<meta charset="utf-8">
<title>Power cut</title>
<style>
  /* Layout: a night city filling the whole frame, drawn in chunky pixels */
  :root { --bg: #05060c; color-scheme: dark; }
  html, body { height: 100%; }
  body { background: var(--bg); overflow: hidden; }
  #stage {
    position: fixed; left: 0; top: 0; display: block;
    image-rendering: pixelated;
  }
</style>

<canvas id="stage" aria-label="A loop. A night city skyline full of lit windows loses power block by block from left to right; stars and the milky way come out over the black rooftops, hold, then the power returns the same way and the stars drown again."></canvas>

<script type="module">
import * as THREE from 'three';
import { params, loop, sections } from 'scene';

// Nothing here is a mesh: every pixel works out which building, window or patch of sky it is
const frag = /* glsl */`
precision highp float;
uniform vec2 uRes;
uniform float uSway, uRound, uT, uOut, uBack, uDensity, uStars, uBlocks;
uniform vec3 uLamp;
const float BAYER[16] = float[16](0.0, 8.0, 2.0, 10.0, 12.0, 4.0, 14.0, 6.0, 3.0, 11.0, 1.0, 9.0, 15.0, 7.0, 13.0, 5.0);
const float TAU = 6.2831853;
const float GROUND = 3.0;   // rows of street under the buildings

// Beyond: the sky, orange with city glow when lit, and the milky way when it is not
const vec3 GLOW[4] = vec3[4](vec3(0.07, 0.06, 0.14), vec3(0.15, 0.10, 0.19), vec3(0.27, 0.15, 0.21), vec3(0.42, 0.22, 0.22));
const vec3 MILK[5] = vec3[5](vec3(0.025, 0.03, 0.075), vec3(0.05, 0.06, 0.13), vec3(0.09, 0.10, 0.20), vec3(0.15, 0.16, 0.29), vec3(0.24, 0.25, 0.40));
// The thing: wall tones for near, middle and far rows, with the power on and off
const vec3 WALL_ON[3] = vec3[3](vec3(0.08, 0.065, 0.12), vec3(0.12, 0.10, 0.17), vec3(0.16, 0.13, 0.22));
const vec3 WALL_OFF[3] = vec3[3](vec3(0.006, 0.006, 0.012), vec3(0.01, 0.01, 0.02), vec3(0.016, 0.016, 0.03));

float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float noise(vec3 x) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x), mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x), mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
// Steps between neighbouring tones in a fixed pattern, so shading is dots, not blends
float dots() { ivec2 c = ivec2(gl_FragCoord.xy) & 3; return (BAYER[c.y * 4 + c.x] + 0.5) / 16.0; }
int rung(float t, int n) { float x = clamp(t, 0.0, 1.0) * float(n); return min(int(x) + (fract(x) > dots() ? 1 : 0), n); }

// Which block a spot across the frame belongs to, as the middle of that block from 0 (left) to 1 (right)
float blockOf(float f) { return (floor(clamp(f, 0.0, 0.999) * uBlocks) + 0.5) / uBlocks; }
// Whether a block has power: the cut sweeps across, and the power follows it back
bool powered(float bf) { return bf > uOut || bf < uBack; }
// How far the stars over a block have come out: slowly after the cut, gone quickly when power returns
float darkness(float bf) { return clamp((uOut - bf) / 0.12, 0.0, 1.0) * (1.0 - clamp((uBack - bf) / 0.03, 0.0, 1.0)); }
// Light thrown up into the sky by the blocks still lit nearby
float glowAt(float f) {
  float g = 0.0;
  for (int i = -3; i <= 3; i++) g += powered(blockOf(f + float(i) * 0.045)) ? 1.0 : 0.0;
  return g / 7.0;
}

// One window: on or off, with a stutter just before the cut and a ragged return
bool windowOn(float bf, float h) {
  float since = uOut - bf, back = uBack - bf - h * 0.035;
  if (back > 0.0 && back < 0.02) return hash(vec3(h * 91.0, floor(uT * 18.0), 3.0)) > 0.45;
  if (since > -0.014 && since < 0.0) return hash(vec3(bf * 37.0, floor(uT * 22.0), 5.0)) > 0.5;
  return since < 0.0 || back > 0.0;
}

// The thing: one row of buildings. Returns true and its colour if this pixel is on one.
bool row(vec2 P, int L, out vec3 col) {
  float cw = L == 0 ? 22.0 : L == 1 ? 15.0 : 11.0;     // how wide a plot is
  float k = L == 0 ? 1.0 : L == 1 ? 0.55 : 0.25;       // how much it moves with the sway
  float lo = L == 0 ? 0.13 : L == 1 ? 0.24 : 0.36, hi = L == 0 ? 0.2 : L == 1 ? 0.24 : 0.26;
  float seed = float(L) * 173.0;
  float x = floor(P.x + uSway * k) + 400.0, ci = floor(x / cw), lx = x - ci * cw;
  vec3 id = vec3(ci, seed, 1.0);
  float w = floor(cw * (0.62 + 0.38 * hash(id + 2.0))), left = floor((cw - w) * hash(id + 3.0));
  float ht = floor(uRes.y * (lo + hi * hash(id + 1.0) + 0.04 * sin(ci * 0.9 + seed)));
  float ly = P.y - GROUND;
  if (ly < 0.0) return false;
  bool inBody = lx >= left && lx < left + w && ly < ht;
  // A narrower top on some, and a mast on a few
  float step = hash(id + 4.0) > 0.5 ? floor(2.0 + 0.1 * w) : 99.0, top = floor(uRes.y * 0.07 * hash(id + 5.0)) + 2.0;
  bool inTop = lx >= left + step && lx < left + w - step && ly >= ht && ly < ht + top;
  float mid = left + floor(w * 0.5), mastH = hash(id + 6.0) > 0.75 ? 4.0 + floor(4.0 * hash(id + 7.0)) : 0.0;
  float roof = step < 99.0 ? ht + top : ht;
  bool inMast = lx == mid && ly >= roof && ly < roof + mastH;
  if (!(inBody || inTop || inMast)) return false;

  float f = (ci * cw + left + w * 0.5 - 400.0 - uSway * k) / uRes.x;
  float bf = blockOf(f);
  bool on = powered(bf);
  col = on ? WALL_ON[L] : WALL_OFF[L];
  // The red light on top of a mast blinks on its own battery
  if (inMast) { if (ly == roof + mastH - 1.0 && fract(uRound * 8.0 + hash(id + 8.0)) < 0.35) col = vec3(0.9, 0.15, 0.12); return true; }

  // Windows in a grid, whole floors tending to be lit together
  float px = L == 0 ? 3.0 : 2.0, py = L == 0 ? 3.0 : L == 1 ? 3.0 : 2.0;
  float ww = L == 0 ? 2.0 : 1.0, wh = L == 2 ? 1.0 : 2.0, m = L == 0 ? 2.0 : 1.0;
  float l0 = inTop ? left + step : left, wid = inTop ? w - 2.0 * step : w;
  float wx = lx - l0 - m, wy = ly - 2.0;
  float span = floor((wid - 2.0 * m + px - ww) / px) * px - (px - ww);
  float sideGap = floor((wid - 2.0 * m - span) * 0.5);
  wx -= sideGap;
  if (wx < 0.0 || wx >= span || wy < 0.0 || ly > (inTop ? ht + top : ht) - 3.0) return true;
  float ix = floor(wx / px), iy = floor(wy / py);
  if (wx - ix * px >= ww || wy - iy * py >= wh) return true;
  float floorLit = hash(vec3(ci, iy, seed + 9.0)), h = hash(vec3(ci * 7.0 + ix, iy, seed + 11.0));
  float busy = uDensity * (0.55 + 0.9 * hash(id + 10.0));
  if (floorLit * 0.5 + h * 0.5 > busy || !windowOn(bf, h)) return true;
  float kind = hash(vec3(ci, ix * 3.0 + iy, seed + 13.0));
  vec3 lamp = kind > 0.88 ? vec3(0.72, 0.82, 1.0) : kind > 0.6 ? uLamp * 0.78 : uLamp;
  col = L == 2 ? lamp * 0.72 : L == 1 ? lamp * 0.88 : lamp;
  return true;
}

// The land: a strip of street with lamps, which also lose their power
vec3 landAt(vec2 P) {
  float bf = blockOf(P.x / uRes.x);
  bool on = powered(bf);
  float x = floor(P.x + uSway) + 400.0;
  if (P.y == 1.0 && mod(x, 9.0) == 0.0 && on) return uLamp * 0.9;
  return on ? vec3(0.06, 0.05, 0.09) : vec3(0.008, 0.008, 0.014);
}

// Beyond: the sky over one spot across the frame
vec3 skyAt(vec2 P) {
  float f = P.x / uRes.x, up = P.y / uRes.y;
  float glow = glowAt(f), dark = darkness(blockOf(f)) * (1.0 - 0.8 * glow);
  if (dark <= dots()) {
    float g = glow * (1.0 - smoothstep(0.15, 0.95, up)) + 0.05;
    return GLOW[rung(g, 3)];
  }
  // The milky way: a band rising across the frame, with dark lanes of dust down it
  vec2 u = (P - 0.5 * uRes) / uRes.y;
  float d = dot(u - vec2(0.0, 0.2), normalize(vec2(-0.5, 1.0)));
  float core = exp(-d * d / 0.03);
  float dust = smoothstep(0.5, 0.75, noise(vec3(u * 7.0, 2.0))) * exp(-d * d / 0.008);
  float milk = core * (0.45 + 0.6 * noise(vec3(u * 4.0, 1.0))) - dust * 0.55;
  vec3 col = MILK[rung(milk * dark * 0.95, 4)];
  // Stars, brightest first, thicker in the band
  float hs = hash(vec3(P, 7.0)), dens = (0.012 + 0.07 * core) * uStars;
  if (hs > 1.0 - dens) {
    float rank = (1.0 - hs) / dens;
    if (dark > 0.15 + 0.8 * rank) {
      float tw = sin(TAU * (uRound * (3.0 + floor(4.0 * hash(vec3(P, 9.0)))) + hash(vec3(P, 8.0))));
      int tier = rank < 0.12 ? 0 : rank < 0.4 ? 1 : 2;
      if (tw > 0.8) tier = min(tier + 1, 2);
      col = tier == 0 ? vec3(1.0, 0.98, 0.92) : tier == 1 ? vec3(0.72, 0.76, 0.95) : vec3(0.38, 0.4, 0.6);
    }
  }
  return col;
}

void main() {
  vec2 P = floor(gl_FragCoord.xy);
  vec3 col;
  if (P.y < GROUND) col = landAt(P);
  else if (!row(P, 0, col) && !row(P, 1, col) && !row(P, 2, col)) col = skyAt(P);
  gl_FragColor = vec4(col, 1.0);
}`;

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas: stage, antialias: false });
renderer.setPixelRatio(1);
const uniforms = {
  uRes: { value: new THREE.Vector2(1, 1) }, uSway: { value: 0 }, uRound: { value: 0 }, uT: { value: 0 },
  uOut: { value: 0 }, uBack: { value: 0 }, uDensity: { value: 0.55 }, uStars: { value: 1 }, uBlocks: { value: 9 },
  uLamp: { value: new THREE.Color() },
};
const scene = new THREE.Scene(), camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const page = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms, fragmentShader: frag, vertexShader: 'void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }', depthTest: false,
}));
page.frustumCulled = false;
scene.add(page);

let sizedW = -1, sizedH = -1;
function resize() {
  // A hidden pane reports no size; draw for a plausible one until it has one
  const w = innerWidth || 1280, h = innerHeight || 800;
  const scale = Math.max(3, Math.round(Math.min(w * 1.3, h) / 104));
  const cols = Math.ceil(w / scale), rows = Math.ceil(h / scale);
  renderer.setSize(cols, rows, false);
  stage.style.width = cols * scale + 'px'; stage.style.height = rows * scale + 'px';
  uniforms.uRes.value.set(cols, rows);
}

const EASE = { lin: x => x, io: x => x < 0.5 ? 4 * x * x * x : 1 - (2 - 2 * x) ** 3 / 2 };
// A track is a list of [when, value, how to arrive]; between entries it moves, after the last it stays
function key(track, t) {
  if (t <= track[0][0]) return track[0][1];
  for (let i = 1; i < track.length; i++) if (t < track[i][0]) {
    const [t0, a] = track[i - 1], [t1, b, how = 'io'] = track[i];
    return a + (b - a) * EASE[how]((t - t0) / (t1 - t0));
  }
  return track[track.length - 1][1];
}

// The story: lit, the cut sweeps across, stars, the power sweeps back, lit again
const S = sections({ lit: 0.6, blackout: 3.0, night: 3.4, powerBack: 2.4, after: 0.8 });
const P = params({
  lights: '#ffc86b',          // colour of the lit windows
  windows: [0.55, 0.2, 0.9],  // how many windows are lit
  stars: [1, 0.3, 2],         // how thick the stars are
  blocks: [9, 3, 20, 1],      // how many blocks the city goes out in
});

function frame(now) {
  if (innerWidth !== sizedW || innerHeight !== sizedH) { sizedW = innerWidth; sizedH = innerHeight; resize(); }
  const t = S.written(now), round = S.round(now), U = uniforms;
  // A slow sideways sway, so the rows of buildings slide past one another
  U.uSway.value = 3 * Math.sin(round * Math.PI * 2);
  U.uRound.value = round;
  U.uT.value = t;
  // Where the cut has reached across the frame, and where the power has come back to
  U.uOut.value = key([[0.6, -0.02], [3.6, 1.02, 'lin']], t);
  U.uBack.value = key([[7.0, -0.04], [9.4, 1.02, 'lin']], t);
  U.uDensity.value = P.windows;
  U.uStars.value = P.stars;
  U.uBlocks.value = Math.round(P.blocks);
  U.uLamp.value.set(P.lights);
  renderer.render(scene, camera);
}
loop(S, frame);
</script>
