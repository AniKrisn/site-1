<meta charset="utf-8">
<title>Red Jelly</title>
<style>
  /* Layout: a white page with one thing on it, drawn in chunky pixels. Deliberately light-only. */
  :root { --bg: #ffffff; color-scheme: light; }
  html, body { height: 100%; }
  body { background: var(--bg); overflow: hidden; }
  #stage {
    position: fixed; left: 0; top: 0; display: block;
    image-rendering: pixelated;
    touch-action: none; cursor: grab;
  }
  #stage.turning { cursor: grabbing; }
</style>

<canvas id="stage" aria-label="A three second loop. A big red fluted jelly sits on a white page; it gets a tap and wobbles, settling before the next tap."></canvas>

<script type="module">
import * as THREE from 'three';
import { params, loop } from 'scene';

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

// Nothing here is a mesh: every pixel walks a ray to a shape described by distance
const frag = /* glsl */`
precision highp float;
uniform vec2 uRes;
uniform vec3 uRight, uUp, uFwd, uTarget, uLight, uTone;
uniform vec2 uShear;  // how far the top leans, in x and z
uniform float uSpan, uSize, uSquash;
const float BAYER[16] = float[16](0.0, 8.0, 2.0, 10.0, 12.0, 4.0, 14.0, 6.0, 3.0, 11.0, 1.0, 9.0, 15.0, 7.0, 13.0, 5.0);

// The jelly in its own unit space: a fluted, two-tier mould shape one unit tall
float mould(vec3 q) {
  float a = atan(q.z, q.x);
  float r = 0.62 - 0.1 * q.y - 0.09 * smoothstep(0.46, 0.6, q.y);   // tapers, with a ledge halfway up
  r += 0.035 * cos(8.0 * a);                                       // the flutes
  vec2 d = vec2(length(q.xz) - r + 0.1, abs(q.y - 0.5) - 0.4);
  return min(max(d.x, d.y), 0.0) + length(max(d, 0.0)) - 0.1;
}
// Undo the wobble: the top leans and squashes, the bottom stays put on the page
float map(vec3 p) {
  vec3 q = p / uSize;
  q.xz -= uShear * q.y * q.y;
  q.y /= uSquash; q.xz *= sqrt(uSquash);
  return mould(q) * uSize * 0.7;
}
vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.012, -0.012);
  return normalize(e.xyy * map(p + e.xyy) + e.yyx * map(p + e.yyx) + e.yxy * map(p + e.yxy) + e.xxx * map(p + e.xxx));
}
// How much of the light reaches a point, soft at the edges
float lightAt(vec3 ro) {
  float res = 1.0, t = 0.05;
  for (int i = 0; i < 30; i++) {
    float d = map(ro + uLight * t);
    res = min(res, 7.0 * d / t);
    t += clamp(d, 0.03, 0.15);
    if (res < 0.01 || t > 2.6) break;
  }
  return clamp(res, 0.0, 1.0);
}
// Steps between neighbouring tones in a fixed pattern, so shading is dots, not blends
float dots() { ivec2 c = ivec2(gl_FragCoord.xy) & 3; return (BAYER[c.y * 4 + c.x] + 0.5) / 16.0; }
float stepped(float t, float steps) { float x = clamp(t, 0.0, 1.0) * steps; return min(floor(x) + (fract(x) > dots() ? 1.0 : 0.0), steps) / steps; }

void main() {
  vec2 s = (gl_FragCoord.xy / uRes) * 2.0 - 1.0, at = vec2(s.x * uSpan * uRes.x / uRes.y, s.y * uSpan);
  vec3 ro = uTarget + uRight * at.x + uUp * at.y - uFwd * 5.0, rd = uFwd;
  vec3 col = vec3(1.0);
  float tFloor = -ro.y / rd.y, tHit = -1.0, t = 0.0;
  for (int i = 0; i < 110 && t < tFloor; i++) {
    float d = map(ro + rd * t);
    if (d < 0.002) { tHit = t; break; }
    t += d;
  }
  if (tHit > 0.0) {
    vec3 p = ro + rd * tHit, n = normalAt(p);
    float glow = clamp(dot(n, uLight) * 0.55 + 0.45, 0.0, 1.0);
    // Light passing through glows at the edges, so it reads as jelly and not plastic
    float rim = pow(1.0 - max(dot(n, -rd), 0.0), 2.0);
    float tone = stepped(glow * 0.8 + rim * 0.25, 4.0);
    col = mix(uTone * 0.32, mix(uTone, vec3(1.0), 0.3), tone);
    // A hard glint
    float spec = pow(max(dot(reflect(rd, n), uLight), 0.0), 30.0);
    if (stepped(spec * 1.6, 1.0) > 0.5) col = mix(uTone, vec3(1.0), 0.85);
  } else if (tFloor > 0.0) {
    // The page, and the shadow on it, tinted by the light coming through
    float dim = 1.0 - lightAt(ro + rd * tFloor + vec3(0.0, 0.02, 0.0));
    col = mix(vec3(1.0), mix(vec3(0.78), uTone * 0.4 + 0.55, 0.45), stepped(dim, 2.0));
  }
  gl_FragColor = vec4(col, 1.0);
}`;

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas: stage, antialias: false });
renderer.setPixelRatio(1);
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const uniforms = {
  uRes: { value: new THREE.Vector2(1, 1) }, uSpan: { value: 1.2 }, uTone: { value: new THREE.Color() },
  uShear: { value: new THREE.Vector2() }, uSize: { value: 0.8 }, uSquash: { value: 1 },
  uRight: { value: V() }, uUp: { value: V() }, uFwd: { value: V() }, uTarget: { value: V(0, 0.4, 0) }, uLight: { value: V() },
};
const scene = new THREE.Scene(), camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const page = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms, fragmentShader: frag, vertexShader: 'void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }', depthTest: false,
}));
page.frustumCulled = false;
scene.add(page);

let cols = 1, rows = 1, sizedW = -1, sizedH = -1;
function resize() {
  // A hidden pane reports no size; draw for a plausible one until it has one
  const w = innerWidth || 1280, h = innerHeight || 800;
  const scale = Math.max(3, Math.round(Math.min(w * 1.3, h) / 104));
  cols = Math.ceil(w / scale); rows = Math.ceil(h / scale);
  renderer.setSize(cols, rows, false);
  stage.style.width = cols * scale + 'px'; stage.style.height = rows * scale + 'px';
  uniforms.uRes.value.set(cols, rows);
  uniforms.uSpan.value = Math.max(1.2, 1.2 * rows / cols);
}

// Dragging only shifts where you watch from; the loop itself answers to nothing
const view = { yaw: 0, pitch: 0.3 };
const drag = { down: false, x: 0, y: 0 };
stage.addEventListener('pointerdown', e => { stage.setPointerCapture(e.pointerId); Object.assign(drag, { down: true, x: e.clientX, y: e.clientY }); stage.classList.add('turning'); });
addEventListener('pointermove', e => {
  if (!drag.down) return;
  view.yaw -= (e.clientX - drag.x) * 0.008; view.pitch = clamp(view.pitch + (e.clientY - drag.y) * 0.004, 0.1, 0.9);
  drag.x = e.clientX; drag.y = e.clientY;
});
const release = () => { drag.down = false; stage.classList.remove('turning'); };
addEventListener('pointerup', release);
addEventListener('pointercancel', release);

// Everything is a function of the time in the loop and nothing else, so the last frame meets the first
const LOOP = 3;
const P = params({
  size: [1.05, 0.5, 1.4],    // how big the jelly is
  wobble: [1, 0, 2],         // how hard it wobbles after each tap
  colour: '#d8142c',
});

function frame(now) {
  if (innerWidth !== sizedW || innerHeight !== sizedH) { sizedW = innerWidth; sizedH = innerHeight; resize(); }
  const t = now % LOOP, round = t / LOOP * Math.PI * 2, U = uniforms;

  // Where you are looking from: a slow sway, so it stays a solid thing
  const yaw = 0.3 + 0.15 * Math.sin(round) + view.yaw, pitch = view.pitch;
  const fwd = U.uFwd.value.set(-Math.sin(yaw) * Math.cos(pitch), -Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
  const right = U.uRight.value.set(Math.cos(yaw), 0, -Math.sin(yaw));
  U.uUp.value.crossVectors(right, fwd);
  // The light stays over your left shoulder
  U.uLight.value.set(Math.sin(yaw) * 0.45, 0.8, Math.cos(yaw) * 0.45).addScaledVector(right, -0.5).normalize();

  // A tap at the start of each loop, then six wobbles dying away; it is still again by the next tap
  const fade = Math.exp(-3.2 * t / LOOP) * P.wobble, sway = Math.sin(round * 6);
  U.uShear.value.set(0.24 * fade * sway, 0.07 * fade * Math.sin(round * 6 + 1.2) * (1 - t / LOOP));
  U.uSquash.value = 1 + 0.09 * fade * Math.sin(round * 12);
  U.uSize.value = P.size;
  U.uTone.value.setStyle(P.colour, THREE.LinearSRGBColorSpace);
  U.uTarget.value.y = 0.5 * P.size;

  renderer.render(scene, camera);
}
loop(LOOP, frame);
</script>
