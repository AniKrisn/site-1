    float lit = max(dot(n, uLight), 0.0) * lamp;
    float glint = pow(max(dot(reflect(-uLight, n), -uFwd), 0.0), 10.0) * lamp;
    float nook = clamp(0.5 + 0.5 * map(p + n * 0.06) / 0.06, 0.0, 1.0);
    float metal = (0.34 + 0.5 * lit + 0.6 * glint) * nook;
    if (mat == BRASS) {
      bool lug = fract(uv.x * 6.0 / 6.2832) < 0.2 && abs(uv.y) < 0.62;   // copper lugs round the shell
      col = ramp(lug ? COPPER_C : uBrass, metal);
    }
    else if (mat == HEAD) col = ramp(CREAM, (0.45 + 0.5 * lit) * nook + 0.3 * uv.x);
    else if (mat == FRONT) col = ramp(gearAt(uv) ? CREAM * vec3(0.9, 0.8, 0.7) : CREAM, 0.45 + 0.5 * lit + 0.3 * uHit[0]);
    else if (mat == COPPER) col = ramp(COPPER_C, metal);
    else if (mat == IRON) col = ramp(uStands, metal);
    else if (mat == WOOD) col = ramp(WOOD_C, 0.4 + 0.55 * lit);
    else if (mat == CYMBAL) col = ramp(CYMBAL_C, metal + 0.1);
    else if (mat == GAUGE) col = uv.x > 0.8 ? ramp(CREAM, 0.5 + 0.4 * lit) : ramp(COPPER_C, metal);
    else col = mix(vec3(0.72, 0.74, 0.83), vec3(0.95, 0.96, 0.98), stepped(0.25 + 0.75 * lit, 2.0));
    col *= 0.45 + 0.55 * uWake;   // the kit sits dim until the place wakes
  } else if (tFloor > 0.0) {
    vec3 g = ro + rd * tFloor;
    float dim = 1.0 - lightAt(g + vec3(0.0, 0.02, 0.0));
    col = landAt(g, s, stepped(dim, 2.0));
  }
  gl_FragColor = vec4(col, 1.0);
}`;

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas: stage, antialias: false });
renderer.setPixelRatio(1);
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const uniforms = {
  uRes: { value: new THREE.Vector2(1, 1) }, uSpan: { value: 1.2 }, uBrass: { value: new THREE.Color() },
  uRight: { value: V() }, uUp: { value: V() }, uFwd: { value: V() }, uTarget: { value: V(-0.1, 0.8, -0.2) }, uLight: { value: V() },
  uCym: { value: [V(0, 1, 0), V(0, 1, 0), V(0, 1, 0)] }, uStick: { value: [V(), V(), V(), V()] },
  uGear: { value: 0 }, uHat: { value: 0.03 }, uBounce: { value: 1 }, uSpin: { value: 0 },
  uHit: { value: [0, 0, 0, 0, 0, 0] },
  uPuff: { value: [new THREE.Vector4(), new THREE.Vector4()] },
  uRing: { value: Array.from({ length: 10 }, () => new THREE.Vector2()) }, uTremor: { value: 1 }, uGround: { value: new THREE.Color() }, uStands: { value: new THREE.Color() },
  uWake: { value: 0 }, uGlow: { value: 0 }, uFury: { value: 0 }, uCity: { value: 0 },
};
const scene = new THREE.Scene(), camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const page = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms, fragmentShader: frag, vertexShader: 'void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }', depthTest: false,
}));
page.frustumCulled = false;
scene.add(page);

let cols = 1, rows = 1, sizedW = -1, sizedH = -1, closeSpan = 1.2;
function resize() {
  // A hidden pane reports no size; draw for a plausible one until it has one
  const w = innerWidth || 1280, h = innerHeight || 800;
  const scale = Math.max(3, Math.round(Math.min(w * 1.3, h) / 104));
  cols = Math.ceil(w / scale); rows = Math.ceil(h / scale);
  renderer.setSize(cols, rows, false);
  stage.style.width = cols * scale + 'px'; stage.style.height = rows * scale + 'px';
  uniforms.uRes.value.set(cols, rows);
  closeSpan = Math.max(1.2, 1.6 * rows / cols);
}

// Dragging only shifts where you watch from; the loop itself answers to nothing
const view = { yaw: 0, pitch: 0.42 };
const drag = { down: false, x: 0, y: 0 };
stage.addEventListener('pointerdown', e => { stage.setPointerCapture(e.pointerId); Object.assign(drag, { down: true, x: e.clientX, y: e.clientY }); stage.classList.add('turning'); });
addEventListener('pointermove', e => {
  if (!drag.down) return;
  view.yaw -= (e.clientX - drag.x) * 0.008; view.pitch = clamp(view.pitch + (e.clientY - drag.y) * 0.004, 0.1, 0.9);
  drag.x = e.clientX; drag.y = e.clientY;
});
const release = () => { drag.down = false; stage.classList.remove('turning'); };
addEventListener('pointerup', release);
addEventListener('pointercancel', release);

// Everything is a function of the time in the loop and nothing else, so the last frame meets the first
// The story, in parts whose lengths can be dragged on the timeline: the beat building and the first towers rising behind it,
// the crash that brings the rest up, one huge bar under their lit windows, and the city sinking back as the beat comes round
const S = sections({ build: 4, eruption: 1, reign: 2, collapse: 1.5 });
const T_BUILD = 0, T_ERUPT = 4, T_REIGN = 5, T_FALL = 7;   // when those parts begin, as written
const LOOP = 4;   // the two bars of the build
const P = params({
  brass: '#dba63f',          // the colour of the shells
  steam: [1, 0, 2],          // how big the puffs from the stack are
  bounce: [1, 0, 2],         // how hard it plays: stick swing, drum give, cymbal rock
  tremor: [1, 0, 2],         // how high the ground heaves with each kick
  zoom: [1.35, 1, 2.5],      // how far back you stand: 1 is close on the kit
  ground: '#33202b',         // the dark stone everything stands on
  stands: '#b5ada0',         // the metal of the stands, legs and spurs
});

// Two bars at 120, counted in sixteenths (32 to the loop). Where a stick lands on each piece:
const S16 = LOOP / 32;
const SPOT = {
  SN: [0.42, 0.715, -0.53], T1: [0.25, 1.09, -0.04], T2: [-0.25, 1.09, -0.04], F1: [-0.62, 0.65, -0.44], F2: [-1.05, 0.68, -0.8],
  HH: [0.85, 0.955, -0.55], RD: [-0.82, 1.225, -0.44], C1: [0.57, 1.46, -0.42], C2: [-0.47, 1.51, -0.42],
};
// The two sticks: where the hand that isn't there rests, and what each strikes when. Each keeps to its own side of the kit.
// Bar one is seven against eight: this hand plays eight in threes round hat, snare and tom while the other fits seven even strokes round its side.
// Bar two is one long fill in sixteenths, shared between them.
// After those two bars they crash as the city comes up, play one huge bar, and keep a quiet pulse while it sinks,
// ending on the stroke the loop begins with. Strokes are [when in seconds, where].
const bar = (at, list) => list.map(([s, name]) => [at + s * S16, name]);
const STICKS = [
  { home: [0.3, 1.3, -0.85], side: 0.035, rest: [[0.62, 0.725, -0.74], [0.3, 0.725, -0.36]], strokes: [
    ...bar(T_BUILD, [[0, 'HH'], [2, 'SN'], [4, 'T1'], [6, 'HH'], [8, 'SN'], [10, 'T1'], [12, 'HH'], [14, 'SN'],
      [16, 'C1'], [18, 'SN'], [19, 'T1'], [21, 'HH'], [23, 'SN'], [24, 'T1'], [26, 'SN'], [27, 'T1'], [29, 'SN']]),
    [T_ERUPT, 'C1'],
    ...bar(T_REIGN, [[0, 'C1'], [2, 'SN'], [4, 'T1'], [6, 'SN'], [8, 'C1'], [10, 'SN'], [11, 'T1'], [12, 'SN'], [14, 'T1'], [16, 'C1']]), [7.5, 'HH'], [8, 'HH'], [8.5, 'HH']] },
  { home: [-0.3, 1.3, -0.85], side: -0.035, rest: [[0.18, 0.725, -0.76], [0.52, 0.725, -0.38]], strokes: [
    ...bar(T_BUILD, [...['C2', 'T2', 'F1', 'RD', 'T2', 'F2', 'RD'].map((name, i) => [i * 16 / 7, name]),
      [16, 'RD'], [17, 'T2'], [20, 'F1'], [22, 'RD'], [25, 'T2'], [28, 'F1'], [29, 'F2']]),
    [T_ERUPT, 'C2'],
    ...bar(T_REIGN, [[0, 'C2'], [3, 'T2'], [4, 'F1'], [6, 'F2'], [8, 'RD'], [10, 'T2'], [12, 'F1'], [13, 'F2'], [14, 'T2'], [16, 'C2']]), [8.5, 'C2']] },
];
// The kick plays itself: [when, how hard]. Two soft thumps under the count, a build that grows, one great blow at the summoning, then eighths under the drummer
const KICKS = [...[0, 4, 8, 12, 16, 19, 22, 24, 27, 30].map((s, i) => [T_BUILD + s * S16, 0.5 + 0.05 * i]),
  [T_ERUPT, 1.7], [T_ERUPT + 0.5, 1.1], ...[0, 2, 4, 6, 8, 10, 12, 14].map(s => [T_REIGN + s * S16, 1.4]), [T_FALL, 1.8], [7.5, 0.4], [8, 0.4], [8.5, 0.5]];
// How each part of the story comes and goes: [when, how much, how to arrive]
const EASE = { lin: x => x, io: x => x < 0.5 ? 4 * x * x * x : 1 - (2 - 2 * x) ** 3 / 2, in: x => x * x * x, out: x => 1 - (1 - x) ** 3,
  snap: x => 1 - (1 - x) ** 5, fall: x => x ** 4, back: x => 1 + 2.70158 * (x - 1) ** 3 + 1.70158 * (x - 1) ** 2 };
function key(track, t) {
  if (t <= track[0][0]) return track[0][1];
  for (let i = 1; i < track.length; i++) if (t < track[i][0]) {
    const [t0, a] = track[i - 1], [t1, b, how = 'io'] = track[i];
    return a + (b - a) * EASE[how]((t - t0) / (t1 - t0));
  }
  return track[track.length - 1][1];
}
const WAKE = [[0, 1]];                                  // the light and the stones coming alive
const FURY = [[0, 0], [4, 0.35, 'in'], [4.15, 1, 'snap'], [7.2, 1], [8.2, 0]];      // the frenzy
const CITY = [[0, 0], [4, 0.5, 'lin'], [5, 1, 'out'], [7.3, 1], [8.3, 0, 'in']];    // the city coming up: a few buildings through the build, the rest at the crash
const LAID = [[0, 0]];                // the sticks lying on the snare
const CALM = [[7.4, 0], [8.3, 1]];                                                  // everything that still rings dying away
// When each piece is struck, in seconds; the kick plays itself: four on the floor under the sevens, then broken up under the fill
const WHEN = { KICK: KICKS.map(k => k[0]) };
for (const k in SPOT) WHEN[k] = [];
for (const st of STICKS) for (const [at, name] of st.strokes) WHEN[name].push(at);
const DRUMS = ['KICK', 'SN', 'T1', 'T2', 'F1', 'F2'];
// Which way each rocking cymbal faces at rest: ride, then the crashes
const CYMS = [['RD', [0.08, 1, -0.12], 0.1], ['C1', [-0.1, 1, -0.2], 0.22], ['C2', [0.1, 1, -0.2], 0.22]];

const easeOut = x => 1 - (1 - x) ** 3, io = x => x < 0.5 ? 4 * x * x * x : 1 - (2 - 2 * x) ** 3 / 2;
// Time from a hit, negative before it, going the short way round the loop
const since = (t, h) => ((t - h) % LOOP + LOOP * 1.5) % LOOP - LOOP / 2;
// How lately struck: up to 1 in the instant before the hit, gone a moment after
const ring = dt => dt >= 0 && dt < 0.3 ? (1 - dt / 0.3) ** 2 : dt > -0.05 && dt < 0 ? (1 + dt / 0.05) ** 2 : 0;
const struck = (name, t) => { let v = 0; for (const h of WHEN[name]) v = Math.max(v, ring(t - h)); return v; };
// A cymbal's rock: every hit sets it swinging, and each swing dies away before the loop comes round
function rock(name, t) {
  let v = 0;
  for (const h of WHEN[name]) { const dt = t - h; if (dt > 0) v += Math.exp(-2.2 * dt) * Math.sin(dt * Math.PI * 4); }
  return v;
}
// Where a stick is: after a stroke it rebounds a little and the hand carries it over the next piece, low; the wrist cocks just before, then snaps down
const STICK_LEN = 0.56;
function stickAt(stick, t, butt, tip, laid, big) {
  const st = stick.strokes, n = st.length;
  let i = -1;
  for (let k = 0; k < n; k++) if (st[k][0] <= t) i = k;
  // Before the first stroke it waits over it; after the last it stays where it struck
  const before = i < 0, after = i === n - 1;
  i = Math.max(i, 0);
  const j = Math.min(i + (before ? 0 : 1), n - 1), t0 = before ? t - 9 : st[i][0], t1 = after ? t + 9 : st[j][0];
  const gap = t1 - t0, ts = t - t0, tn = t1 - t, k = io(Math.min(1, ts / Math.min(gap, 0.3))), a = SPOT[st[i][1]], b = SPOT[st[j][1]];
  const gx = a[0] + (b[0] - a[0]) * k + stick.side, gy = a[1] + (b[1] - a[1]) * k, gz = a[2] + (b[2] - a[2]) * k;
  const cock = 0.55 + 0.45 * io(clamp(1 - (tn - 0.06) / 0.18, 0, 1));
  const high = big * P.bounce * Math.min(0.2, 0.08 + 0.4 * gap) * Math.min(easeOut(Math.min(1, ts / 0.1)) * cock, tn / 0.06);
  butt.set(stick.home[0] - gx, stick.home[1] - gy, stick.home[2] - gz).setLength(STICK_LEN);
  butt.x += gx; butt.y += gy + 0.25 * high; butt.z += gz;
  tip.set(gx - butt.x, gy + high - butt.y, gz - butt.z).setLength(STICK_LEN).add(butt);
  // Lying on the snare, or on the way there
  if (laid > 0) {
    const [rb, rt] = stick.rest;
    butt.set(butt.x + (rb[0] - butt.x) * laid, butt.y + (rb[1] - butt.y) * laid, butt.z + (rb[2] - butt.z) * laid);
    tip.set(tip.x + (rt[0] - tip.x) * laid, tip.y + (rt[1] - tip.y) * laid, tip.z + (rt[2] - tip.z) * laid).sub(butt).setLength(STICK_LEN).add(butt);
  }
}

function frame(now) {
  if (innerWidth !== sizedW || innerHeight !== sizedH) { sizedW = innerWidth; sizedH = innerHeight; resize(); }
  // The story runs on the time as written; the sway of the view goes once round the real loop, so it never freezes in a held part
  const t = S.written(now), round = S.round(now) * Math.PI * 2, U = uniforms;
  const wake = key(WAKE, t), fury = key(FURY, t), rise = key(CITY, t), calm = 1 - key(CALM, t);
  U.uWake.value = wake; U.uGlow.value = wake + 0.2 * fury; U.uFury.value = fury; U.uCity.value = rise;
  U.uTarget.value.y = 0.8 + 0.45 * rise;   // look up as the city rises

  // Where you are looking from: a slow sway, so it stays a solid thing
  const yaw = 0.3 + 0.15 * Math.sin(round) + view.yaw, pitch = view.pitch;
  const fwd = U.uFwd.value.set(-Math.sin(yaw) * Math.cos(pitch), -Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
  const right = U.uRight.value.set(Math.cos(yaw), 0, -Math.sin(yaw));
  U.uUp.value.crossVectors(right, fwd);
  // The light stays over your left shoulder
  U.uLight.value.set(Math.sin(yaw) * 0.45, 0.8, Math.cos(yaw) * 0.45).addScaledVector(right, -0.5).normalize();

  // The sticks, and how lately each drum was struck
  for (let i = 0; i < 2; i++) stickAt(STICKS[i], t, U.uStick.value[i * 2], U.uStick.value[i * 2 + 1], key(LAID, t), 1 + 0.6 * rise);
  for (let i = 0; i < 6; i++) U.uHit.value[i] = struck(DRUMS[i], t);
  // The hi-hat's top dips when it is struck; the other cymbals rock
  U.uHat.value = 0.034 - 0.018 * struck('HH', t);
  for (let i = 0; i < 3; i++) {
    const [name, rest, much] = CYMS[i], r = much * P.bounce * calm * rock(name, t);
    U.uCym.value[i].set(rest[0] + 0.4 * r, 1, rest[2] - r);
  }
  // The gear on the kick ticks on one tooth a beat, and the governor goes round twice a loop
  const beat = S.round(now) * 8;   // eight ticks round the real loop, so gear and steam carry on through a held part
  U.uGear.value = (Math.floor(beat) + easeOut(Math.min(1, (beat % 1) / 0.25))) * Math.PI / 4;
  U.uSpin.value = round * 2;
  // A small puff of steam leaves the stack every other beat, rises, and thins to nothing
  for (let k = 0; k < 2; k++) {
    const age = (beat % 1) + k;
    U.uPuff.value[k].set(0.03 * age, 1.2 + 0.16 * age, -0.12, 0.055 * P.steam * wake * (1 + 0.8 * fury) * easeOut(Math.min(1, age / 0.25)) * (1 - age / 2));
  }
  // Each kick sends a ring out through the ground, weakening as it goes
  const live = [];
  for (const [at, hard] of KICKS) { const age = t - at; if (age >= 0 && age < 2.2) live.push([age, hard]); }
  live.sort((a, b) => a[0] - b[0]);
  for (let i = 0; i < 10; i++) {
    const [age, hard] = live[i] || [0, 0];
    U.uRing.value[i].set(1.2 + 1.8 * age, hard * calm * Math.min(1, age / 0.1) * (1 - age / 2.2) ** 1.5);
  }
  U.uStands.value.set(P.stands).convertLinearToSRGB();
  U.uTremor.value = P.tremor;
  U.uGround.value.set(P.ground).convertLinearToSRGB();   // the colour as picked, not darkened
  U.uSpan.value = closeSpan * P.zoom * (1 + 0.2 * rise);   // and stand back to take it in
  U.uBounce.value = P.bounce;
  U.uBrass.value.set(P.brass);

  renderer.render(scene, camera);
}
loop(S, frame);
</script>
