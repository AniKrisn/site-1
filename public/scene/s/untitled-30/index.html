<meta charset="utf-8">
<title>Wrong floor: night</title>
<style>
  /* Layout: a white page with one doorway on it, drawn in chunky pixels. Deliberately light-only. */
  :root { --bg: #ffffff; color-scheme: light; }
  html, body { height: 100%; }
  body { background: var(--bg); overflow: hidden; }
  #stage {
    position: fixed; left: 0; top: 0; display: block;
    image-rendering: pixelated;
    touch-action: none;
  }
</style>

<canvas id="stage" aria-label="An eight second loop. A tall steel doorway stands on a white page. Through it, long after everything: a dark cracked plain with still pools reaching to a low horizon, three worn mounds where the towers stood, and a vast night sky with a faint river of stars. A whale made of stars joined by faint lines turns slowly overhead, beating its flukes, its eye the brightest star, and is mirrored in the pools. Far off on the plain a small doorway of light throws a broken warm streak across the water towards you."></canvas>

<script type="module">
import * as THREE from 'three';
import { params, loop } from 'scene';

// Nothing here is a mesh: every pixel works out what it sees, by distance to shapes and by where its ray meets the plain
const frag = /* glsl */`
precision highp float;
uniform vec2 uRes;
uniform float uSpan, uU, uLines, uDoor, uEye, uWet;
uniform vec3 uStar[11];   // the whale's stars: where they are on the doorway, and how bright

// The doorway every floor shares: 2 wide, 3 tall, threshold on y = 0, seen square on
const float W = 1.0, H = 3.0;           // half the opening's width, and its height
const float FW = 0.07, SILL = 0.09;     // the steel frame round the sides and top, and the threshold under it
const float EYE = 1.6, D = 2.2;         // the world is seen from eye height, standing this far back from the opening
const vec3 DOOR = vec3(-7.6, 0.0, 52.0);  // the far doorway of light: across, up, and how far out on the plain

const float BAYER[16] = float[16](0.0, 8.0, 2.0, 10.0, 12.0, 4.0, 14.0, 6.0, 3.0, 11.0, 1.0, 9.0, 15.0, 7.0, 13.0, 5.0);
const vec3 SKY[5] = vec3[5](vec3(0.016, 0.02, 0.05), vec3(0.03, 0.04, 0.085), vec3(0.05, 0.06, 0.125), vec3(0.085, 0.09, 0.17), vec3(0.15, 0.14, 0.225));  // top to horizon
const vec3 PLAIN[5] = vec3[5](vec3(0.006, 0.006, 0.012), vec3(0.02, 0.021, 0.034), vec3(0.037, 0.038, 0.056), vec3(0.062, 0.062, 0.088), vec3(0.11, 0.11, 0.15));
const vec3 STAR[4] = vec3[4](vec3(0.26, 0.32, 0.52), vec3(0.55, 0.62, 0.82), vec3(0.84, 0.88, 0.98), vec3(1.0, 0.97, 0.86));
const vec3 LINE = vec3(0.1, 0.13, 0.27);
const vec3 WARM[4] = vec3[4](vec3(0.13, 0.085, 0.07), vec3(0.38, 0.24, 0.14), vec3(0.86, 0.62, 0.36), vec3(1.0, 0.95, 0.8));
const vec3 STEEL[5] = vec3[5](vec3(0.3, 0.32, 0.36), vec3(0.46, 0.48, 0.52), vec3(0.62, 0.64, 0.68), vec3(0.78, 0.8, 0.83), vec3(0.94, 0.95, 0.96));
const vec3 PAGE[3] = vec3[3](vec3(1.0), vec3(0.86, 0.87, 0.91), vec3(0.7, 0.71, 0.78));

float hash(vec2 p) { vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
float noise(vec2 x) {

  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
}
float seg(vec2 p, vec2 a, vec2 b) { vec2 pa = p - a, ba = b - a; return length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0)); }

float dots() { ivec2 c = ivec2(gl_FragCoord.xy) & 3; return (BAYER[c.y * 4 + c.x] + 0.5) / 16.0; }

// Clean bands: flat colour, with dots only in a narrow seam where one band meets the next
float banded(float t, float steps) { float x = clamp(t, 0.0, 1.0) * steps, f = fract(x); return min(floor(x) + (smoothstep(0.32, 0.68, f) > dots() ? 1.0 : 0.0), steps) / steps; }

// Which pixel a point on the page falls in, and where a spot out in the world shows on the page
vec2 toPix(vec2 u) { return floor((u - vec2(0.0, 1.5)) / PX + uRes * 0.5); }
vec2 onPage(vec3 w) { return vec2(w.x * D / w.z, EYE + (w.y - EYE) * D / w.z); }

// Beyond: a river of faint stars rising from the horizon right of centre, where the broad tower stood
float milky(vec2 u) {
  vec2 a = vec2(0.32, 1.6), dir = normalize(vec2(0.8, 1.5)), r = u - a;
  float across = dot(r, vec2(-dir.y, dir.x)), along = dot(r, dir);
  float wob = 0.05 * sin(along * 5.0 + 1.0) + 0.06 * (noise(u * 4.0) - 0.5);

  float dust = smoothstep(0.5, 0.72, noise(vec2(along * 5.0, across * 12.0))) * exp(-pow((across + wob - 0.03) / 0.06, 2.0));

}
// The sky with nothing in it: deep overhead, glowing faintly low down
vec3 skyBase(vec2 u) {
  float v = clamp((u.y - EYE) / (H - EYE), 0.0, 1.0);
  return SKY[int(banded(pow(1.0 - v, 2.6) + 0.17 * milky(u), 4.0) * 4.0 + 0.5)];
}
// Worn mounds on the horizon where the three towers stood, and a ragged far ridge between, in pixels high
float ruins(float x) {
  float h = 0.6 * noise(vec2(x * 9.0, 1.0)) + 0.3 * noise(vec2(x * 31.0, 5.0)) - 0.2;
  h = max(h, 2.2 * (1.0 - pow(abs(x + 0.42) / 0.06, 2.0)) + 0.4 * noise(vec2(x * 40.0, 2.0)));   // the tall thin one

  h = max(h, (broad < 0.5 ? 1.7 : 1.1) * (1.0 - broad * broad) + 0.3 * noise(vec2(x * 40.0, 3.0)));   // the broad stepped one

}
vec3 skyAt(vec2 u, vec2 pix) {

  float v = clamp((u.y - EYE) / (H - EYE), 0.0, 1.0), mw = milky(u);
  float h = hash(pix);

    float m = b * b * tw * smoothstep(0.0, 0.3, v) * (h < 0.012 ? 1.0 : 0.4);   // the river is dust, not bright stars
    if (m > 0.85) col = STAR[1]; else if (m > 0.3) col = STAR[0]; else if (m > 0.05) col = mix(col, STAR[0], 0.5);

}

// The thing: the whale, sixteen stars joined by faint lines, the last of them the eye
// Drawn as a star chart would: an open stick figure along the spine, not an outline
const int EDGES[20] = int[20](0, 1, 1, 2, 2, 3, 3, 4, 4, 5, 4, 6, 0, 7, 7, 8, 8, 4, 7, 9);
float whaleLines(vec2 c) {
  float near = 1e3;
  for (int e = 0; e < 10; e++) {
    vec2 a = toPix(uStar[EDGES[e * 2]].xy) + 0.5, b = toPix(uStar[EDGES[e * 2 + 1]].xy) + 0.5;

  }
  return near;
}
vec3 whale(vec2 pix, vec3 col, bool mirrored) {
  vec2 c = pix + 0.5;
  float nearest = 1e3;
  for (int i = 0; i < 11; i++) {
    vec2 sp = toPix(uStar[i].xy) + 0.5;
    nearest = min(nearest, length(c - sp));
    vec2 o = abs(pix - floor(sp)); float m = uStar[i].z, r = o.x + o.y;
    if (r == 0.0) return STAR[i == 10 || m > 0.72 ? 3 : m > 0.5 ? 2 : 1];
    // Only the brightest swell past one pixel, and only faintly; the eye a little more as it brightens
    if (r == 1.0 && i == 10) return uEye > 0.35 + 0.5 * dots() ? STAR[1] : STAR[0];
    if (r == 1.0 && m > 0.74 && dots() < 0.5) return mix(col, STAR[0], 0.6);
  }
  if (mirrored) return col;
  float near = whaleLines(c);
  // Faint and fine, like a line drawn on a chart
  if (near < 0.55 && clamp(uLines, 0.0, 1.0) > dots()) return LINE * max(1.0, uLines);
  if (near < 2.0 || nearest < 3.5) return skyBase((c - uRes * 0.5) * PX + vec2(0.0, 1.5));   // clear stray stars off the lines
  return col;
}

// The land: a dark dried-out plain to the horizon, cracked into plates near by, with still pools that mirror the sky
float plate(vec2 u) {
  float z = D * EYE / (EYE - u.y);
  vec2 g = vec2(u.x * z / D, z) * vec2(1.2, 1.5), n = floor(g), f = fract(g);
  float md = 8.0, id = 0.0;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 o = vec2(i, j), r = o + vec2(hash(n + o), hash(n + o + 19.19)) * 0.85 + 0.075 - f;
    float d = dot(r, r);
    if (d < md) { md = d; id = hash(n + o + 7.7); }
  }
  return id;
}
float wetAt(vec2 u) {
  float z = D * EYE / (EYE - u.y); vec2 g = vec2(u.x * z / D, z);
  float n = noise(g * vec2(0.42, 0.26) + 3.0) * 0.7 + noise(g * vec2(1.3, 0.7)) * 0.3;
  // A shallow channel winding out from the far doorway towards you
  float lane = abs(g.x - DOOR.x * z / DOOR.z - 0.5 * sin(z * 0.23 + 0.6)) / (0.35 + 0.25 * noise(g * vec2(1.5, 0.6)));
  n = max(n * smoothstep(3.6, 4.6, z), 1.05 - lane * 0.5);
  return (EYE - u.y) / PX < 1.0 ? 1.0 : step(1.0 - 0.36 * uWet, n);
}
vec3 plainAt(vec2 u, vec2 pix) {
  float z = D * EYE / (EYE - u.y), gx = u.x * z / D;

  vec2 ds = onPage(DOOR); float dk = D / DOOR.z;
  vec3 col;
  if (wetAt(u) > 0.5) {
    // A pool: the sky upside down, dimmed, trembling a little sideways
    float wob = (noise(vec2(z * 3.0 + 1.3 * sin(6.2831853 * uU), u.x * 2.0)) - 0.5) * 1.4 * PX;
    vec2 m = vec2(u.x + wob, 2.0 * EYE - u.y), mp = toPix(m);

// The far doorway itself, the same shape as this one, glowing

// The page round the doorway: steel frame, its shadow, and a little of the plain spilt over the threshold
vec3 pageAt(vec2 u, vec2 pix, float px) {

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas: stage, antialias: false });
renderer.setPixelRatio(1);
const uniforms = {
  uRes: { value: new THREE.Vector2(1, 1) }, uSpan: { value: 1.95 }, uU: { value: 0 },
  uLines: { value: 1 }, uDoor: { value: 1 }, uEye: { value: 0 }, uWet: { value: 1 },
  uStar: { value: Array.from({ length: 11 }, () => new THREE.Vector3()) },
};
const scene = new THREE.Scene(), camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const page = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms, fragmentShader: frag, vertexShader: 'void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }', depthTest: false,
}));
page.frustumCulled = false;
scene.add(page);

let cols = 1, rows = 1, sizedW = -1, sizedH = -1;
function resize() {

  const w = innerWidth || 1280, h = innerHeight || 800;
  const scale = Math.max(3, Math.round(Math.min(w * 1.3, h) / 104));
  cols = Math.ceil(w / scale); rows = Math.ceil(h / scale);
  renderer.setSize(cols, rows, false);
  stage.style.width = cols * scale + 'px'; stage.style.height = rows * scale + 'px';
  uniforms.uRes.value.set(cols, rows);
  uniforms.uSpan.value = Math.max(1.95, 1.4 * rows / cols);
}

// The humpback's stars, nose to the left: x, y, how near the viewer it is, and how bright. Snout, head, back, hump, tail stock,
// the two fluke tips, throat, belly, the tip of the long fin, and the eye last.
const WHALE = [
  [-1.0, 0.02, 0, 0.6], [-0.6, 0.15, 0, 0.45], [-0.08, 0.21, 0, 0.78], [0.38, 0.15, 0, 0.55], [0.8, 0.03, 0, 0.5],
  [1.06, 0.24, -0.15, 0.8], [1.1, -0.13, 0.15, 0.6], [-0.52, -0.19, 0.05, 0.52], [0.12, -0.17, 0.05, 0.4], [-0.14, -0.52, 0.3, 0.76],
  [-0.72, 0.0, 0, 1],
];
const CENTRE = [-0.03, 2.37], SIZE = 0.78, TILT = -0.1, STOCK = 4, EYE_STAR = 10;

// Everything is a function of the time in the loop and nothing else, so the last frame meets the first
const LOOP = 8;
const P = params({
  turn: [0.45, 0, 1],        // how far the whale turns towards you, and its long fin swings, before it turns back
  lines: [1, 0, 2],          // how bright the lines between its stars are
  doorLight: [1, 0, 2],      // how bright the far doorway and its light on the plain are
  pools: [1, 0, 2],          // how much of the plain is still water mirroring the sky
});

function frame(now) {
  if (innerWidth !== sizedW || innerHeight !== sizedH) { sizedW = innerWidth; sizedH = innerHeight; resize(); }
  const u = (now % LOOP) / LOOP, U = uniforms;
  U.uU.value = u;
  U.uLines.value = P.lines; U.uDoor.value = P.doorLight; U.uWet.value = P.pools;

  // It turns towards you and back, still at both ends; the flukes beat twice on the way, lifting it a little; the eye swells between
  const calm = 0.5 - 0.5 * Math.cos(u * Math.PI * 2), mid = Math.sin(Math.PI * u) ** 2;
  const yaw = P.turn * calm, tilt = TILT - 0.05 * calm;
  const beat = 0.3 * mid * Math.sin(Math.PI * 4 * u), lift = 0.025 * mid * Math.sin(Math.PI * 4 * u - 1.2);
  U.uEye.value = mid;
  const [sx, sy] = WHALE[STOCK];
  WHALE.forEach(([x, y, z, m], i) => {
    // Flukes swing about the tail stock; the stock before it swings half as far
    const f = i === 5 || i === 6 ? beat : i === 3 ? beat * 0.3 : 0;
    if (f) { const dx = x - sx, dy = y - sy; x = sx + dx * Math.cos(f) - dy * Math.sin(f); y = sy + dx * Math.sin(f) + dy * Math.cos(f); }

    const tx = x * Math.cos(yaw) - z * Math.sin(yaw);
    const c = Math.cos(tilt), s = Math.sin(tilt);
    const tw = 0.92 + 0.08 * Math.sin(Math.PI * 2 * ((i % 3) + 1) * u + i * 1.7);
    U.uStar.value[i].set(CENTRE[0] + (tx * c - y * s) * SIZE, CENTRE[1] + lift + (tx * s + y * c) * SIZE, i === EYE_STAR ? m : m * tw);
  });

  renderer.render(scene, camera);
}
loop(LOOP, frame);
</script>
