<meta charset="utf-8">
<title>Full moon</title>
<style>
  /* Layout: the whole frame is night sea and sky, drawn in chunky pixels. */
  :root { --bg: #070a18; color-scheme: dark; }
  html, body { height: 100%; }
  body { background: var(--bg); overflow: hidden; }
  #stage {
    position: fixed; left: 0; top: 0; display: block;
    image-rendering: pixelated;
    touch-action: none; cursor: grab;
  }
  #stage.turning { cursor: grabbing; }
</style>

<canvas id="stage" aria-label="A loop on a calm night sea. A full moon rises, turns out to be a mirror ball and starts to spin, throwing spots of light over the sea and clouds while the waves move in time and the light turns magenta, cyan and gold; then it sets and the sea goes still and dark."></canvas>

<script type="module">
import * as THREE from 'three';
import { params, loop, sections } from 'scene';

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

// Nothing here is a mesh: every pixel walks a ray to the sea, the moon or the sky
const frag = /* glsl */`
precision highp float;
uniform vec2 uRes;
uniform vec3 uRight, uUp, uFwd, uMoonDir;
uniform float uSpan, uMoonSize, uRisen, uBall, uSpin, uSpots, uSpotSize, uColour, uGroove, uWaves, uBeat, uRound;

const float BAYER[16] = float[16](0.0, 8.0, 2.0, 10.0, 12.0, 4.0, 14.0, 6.0, 3.0, 11.0, 1.0, 9.0, 15.0, 7.0, 13.0, 5.0);
const vec3 SKY[5] = vec3[5](vec3(0.02, 0.025, 0.07), vec3(0.04, 0.055, 0.13), vec3(0.07, 0.09, 0.2), vec3(0.12, 0.15, 0.29), vec3(0.22, 0.25, 0.4));
const vec3 CLOUD[5] = vec3[5](vec3(0.05, 0.055, 0.12), vec3(0.1, 0.11, 0.2), vec3(0.18, 0.19, 0.3), vec3(0.34, 0.35, 0.46), vec3(0.62, 0.63, 0.7));
const vec3 SEA[5] = vec3[5](vec3(0.01, 0.015, 0.045), vec3(0.03, 0.045, 0.1), vec3(0.06, 0.09, 0.18), vec3(0.11, 0.16, 0.28), vec3(0.24, 0.3, 0.42));
const vec3 MOON[5] = vec3[5](vec3(0.42, 0.43, 0.5), vec3(0.6, 0.6, 0.63), vec3(0.76, 0.75, 0.72), vec3(0.9, 0.88, 0.8), vec3(1.0, 0.98, 0.9));
const vec3 BALL[5] = vec3[5](vec3(0.12, 0.13, 0.2), vec3(0.3, 0.32, 0.42), vec3(0.55, 0.57, 0.66), vec3(0.82, 0.83, 0.88), vec3(1.0));
const vec3 MAGENTA = vec3(1.0, 0.25, 0.72), CYAN = vec3(0.25, 0.9, 1.0), GOLD = vec3(1.0, 0.8, 0.25);
const vec3 GLINT = vec3(0.95, 0.93, 0.8);

const vec3 EYE = vec3(0.0, 1.0, 0.0);
const float FAR = 400.0;                    // how far off the moon is
const vec3 SPOTS_FROM = vec3(0.0, 5.0, -12.0); // where the spots on the sea seem to be thrown from
const float CELL = 0.105;                   // how far apart the spots are, as an angle
const float TILE = 0.3;                     // the size of a mirror tile on the ball, as an angle

float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float noise(vec3 x) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x), mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x), mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
vec3 spinY(vec3 v, float a) { float c = cos(a), s = sin(a); return vec3(c * v.x - s * v.z, v.y, s * v.x + c * v.z); }

// Steps between neighbouring tones in a fixed pattern, so shading is dots, not blends
float dots() { ivec2 c = ivec2(gl_FragCoord.xy) & 3; return (BAYER[c.y * 4 + c.x] + 0.5) / 16.0; }
vec3 rung(vec3 r[5], float t) { float x = clamp(t, 0.0, 1.0) * 4.0; return r[min(int(x) + (fract(x) > dots() ? 1 : 0), 4)]; }
vec3 party(float i) { i = mod(i, 3.0); return i < 1.0 ? MAGENTA : i < 2.0 ? CYAN : GOLD; }
float pulse() { return exp(-fract(uBeat) * 5.0); }

// The thing: the moon, far off, which is a mirror ball underneath
float toMoon(vec3 ro, vec3 rd) {
  vec3 m = uMoonDir * FAR - ro; float r = FAR * uMoonSize;
  float b = dot(rd, m), disc = b * b - dot(m, m) + r * r;
  return disc > 0.0 ? b - sqrt(disc) : -1.0;
}
vec3 moonAt(vec3 p, vec3 rd) {
  vec3 n = normalize(p - uMoonDir * FAR);
  float face = max(dot(n, -rd), 0.0);
  // As a moon: pale, a little darker at the rim, with grey seas on it
  float seas = smoothstep(0.52, 0.66, noise(n * 3.2 + 1.7)) * 0.3 + smoothstep(0.6, 0.7, noise(n * 7.0)) * 0.12;
  vec3 moon = rung(MOON, 0.35 + 0.65 * pow(face, 0.35) - seas);
  // As a mirror ball: rows of tiles, turning, each catching the light now and then
  vec3 b = spinY(n, uSpin);
  float rowF = asin(clamp(b.y, -1.0, 1.0)) / TILE, row = floor(rowF), clat = (row + 0.5) * TILE;
  float per = max(4.0, floor(6.2832 * cos(clat) / TILE)), colF = atan(b.z, b.x) / 6.2832 * per, col = floor(colF);
  float id = hash(vec3(row, col, 3.0));
  if (id > uBall) return moon;
  float clon = (col + 0.5) / per * 6.2832;
  vec3 fn = spinY(vec3(cos(clat) * cos(clon), sin(clat), cos(clat) * sin(clon)), -uSpin), rf = reflect(rd, fn);
  float flash = pow(max(dot(rf, normalize(vec3(-0.35, 0.15, 1.0))), 0.0), 40.0) + pow(max(dot(rf, normalize(vec3(0.5, -0.1, 1.0))), 0.0), 40.0);
  float fr = fract(rowF), fc = fract(colF);
  if (min(fr, 1.0 - fr) < 0.12 || min(fc, 1.0 - fc) < 0.1) return BALL[0];
  float tone = (0.2 + 0.35 * id + 0.25 * face) * (0.5 + 0.5 * face) + flash;
  if (flash > 0.6 && uColour > 0.5) return party(floor(id * 7.0) + floor(uBeat));
  return rung(BALL, tone);
}

// The mirror ball's spots: a grid of little discs on a sphere of directions, turned with the ball
vec3 spotOver(vec3 col, vec3 d, float strength) {
  d = spinY(d, uSpin);
  float lat = asin(clamp(d.y, -1.0, 1.0)), row = floor(lat / CELL + 0.5), clat = row * CELL;
  float per = max(1.0, floor(6.2832 * cos(clat) / CELL)), cell = floor(atan(d.z, d.x) / 6.2832 * per + 0.5), clon = cell / per * 6.2832;
  float id = hash(vec3(row, cell, 7.0));
  if (id > 0.75) return col;
  float a = acos(clamp(dot(d, vec3(cos(clat) * cos(clon), sin(clat), cos(clat) * sin(clon))), -1.0, 1.0)), r = 0.026 * uSpotSize;
  if (smoothstep(r, r * 0.75, a) * uSpots * strength > dots()) return mix(vec3(0.96, 0.96, 1.0), party(floor(id * 9.0) + floor(uBeat)), uColour) * (0.6 + 0.4 * strength);
  return col;
}

// The land: the sea. A height for every spot on the water, ripples always and, while the ball turns, a swell that runs in on the beat.
float sea(vec2 q) {
  float tau = 6.2832, u = uRound * tau;
  float calm = 0.02 * sin(q.x * 1.9 + q.y * 1.1 + u * 7.0) + 0.015 * sin(-q.x * 1.3 + q.y * 2.3 + u * 9.0) + 0.01 * sin(q.x * 3.7 - q.y * 1.7 - u * 11.0);
  float swell = pow(0.5 + 0.5 * sin(q.y * 1.3 + 0.35 * sin(q.x * 0.45) - uBeat * tau), 3.0);
  return calm * (1.0 + uGroove) + uGroove * uWaves * 0.2 * swell * (0.75 + 0.25 * pulse());
}
vec3 seaAt(vec3 g, vec3 rd, float dist) {
  float e = 0.04 + dist * 0.012, h = sea(g.xz);
  vec3 n = normalize(vec3(h - sea(g.xz + vec2(e, 0.0)), e, h - sea(g.xz + vec2(0.0, e))));
  vec3 r = reflect(rd, n);
  float fres = pow(1.0 - max(dot(-rd, n), 0.0), 4.0);
  float crest = uGroove * smoothstep(0.08, 0.17, h) * smoothstep(40.0, 6.0, dist);
  float tone = 0.12 + 0.18 * uRisen + 0.45 * fres * (0.35 + 0.65 * uRisen) + 0.3 * crest;
  vec3 col = rung(SEA, tone);
  // The moon's path on the water: wherever a wave tips the moon's light up at you
  float glint = pow(max(dot(r, uMoonDir), 0.0), 500.0 / (1.0 + uGroove)) * smoothstep(-uMoonSize, uMoonSize, uMoonDir.y);
  if (glint * 1.4 > dots()) col = mix(GLINT, party(floor(uBeat)), uColour * 0.7);
  return spotOver(col, normalize(g - SPOTS_FROM), mix(0.5, 1.0, smoothstep(40.0, 12.0, dist)));
}

// Beyond: the night sky with a few long clouds, paler towards the horizon and around the moon
vec3 skyAt(vec3 rd, bool moon, vec3 moonCol) {
  float el = asin(rd.y), az = atan(rd.x, -rd.z), off = acos(clamp(dot(rd, uMoonDir), -1.0, 1.0));
  float halo = exp(-off * 5.0) * uRisen;
  vec3 col = moon ? moonCol : rung(SKY, 0.16 + 0.3 * (1.0 - smoothstep(0.0, 0.4, el)) * (0.4 + 0.6 * uRisen) + 0.55 * halo);
  float wash = uColour * pulse() * 0.3 * (1.0 - smoothstep(0.0, 0.12, el));
  if (!moon && wash > dots()) col = mix(col, party(floor(uBeat)), 0.3);
  float dens = noise(vec3(az * 4.0, el * 20.0, 0.5)) * 0.65 + noise(vec3(az * 11.0, el * 38.0, 3.5)) * 0.35;
  float cover = dens - 0.56 - 0.25 * smoothstep(0.2, 0.45, el) - 0.3 * smoothstep(0.05, 0.0, el);
  float strength = 0.55;
  if (cover > (moon ? 0.07 : 0.0)) {
    col = rung(CLOUD, 0.2 + 1.6 * cover + 0.9 * exp(-off * 4.0) * uRisen);
    strength = 0.85;
  } else if (moon) return col;
  return spotOver(col, rd, strength);
}

void main() {
  vec2 s = (gl_FragCoord.xy / uRes) * 2.0 - 1.0;
  vec3 rd = normalize(uFwd + uRight * s.x * uSpan * uRes.x / uRes.y + uUp * s.y * uSpan), ro = EYE;
  vec3 col;
  if (rd.y < 0.0) {
    float t = -ro.y / rd.y;
    col = seaAt(ro + rd * t, rd, t);
  } else {
    float tm = toMoon(ro, rd);
    col = skyAt(rd, tm > 0.0, tm > 0.0 ? moonAt(ro + rd * tm, rd) : vec3(0.0));
  }
  gl_FragColor = vec4(col, 1.0);
}`;

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas: stage, antialias: false });
renderer.setPixelRatio(1);
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const uniforms = {
  uRes: { value: new THREE.Vector2(1, 1) }, uSpan: { value: 0.4 }, uRight: { value: V() }, uUp: { value: V() }, uFwd: { value: V() },
  uMoonDir: { value: V() }, uMoonSize: { value: 0.085 }, uRisen: { value: 0 }, uBall: { value: 0 }, uSpin: { value: 0 },
  uSpots: { value: 0 }, uSpotSize: { value: 1 }, uColour: { value: 0 }, uGroove: { value: 0 }, uWaves: { value: 1 }, uBeat: { value: 0 }, uRound: { value: 0 },
};
const scene = new THREE.Scene(), camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const page = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms, fragmentShader: frag, vertexShader: 'void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }', depthTest: false,
}));
page.frustumCulled = false;
scene.add(page);

let cols = 1, rows = 1, sizedW = -1, sizedH = -1;
function resize() {
  // A hidden pane reports no size; draw for a plausible one until it has one
  const w = innerWidth || 1280, h = innerHeight || 800;
  const scale = Math.max(3, Math.round(Math.min(w * 1.3, h) / 104));
  cols = Math.ceil(w / scale); rows = Math.ceil(h / scale);
  renderer.setSize(cols, rows, false);
  stage.style.width = cols * scale + 'px'; stage.style.height = rows * scale + 'px';
  uniforms.uRes.value.set(cols, rows);
  uniforms.uSpan.value = Math.max(0.4, 0.53 * rows / cols);
}

// Dragging only shifts where you watch from; the loop itself answers to nothing
const view = { yaw: 0, pitch: 0.1 };
const drag = { down: false, x: 0, y: 0 };
stage.addEventListener('pointerdown', e => { stage.setPointerCapture(e.pointerId); Object.assign(drag, { down: true, x: e.clientX, y: e.clientY }); stage.classList.add('turning'); });
addEventListener('pointermove', e => {
  if (!drag.down) return;
  view.yaw -= (e.clientX - drag.x) * 0.004; view.pitch = clamp(view.pitch - (e.clientY - drag.y) * 0.002, 0.0, 0.3);
  drag.x = e.clientX; drag.y = e.clientY;
});
const release = () => { drag.down = false; stage.classList.remove('turning'); };
addEventListener('pointerup', release);
addEventListener('pointercancel', release);

const EASE = {
  lin: x => x, io: x => x < 0.5 ? 4 * x * x * x : 1 - (2 - 2 * x) ** 3 / 2, in: x => x * x * x, out: x => 1 - (1 - x) ** 3,
};
// A track is a list of [when, value, how to arrive]; between entries it moves, after the last it stays
function key(track, t) {
  if (t <= track[0][0]) return track[0][1];
  for (let i = 1; i < track.length; i++) if (t < track[i][0]) {
    const [t0, a] = track[i - 1], [t1, b, how = 'io'] = track[i];
    return a + (b - a) * EASE[how]((t - t0) / (t1 - t0));
  }
  return track[track.length - 1][1];
}

// Everything is a function of the time in the loop and nothing else, so the last frame meets the first
const S = sections({ rising: 3, turning: 2.5, dancing: 5, setting: 3, still: 1.5 });
const BEATS = 30;   // beats once round the loop
const P = params({
  moonSize: [0.11, 0.06, 0.16],   // how big the moon is in the sky
  spotSize: [1, 0.4, 1.8],         // how big the spots of light are
  waves: [1, 0, 2],                // how high the waves dance
});

function frame(now) {
  if (innerWidth !== sizedW || innerHeight !== sizedH) { sizedW = innerWidth; sizedH = innerHeight; resize(); }
  const t = S.written(now), round = S.round(now), real = round * S.length, U = uniforms;

  // Where you are looking from: out to sea, a slow sway
  const yaw = 0.04 * Math.sin(round * Math.PI * 2) + view.yaw, pitch = view.pitch;
  const fwd = U.uFwd.value.set(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
  const right = U.uRight.value.set(Math.cos(yaw), 0, Math.sin(yaw));
  U.uUp.value.crossVectors(right, fwd);

  // The moon comes up out of the sea, hangs, and goes back down
  const size = P.moonSize, low = -size - 0.03;
  const elev = key([[0, low], [0.3, low], [3.0, 0.22, 'out'], [10.5, 0.25], [13.5, low, 'in']], t);
  U.uMoonDir.value.set(0, Math.sin(elev), -Math.cos(elev));
  U.uMoonSize.value = size;
  U.uRisen.value = clamp((elev + size) / (2.5 * size), 0, 1);
  // Its tiles show, it turns, it throws spots, the colours come in, and it all goes again as it sets
  U.uBall.value = key([[0, 0], [3.0, 0], [4.0, 1]], t);
  U.uSpots.value = key([[0, 0], [3.6, 0], [5.0, 1, 'out'], [10.5, 1], [12.6, 0]], t);
  U.uColour.value = key([[0, 0], [5.5, 0], [6.3, 1, 'out'], [10.5, 1], [12.2, 0]], t);
  U.uGroove.value = key([[0, 0], [5.5, 0], [6.5, 1], [10.5, 1], [12.8, 0]], t);
  // The spin starts slow and keeps going in real time, so it carries on through a held section
  const since = Math.max(0, real - S.start('turning') - 0.3), ramp = 1.5, w = 0.35;
  U.uSpin.value = since < ramp ? 0.5 * w * since * since / ramp : 0.5 * w * ramp + w * (since - ramp);
  U.uSpotSize.value = P.spotSize;
  U.uWaves.value = P.waves;
  U.uBeat.value = round * BEATS;
  U.uRound.value = round;

  renderer.render(scene, camera);
}
loop(S, frame);
</script>
