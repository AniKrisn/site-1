<meta charset="utf-8">
<title>Waterfall</title>
<style>
  /* Layout: a white page with one thing on it, drawn in chunky pixels. Deliberately light-only. */
  :root { --bg: #ffffff; color-scheme: light; }
  html, body { height: 100%; }
  body { background: var(--bg); overflow: hidden; }
  #stage {
    position: fixed; left: 0; top: 0; display: block;
    image-rendering: pixelated;
    touch-action: none; cursor: grab;
  }
  #stage.turning { cursor: grabbing; }
</style>

<canvas id="stage" aria-label="A four second loop. A cut block of gorge on a white page: ochre cliffs hung with bushes, a pale house on top, and a waterfall pouring into a green pool that spills off the front edge."></canvas>

<script type="module">
import * as THREE from 'three';
import { params, loop } from 'scene';

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

// Nothing here is a mesh: every pixel walks a ray to a shape described by distance
const frag = /* glsl */`
precision highp float;
uniform vec2 uRes;
uniform vec3 uRight, uUp, uFwd, uTarget, uLight, uPool;
uniform float uSpan, uT, uFall, uLeaves, uStars;   // uT goes 0 to 1 once round the loop
const float BAYER[16] = float[16](0.0, 8.0, 2.0, 10.0, 12.0, 4.0, 14.0, 6.0, 3.0, 11.0, 1.0, 9.0, 15.0, 7.0, 13.0, 5.0);
const float TAU = 6.2831853;

// The few tones each material is allowed, dark to light
const vec3 ROCK[5] = vec3[5](vec3(0.23, 0.14, 0.12), vec3(0.44, 0.28, 0.2), vec3(0.66, 0.46, 0.3), vec3(0.84, 0.66, 0.43), vec3(0.96, 0.86, 0.64));
const vec3 LEAF[5] = vec3[5](vec3(0.06, 0.16, 0.12), vec3(0.12, 0.29, 0.15), vec3(0.24, 0.44, 0.18), vec3(0.45, 0.62, 0.24), vec3(0.72, 0.82, 0.4));
const vec3 FOAM[3] = vec3[3](vec3(0.5, 0.7, 0.8), vec3(0.8, 0.91, 0.95), vec3(1.0));
const vec3 WALL[3] = vec3[3](vec3(0.62, 0.5, 0.45), vec3(0.87, 0.78, 0.68), vec3(0.99, 0.95, 0.87));

const vec3 GOLD[3] = vec3[3](vec3(0.88, 0.56, 0.1), vec3(1.0, 0.8, 0.25), vec3(1.0, 0.95, 0.65));
const vec3 BLUE[3] = vec3[3](vec3(0.25, 0.48, 0.88), vec3(0.45, 0.72, 0.97), vec3(0.8, 0.93, 1.0));

const vec3 FOOT =vec3(-0.16, 0.15, 0.04);    // where the big fall lands in the pool
const vec3 HEART = vec3(0.0, 0.5, 0.0);      // middle of the block, for the ball that bounds it
// Bushes: where each sits, and how big
const vec4 BUSH[12] = vec4[12](
  vec4(-0.76, 1.12, -0.05, 0.22), vec4(-0.68, 1.22, -0.5, 0.2), vec4(-0.86, 0.86, 0.36, 0.2), vec4(-0.74, 0.56, 0.56, 0.16),
  vec4(-0.08, 1.5, -0.52, 0.15), vec4(0.7, 1.52, -0.42, 0.2), vec4(0.86, 1.32, -0.08, 0.2), vec4(0.8, 0.98, 0.3, 0.17),
  vec4(0.76, 0.5, 0.54, 0.15), vec4(0.16, 1.18, -0.2, 0.11), vec4(-0.9, 1.0, -0.3, 0.18), vec4(0.48, 0.92, -0.14, 0.1));

float hash1(float x) { return fract(sin(x * 127.1) * 43758.5453); }
float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float noise(vec3 x) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x), mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x), mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
float smin(float a, float b, float k) { float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }
float ball(vec3 p, vec3 c, float r) { return length(p - c) - r; }
float egg(vec3 p, vec3 c, vec3 r) { vec3 q = (p - c) / r; float k0 = length(q), k1 = length(q / r); return k0 * (k0 - 1.0) / max(k1, 1e-4); }
float rod(vec3 p, vec3 a, vec3 b, float ra, float rb) {
  vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h) - mix(ra, rb, h);
}
float box(vec3 p, vec3 c, vec3 h, float r) { vec3 q = abs(p - c) - h + r; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0) - r; }

// The thing: a block of gorge. Rock first: a plinth, a tall crag at the back, a low shoulder the stream crosses, and a wing each side
float rock(vec3 p) {
  float d = box(p, vec3(0.0, 0.1, 0.0), vec3(1.0, 0.1, 0.8), 0.04);
  d = smin(d, max(egg(p, vec3(0.3, 0.75, -0.5), vec3(0.72, 0.85, 0.34)), p.y - 1.5), 0.08);   // crag, flat on top for the house
  d = smin(d, egg(p, vec3(-0.55, 0.5, -0.5), vec3(0.5, 0.64, 0.34)), 0.08);                    // shoulder
  d = smin(d, egg(p, vec3(-0.78, 0.45, 0.0), vec3(0.3, 0.68, 0.68)), 0.08);                    // left wing
  d = smin(d, egg(p, vec3(0.8, 0.55, -0.02), vec3(0.3, 0.8, 0.62)), 0.08);                     // right wing
  d -= (noise(p * 4.5) - 0.5) * 0.16 * smoothstep(0.15, 0.4, p.y) + (noise(p * 10.0) - 0.5) * 0.05;   // crags
  d = max(d, -egg(p, vec3(0.05, 0.2, 0.2), vec3(0.62, 0.1, 0.46)));                            // basin for the pool
  d = max(d, -box(p, vec3(0.15, 0.2, 0.7), vec3(0.14, 0.07, 0.2), 0.03));                      // and the gap it leaves by
  d = max(d, -rod(p, vec3(-0.5, 1.16, -0.9), vec3(-0.36, 1.12, -0.2), 0.09, 0.09));            // bed of the stream on top
  d = max(d, -ball(p, vec3(-0.12, 0.45, -0.2), 0.26));                                         // hollow behind the fall
  return max(d, box(p, vec3(0.0, 0.5, 0.0), vec3(1.0, 1.7, 0.8), 0.03));                       // cut square, like a sample
}
// Spray where falling water lands
float spray(vec3 p) {
  float puff = (noise(p * 13.0 + 0.4 * vec3(cos(TAU * uT), sin(TAU * uT), 0.0)) - 0.5) * 0.07;
  float d = ball(p, FOOT + vec3(0.0, 0.03, 0.03), (0.1 + 0.015 * sin(TAU * 2.0 * uT)) * uFall);
  d = min(d, ball(p, vec3(0.4, 0.17, 0.32), 0.06 + 0.01 * sin(TAU * 2.0 * uT + 2.0)));
  return d - puff;
}
float water(vec3 p) {
  float d = max(egg(p, vec3(0.05, 0.2, 0.2), vec3(0.64, 0.12, 0.48)), p.y - 0.15);                        // pool
  d = min(d, max(box(p, vec3(0.15, 0.2, 0.72), vec3(0.13, 0.07, 0.1), 0.02), p.y - 0.15));                // running out the front
  vec3 e = vec3(p.x, p.y, (p.z - 0.82) * 2.5 + 0.82);
  d = min(d, rod(e, vec3(0.15, 0.12, 0.82), vec3(0.15, -0.4, 0.9), 0.11, 0.05) / 2.5);                    // and over the edge, a thinning sheet
  for (int i = 0; i < 5; i++) {                                                                           // that breaks into drops and is gone
    float f = fract(2.0 * uT + float(i) / 5.0);
    d = min(d, ball(p, vec3(0.15 + 0.07 * (hash1(float(i) + 3.0) - 0.5), -0.4 - 0.2 * f - 0.75 * f * f, 0.852), 0.05 * (1.0 - f)));
  }
  d = min(d, rod(p, vec3(-0.5, 1.09, -0.79), vec3(-0.36, 1.08, -0.22), 0.05, 0.05));                      // stream on top
  float w = uFall;
  d = smin(d, rod(p, vec3(-0.36, 1.08, -0.22), vec3(-0.3, 0.95, -0.1), 0.055 * w, 0.065 * w), 0.02);       // the big fall, in three reaches
  d = smin(d, rod(p, vec3(-0.3, 0.95, -0.1), vec3(-0.22, 0.6, -0.02), 0.065 * w, 0.085 * w), 0.02);
  d = smin(d, rod(p, vec3(-0.22, 0.6, -0.02), FOOT, 0.085 * w, 0.11 * w), 0.02);
  d = min(d, rod(p, vec3(0.54, 0.56, 0.04), vec3(0.46, 0.42, 0.2), 0.035, 0.04));                         // the small one
  d = min(d, rod(p, vec3(0.46, 0.42, 0.2), vec3(0.4, 0.15, 0.3), 0.04, 0.05));
  return min(d, spray(p));
}
float leaves(vec3 p) {
  float d = 1e3;
  for (int i = 0; i < 12; i++) d = smin(d, ball(p, BUSH[i].xyz, BUSH[i].w * uLeaves), 0.06);
  if (d > 0.3) return d - 0.1;
  vec3 q = p + vec3(0.012 * sin(TAU * uT + p.y * 5.0), 0.0, 0.0);   // a little wind
  return d - (noise(q * 9.0) - 0.5) * 0.13 - (noise(q * 19.0) - 0.5) * 0.05;
}
float house(vec3 p) {
  return min(box(p, vec3(0.3, 1.6, -0.5), vec3(0.17, 0.1, 0.11), 0.005), box(p, vec3(0.5, 1.64, -0.46), vec3(0.08, 0.14, 0.09), 0.005));
}
// Star bits: little gems on a tilted ring round the island. Each moves one place along per loop, so the ring closes.
float ring(vec3 p, int n, float r, float y0, float tilt, float dir) {
  float d = 1e3;
  if (uStars < 0.5) return d;
  for (int i = 0; i < 6; i++) {
    if (i >= n) break;
    float a = TAU * (float(i) + dir * uT) / float(n);
    vec3 c = vec3(cos(a) * r, y0 + tilt * sin(a + 1.0) + 0.05 * sin(TAU * 2.0 * uT + a * 3.0), sin(a) * r);
    vec3 q = abs(p - c);
    d = min(d, (q.x + q.y + q.z - 0.075 - 0.02 * sin(TAU * 3.0 * uT + a * 5.0)) * 0.577);   // twinkling
  }
  return d;
}
float starsA(vec3 p) { return ring(p, 5, 1.5, 0.75, 0.45, 1.0); }
float starsB(vec3 p) { return ring(p, 4, 1.3, 0.2, -0.5, -1.0); }
float map(vec3 p) { return min(min(min(rock(p), water(p)), min(leaves(p), house(p))), min(starsA(p), starsB(p))); }

vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.012, -0.012);
  return normalize(e.xyy * map(p + e.xyy) + e.yyx * map(p + e.yyx) + e.yxy * map(p + e.yxy) + e.xxx * map(p + e.xxx));
}
// How much of the light reaches a point, soft at the edges
float lightAt(vec3 ro) {
  float res = 1.0, t = 0.05;
  for (int i = 0; i < 32; i++) {
    float d = map(ro + uLight * t);
    res = min(res, 7.0 * d / t);
    t += clamp(d, 0.04, 0.18);
    if (res < 0.01 || t > 3.0) break;
  }
  return clamp(res, 0.0, 1.0);
}
// Steps between neighbouring tones in a fixed pattern, so shading is dots, not blends
float dots() { ivec2 c = ivec2(gl_FragCoord.xy) & 3; return (BAYER[c.y * 4 + c.x] + 0.5) / 16.0; }
float stepped(float t, float steps) { float x = clamp(t, 0.0, 1.0) * steps; return min(floor(x) + (fract(x) > dots() ? 1.0 : 0.0), steps) / steps; }
vec3 of5(vec3 r[5], float t) { return r[int(stepped(t, 4.0) * 4.0 + 0.5)]; }
vec3 of3(vec3 r[3], float t) { return r[int(stepped(t, 2.0) * 2.0 + 0.5)]; }

// Falling water: streaks sliding down, each column at its own whole number of trips a loop
vec3 fallColour(vec3 p, float lit) {
  float h = hash1(floor(p.x * 17.0 + p.z * 9.0));
  float s = fract(p.y * 2.5 + uT * (5.0 + floor(h * 3.0)) + h * 7.0);
  return of3(FOAM, (0.5 + 0.5 * lit) * (s < 0.32 ? 0.4 : 1.0));
}
// Still water: dark, with rings going out from where the fall lands
vec3 poolColour(vec3 p, float lamp) {
  float r = length(p.xz - FOOT.xz), ring = sin(r * 30.0 - TAU * 3.0 * uT + 2.0 * noise(p * 6.0));
  float t = 0.22 + 0.3 * lamp + (ring > 0.5 ? 0.4 * (1.0 - smoothstep(0.2, 0.75, r)) : 0.0) + 0.5 * (1.0 - smoothstep(0.1, 0.24, r));
  float k = stepped(t, 3.0) * 3.0;
  return k < 0.5 ? uPool * 0.45 : k < 1.5 ? uPool * 0.75 : k < 2.5 ? uPool : mix(uPool, vec3(1.0), 0.8);
}
vec3 houseColour(vec3 p, vec3 n, float lit) {
  bool tower = p.x > 0.415;
  float top = tower ? 1.78 : 1.7;
  if (p.y > top - 0.03) return ROCK[lit > 0.3 ? 2 : 1];                                   // roof
  float u = abs(n.z) > abs(n.x) ? p.x : p.z;
  if (p.y > top - 0.11 && p.y < top - 0.06 && fract(u * 11.0 + 0.2) < 0.3) return ROCK[0];   // windows
  return of3(WALL, 0.25 + 0.75 * lit);
}

// The land: what the thing stands on and its shadow falls on. Here a flat white page, with nothing beyond it.
vec3 landAt(vec3 g, vec2 s, float shade) { return vec3(1.0 - 0.24 * shade); }

void main() {
  vec2 s = (gl_FragCoord.xy / uRes) * 2.0 - 1.0, at = vec2(s.x * uSpan * uRes.x / uRes.y, s.y * uSpan);
  vec3 ro = uTarget + uRight * at.x + uUp * at.y - uFwd * 5.0, rd = uFwd;
  vec3 col = vec3(1.0);
  float tHit = -1.0;
  // Only rays that pass near the island need walking; it floats, so there is no floor to stop at
  vec3 oc = ro - HEART; float b = dot(oc, rd), disc = b * b - dot(oc, oc) + 2.0 * 2.0;
  if (disc > 0.0) {
    float t = -b - sqrt(disc), tEnd = -b + sqrt(disc);
    for (int i = 0; i < 110 && t < tEnd; i++) {
      float d = map(ro + rd * t);
      if (d < 0.003) { tHit = t; break; }
      t += d * 0.6;   // crags and leaves are too bumpy to trust a full step
    }
  }
  if (tHit > 0.0) {
    vec3 p = ro + rd * tHit, n = normalAt(p);
    float dr = rock(p), dw = water(p), dl = leaves(p), dh = house(p), near = min(min(dr, dw), min(dl, dh));
    float da = starsA(p), db = starsB(p);
    float lamp = lightAt(p + n * 0.03), lit = max(dot(n, uLight), 0.0) * lamp;
    float nook = clamp(0.5 + 0.5 * map(p + n * 0.08) / 0.08, 0.0, 1.0);
    if (min(da, db) < near) col = da < db ? of3(GOLD, 0.2 + 0.9 * max(dot(n, uLight), 0.0)) : of3(BLUE, 0.2 + 0.9 * max(dot(n, uLight), 0.0));
    else if (near == dh) col = houseColour(p, n, lit);
    else if (near == dw) {
      bool flat_ = n.y > 0.75 && ((p.y < 0.17 && p.y > 0.1) || p.y > 1.0) && spray(p) > 0.02;
      col = flat_ ? poolColour(p, lamp) : fallColour(p, lit);
    } else if (near == dl) col = of5(LEAF, (0.1 + 0.8 * lit + (noise(p * 18.0) - 0.5) * 0.3) * nook);
    else {
      bool cut = abs(p.x) > 0.985 || abs(p.z) > 0.785;
      float grain = noise(p * 14.0) - 0.5;
      // Moss on whatever faces up, and all over the left side
      bool moss = !cut && (n.y > 0.6 - 0.3 * noise(p * 6.0) || (p.x < -0.42 + 0.2 * noise(p * 5.0) && p.y > 0.12));
      if (moss) col = of5(LEAF, (0.18 + 0.7 * lit + grain * 0.25) * nook);
      else if (cut) col = of5(ROCK, 0.2 + 0.3 * lit + 0.22 * step(0.5, fract(p.y * 7.0 + noise(p * 3.0) * 0.8)));   // layers of earth
      else col = of5(ROCK, (0.14 + 0.85 * lit + grain * 0.2) * nook);
    }
  } else col = landAt(ro, s, 0.0);   // the bare page, with no shadow on it
  gl_FragColor = vec4(col, 1.0);
}`;

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas: stage, antialias: false });
renderer.setPixelRatio(1);
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const uniforms = {
  uRes: { value: new THREE.Vector2(1, 1) }, uSpan: { value: 1.65 }, uStars: { value: 1 }, uT: { value: 0 }, uFall: { value: 1 }, uLeaves: { value: 1 }, uPool: { value: new THREE.Color() },
  uRight: { value: V() }, uUp: { value: V() }, uFwd: { value: V() }, uTarget: { value: V(0, 0.82, 0) }, uLight: { value: V() },
};
const scene = new THREE.Scene(), camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const page = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms, fragmentShader: frag, vertexShader: 'void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }', depthTest: false,
}));
page.frustumCulled = false;
scene.add(page);

let cols = 1, rows = 1, sizedW = -1, sizedH = -1;
function resize() {
  // A hidden pane reports no size; draw for a plausible one until it has one
  const w = innerWidth || 1280, h = innerHeight || 800;
  const scale = Math.max(3, Math.round(Math.min(w * 1.3, h) / 124));
  cols = Math.ceil(w / scale); rows = Math.ceil(h / scale);
  renderer.setSize(cols, rows, false);
  stage.style.width = cols * scale + 'px'; stage.style.height = rows * scale + 'px';
  uniforms.uRes.value.set(cols, rows);
  uniforms.uSpan.value = Math.max(1.65, 1.8 * rows / cols);
}

// Dragging only shifts where you watch from; the loop itself answers to nothing
const view = { yaw: 0, pitch: 0.3 };
const drag = { down: false, x: 0, y: 0 };
stage.addEventListener('pointerdown', e => { stage.setPointerCapture(e.pointerId); Object.assign(drag, { down: true, x: e.clientX, y: e.clientY }); stage.classList.add('turning'); });
addEventListener('pointermove', e => {
  if (!drag.down) return;
  view.yaw -= (e.clientX - drag.x) * 0.008; view.pitch = clamp(view.pitch + (e.clientY - drag.y) * 0.004, 0.1, 0.9);
  drag.x = e.clientX; drag.y = e.clientY;
});
const release = () => { drag.down = false; stage.classList.remove('turning'); };
addEventListener('pointerup', release);
addEventListener('pointercancel', release);

// Everything is a function of the time in the loop and nothing else, so the last frame meets the first
const LOOP = 4;
const P = params({
  fall: [1, 0.5, 1.8],       // how wide the big waterfall is
  leaves: [1, 0.5, 1.5],     // how bushy the bushes are
  water: '#3f9080',          // colour of the pool
  drift: [1, 0, 2.5],        // how much the island bobs as it floats
  stars: true,               // the star bits circling it
});

function frame(now) {
  if (innerWidth !== sizedW || innerHeight !== sizedH) { sizedW = innerWidth; sizedH = innerHeight; resize(); }
  const t = now % LOOP, round = t / LOOP * Math.PI * 2, U = uniforms;

  // Where you are looking from: a slow sway, so it stays a solid thing
  const yaw = 0.25 + 0.14 * Math.sin(round) + view.yaw, pitch = view.pitch;
  const fwd = U.uFwd.value.set(-Math.sin(yaw) * Math.cos(pitch), -Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
  const right = U.uRight.value.set(Math.cos(yaw), 0, -Math.sin(yaw));
  U.uUp.value.crossVectors(right, fwd);
  // The light stays over your left shoulder
  U.uLight.value.set(Math.sin(yaw) * 0.45, 0.8, Math.cos(yaw) * 0.45).addScaledVector(right, -0.5).normalize();

  // The island hangs in the air and bobs; with nothing else on the page, moving the view the other way is the same thing
  U.uTarget.value.y = 0.45 - 0.05 * P.drift * Math.sin(round + 1.2);
  U.uStars.value = P.stars ? 1 : 0;
  U.uT.value = t / LOOP;
  U.uFall.value = P.fall;
  U.uLeaves.value = P.leaves;
  U.uPool.value.set(P.water);

  renderer.render(scene, camera);
}
loop(LOOP, frame);
</script>
