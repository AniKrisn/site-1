const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const uniforms = {
  uRes: { value: new THREE.Vector2(1, 1) }, uSpan: { value: 0.62 },
  uRight: { value: V() }, uUp: { value: V() }, uFwd: { value: V() }, uTarget: { value: V(0, 0.2, 0) }, uLight: { value: V() },
  uStorm: { value: 1 }, uLip: { value: 1 }, uFlash: { value: 0 }, uBoltOn: { value: 0 }, uTeaMix: { value: 0 },
  uPh: { value: V() }, uTea: { value: new THREE.Color() }, uShipPos: { value: V() }, uTrailA: { value: V() }, uTrailB: { value: V() },
  uRing: { value: new THREE.Vector4() }, uSugar: { value: new THREE.Vector4() },
  uShip: { value: new THREE.Matrix3() }, uCube: { value: new THREE.Matrix3() },
  uDrops: { value: Array.from({ length: 5 }, () => new THREE.Vector4()) },
  uBolt: { value: Array.from({ length: 6 }, () => V()) },
  uSwirl: { value: 0 }, uTwist: { value: 0 }, uVortex: { value: 0 }, uSpoonOn: { value: 0 },
  uSpoonA: { value: V() }, uSpoonD: { value: V(0, 1, 0) }, uSpoonS: { value: V(1, 0, 0) },
};
const scene = new THREE.Scene(), camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const page = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms, fragmentShader: frag, vertexShader: 'void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }', depthTest: false,
}));
page.frustumCulled = false;
scene.add(page);

let cols = 1, rows = 1, sizedW = -1, sizedH = -1, baseSpan = 0.58;
function resize() {
  // A hidden pane reports no size; draw for a plausible one until it has one
  const w = innerWidth || 1280, h = innerHeight || 800;
  const scale = Math.max(3, Math.round(Math.min(w * 1.3, h) / 104));
  cols = Math.ceil(w / scale); rows = Math.ceil(h / scale);
  renderer.setSize(cols, rows, false);
  stage.style.width = cols * scale + 'px'; stage.style.height = rows * scale + 'px';
  uniforms.uRes.value.set(cols, rows);
  baseSpan = Math.max(0.72, 0.8 * rows / cols);   // wide enough that a square frame still holds the saucer
}

// Dragging only shifts where you watch from; the loop itself answers to nothing
const view = { yaw: 0, pitch: 0.55 };
const drag = { down: false, x: 0, y: 0 };
stage.addEventListener('pointerdown', e => { stage.setPointerCapture(e.pointerId); Object.assign(drag, { down: true, x: e.clientX, y: e.clientY }); stage.classList.add('turning'); });
addEventListener('pointermove', e => {
  if (!drag.down) return;
  view.yaw -= (e.clientX - drag.x) * 0.008; view.pitch = clamp(view.pitch + (e.clientY - drag.y) * 0.004, 0.15, 1.2);
  drag.x = e.clientX; drag.y = e.clientY;
});
const release = () => { drag.down = false; stage.classList.remove('turning'); };
addEventListener('pointerup', release);
addEventListener('pointercancel', release);

const EASE = {
  lin: x => x, io: x => x < 0.5 ? 4 * x * x * x : 1 - (2 - 2 * x) ** 3 / 2, in: x => x * x * x, out: x => 1 - (1 - x) ** 3,
  snap: x => 1 - (1 - x) ** 5, fall: x => x ** 4,
};
// A track is a list of [when, value, how to arrive]; between entries it moves, after the last it stays
function key(track, t) {
  if (t <= track[0][0]) return track[0][1];
  for (let i = 1; i < track.length; i++) if (t < track[i][0]) {
    const [t0, a] = track[i - 1], [t1, b, how = 'io'] = track[i];
    return a + (b - a) * EASE[how]((t - t0) / (t1 - t0));
  }
  return track[track.length - 1][1];
}
const bump = (t, at, len) => t > at && t < at + len ? Math.sin((t - at) / len * Math.PI) : 0;

// The story, part by part; everything below is keyed to the time as written
const S = sections({ calm: 2.0, sugar: 1.2, spoon: 1.0, storm: 5.0, lift: 1.0, settle: 2.5 });
const P = params({
  waves: [1, 0, 1.6],      // how rough the sea in the cup is
  flash: [1, 0, 1.5],      // how brightly the lightning lights the cup
  tea: '#80421a',          // the colour of the tea once it settles
});

const LEVEL = 0.2, RIM = 0.33;
const DROP = [2.0, 2.7];                         // the sugar falls, and lands
const LAND = V(0.12, LEVEL, -0.04);              // where it lands
const FROM = V(0.16, 0.72, -0.08);               // where it falls from, just out of sight above
const HOME = Math.atan2(-0.112, -0.033), NEAR = 0.117;   // where the ship rides, at the back of the cup
const HEAD = V(0.96, 0, -0.28);                  // the way its bow points, side on to you and into the current
const STIR = { at: 3.8, a: 1.0, L: 4.4, b: 3.2, turns: 4 };   // the tea speeds up, turns steadily, then slows to a stop
const SWELL = [[0, 0], [3.9, 0], [6.0, 1, 'io'], [9.2, 1], [11.9, 0, 'io']];
const DIP = [[0, 0.75], [3.2, 0.75], [3.85, 0, 'out'], [9.2, 0], [10.1, 0.75, 'in']];   // how far the spoon is drawn back along its length
const HAND = V(0.5, 0.78, -0.04);                  // where the unseen hand holds it, up and to the right
const STRIKES = [[6.3, 0.1, 0.6, 0], [6.45, 0.18, 0.45, 0], [7.7, 0.1, 0.6, -0.24], [7.85, 0.16, 0.4, -0.24]];   // when, how long, how bright, how far along the back
const ZIG = [0, 0.028, -0.018, 0.034, -0.012, 0.004];

// How many times round the tea has turned, and how fast it is turning now (0 to 1)
function stir(t) {
  const { at, a, L, b, turns } = STIR, v = turns / (a / 3 + L + b / 3);
  let x = t - at;
  if (x <= 0) return [0, 0];
  if (x < a) return [v * x ** 3 / (3 * a * a), (x / a) ** 2];
  x -= a; const d1 = v * a / 3;
  if (x < L) return [d1 + v * x, 1];
  x -= L; const d2 = d1 + v * L;
  if (x < b) return [d2 + v * b / 3 * (1 - (1 - x / b) ** 3), (1 - x / b) ** 2];
  return [turns, 0];
}
// The same sea as the shader's, for the ship to ride
function waves(x, z, amp, ph, sw, tw, vx, ring) {
  const r = Math.hypot(x, z), a = -(sw + tw * (0.33 - r) / 0.33), c = Math.cos(a), s = Math.sin(a);
  const kx = c * x - s * z, kz = s * x + c * z;
  let h = amp * (0.026 * Math.sin(17 * kx + 9 * kz - ph[0]) + 0.014 * Math.sin(-8 * kx + 21 * kz - ph[1]) + 0.008 * Math.sin(29 * kx - 13 * kz - ph[2]));
  h += vx * 0.55 * (x * x + z * z - 0.055);
  const w = Math.hypot(x - ring.x, z - ring.y) - ring.z;
  return h + ring.w * Math.cos(w * 30) * Math.exp(-w * w * 70);
}
const fallAt = t => FROM.clone().lerp(LAND, clamp((t - DROP[0]) / (DROP[1] - DROP[0]), 0, 1) ** 2);
const spin = new THREE.Matrix4(), axis = V(1, 0.6, 0.3).normalize();

function frame(now) {
  if (innerWidth !== sizedW || innerHeight !== sizedH) { sizedW = innerWidth; sizedH = innerHeight; resize(); }
  const t = S.written(now), round = S.round(now) * Math.PI * 2, U = uniforms;

  // Where you are looking from: a slow drifting camera, once round the loop, that eases in a little as the storm builds
  const yaw = 0.3 + 0.1 * Math.sin(round) + view.yaw, pitch = view.pitch + 0.035 * Math.sin(round + 0.8);
  const push = key([[0, 0], [3.6, 0], [6.5, 1, 'io'], [9.5, 1], [12.2, 0, 'io']], t);
  U.uSpan.value = baseSpan * (1 - 0.07 * push);
  U.uTarget.value.set(0.025 * Math.sin(round + 1.6), 0.2 + 0.012 * Math.sin(2 * round) + 0.02 * push, 0.02 * Math.cos(round));
  const fwd = U.uFwd.value.set(-Math.sin(yaw) * Math.cos(pitch), -Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
  const right = U.uRight.value.set(Math.cos(yaw), 0, -Math.sin(yaw));
  U.uUp.value.crossVectors(right, fwd);
  // The light stays over your left shoulder
  U.uLight.value.set(Math.sin(yaw) * 0.45, 0.8, Math.cos(yaw) * 0.45).addScaledVector(right, -0.5).normalize();

  // The stirring turns the tea and hollows a whirl in it; the swells it raises are the storm
  const [turns, speed] = stir(t), storm = key(SWELL, t), amp = storm * P.waves;
  const sw = -2 * Math.PI * turns, tw = -1.2 * speed, vx = speed;
  const ph = [9 * round, 7 * round, 12 * round];
  U.uStorm.value = amp; U.uPh.value.set(...ph); U.uTeaMix.value = 1 - storm; U.uTea.value.set(P.tea).convertLinearToSRGB();
  U.uSwirl.value = sw; U.uTwist.value = tw; U.uVortex.value = vx;
  // The ring the sugar sends out
  const since = t - DROP[1], ringAmp = since > 0 && since < 2.4 ? 0.022 * Math.exp(-since * 1.5) * Math.min(1, since / 0.08) : 0;
  U.uRing.value.set(LAND.x, LAND.z, 0.02 + 0.5 * Math.max(since, 0), ringAmp);
  U.uLip.value = 0.9 / Math.sqrt(1 + (amp * 1.06 * (1 + 1.2 * speed) + ringAmp * 32 + vx * 0.4) ** 2);

  // The spoon is held by a hand up and to the right, out of the picture: it slides in along its own length, pivots
  // about that hand as the bowl goes round close to the middle (so the handle sweeps a slanted cone, away from the ship),
  // and slides back out the way it came while the tea still turns
  const dip = key(DIP, t), sa = HOME + Math.PI + sw + tw * (0.33 - 0.07) / 0.33;
  const reach = 0.07 + 0.012 * Math.sin(round * 5) * speed;   // a hand doesn't stir a perfect circle
  const bowl = V(Math.cos(sa) * reach, LEVEL - 0.03, Math.sin(sa) * reach);
  const lean = HAND.clone().sub(bowl).normalize();
  U.uSpoonOn.value = dip < 0.74 ? 1 : 0;
  U.uSpoonD.value.copy(lean);
  const sd = V(-Math.sin(sa), 0, Math.cos(sa));
  U.uSpoonS.value.copy(sd.addScaledVector(lean, -sd.dot(lean)).normalize());
  U.uSpoonA.value.copy(bowl).addScaledVector(lean, dip);

  // The ship holds its place at the back, bow into the current; the stirring drags it outward and to and fro
  const ring = U.uRing.value, sea = (x, z) => waves(x, z, amp, ph, sw, tw, vx, ring);
  const ang = HOME + storm * (0.35 * Math.sin(round * 3) + 0.15 * Math.sin(round * 5 + 1)), rad = NEAR + 0.075 * speed;
  const sx = rad * Math.cos(ang), sz = rad * Math.sin(ang), e = 0.012;
  const hx = (sea(sx + e, sz) - sea(sx - e, sz)) / (2 * e), hz = (sea(sx, sz + e) - sea(sx, sz - e)) / (2 * e);
  U.uShipPos.value.set(sx, LEVEL + sea(sx, sz) + 0.008, sz);
  let up = V(-hx * 1.2, 1, -hz * 1.2).normalize();
  const yaw0 = ang - HOME + storm * 0.25 * Math.sin(round * 7);   // it swings with its place on the circle, and slews as it fights
  const head = V(HEAD.x * Math.cos(yaw0) - HEAD.z * Math.sin(yaw0), 0, HEAD.x * Math.sin(yaw0) + HEAD.z * Math.cos(yaw0));
  const f = head.addScaledVector(up, -head.dot(up)).normalize(), side = V().crossVectors(f, up);
  U.uShip.value.set(f.x, f.y, f.z, up.x, up.y, up.z, side.x, side.y, side.z);

  // Lightning in the thick of it: two strikes, each a double flick, the second further along the back
  let flick = 0, shift = 0;
  for (const [at, len, bright, dx] of STRIKES) { const k = bright * bump(t, at, len); if (k > flick) { flick = k; shift = dx; } }
  U.uFlash.value = flick * P.flash; U.uBoltOn.value = flick > 0.2 ? 1 : 0;
  // It forks from the very lip down the face of the far wall and on into the sea towards you, so it stays inside the cup
  U.uBolt.value.forEach((b, i) => b.set(0.08 + shift - 0.04 * i / 5 + ZIG[i] * 1.1, RIM - 0.003 - (RIM - 0.003 - LEVEL + 0.01) * i / 5, -0.34 + 0.045 * i));

  // The sugar: dropped in from above, a moment at the surface, then gone under
  if (t > DROP[0] && t < DROP[1] + 0.3) {
    const c = t < DROP[1] ? fallAt(t) : LAND.clone().setY(LEVEL - 0.09 * EASE.out((t - DROP[1]) / 0.3));
    U.uSugar.value.set(c.x, c.y, c.z, 1);
    spin.makeRotationAxis(axis, 3 * (Math.min(t, DROP[1]) - DROP[0])); U.uCube.value.setFromMatrix4(spin);
    U.uTrailB.value.copy(U.uTrailA.value);
  } else U.uSugar.value.w = 0;
  // And the little splash it throws up
  U.uDrops.value.forEach((d, i) => {
    const s = since, ang = 0.4 + i * 1.3, out = i === 4 ? 0 : 0.2, vy = i === 4 ? 0.75 : 0.5 + 0.06 * i;
    const y = LEVEL + vy * s - 3.2 * s * s;
    if (s > 0 && y > LEVEL - 0.005) d.set(LAND.x + Math.cos(ang) * out * s, y, LAND.z + Math.sin(ang) * out * s, i === 4 ? 0.015 : 0.011);
    else d.w = 0;
  });

  renderer.render(scene, camera);
}
loop(S, frame);
</script>
</body></html>
