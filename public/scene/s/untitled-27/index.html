<meta charset="utf-8">
<title>Wrong floor: sea</title>
<style>
  /* Layout: a white page with one doorway on it, drawn in chunky pixels. Deliberately light-only. */
  :root { --bg: #ffffff; color-scheme: light; }
  html, body { height: 100%; }
  body { background: var(--bg); overflow: hidden; }
  #stage {
    position: fixed; left: 0; top: 0; display: block;
    image-rendering: pixelated;
  }
</style>

<canvas id="stage" aria-label="An eight second loop. A steel doorway stands on a white page; through it a calm sea has drowned the city to the tops of its three towers. A huge whale's back slides up between them, it breathes out, one eye turns to look at you, and it sinks; a little water laps over the threshold."></canvas>

<script type="module">
import * as THREE from 'three';
import { params, loop, sections } from 'scene';

// Nothing here is a mesh: every pixel inside the doorway walks a ray out into the drowned city
const frag = /* glsl */`
precision highp float;
uniform vec2 uRes;
uniform float uRound, uLook, uBlink, uSpill, uWet, uRing, uRingAmp, uSwell, uHaze;
uniform vec3 uWhale;   // height of its spine at the top of its arc, how far along the arc its snout is, the arc's radius
uniform float uTail;   // how far its tail is swung up out of the water, in radians
uniform vec4 uSpout;   // where the blowhole is, how long since it blew, how tall
uniform float uSpoutZ, uSlick, uDripT;
uniform vec2 uWave;    // how far from you the crest of the dive's swell is, and how high it stands
uniform vec4 uDive;    // where the flukes went under, and how long ago
uniform float uFlood, uDry, uSplash;   // how far the spill has run onto the page, how dried its mark is, time since it came over
uniform vec4 uDrip;    // where the flukes are (x, z), how high, how much water runs off them

const float BAYER[16] = float[16](0.0, 8.0, 2.0, 10.0, 12.0, 4.0, 14.0, 6.0, 3.0, 11.0, 1.0, 9.0, 15.0, 7.0, 13.0, 5.0);
const float TAU = 6.2831853;

// The doorway: 2 wide and 3 tall, in metres, with you standing in the lift behind it at eye height
const float HALF = 1.85, MID = 1.45;      // how much of the page the picture shows, and where it is centred
const float FW = 0.07;                    // how thick the steel frame is
const vec3 EYE = vec3(0.0, 1.6, 2.5);
const vec3 LIGHT = vec3(-0.474, 0.710, 0.521);   // daylight over your left shoulder

// Tones
const vec3 SKY[4] = vec3[4](vec3(0.97, 0.96, 0.92), vec3(0.91, 0.93, 0.93), vec3(0.82, 0.89, 0.93), vec3(0.71, 0.82, 0.91));   // low to high
const vec3 CLOUD[2] = vec3[2](vec3(1.0, 0.995, 0.98), vec3(0.87, 0.89, 0.91));
const vec3 FARC = vec3(0.84, 0.87, 0.88);   // the rest of the city, far off on the horizon
const vec3 SEA[6] = vec3[6](vec3(0.11, 0.22, 0.30), vec3(0.19, 0.35, 0.43), vec3(0.31, 0.50, 0.57), vec3(0.48, 0.66, 0.71), vec3(0.70, 0.83, 0.85), vec3(0.95, 0.98, 0.97));
const vec3 STONE[5] = vec3[5](vec3(0.20, 0.20, 0.22), vec3(0.34, 0.33, 0.33), vec3(0.49, 0.47, 0.44), vec3(0.64, 0.61, 0.56), vec3(0.79, 0.76, 0.70));
const vec3 WIN = vec3(0.13, 0.15, 0.17);
const vec3 GUANO = vec3(0.93, 0.92, 0.87);
const vec3 ALGAE[2] = vec3[2](vec3(0.20, 0.27, 0.23), vec3(0.36, 0.42, 0.33));
const vec3 WHALE[5] = vec3[5](vec3(0.06, 0.08, 0.12), vec3(0.13, 0.17, 0.23), vec3(0.23, 0.29, 0.36), vec3(0.37, 0.43, 0.50), vec3(0.56, 0.62, 0.68));
const vec3 BARNACLE = vec3(0.55, 0.58, 0.58);
const vec3 IRON[3] = vec3[3](vec3(0.12, 0.12, 0.13), vec3(0.24, 0.23, 0.22), vec3(0.40, 0.36, 0.31));
const vec3 STEEL[4] = vec3[4](vec3(0.28, 0.30, 0.33), vec3(0.47, 0.50, 0.53), vec3(0.66, 0.68, 0.71), vec3(0.87, 0.88, 0.90));
const vec3 MIST[2] = vec3[2](vec3(1.0), vec3(0.80, 0.84, 0.88));
const vec3 GULL[2] = vec3[2](vec3(0.99, 0.99, 0.97), vec3(0.40, 0.42, 0.46));

float hash1(float n) { return fract(sin(n * 127.1) * 43758.5453); }
float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float noise(vec3 x) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x), mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x), mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
// Noise that comes back to where it was once round the loop
float loopNoise(vec2 p, float turns) { float a = TAU * uRound * turns; return noise(vec3(p + 1.6 * vec2(cos(a), sin(a)), 0.5)); }
float smin(float a, float b, float k) { float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }
float ball(vec3 p, vec3 c, float r) { return length(p - c) - r; }
float egg(vec3 p, vec3 c, vec3 r) { vec3 q = (p - c) / r; float k0 = length(q), k1 = length(q / r); return k0 * (k0 - 1.0) / max(k1, 1e-4); }
float rod(vec3 p, vec3 a, vec3 b, float ra, float rb) {
  vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h) - mix(ra, rb, h);
}
float box(vec3 p, vec3 c, vec3 b) { vec3 q = abs(p - c) - b; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0); }

// Steps between neighbouring tones in a fixed pattern, so shading is dots, not blends
float dots() { ivec2 c = ivec2(gl_FragCoord.xy) & 3; return (BAYER[c.y * 4 + c.x] + 0.5) / 16.0; }
int rung(float t, int n) { float x = clamp(t, 0.0, 1.0) * float(n - 1); return min(int(x) + (fract(x) > dots() ? 1 : 0), n - 1); }
// Tones in clean bands: flat colour, with dots only in a narrow seam where one band meets the next
float banded(float t, float steps) { float x = clamp(t, 0.0, 1.0) * steps, f = fract(x); return min(floor(x) + (smoothstep(0.32, 0.68, f) > dots() ? 1.0 : 0.0), steps) / steps; }
float lum(vec3 c) { return dot(c, vec3(0.3, 0.55, 0.15)); }

// ---- The land: the three towers, always in the same places, drowned to their tops, and a lamp post near by ----
const vec3 T1 = vec3(-5.46, 6.8, -30.0);   // the tall thin one, left of centre: middle of its roof
const vec2 T2 = vec2(12.3, -100.0);        // the broad stepped one, right of centre
const vec2 T3 = vec2(27.8, -75.0);         // the short one at the far right, leaning left
const vec3 LAMP = vec3(-3.5, 0.0, -10.0);
float thin(vec3 p) {
  float d = box(p, vec3(T1.x, T1.y - 30.0, T1.z), vec3(1.7, 30.0, 1.7));
  d = min(d, box(p, vec3(T1.x, T1.y - 0.22, T1.z), vec3(1.84, 0.22, 1.84)));       // cornice
  return max(d, -box(p, vec3(T1.x + 1.75, T1.y + 0.1, T1.z + 1.75), vec3(0.75, 1.0, 0.75)));   // a corner broken off the roof
}
float broad(vec3 p) {
  float d = box(p, vec3(T2.x, -15.0, T2.y), vec3(10.2, 24.0, 8.0));                // to 9
  d = min(d, box(p, vec3(T2.x - 0.6, -10.0, T2.y), vec3(7.4, 22.0, 6.5)));         // to 12
  return min(d, box(p, vec3(T2.x - 1.2, -5.0, T2.y + 0.5), vec3(4.4, 19.5, 4.5))); // to 14.5
}
vec3 toLean(vec3 p) { vec3 q = p - vec3(T3.x, 0.0, T3.y); q.x += 0.2 * (q.y + 12.0); return q; }
float lean(vec3 p) { return box(toLean(p), vec3(0.0, -12.0, 0.0), vec3(3.4, 20.0, 3.4)) * 0.97; }
// A low roof gone under, just below the near water
float sunk(vec3 p) { return min(box(p, vec3(1.6, -3.0, -8.0), vec3(3.6, 0.6, 2.4)), box(p, vec3(1.6, -2.3, -5.7), vec3(3.6, 0.25, 0.12))); }
float lamp(vec3 p) {
  vec3 q = p - LAMP;
  float d = rod(q, vec3(0.0, -3.0, 0.0), vec3(0.0, 1.25, 0.0), 0.1, 0.08);
  d = min(d, box(q, vec3(0.0, 1.47, 0.0), vec3(0.17, 0.2, 0.17)));
  return min(d, rod(q, vec3(0.0, 1.68, 0.0), vec3(0.0, 1.86, 0.0), 0.24, 0.03));   // its cap
}
float city(vec3 p) { return min(min(min(thin(p), broad(p)), min(lean(p), lamp(p))), sunk(p)); }

// ---- The thing: a humpback, its spine bent along an arc that it rolls through, swimming away to the left ----
const vec2 WO = vec2(-2.0, -22.0);     // where it surfaces
const vec2 WF = vec2(-0.5, -0.866);   // which way it swims
const vec2 WN = vec2(-0.866, 0.5);     // its side that faces you
const float HUMP = -17.5;             // where along it the tail swings up from
// Into its own space: toward the snout, up from the spine, out toward its near side
vec3 toWhale(vec3 p) {
  vec2 o = p.xz - WO, r = vec2(dot(o, WF), p.y - uWhale.x + uWhale.z);
  vec3 q = vec3(atan(r.x, r.y) * uWhale.z - uWhale.y, length(r) - uWhale.z, dot(o, WN));
  float k = uTail * smoothstep(HUMP, HUMP - 3.5, q.x), c = cos(k), s = sin(k);
  q.xy = vec2((q.x - HUMP) * c - q.y * s, (q.x - HUMP) * s + q.y * c) + vec2(HUMP, 0.0);
  return q;
}
float flipper(vec3 q) { return rod(q, vec3(-5.6, -1.0, 1.3), vec3(-10.5, -2.2, 4.6), 0.38, 0.12); }   // long and pale
float flukes(vec3 q) {
  float aw = abs(q.z);
  float lead = -22.9 - 0.3 * aw - 0.5 * smoothstep(1.6, 2.5, aw);
  float trail = -23.9 - 0.55 * smoothstep(0.0, 0.8, aw) - 0.3 * aw + 0.6 * smoothstep(1.6, 2.5, aw);   // notched in the middle
  return max(max(max(q.x - lead, trail - q.x), aw - 2.5), abs(q.y) - 0.13);
}
float whale(vec3 p) {
  vec3 q = toWhale(p); q.z = abs(q.z);
  float bound = max(max(q.z - 6.0, abs(q.y) - 4.0), max(q.x - 1.0, -27.0 - q.x));
  if (bound > 2.0) return bound;
  float d = egg(q, vec3(-3.4, -0.35, 0.0), vec3(3.6, 1.15, 1.45));                        // long flat head
  d = smin(d, rod(q, vec3(-4.0, -0.45, 0.0), vec3(-11.0, -0.4, 0.0), 1.55, 2.05), 1.5);   // chest
  d = smin(d, rod(q, vec3(-11.0, -0.4, 0.0), vec3(-18.5, -0.1, 0.0), 2.05, 0.75), 1.2);   // back
  d = smin(d, egg(q, vec3(-21.0, 0.0, 0.0), vec3(2.8, 0.9, 0.42)), 0.6);                 // tail stock, tall and thin
  d = smin(d, rod(q, vec3(-14.4, 0.9, 0.0), vec3(-15.8, 1.75, 0.0), 0.45, 0.1), 0.5);     // the small hump of its fin
  d = smin(d, flukes(q), 0.35);
  d = smin(d, flipper(q), 0.4);
  d = smin(d, ball(q, vec3(-3.4, 0.85, 0.0), 0.35), 0.4);                                 // splash guard round the blowhole
  return d * 0.75;
}

float map(vec3 p) { return min(city(p), whale(p)); }
int what(vec3 p) {
  float a = thin(p), b = broad(p), c = lean(p), l = lamp(p), w = whale(p), m = min(min(min(a, b), min(c, l)), w);
  return m == w ? 5 : m == a ? 1 : m == b ? 2 : m == c ? 3 : 4;
}
float march(vec3 ro, vec3 rd, float far) {
  float t = 0.0;
  for (int i = 0; i < 140; i++) {
    float d = map(ro + rd * t);
    if (d < 0.002 + 0.0015 * t) return t;
    t += d;
    if (t > far) break;
  }
  return -1.0;
}
vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.02, -0.02);
  return normalize(e.xyy * map(p + e.xyy) + e.yyx * map(p + e.yyx) + e.yxy * map(p + e.yxy) + e.xxx * map(p + e.xxx));
}

// Concrete gone to weather: dark windows, white streaks under every ledge the birds sit on, weed where the sea laps
vec3 towerColour(vec3 p, vec3 n, int id) {
  vec3 q = p; float cw = 1.1, fh = 2.0, ledge = T1.y; vec3 tint = vec3(0.96, 0.99, 1.04);
  if (id == 2) { cw = 2.4; fh = 3.2; ledge = p.y < 9.0 ? 9.0 : p.y < 12.0 ? 12.0 : 14.5; tint = vec3(1.05, 1.0, 0.92); }
  if (id == 3) { q = toLean(p); cw = 1.4; fh = 2.3; ledge = 8.0; tint = vec3(1.04, 0.95, 0.9); }
  float a = abs(n.x) > 0.5 ? q.z : q.x;
  float lit = 0.3 + 0.55 * max(dot(n, LIGHT), 0.0) + 0.12 * max(n.y, 0.0) + (noise(q * vec3(0.7, 0.3, 0.7)) - 0.5) * 0.2;
  vec3 col = STONE[int(banded(lit, 4.0) * 4.0 + 0.5)] * tint;
  if (n.y > 0.6) return noise(q * 0.35) > 0.4 ? GUANO : col;   // roofs white with droppings
  float below = ledge - p.y;
  vec2 w = vec2(fract(a / cw + 0.5), fract(p.y / fh));
  float lane = floor(a * 1.8) + float(id) * 17.0;
  bool bricked = hash1(floor(a / cw + 0.5) * 7.1 + floor(p.y / fh) * 3.7 + float(id)) > 0.72;
  if (w.x > 0.28 && w.x < 0.74 && w.y > 0.3 && w.y < 0.85 && below > 0.7 && p.y > 0.6 && !bricked) col = WIN;
  else if (hash1(lane) > 0.62 && below < 0.4 + 4.0 * hash1(lane * 1.3 + 5.0)) col = GUANO * 0.96;
  float tide = 1.1 + 0.4 * noise(vec3(a * 0.8, 0.0, float(id)));
  if (p.y < tide) col = ALGAE[p.y < tide * 0.5 ? 0 : 1];
  return col;
}
// Wet black skin, knobs on the head, pale flippers and fluke undersides, and the eye
vec3 whaleColour(vec3 p, vec3 n) {
  vec3 q = toWhale(p), m = vec3(q.xy, abs(q.z));
  if (q.x < -22.4 && flukes(m) < 0.1) {
    float edge = q.x - (-23.9 - 0.55 * smoothstep(0.0, 0.8, m.z) - 0.3 * m.z + 0.6 * smoothstep(1.6, 2.5, m.z));
    if (q.y > 0.0 || edge < 0.25 || m.z > 2.1) return WHALE[1];
    return noise(q * 1.4) > 0.55 ? vec3(0.74, 0.76, 0.76) : WHALE[3];   // the pale marks underneath
  }
  if (flipper(m) < 0.06) return vec3(0.8, 0.82, 0.82);
  if (q.x > -3.4 && q.y > 0.4 && hash(floor(vec3(q.x * 1.7, 0.0, m.z * 1.7))) > 0.72) return WHALE[3];   // the knobs on its snout
  if (q.z > 0.8) {
    vec2 e = vec2(q.x + 5.0, q.y + 0.3) / vec2(0.8, 0.45);
    float lid = length(e);
    if (lid < 1.0) {
      if (e.y > mix(1.1, -1.1, uBlink)) return WHALE[1];
      vec2 iris = vec2(mix(0.5, 0.0, uLook), mix(-0.1, 0.05, uLook));
      vec2 f = e - iris;
      if (uLook > 0.5 && f.x < -0.1 && f.x > -0.42 && f.y > 0.1 && f.y < 0.55) return GULL[0];   // the light caught in it
      return abs(f.x) < 0.42 && abs(f.y) < 0.6 ? vec3(0.02, 0.02, 0.03) : vec3(0.78, 0.76, 0.68);
    }
    if (lid < 1.45) return WHALE[3];
  }
  if (q.z > 0.6 && q.x > -5.8 && abs(q.y + 0.75 - 0.09 * (q.x + 5.5)) < 0.12) return WHALE[0];   // the long line of its mouth
  if (abs(q.x + 3.4) < 0.2 && abs(m.z - 0.18) < 0.12 && q.y > 0.95) return WHALE[0];               // the blowhole
  if (p.y < 0.9 * loopNoise(vec2(q.x * 0.9, q.z * 0.5), 3.0) - 0.3) return SEA[5];   // water foaming off its sides
  float lit = 0.12 + 0.5 * max(dot(n, LIGHT), 0.0) + 0.28 * pow(max(n.y, 0.0), 2.0) + (noise(q * vec3(0.5, 0.8, 0.8)) - 0.5) * 0.16;
  if (q.x > -7.0 && q.x < -1.0 && q.y > -0.6 && noise(q * 2.2) > 0.8) return BARNACLE;
  return WHALE[int(banded(lit, 4.0) * 4.0 + 0.5)];
}
vec3 solid(vec3 p, float t) {
  vec3 n = normalAt(p);
  int id = what(p);
  vec3 col;
  if (id == 5) col = whaleColour(p, n);
  else if (id == 4) col = IRON[rung(0.2 + 0.7 * max(dot(n, LIGHT), 0.0), 3)];
  else col = towerColour(p, n, id);
  // Air pales what is far, by steps
  float far = banded(smoothstep(20.0, 320.0, t) * uHaze, 4.0);
  return mix(col, SKY[0], far);
}

// ---- Beyond: pale sky, long soft clouds, and the rest of the drowned city far off on the horizon ----
vec3 sky(vec3 rd) {
  float e = rd.y, ax = rd.x / -rd.z, cell = floor(ax * 34.0);
  float far = hash1(cell * 1.7 + 3.1) > 0.4 && noise(vec3(ax * 5.0, 0.3, 0.0)) > 0.38 ? 0.003 + 0.02 * pow(hash1(cell * 3.3 + 1.2), 2.0) : 0.0;
  if (e < far) return FARC;
  vec3 col = SKY[int(banded(smoothstep(0.0, 0.5, e), 3.0) * 3.0 + 0.5)];
  if (e > 0.02) {
    vec2 c = rd.xz / e;
    float n = noise(vec3(c.x * 0.22, c.y * 0.9, 1.0)) * 0.65 + noise(vec3(c.x * 0.6, c.y * 2.3, 4.0)) * 0.35;
    float cl = (n - 0.52) * smoothstep(0.03, 0.14, e) * smoothstep(0.5, 0.25, e);
    if (cl > 0.0) col = cl > 0.06 + 0.05 * dots() ? CLOUD[0] : CLOUD[1];
  }
  return col;
}

// ---- The sea: level with the threshold, swells that loop, rings from the whale ----
vec3 seaNormal(vec2 xz, float t) {
  vec2 s = vec2(0.0);
  float ph = TAU * uRound;
  vec2 d1 = normalize(vec2(0.3, 1.0)), d2 = normalize(vec2(-0.6, 1.0)), d3 = normalize(vec2(1.0, 0.25)), d4 = normalize(vec2(0.15, 1.0));
  s += d1 * 0.018 * 0.9 * cos(dot(xz, d1) * 0.9 - ph * 2.0) * exp(-t * 0.9 / 60.0);
  s += d2 * 0.025 * 1.7 * cos(dot(xz, d2) * 1.7 - ph * 3.0 + 1.0) * exp(-t * 1.7 / 60.0);
  s += d3 * 0.016 * 3.1 * cos(dot(xz, d3) * 3.1 - ph * 5.0 + 2.0) * exp(-t * 3.1 / 60.0);
  s += d4 * 0.007 * 5.3 * cos(dot(xz, d4) * 5.3 - ph * 7.0 + 4.0) * exp(-t * 5.3 / 60.0);
  s *= uSwell * 2.0;
  s *= 1.0 - 0.85 * uSlick * exp(-dot(xz - WO, xz - WO) / 30.0);   // the smooth footprint it leaves where it dived
  vec2 o = xz - WO;
  float r = length(o), env = uRingAmp * exp(-pow((r - uRing) / 6.0, 2.0)) * step(r, uRing + 8.0);
  s += normalize(o + 1e-4) * 0.11 * 1.2 * cos(1.2 * (r - uRing)) * env * exp(-t / 80.0);
  return normalize(vec3(-s.x, 1.0, -s.y));
}
// The swell's height at a distance from you: sharp in front, then trough and a smaller crest trailing behind
float swellAt(vec2 xz) {
  vec2 o = xz - uDive.xz;
  float u = length(o) - uWave.x, a = atan(o.x, o.y);
  float uneven = 0.6 + 0.8 * noise(vec3(a * 9.0, 0.5, 3.0));
  return uWave.y * uneven * cos(u * 1.8) * (u > 0.0 ? exp(-u * u / 1.0) : exp(-u * u / 12.0));
}
vec3 sea(vec3 g, vec3 rd, float t) {
  vec3 n = seaNormal(g.xz, t);
  float fres = 0.13 + 0.67 * pow(1.0 - max(dot(-rd, n), 0.0), 3.0);
  vec3 rf = reflect(rd, n); rf.y = max(rf.y, 0.002); rf = normalize(rf);
  float tr = march(g + rf * 0.05, rf, 200.0);
  float back = tr > 0.0 ? lum(solid(g + rf * tr, t + tr)) * 0.85 : lum(sky(rf));
  // Looking down into it: the drowned parts of things, and the whale beneath
  vec3 rr = refract(rd, n, 0.75);
  float under = 0.16, shade = 0.0, tu = 0.1;
  for (int i = 0; i < 24; i++) {
    vec3 u = g + rr * tu;
    float dd = map(u);
    if (dd < 0.08) {
      vec3 q = toWhale(u); q.z = abs(q.z);
      if (what(u) == 5 && flipper(q) < 0.3) under = mix(0.62, 0.16, smoothstep(0.0, 5.0, -u.y));   // its pale flipper, under the water
      else if (what(u) == 5) shade = 0.6 * (1.0 - smoothstep(0.5, 4.0, -u.y));
      else under = mix(0.5, 0.16, smoothstep(0.0, 6.0, -u.y));
      break;
    }
    tu += max(dd, 0.5);
    if (tu > 9.0) break;
  }
  float b = mix(under, back, fres) * (1.0 - 0.55 * shade);
  int i = int(banded(b, 4.0) * 4.0 + 0.5);
  // Foam where the sea laps at whatever stands in it
  vec3 w = vec3(g.x, 0.0, g.z);
  float lap = loopNoise(g.xz * 0.7, 2.0);
  float chop = loopNoise(vec2(g.x * 1.3, g.z * 0.4), 3.0);
  if (whale(w) < 2.2 * chop - 0.9 || city(w) < 0.4 * lap - 0.05) i = 5;
  return SEA[i];
}

// ---- Small things painted where they are: the spout, gulls ----
float spout(vec2 q, float age, float tall) {
  if (age <= 0.0 || age > 2.6 || tall <= 0.0) return 0.0;
  float hgt = 5.0 * tall * (1.0 - exp(-age * 5.0));
  q.x -= q.y * 0.1 + age * age * 0.6;                       // leans and drifts downwind
  float w = 0.3 + q.y * 0.32 + age * 0.45;                  // a bushy cloud, not a column
  float body = smoothstep(w, w * 0.25, abs(q.x)) * smoothstep(-0.2, 0.4, q.y) * smoothstep(hgt + 1.8, hgt - 1.2, q.y);
  return body * (0.55 + 0.7 * noise(vec3(q * 0.8, age * 1.5))) * (1.0 - smoothstep(0.8, 2.5, age));
}
vec2 toPixel(vec3 w) {
  float k = EYE.z / (EYE.z - w.z);
  vec2 d = vec2(w.x * k, EYE.y + (w.y - EYE.y) * k);
  return (d - vec2(0.0, MID)) / HALF * 0.5 * uRes.y + 0.5 * uRes;
}
// A gull in flight, five pixels wide, its wings up, level or down
bool flying(vec3 w, float flap) {
  vec2 f = floor(gl_FragCoord.xy) - floor(toPixel(w));
  float tip = flap > 0.35 ? 1.0 : flap < -0.35 ? -1.0 : 0.0;
  return (f.y == 0.0 && abs(f.x) <= 1.0) || (abs(f.x) == 2.0 && f.y == tip);
}
// A gull sitting: white, with a grey back; returns which tone, or -1
int sitting(vec3 w) {
  vec2 f = floor(gl_FragCoord.xy) - floor(toPixel(w));
  if (f.y == 0.0 && (f.x == 0.0 || f.x == 1.0)) return 0;
  if (f.y == 1.0 && f.x == 1.0) return 0;
  if (f.y == 1.0 && f.x == 0.0) return 1;
  return -1;
}

vec3 world(vec2 d) {
  vec3 ro = EYE, rd = normalize(vec3(d, 0.0) - EYE);
  float tW = rd.y < 0.0 ? -ro.y / rd.y : 1e4;
  float tHit = march(ro, rd, min(tW, 260.0)), tNear = tHit > 0.0 ? tHit : tW;
  vec3 col = tHit > 0.0 ? solid(ro + rd * tHit, tHit) : rd.y < 0.0 ? sea(ro + rd * tW, rd, tW) : sky(rd);

  // The swell from the dive, walked as real height: a crest, a trough behind it, a smaller crest, rolling in to the threshold
  if (uWave.y > 0.0 && rd.y < 0.0) {
    float rz = -rd.z, t0 = EYE.z / rz, t1 = min(tW * 1.6, 60.0), tWave = -1.0;
    for (int i = 0; i < 72; i++) {
      float t = t0 * pow(t1 / t0, float(i) / 71.0);   // finer steps near you, where the swell is big on the picture
      vec3 g = ro + rd * t;
      if (g.y < swellAt(g.xz)) { tWave = t; break; }
    }
    if (tWave > 0.0 && (tHit < 0.0 || tWave < tHit)) {
      vec3 g = ro + rd * tWave;
      vec2 toward = vec2(0.0, 0.08);
      float h = swellAt(g.xz), rel = h / uWave.y, slope = (swellAt(g.xz - toward) - swellAt(g.xz + toward)) / 0.16;
      float churn = noise(vec3(g.x * 3.0, g.z * 1.5, uWave.x * 0.7));
      tNear = tWave;
      if (rel > 0.85 && churn > 0.45) col = SEA[5];                                       // white where the crest breaks
      else if (rel < -0.35) col = SEA[1];                                                 // the trough behind it
      else if (abs(rel) > 0.2) col = slope > 0.0 ? (rel > 0.45 ? SEA[3] : SEA[2]) : SEA[3];   // its face, lit through near the top
      else col = sea(g, rd, tWave);
    }
  }

  // The whale's breath, a column of mist that rises, leans and thins
  float tS = (uSpoutZ - ro.z) / rd.z;
  if (tS < tNear + 1.0) {
    vec3 ps = ro + rd * tS;
    vec2 q = ps.xy - uSpout.xy;
    float dens = spout(q, uSpout.z, uSpout.w);
    if (dens > 0.1 + 0.55 * dots()) col = MIST[q.x - q.y * 0.1 - uSpout.z * uSpout.z * 0.6 > 0.25 ? 1 : 0];
  }
  // Water running off the lifted flukes in strings
  float tD = (uDrip.y - ro.z) / rd.z;
  if (uDrip.w > 0.0 && tD < tNear + 1.5) {
    vec3 pd = ro + rd * tD;
    float dx = pd.x - uDrip.x, lane = floor(dx * 7.0);
    if (abs(dx) < 1.6 && pd.y > 0.0 && pd.y < uDrip.z && hash1(lane + 3.0) > 0.6 && fract(pd.y * 0.5 + uDripT * 2.5 + hash1(lane)) < 0.3 * uDrip.w) col = SEA[4];
  }
  // White water thrown up where the flukes go under
  float tB = (uDive.z - ro.z) / rd.z;
  if (uDive.w > 0.0 && tB < tNear + 1.0) {
    vec2 q = (ro + rd * tB).xy - uDive.xy;
    float dens = spout(vec2(q.x * 1.1, q.y * 1.4), uDive.w * 1.8, 0.4);
    if (dens > 0.1 + 0.55 * dots()) col = MIST[q.x > 0.6 ? 1 : 0];
  }
  // Gulls wheeling round the thin tower, and a few sitting about
  for (int i = 0; i < 3; i++) {
    float fi = float(i), a = TAU * (uRound * (i == 1 ? -1.0 : 1.0) + fi * 0.37);
    vec3 w = vec3(T1.x + 0.8 + 4.2 * cos(a), 9.0 + 1.4 * fi + 0.4 * sin(a * 2.0), T1.z + 3.0 * sin(a));
    if (length(w - EYE) < tNear && flying(w, sin(TAU * (uRound * (14.0 + 3.0 * fi)) + fi))) col = GULL[1];
  }
  vec3 perch[4] = vec3[4](vec3(T1.x - 1.3, T1.y + 0.05, T1.z + 1.7), vec3(T1.x - 0.3, T1.y + 0.05, T1.z + 1.7),
                          vec3(T2.x - 3.0, 11.9, T2.y + 5.0), vec3(LAMP.x - 0.04, 1.9, LAMP.z));
  for (int i = 0; i < 4; i++) {
    int k = sitting(perch[i]);
    if (k >= 0 && length(perch[i] - EYE) < tNear + 1.0) col = GULL[k];
  }
  return col;
}

// ---- The page, the steel frame, and whatever the sea spills over the threshold ----
vec3 page(vec2 d) {
  float rx = 1.0 + FW, ty = 3.0 + FW;
  if (abs(d.x) < rx && d.y >= 3.0 && d.y < ty) {
    float a = (d.y - 3.0 - FW * 0.5) / (FW * 0.5);
    return STEEL[a > 0.0 ? 3 : 1];
  }
  if (abs(d.x) >= 1.0 && abs(d.x) < rx && d.y >= 0.0 && d.y < 3.0) {
    float a = (abs(d.x) - 1.0 - FW * 0.5) / (FW * 0.5);
    if (d.x < 0.0) return STEEL[a > 0.0 ? 3 : 2];             // the jamb that faces the light
    return STEEL[a > 0.0 ? 1 : 2];
  }
  // The sheet of sea thrown over the threshold: lobed, deeper by the sill, a foam lip at its front, then drying off in patches
  float px = 2.0 * HALF / uRes.y;
  float lobes = 0.55 * noise(vec3(d.x * 2.4, 4.0, 0.0)) + 0.45 * noise(vec3(d.x * 6.5, 7.0, 0.0));
  float shape = 0.36 * (0.2 + 0.8 * lobes) * smoothstep(1.2, 0.55, abs(d.x));
  float reach = uFlood * shape, wetReach = uWet * shape * 1.06;
  if (abs(d.x) < rx && d.y >= -0.06 && d.y < 0.0) {
    if (uFlood > 0.08 && reach > 0.02) return noise(vec3(d.x * 12.0, d.y * 40.0, uSplash * 6.0)) > 0.5 ? SEA[5] : SEA[4];   // pouring over the sill
    return STEEL[d.y > -0.03 ? 2 : 1];                       // the sill, seen from above
  }
  if (d.y < -0.06 && abs(d.x) < 1.35) {
    float front = -0.06 - d.y;
    if (front < reach) {
      float edge = reach - front, along = front / max(reach, 1e-3);
      if (edge < px) return SEA[5];                                                         // foam lip
      if (edge < 2.0 * px && noise(vec3(d.x * 18.0, uSplash * 3.0, 1.0)) > 0.5) return SEA[5];
      if (along > 0.35 && noise(vec3(d.x * 2.0, front * 16.0, uSplash * 1.5)) > 0.72) return vec3(0.9, 0.96, 0.97);   // the sky caught on it
      if (hash(floor(vec3(gl_FragCoord.xy, floor(uSplash * 8.0)))) > 0.97) return SEA[5];             // bubbles
      if (along < 0.3 && noise(vec3(d.x * 9.0, front * 30.0, uSplash * 4.0)) > 0.62) return SEA[5]; // churned where it comes over
      return along < 0.4 ? SEA[3] : SEA[4];
    }
    if (front < reach + px && reach > 1.5 * px) return SEA[2];                                 // its edge, a line of shadow on the page
    if (front < wetReach && noise(vec3(d.x * 7.0, front * 26.0, 3.0)) > uDry) {
      if (wetReach - front < px) return vec3(0.76, 0.83, 0.87);                              // the tide line where it reached
      return 0.55 > dots() ? vec3(0.86, 0.9, 0.93) : vec3(0.93, 0.95, 0.96);
    }
    if (front < px && abs(d.x) < rx) return vec3(0.86);       // the sill's own shadow on the page
  }
  return vec3(1.0);
}

void main() {
  vec2 d = (gl_FragCoord.xy - 0.5 * uRes) / (0.5 * uRes.y) * HALF + vec2(0.0, MID);
  vec3 col = abs(d.x) < 1.0 && d.y > 0.0 && d.y < 3.0 ? world(d) : page(d);
  // Drops flung up and out as it comes over, landing as spots that dry
  float px = 2.0 * HALF / uRes.y;
  for (int i = 0; i < 14; i++) {
    float fi = float(i), tau = uSplash - hash1(fi + 7.0) * 0.15;
    if (tau <= 0.0 || tau > 1.4) continue;
    float x0 = (hash1(fi) * 2.0 - 1.0) * 0.8, fly = min(tau, 0.55);
    float away = (0.25 + 0.45 * hash1(fi + 3.0)) * fly, up = (0.9 + 0.8 * hash1(fi + 5.0)) * fly - 2.4 * fly * fly;
    vec2 at = vec2(x0 * (1.0 + 0.3 * fly), -0.06 - away + max(up, 0.0));
    if (max(abs(d.x - at.x), abs(d.y - at.y)) < px * 0.6) {
      if (up > 0.0 && tau < 0.55) col = at.y > 0.0 ? SEA[5] : SEA[3];
      else if (hash1(fi + 9.0) > uDry) col = SEA[4];
    }
  }
  gl_FragColor = vec4(col, 1.0);
}`;

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas: stage, antialias: false });
renderer.setPixelRatio(1);
const uniforms = {
  uRes: { value: new THREE.Vector2(1, 1) }, uRound: { value: 0 }, uLook: { value: 0 }, uBlink: { value: 0 },
  uSpill: { value: 0 }, uWet: { value: 0 }, uRing: { value: 0 }, uRingAmp: { value: 0 }, uSwell: { value: 1 }, uHaze: { value: 1 },
  uWhale: { value: new THREE.Vector3(-10, 0, 22) }, uSpout: { value: new THREE.Vector4() }, uTail: { value: 0 },
  uSpoutZ: { value: 0 }, uSlick: { value: 0 }, uWave: { value: new THREE.Vector2() }, uDive: { value: new THREE.Vector4() }, uFlood: { value: 0 }, uDry: { value: 0 }, uSplash: { value: -1 }, uDripT: { value: 0 }, uDrip: { value: new THREE.Vector4() },
};
const scene = new THREE.Scene(), camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const page = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms, fragmentShader: frag, vertexShader: 'void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }', depthTest: false,
}));
page.frustumCulled = false;
scene.add(page);

let sizedW = -1, sizedH = -1;
function resize() {
  // A hidden pane reports no size; draw for a plausible one until it has one
  const w = innerWidth || 1280, h = innerHeight || 800;
  const scale = Math.max(3, Math.round(Math.min(w * 1.3, h) / 130));
  const cols = Math.ceil(w / scale), rows = Math.ceil(h / scale);
  renderer.setSize(cols, rows, false);
  stage.style.width = cols * scale + 'px'; stage.style.height = rows * scale + 'px';
  uniforms.uRes.value.set(cols, rows);
}

const EASE = {
  lin: x => x, io: x => x < 0.5 ? 4 * x * x * x : 1 - (2 - 2 * x) ** 3 / 2, in: x => x * x * x, out: x => 1 - (1 - x) ** 3,
  snap: x => 1 - (1 - x) ** 5,
};
// A track is a list of [when, value, how to arrive]; between entries it moves, after the last it stays
function key(track, t) {
  if (t <= track[0][0]) return track[0][1];
  for (let i = 1; i < track.length; i++) if (t < track[i][0]) {
    const [t0, a] = track[i - 1], [t1, b, how = 'io'] = track[i];
    return a + (b - a) * EASE[how]((t - t0) / (t1 - t0));
  }
  return track[track.length - 1][1];
}
const bump = (t, at, len) => t > at && t < at + len ? Math.sin((t - at) / len * Math.PI) : 0;

// The whale rolls through one fixed arc: its head comes up, it blows and looks, then its back rolls over, its tail lifts and slides under
const WR = 22, WO = [-2, -22], WF = [-0.5, -0.866], WN = [-0.866, 0.5], HUMP = -17.5;
const PEAK = [[0, -16], [1.0, -10], [2.4, 0.7, 'out'], [2.7, 1.0, 'out'], [3.4, 0.85], [4.7, 0.95], [5.6, 0.6], [6.1, 0.9], [6.6, 0.8], [7.25, -9, 'in'], [8, -16]];
const ALONG = [[0, -12], [1.0, -9, 'lin'], [2.4, -0.5, 'out'], [3.4, 0.3, 'lin'], [4.7, 1.5, 'lin'], [5.6, 9, 'in'], [6.1, 17, 'lin'], [6.6, 18.5, 'out'], [7.25, 22], [8, 24]];
const TAIL = [[0, 0], [5.55, 0], [6.2, 1.0, 'io'], [6.6, 1.05], [7.2, 0.95], [7.7, 0]];
const LOOK = [[0, 0], [3.7, 0], [4.0, 1, 'snap'], [4.9, 1], [5.25, 0, 'io']];
// After the flukes go under (7.1): rings, and one swell that rolls in, heaps at the threshold, spills, sucks back and laps once more
const DIVE = 7.1, END = 9.2;
const RING = [[0, 0], [1.6, 0], [2.2, 0.6], [6.6, 0.4], [7.1, 0.3], [7.3, 0.45], [9.1, 0]];
const WAVE_AT = [[0, 0], [DIVE, 0], [7.7, 17.5, 'lin'], [8.05, 22, 'lin'], [8.75, 27, 'lin']];   // how far the swell has spread from the dive
const WAVE_UP = [[0, 0], [DIVE, 0], [7.2, 0.07, 'out'], [7.7, 0.12, 'lin'], [8.05, 0.34, 'in'], [8.75, 0.3], [8.95, 0]];
const FLOOD = [[0, 0], [7.98, 0], [8.2, 1, 'out'], [8.42, 0.3, 'io'], [8.6, 0.48, 'io'], [8.9, 0, 'io']];
const WET = [[0, 0], [7.98, 0], [8.2, 1, 'out']];
const DRY = [[0, 0], [8.65, 0], [9.17, 1.05, 'in']];
const SLICK = [[0, 0], [7.0, 0], [7.4, 1], [9.15, 0]];
// The calm is written short: its half second stands for the first second of this timing, when nothing shows
const written = t => t < 0.4 ? t * 2.5 : t + 0.6;
const DRIP = [[0, 0], [6.0, 0], [6.2, 1], [6.9, 1], [7.15, 0]];
const smooth = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a) / (b - a))); return k * k * (3 - 2 * k); };
// A point on the whale, from its own space out into the world, the same way the shader takes it back
function whaleAt(u, v, peak, head, tail) {
  const k = tail * smooth(HUMP, HUMP - 3.5, u), du = u - HUMP;
  [u, v] = [HUMP + du * Math.cos(k) + v * Math.sin(k), -du * Math.sin(k) + v * Math.cos(k)];
  const a = (head + u) / WR, x = (WR + v) * Math.sin(a), y = peak - WR + (WR + v) * Math.cos(a);
  return [WO[0] + WF[0] * x, y, WO[1] + WF[1] * x];
}

// The sea's story, in parts whose lengths can be dragged on the timeline
const S = sections({ calm: 0.4, rise: 1.4, blow: 1.0, look: 1.3, sink: 2.4, after: 2.1 });
const P = params({
  swell: [1, 0, 2.5],     // how much the sea moves
  haze: [1, 0, 1.6],      // how much the air pales what is far
  breath: [1, 0, 1.6],    // how tall the whale's spout goes
});

function frame(now) {
  if (innerWidth !== sizedW || innerHeight !== sizedH) { sizedW = innerWidth; sizedH = innerHeight; resize(); }
  const t = written(S.written(now)), round = S.round(now), U = uniforms;
  U.uRound.value = round; U.uSwell.value = P.swell; U.uHaze.value = P.haze;

  // It rides a little on the swell even while it holds still
  const peak = key(PEAK, t) + 0.1 * Math.sin(round * Math.PI * 2 * 4), along = key(ALONG, t), tail = key(TAIL, t);
  U.uWhale.value.set(peak, along, WR);
  U.uTail.value = tail;
  const hole = whaleAt(-3.4, 1.1, peak, along, tail);
  U.uSpout.value.set(hole[0], hole[1], t - 2.5, P.breath);
  U.uSpoutZ.value = hole[2];
  U.uLook.value = key(LOOK, t);
  U.uBlink.value = bump(t, 4.35, 0.2);

  // Water runs off the flukes while they are up
  const fluke = whaleAt(-24, 0, peak, along, tail);
  U.uDrip.value.set(fluke[0], fluke[2], fluke[1] - 0.3, key(DRIP, t));
  U.uDripT.value = t;

  // Its rings spread out and reach the threshold, and a little water comes over; where it dived the sea lies smooth
  U.uRing.value = t < DIVE ? Math.max(0, t - 1.6) * 4.4 : (t - DIVE) * 14;
  U.uRingAmp.value = key(RING, t);
  U.uWave.value.set(key(WAVE_AT, t), key(WAVE_UP, t));
  const dive = whaleAt(-24, 0, key(PEAK, DIVE), key(ALONG, DIVE), key(TAIL, DIVE));
  U.uDive.value.set(dive[0], 0, dive[2], t > DIVE ? t - DIVE : 0);
  U.uFlood.value = key(FLOOD, t);
  U.uDry.value = t > END - 0.03 ? 1.1 : key(DRY, t);
  U.uWet.value = t > END - 0.03 ? 0 : key(WET, t);
  U.uSplash.value = t - 8.05;
  U.uSlick.value = key(SLICK, t);

  renderer.render(scene, camera);
}
loop(S, frame);
</script>
