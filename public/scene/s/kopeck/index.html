<meta charset="utf-8">
<title>Ten Kopecks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: a white page with one black cat on it. Every ten seconds or so the page goes dark and he does something he should not be able to. Deliberately light-only. */
  :root { --bg: #ffffff; color-scheme: light; }
  html, body { height: 100%; }
  body { background: var(--bg); overflow: hidden; }
  #stage {
    position: fixed; left: 0; top: 0; display: block;
    image-rendering: pixelated;
    touch-action: none; cursor: grab;
  }
  #stage.turning { cursor: grabbing; }
</style>

<canvas id="stage" aria-label="A ten second loop. A small black cat sits on a white page. The page goes dark and only his eyes show. A spotlight snaps on from the top left: there is a wooden table beside him. He is up on his hind legs at once, paws held loose at his chest. He produces a coin, flips it, watches it a little, catches it, swings over to the table, sets it down and pushes it across. The moment his paw is back the light goes out and his eyes drop. The page is white again with an ordinary cat sitting on it, who tips his head."></canvas>

<script type="module">
import * as THREE from 'three';
import { params, loop } from 'scene';

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v)), lerp = (a, b, t) => a + (b - a) * t;

// The cat is not a mesh: every pixel walks a ray to a shape made of blended blobs, roughened into fur
const frag = /* glsl */`
precision highp float;
uniform vec2 uRes;
uniform vec3 uRight, uUp, uFwd, uTarget, uLight, uNeck, uHandL, uHandR, uBendL, uBendR, uHat;
uniform float uSpan, uBreath, uStand, uMode, uSinP;
uniform mat3 uHead, uBody;
uniform vec3 uTail[6];
uniform vec2 uEar, uBlink, uPool, uPoolS, uApex;
uniform vec4 uCoin;
uniform float uBig, uBeam, uEarSize;
uniform vec3 uEye, uBand;

// Black, and the few greys daylight is allowed to pull out of it; then the same under the lamp
const vec3 FUR[5] = vec3[5](vec3(0.03, 0.028, 0.04), vec3(0.13, 0.115, 0.15), vec3(0.25, 0.21, 0.24), vec3(0.42, 0.34, 0.32), vec3(0.66, 0.56, 0.48));
const vec3 WARM[5] = vec3[5](vec3(0.03, 0.028, 0.04), vec3(0.15, 0.1, 0.1), vec3(0.29, 0.19, 0.15), vec3(0.5, 0.35, 0.24), vec3(0.8, 0.64, 0.44));
const vec3 WOOD[5] = vec3[5](vec3(0.09, 0.06, 0.055), vec3(0.26, 0.16, 0.11), vec3(0.46, 0.3, 0.18), vec3(0.68, 0.48, 0.28), vec3(0.9, 0.72, 0.48));
const vec3 FLOOR[3] = vec3[3](vec3(1.0), vec3(0.85, 0.86, 0.91), vec3(0.66, 0.67, 0.76));
const vec3 POOL[4] = vec3[4](vec3(0.03, 0.028, 0.04), vec3(0.3, 0.22, 0.17), vec3(0.64, 0.5, 0.36), vec3(0.97, 0.89, 0.7));
const vec3 HAZE = vec3(0.2, 0.17, 0.155);
const float BAYER[16] = float[16](0.0, 8.0, 2.0, 10.0, 12.0, 4.0, 14.0, 6.0, 3.0, 11.0, 1.0, 9.0, 15.0, 7.0, 13.0, 5.0);

const vec3 PIVOT = vec3(0.0, 0.7, 0.06);    // where the head turns on the neck, as modelled
const vec3 EYE = vec3(0.078, 0.86, 0.218);
const float EYE_R = 0.042;
#define BIG uBig                            // how much larger the head is than it was modelled
const float SQUAT = 0.84;                   // and how much shorter the body
const vec3 HEART = vec3(-0.1, 0.65, 0.0);   // middle of everything, for the ball that bounds it
const vec3 TABLE = vec3(-0.72, 0.0, 0.1);
#define BEAM uBeam                          // how wide the lamp's beam is

float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float noise(vec3 x) {

             mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x), mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
float smin(float a, float b, float k) { float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }

float egg(vec3 p, vec3 c, vec3 r) { vec3 q = (p - c) / r; float k0 = length(q), k1 = length(q / r); return k0 * (k0 - 1.0) / max(k1, 1e-4); }
float rod(vec3 p, vec3 a, vec3 b, float ra, float rb) {
  vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);

}
float tub(vec3 p, float y, float r, float h) { vec2 d = abs(vec2(length(p.xz), p.y - y)) - vec2(r, h); return min(max(d.x, d.y), 0.0) + length(max(d, 0.0)); }

// Clumps and wisps: what makes the outline ragged
float fur(vec3 p) { return (noise(p * vec3(11.0, 6.0, 11.0)) - 0.5) * 0.06 + (noise(p * vec3(21.0, 10.0, 21.0)) - 0.5) * 0.03; }

vec3 toHead(vec3 p) { return uHead * (p - uNeck) / BIG + PIVOT; }

// One ear, in a space squashed front to back; x is the ear itself, y the hollow scooped out of its front
vec2 ear(vec3 q, float side) {

  vec3 a = vec3(0.09, 0.95, 0.11), b = vec3(0.15 + 0.05 * e, 1.1 - 0.045 * e, 0.09 - 0.03 * e);
  vec3 s = vec3(q.x, q.y, (q.z - 0.1) * 1.8 + 0.1);

  float k = uEarSize; s = a + (s - a) / k;
  float d = rod(s, a, b, 0.07, 0.022);

}
// q is in the head's own space, folded so one side does for both
float headPart(vec3 hq) {

  float d = egg(q, vec3(0.0, 0.86, 0.12), vec3(0.172, 0.132, 0.132));
  d = smin(d, ball(q, vec3(0.114, 0.812, 0.15), 0.08), 0.04);                        // jowls
  d = smin(d, egg(q, vec3(0.0, 0.804, 0.262), vec3(0.074, 0.052, 0.078)), 0.022);      // muzzle
  float tufts = fur(hq);

}
// A foreleg when he sits, an arm when he stands: shoulder, elbow, and a paw that goes wherever it is told
float arm(vec3 p, float side, vec3 bend, vec3 paw) {

  float thin = mix(0.93, 0.87, uStand);

  d = smin(d, egg(q, mix(vec3(0.19, 0.2, -0.1), vec3(0.14, 0.215, 0.025), u), mix(vec3(0.125, 0.21, 0.2), vec3(0.108, 0.22, 0.155), u)), 0.06);                   // haunches, or legs
  d = smin(d, rod(q, mix(vec3(0.0, 0.3, -0.14), vec3(0.0, 0.46, -0.01), u), mix(vec3(0.0, 0.6, 0.07), vec3(0.0, 0.94, 0.03), u), mix(0.182, 0.162, u) + uBreath, mix(0.146, 0.128, u) + uBreath), 0.08);

  d = smin(d, rod(q, mix(vec3(0.0, 0.6, 0.06), vec3(0.0, 0.95, 0.04), u), mix(vec3(0.0, 0.78, 0.11), vec3(0.0, 1.11, 0.08), u), mix(0.138, 0.126, u), mix(0.128, 0.118, u)), 0.06);         // neck
  d = smin(d, arm(p, 1.0, uBendR, uHandR), 0.04);
  d = smin(d, arm(p, -1.0, uBendL, uHandL), 0.04);
  d = smin(d, egg(q, mix(vec3(0.185, 0.035, 0.1), vec3(0.13, 0.035, 0.09), u), vec3(0.06, 0.042, 0.11)), 0.04);                                                // hind feet
  float tail = 1e3;
  for (int i = 0; i < 5; i++) tail = min(tail, rod(p, uTail[i], uTail[i + 1], 0.058 - 0.003 * float(i), 0.055 - 0.003 * float(i)));

}
// The body leans and turns as a whole, about his feet
float body(vec3 p) { vec3 b = uBody * p; return bodyPart(vec3(b.x, b.y / SQUAT, b.z)) * SQUAT; }
// Only there while the lamp is on
float table(vec3 p) {
  if (uMode < 1.5) return 1e3;
  float d = slab(p, TABLE + vec3(0.0, 0.57, 0.0), vec3(0.21, 0.032, 0.21));
  vec3 q = vec3(abs(p.x - TABLE.x) - 0.16, p.y, abs(p.z - TABLE.z) - 0.16);
  return min(d, slab(q, vec3(0.0, 0.27, 0.0), vec3(0.034, 0.27, 0.034)));
}
// A top hat, in the head's space, worn a little to one side. It comes with the lamp, from above.
vec3 toHat(vec3 hq) {
  vec3 p = hq - vec3(0.012, 0.985 + uHat.x, 0.115);
  float a = 0.2 + uHat.y, b = uHat.z;
  p.xy = mat2(cos(a), -sin(a), sin(a), cos(a)) * p.xy; p.yz = mat2(cos(b), -sin(b), sin(b), cos(b)) * p.yz;

}

}

vec3 normalAt(vec3 p) {

}
// How much of the lamp reaches a point, soft at the edges
float lampAt(vec3 ro) {

}
// The spotlight is a slanted beam: a thing is lit if sliding it down the beam lands it in the pool
float beam(vec3 p) { vec3 g = p - uLight * (p.y / uLight.y); return smoothstep(BEAM + 0.1, BEAM - 0.1, length(g.xz - uPool)); }
// And the beam itself, seen from the side: the cone from the lamp to the edges of the pool, where s is a place on the picture
float shaft(vec2 s) {

// Steps between neighbouring tones in a fixed pattern, so shading is dots, not blends
float dots() { ivec2 c = ivec2(gl_FragCoord.xy) & 3; return (BAYER[c.y * 4 + c.x] + 0.5) / 16.0; }

// Whether this spot on the eye is showing, or covered by a lid
bool eyeOpen(vec3 hq) {

  vec2 uv = vec2(hq.x - side * EYE.x, hq.y - EYE.y) / EYE_R;

  float v = uv.y - 0.22 * uv.x * side;
  return v < mix(0.85, -0.55, shut) && v > -0.85 + 0.25 * shut;
}

void main() {

  vec3 oc = ro - HEART; float b = dot(oc, rd), c = dot(oc, oc) - bound * bound, disc = b * b - c;

    for (int i = 0; i < 110 && t < tEnd; i++) {

      if (d < 0.002) { tHit = t; break; }

  }

    vec3 p = ro + rd * tHit, hq = toHead(p), q = vec3(abs(hq.x), hq.yz);
    if (ball(q, EYE, EYE_R) < 0.004 && eyeOpen(hq)) col = uEye;
    else if (day || lamplit) {
      vec3 n = normalAt(p);
      float lamp = lampAt(p + n * 0.02), reach = lamplit ? beam(p) : 1.0;
      float lit = max(dot(n, uLight), 0.0) * lamp * reach;

        col = lamplit ? WARM[rung((0.07 * reach + lit * 0.7 + sheen * 0.45 + grain) * nook, 4)] : FUR[rung((lit * 0.5 + sheen * 0.4 + grain) * nook, 4)];

    vec3 g = ro + rd * tFloor;

      float near = 1.0 - smoothstep(0.7, 1.45, length(g.xz - vec2(0.1, -0.1)));
      if (near > 0.0) {

        col = FLOOR[rung(near * ((1.0 - lampAt(g + vec3(0.0, 0.012, 0.0))) * 0.42 + under * under * 0.5), 2)];

      if (shaft(at) > dots()) col = HAZE;

        if (tone > 0) col = POOL[tone];
      }
    }
  }

  // The coin is drawn straight onto the picture, so it never shrinks to nothing: face on, or edge on as it spins
  if (uCoin.w > -0.5) {
    vec2 d = abs(floor(gl_FragCoord.xy) - floor(uCoin.xy));
    // In the dark it is only a glint: one point that swells a little and dies away
    if (uCoin.z < -0.5) { if (d.x + d.y < 0.5) col = mix(col, vec3(0.95, 0.8, 0.45), uCoin.w); }
    else if (d.y <= 1.0 && d.x <= uCoin.z && d.x + d.y < 2.0) col = d.x + d.y < 0.5 && uCoin.w > 0.5 ? vec3(1.0, 0.98, 0.84) : vec3(0.98, 0.74, 0.2);
  }
  gl_FragColor = vec4(col, 1.0);
}`;

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas: stage, antialias: false });
renderer.setPixelRatio(1);
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z), V2 = () => new THREE.Vector2();

  uRight: { value: V() }, uUp: { value: V() }, uFwd: { value: V() }, uTarget: { value: V(0.03, 0.5, 0) }, uLight: { value: V() },
  uNeck: { value: V() }, uHandL: { value: V() }, uHandR: { value: V() }, uBendL: { value: V() }, uBendR: { value: V() },
  uHead: { value: new THREE.Matrix3() }, uBody: { value: new THREE.Matrix3() }, uTail: { value: [] },
  uEar: { value: V2() }, uBlink: { value: V2() }, uPool: { value: V2() }, uPoolS: { value: V2() }, uApex: { value: V2() },

const TAIL_SIT = [[0, 0.1, -0.42], [0.2, 0.07, -0.56], [0.42, 0.06, -0.47], [0.56, 0.06, -0.27], [0.62, 0.06, -0.04], [0.6, 0.07, 0.18]];
const TAIL_UP = [[0, 0.36, -0.2], [0.03, 0.23, -0.36], [0.08, 0.13, -0.47], [0.16, 0.08, -0.55], [0.27, 0.06, -0.57], [0.38, 0.09, -0.52]];
uniforms.uTail.value = TAIL_SIT.map(p => V(...p));
const scene = new THREE.Scene(), camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const page = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms, fragmentShader: frag, vertexShader: 'void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }', depthTest: false,
}));
page.frustumCulled = false;
scene.add(page);

let cols = 1, rows = 1, sizedW = -1, sizedH = -1;
function resize() {
  // A hidden pane reports no size; draw for a plausible one until it has one
  const w = innerWidth || 1280, h = innerHeight || 800;
  const scale = Math.max(3, Math.round(Math.min(w * 1.3, h) / 104));
  cols = Math.ceil(w / scale); rows = Math.ceil(h / scale);
  renderer.setSize(cols, rows, false);
  stage.style.width = cols * scale + 'px'; stage.style.height = rows * scale + 'px';
  uniforms.uRes.value.set(cols, rows);
  // Tall windows are fitted by width, so the table and tail stay in
  uniforms.uSpan.value = Math.max(1.6, 1.5 * rows / cols);
}

// Dragging only shifts where you watch from; the loop itself answers to nothing
const view = { yaw: 0, pitch: 0.3 };
const drag = { down: false, x: 0, y: 0 };
stage.addEventListener('pointerdown', e => { stage.setPointerCapture(e.pointerId); Object.assign(drag, { down: true, x: e.clientX, y: e.clientY }); stage.classList.add('turning'); });
addEventListener('pointermove', e => {
  if (!drag.down) return;
  view.yaw -= (e.clientX - drag.x) * 0.008; view.pitch = clamp(view.pitch + (e.clientY - drag.y) * 0.004, 0.1, 0.75);
  drag.x = e.clientX; drag.y = e.clientY;
});
const release = () => { drag.down = false; stage.classList.remove('turning'); };
addEventListener('pointerup', release);
addEventListener('pointercancel', release);

// The performance. Everything is a function of the time in the loop and nothing else, so the last frame meets the first.
const LOOP = 9.9, TURN = Math.PI * 2 / LOOP, SQUAT = 0.84;
const DARK = 1.3, LAMP = 2.3, OUT = 6.35, DAY = 7.5;     // when the page goes dark, the lamp comes on, goes off, and day returns
const FLICK = 3.35, CATCH = 4.15, PUT = 5.25, FREE = 5.75; // when the coin leaves the paw, comes back to it, meets the table, and is let go

// Ways of arriving at a pose: gently, late, early, with a crack, or overshooting and settling
const EASE = {
  lin: x => x, io: x => x < 0.5 ? 4 * x * x * x : 1 - (2 - 2 * x) ** 3 / 2, in: x => x * x * x, out: x => 1 - (1 - x) ** 3,
  snap: x => 1 - (1 - x) ** 5, fall: x => x ** 4, back: x => 1 + 2.70158 * (x - 1) ** 3 + 1.70158 * (x - 1) ** 2,
};
// A track is a list of [when, pose, how to arrive]; between entries it moves, after the last it stays
function key(track, t) {
  if (t <= track[0][0]) return track[0][1];
  for (let i = 1; i < track.length; i++) if (t < track[i][0]) {
    const [t0, a] = track[i - 1], [t1, b, how = 'io'] = track[i], k = EASE[how]((t - t0) / (t1 - t0));
    return typeof a === 'number' ? a + (b - a) * k : a.map((v, j) => v + (b[j] - v) * k);
  }
  return track[track.length - 1][1];
}
const bump = (t, at, len) => t > at && t < at + len ? Math.sin((t - at) / len * Math.PI) : 0;
const mix3 = (a, b, k) => a.map((v, i) => lerp(v, b[i], k));
// A tossed coin: gone from the paw at once, a long while at the top, and back in a hurry; it turns fastest where it travels fastest
const hang = u => 1 - Math.abs(2 * u - 1) ** 2.4;
const turns = u => 0.5 + 0.5 * Math.sign(2 * u - 1) * Math.abs(2 * u - 1) ** 1.7;

// Up at once: the lamp is hardly on before he is rising, too far, and settling. He stretches into the flick, his knees give on
// the catch, and he sinks a little to reach the table. Down, in the dark: a drop and a bounce.
const STAND = [[2.42, 0], [2.5, -0.08], [2.9, 1.08], [3.1, 1], [3.3, 0.97], [3.38, 1.05, 'snap'], [3.65, 1], [4.1, 1], [4.23, 0.94, 'snap'], [4.5, 1, 'back'],
  [4.95, 1], [5.22, 0.93], [5.75, 0.95], [6.3, 1], [6.7, 1], [6.82, -0.08, 'in'], [6.95, 0, 'out']];
// Sideways: away first, to wind up, then all the way over to the table, further as he pushes the coin, and back
const SIDE = [[2.5, 0], [3.0, -0.04], [4.55, -0.04], [4.75, -0.08], [5.2, 0.1], [5.75, 0.12], [5.95, 0.12], [6.35, -0.03], [6.7, -0.03], [6.82, 0]];
// Forward and back: he stands a little hunched, like anything on two legs that was built for four
const BACK = [[2.42, 0], [2.5, 0.09], [2.9, -0.03, 'out'], [3.1, 0.03], [3.3, 0.04], [3.38, -0.06, 'snap'], [3.8, 0.03], [4.75, 0.03], [5.2, 0.12], [5.75, 0.14], [5.95, 0.14], [6.35, 0.03], [6.7, 0.03], [6.82, 0]];
// Round: he is never square to you, sitting or standing, and turns further when he goes to the table
const ASKEW = -0.35;
const TWIST = [[2.5, ASKEW], [2.95, ASKEW - 0.07, 'out'], [3.2, ASKEW], [4.6, ASKEW], [4.78, ASKEW + 0.06], [5.2, -0.58], [5.95, -0.58], [6.35, ASKEW]];
// Nothing on two legs stands still: while he is up he shifts his weight and bobs
const up2 = t => clamp(key(STAND, t), 0, 1);
const lean = t => new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(
  key(BACK, t) + 0.012 * Math.sin(t * TURN * 9 + 1) * up2(t), key(TWIST, t), key(SIDE, t) + 0.022 * Math.sin(t * TURN * 7) * up2(t), 'YZX'));
// A spot on his body, given in its own space, as it stands in the room at a moment; and the other way about, for his left paw
const place = (out, c, t) => out.set(c[0], c[1] * SQUAT, c[2]).applyMatrix4(lean(t));
const scratch = V();
const over = (t, x, y, z) => {
  scratch.set(x, y, z).applyMatrix4(lean(t).invert());
  return [-scratch.x, scratch.y / SQUAT, scratch.z];
};
// Paws at rest: on the floor, or held up loose at his chest
const HAND_SIT = [0.09, 0.07, 0.2], TUCK = [0.09, 0.75, 0.19];
// The coin paw: out with the coin while he is still rising, a dip and a crack of a flick, hanging open, a catch that gives and
// springs back; then drawn back, swung over the top and a little past, set down, a slow push across the table, and home in a hurry
const SHOW = [0.27, 0.82, 0.32];
const HAND = [[2.75, [0.16, 0.7, 0.24]], [3.1, SHOW, 'out'], [3.22, SHOW], [3.31, [0.27, 0.75, 0.31]], [3.37, [0.27, 0.99, 0.33], 'snap'], [3.7, [0.29, 0.9, 0.31], 'out'],
  [4.0, [0.28, 0.83, 0.32]], [CATCH, [0.28, 0.83, 0.32]], [4.23, [0.27, 0.72, 0.32], 'snap'], [4.5, SHOW, 'back'], [4.75, [0.22, 0.86, 0.3]],
  [5.0, [0.42, 0.98, 0.26], 'in'], [5.18, over(5.18, -0.61, 0.675, 0.16), 'out'], [5.3, over(5.3, -0.57, 0.655, 0.16)], [5.4, over(5.4, -0.57, 0.655, 0.16)],
  [FREE, over(FREE, -0.68, 0.655, 0.14)], [5.95, over(5.95, -0.67, 0.68, 0.14)], [6.3, TUCK, 'back']];
const USE = [[2.75, 0], [3.0, 1], [6.3, 1], [6.31, 0, 'lin']];
// The other paw comes out for balance while he is over the table
const OTHER = [[4.7, TUCK], [5.2, [0.28, 0.8, 0.1]], [5.9, [0.28, 0.8, 0.1]], [6.4, TUCK, 'back']], USE_OTHER = [[4.7, 0], [4.9, 1], [6.2, 1], [6.4, 0]];
// His head sits a little crooked while he is up, as if he knew something
const JAUNT = [[2.5, 0], [3.0, 0.06], [6.7, 0.06], [6.82, 0]];
// Head, on top of facing you: a dip and lift as he rises; round to the table before the paw goes there, and back before it leaves
const YAW = [[4.45, 0], [4.7, -0.35], [5.85, -0.35], [6.2, 0]];
const NOD = [[2.42, 0], [2.5, -0.15], [2.9, 0.12, 'out'], [3.15, 0.04], [4.15, 0.04], [4.23, -0.07, 'snap'], [4.5, 0.04], [4.7, -0.33], [5.85, -0.33], [6.2, 0.04],
  [6.7, 0.04], [6.82, -0.15, 'in'], [6.97, 0, 'out']];
// And when it is all over and he is only a cat: the head tipped gently to one side, as if you were the odd one
const COCK = [[8.05, 0], [8.5, -0.26], [9.2, -0.26], [9.65, 0]];
// The hat falls out of the lamp, slowly and then all at once, and lands on him just as he dips to get up
const DROP = [[LAMP + 0.02, 1.2], [2.49, 0, 'fall']];
const STARTLE = [[LAMP, 0], [LAMP + 0.06, 1, 'snap'], [2.6, 1], [3.0, 0]];

// Both paws, in the body's own space, at a moment
function paws(t) {
  const up = key(STAND, t) + 0.012 * Math.sin(t * TURN * 14) * up2(t), rest = mix3(HAND_SIT, TUCK, up);
  const busy = mix3(rest, key(HAND, t), key(USE, t)), other = mix3(rest, key(OTHER, t), key(USE_OTHER, t));
  return { up, left: [-busy[0], busy[1], busy[2]], right: other };
}
// Where the elbow has to be for an arm of fixed length to reach from shoulder to paw
const reachA = V(), reachB = V(), poke = V();
function elbow(out, side, paw, up) {
  reachA.set(lerp(0.085, 0.115, up) * side, lerp(0.45, 0.895, up), lerp(0.13, 0.075, up));
  reachB.set(...paw).sub(reachA);
  const span = reachB.length(), bone = Math.max(span / 2, lerp(0.19, 0.2, clamp(up, 0, 1)));
  poke.set(side * 0.7, -0.5, -0.5).addScaledVector(reachB, -poke.dot(reachB) / (span * span)).normalize();
  return out.copy(reachA).addScaledVector(reachB, 0.5).addScaledVector(poke, Math.sqrt(bone * bone - span * span / 4));
}
// Where the coin is while it sits on the paw, and while the paw is pushing it along the table
const onPaw = (t, out) => { const { left } = paws(t); return place(out, [left[0], left[1] + 0.085, left[2] + 0.03], t); };
const pushed = (t, out) => place(out, paws(t).left, t).setY(0.64);
const tossed = onPaw(FLICK, V()), caught = onPaw(CATCH, V()), laid = pushed(FREE, V());

const askew = new THREE.Matrix4().makeRotationY(ASKEW), turn = new THREE.Matrix4(), spot = V(), back = V(), aim = V(), tmp = V(), pix = V2();
const MIDDLE = V(-0.3, 0.6, 0.05);   // a point the middle of the beam passes through

// Knobs the host can turn while it plays
const P = params({
  sway: [0.1, 0, 0.4],          // how far the view swings round him
  headSize: [1.42, 1, 1.7],     // how big his head is, grown from the neck
  earSize: [1, 0.6, 1.6],       // how long his ears are, from the root
  eyes: '#d1d64d',              // the colour of his eyes
  hatBand: '#db2b21',           // the ribbon round the hat
  beam: [1.05, 0.6, 1.5],       // how wide the spotlight's pool is
  flip: [0.85, 0.3, 1.3],       // how high the coin goes
  tailSwish: [1, 0, 3],         // how much the tail swings
});

function frame(now, dt) {
  if (innerWidth !== sizedW || innerHeight !== sizedH) { sizedW = innerWidth; sizedH = innerHeight; resize(); }
  // The first dark was written a beat longer than it plays: the clock skips the difference
  const real = now % LOOP, t = real < 1.9 ? real : real + 0.4, U = uniforms;
  const mode = t < DARK ? 0 : t < LAMP ? 1 : t < OUT ? 2 : t < DAY ? 1 : 0;
  U.uMode.value = mode;
  U.uBig.value = P.headSize; U.uBeam.value = P.beam; U.uEarSize.value = P.earSize;
  hex(U.uEye.value, P.eyes); hex(U.uBand.value, P.hatBand);

  // Where you are looking from: a slow sway, so he stays a solid thing
  const yaw = 0.38 + P.sway * Math.sin(real * TURN) + view.yaw, pitch = view.pitch, span = U.uSpan.value;
  const fwd = U.uFwd.value.set(-Math.sin(yaw) * Math.cos(pitch), -Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
  const right = U.uRight.value.set(Math.cos(yaw), 0, -Math.sin(yaw));
  const up = U.uUp.value.crossVectors(right, fwd);
  back.set(Math.sin(yaw), 0, Math.cos(yaw));
  const onPicture = (v, out) => { tmp.copy(v).sub(U.uTarget.value); return out.set(tmp.dot(right), tmp.dot(up)); };
  // Daylight comes over your left shoulder; the spotlight slants down from the top left
  const light = U.uLight.value;
  if (mode === 2) {
    light.set(0, 0.85, 0).addScaledVector(right, -0.45).addScaledVector(back, 0.2).normalize();
    aim.copy(MIDDLE).addScaledVector(light, -MIDDLE.y / light.y);
    U.uPool.value.set(aim.x, aim.z);
    onPicture(aim, U.uPoolS.value);
    onPicture(aim.copy(MIDDLE).addScaledVector(light, 5.5), U.uApex.value);
    U.uSinP.value = Math.sin(pitch);
  } else light.set(0, 0.8, 0).addScaledVector(right, -0.55).addScaledVector(back, 0.5).normalize();

  // Body: how far up he is, and how he is leaning
  const { up: stand, left, right: other } = paws(t), tilt = lean(t);
  U.uStand.value = stand;
  // It does not land flat: it rocks round on its brim and settles
  const landed = Math.max(0, t - 2.49), rock = 0.2 * (landed / 0.07) * Math.exp(1 - landed / 0.07);
  U.uHat.value.set(key(DROP, t), rock * Math.sin(landed * 34), rock * Math.cos(landed * 34) * 0.6);
  U.uBody.value.setFromMatrix4(tilt).transpose();
  place(U.uNeck.value, [0, lerp(0.702, 1.048, stand), 0.07], t);
  U.uBreath.value = Math.sin(real * TURN * 5) * 0.006;
  U.uHandL.value.set(...left); U.uHandR.value.set(...other);
  elbow(U.uBendL.value, -1, left, stand); elbow(U.uBendR.value, 1, other, stand);

  // The coin: produced, flicked, turning over in the air, caught, set on the table and pushed across it, there until the lamp goes
  const fly = (t - FLICK) / (CATCH - FLICK), flying = fly > 0 && fly < 1;
  if (mode === 2 && t > 3.05) {
    if (flying) spot.lerpVectors(tossed, caught, fly).y += P.flip * hang(fly);
    else if (t < PUT) onPaw(t, spot).lerp(pushed(t, aim), clamp((t - PUT + 0.1) / 0.1, 0, 1));
    else if (t < FREE) pushed(t, spot);
    else spot.copy(laid);
    onPicture(spot, pix);
    const glint = bump(t, 3.08, 0.14) + bump(t, FLICK + 0.33, 0.14) + bump(t, CATCH, 0.12) + bump(t, PUT, 0.14) + bump(t, FREE + 0.05, 0.14) > 0;
    U.uCoin.value.set((pix.x / (span * cols / rows) * 0.5 + 0.5) * cols, (pix.y / span * 0.5 + 0.5) * rows, flying && Math.floor(turns(fly) * 9) % 2 ? 0 : 1, glint ? 1 : 0);
  } else if (t > OUT + 0.1 && t < OUT + 0.6) {
    // A moment after the lamp goes, the coin catches what little light is left
    onPicture(laid, pix);
    U.uCoin.value.set((pix.x / (span * cols / rows) * 0.5 + 0.5) * cols, (pix.y / span * 0.5 + 0.5) * rows, -1, 0.5 * bump(t, OUT + 0.1, 0.5) ** 1.5);
  } else U.uCoin.value.w = -1;

  // Head: towards you, but turned most of the way with his body; and it cannot quite help following the coin up and down
  const watch = hang(clamp((t - 0.07 - FLICK) / (CATCH - FLICK), 0, 1));
  const headYaw = clamp(yaw, -1.2, 1.2) * (1 - 0.5 * up2(t)) + key(TWIST, t) * 0.7 + key(YAW, t) - 0.16 * watch, headPitch = pitch * 0.7 + key(NOD, t) + 0.2 * watch;
  turn.makeRotationFromEuler(new THREE.Euler(-headPitch, headYaw, headYaw * 0.12 + key(COCK, t) + key(JAUNT, t), 'YXZ'));
  U.uHead.value.setFromMatrix4(turn).transpose();

  // Eyes: wide under the lamp; he only blinks when there is nothing to see
  const blink = Math.min(1, (bump(t, 0.6, 0.16) + bump(t, 1.52, 0.2) + bump(t, 8.85, 0.16)) * 1.6);
  U.uBlink.value.set(blink, blink);
  // Ears: back when the lamp catches him, a flick on the catch, another as his head tips
  const startle = key(STARTLE, t);
  U.uEar.value.set(startle + bump(t, 4.18, 0.2) * 0.8, startle + bump(t, 8.25, 0.22) * 0.8 + bump(t, 0.9, 0.22) * 0.8);

  // Tail: follows him up late, swishes wider while he is on his feet, and thumps once at the end
  const late = clamp(key(STAND, t - 0.22), 0, 1), thump = bump(t, 9.35, 0.45);
  TAIL_SIT.forEach((sit, i) => {
    const [x, y, z] = mix3(sit, TAIL_UP[i], late), w = (i / 5) ** 2, sway = Math.sin(real * TURN * 4 + i * 0.5) * (0.05 + 0.06 * late) * w * P.tailSwish;
    // The root leans with him; the tip stays where it lies
    spot.set(x + sway * 0.6 - thump * 0.05 * w, (y + thump * 0.2 * w) * SQUAT, z + sway).applyMatrix4(askew).applyMatrix3(U.uBody.value);
    U.uTail.value[i].set(lerp(x, spot.x, i / 5), lerp(y, spot.y / SQUAT, i / 5), lerp(z, spot.z, i / 5));
  });

  renderer.render(scene, camera);
}
loop(LOOP, frame);
</script>
</body></html>
