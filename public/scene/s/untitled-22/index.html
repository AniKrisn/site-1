<canvas id="stage" aria-label="A forty second loop. A bronze and brushed steel lift stands on a white page. Each time its needle swings round and it dings, its doors open on another floor of the same drowned city: a sea where a whale surfaces, a desert of broken towers, a rainforest, and a night of stars, before closing and going on."></canvas>

<script type="module">
import * as THREE from 'three';
import { params, loop, sections } from 'scene';

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

// ================= The lift. Nothing here is a mesh: every pixel walks a ray to a shape described by distance =================
const frag = /* glsl */`
precision highp float;
uniform vec2 uRes;
uniform vec3 uRight, uUp, uFwd, uTarget, uLight;
uniform float uSpan, uOpen, uRound, uNeedle, uCall, uDing, uWet, uSill, uPuddle, uShine;
uniform vec2 uStream, uPile;
uniform sampler2D uView;   // the floor behind the doors, already drawn for the opening
const float BAYER[16] = float[16](0.0, 8.0, 2.0, 10.0, 12.0, 4.0, 14.0, 6.0, 3.0, 11.0, 1.0, 9.0, 15.0, 7.0, 13.0, 5.0);
const float PI = 3.14159265;

// The lift's measurements
const float HW = 0.46, HT = 1.74, HD = 0.1;    // half its width, its height, half its depth
const float DW = 0.36, SILL = 0.1, DH = 1.08;  // half the doorway's width, how high its threshold is, how tall it is: 2 by 3
const float AW = 0.045;                         // width of the moulding round the doorway
const float BACK = -0.02;                       // the back of the doorway, where the other floor shows
const vec2 DIAL = vec2(0.0, 1.32);              // the floor indicator above the doors
const vec2 BTN = vec2(0.433, 0.68);             // the call button beside them
const float FAN = 0.34;                        // how far the sunburst round the dial reaches

// Brushed steel doors in a dark bronze surround, brass fittings
const vec3 STEEL[5] = vec3[5](vec3(0.2, 0.22, 0.25), vec3(0.37, 0.39, 0.43), vec3(0.55, 0.57, 0.61), vec3(0.73, 0.75, 0.78), vec3(0.9, 0.91, 0.92));
const vec3 BRONZE[5] = vec3[5](vec3(0.09, 0.075, 0.065), vec3(0.19, 0.15, 0.12), vec3(0.32, 0.26, 0.2), vec3(0.49, 0.4, 0.3), vec3(0.7, 0.6, 0.46));
const vec3 BRASS[4] = vec3[4](vec3(0.33, 0.22, 0.08), vec3(0.55, 0.4, 0.15), vec3(0.76, 0.6, 0.28), vec3(0.93, 0.82, 0.52));
const vec3 AMBER[3] = vec3[3](vec3(0.98, 0.55, 0.16), vec3(1.0, 0.78, 0.4), vec3(1.0, 0.95, 0.8));
const vec3 SAND[4] = vec3[4](vec3(0.55, 0.42, 0.28), vec3(0.72, 0.58, 0.4), vec3(0.85, 0.73, 0.54), vec3(0.94, 0.87, 0.71));
const vec3 WATER[3] = vec3[3](vec3(0.42, 0.6, 0.7), vec3(0.62, 0.79, 0.86), vec3(0.86, 0.94, 0.97));

float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float h21(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

float egg(vec3 p, vec3 c, vec3 r) { vec3 q = (p - c) / r; float k0 = length(q), k1 = length(q / r); return k0 * (k0 - 1.0) / max(k1, 1e-4); }
float rod(vec3 p, vec3 a, vec3 b, float ra, float rb) {
  vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h) - mix(ra, rb, h);
}

// Steps between neighbouring tones in a fixed pattern, so shading is dots, not blends
float dots() { ivec2 c = ivec2(gl_FragCoord.xy) & 3; return (BAYER[c.y * 4 + c.x] + 0.5) / 16.0; }
float stepped(float t, float steps) { float x = clamp(t, 0.0, 1.0) * steps; return min(floor(x) + (fract(x) > dots() ? 1.0 : 0.0), steps) / steps; }
int ramp(float t, float n) { float x = clamp(t, 0.0, 1.0) * n; return int(min(floor(x) + (fract(x) > dots() ? 1.0 : 0.0), n)); }
// Metal takes hard steps, no dots, so its edges and its reflection stay crisp
int hard(float t, float n) { return int(clamp(t, 0.0, 1.0) * n + 0.5); }

// The parts
float slab(vec3 p) {
  float d = box(p, vec3(0.0, HT * 0.5, 0.0), vec3(HW, HT * 0.5, HD), 0.006);
  return max(d, -box(p, vec3(0.0, SILL + DH * 0.5, 0.09), vec3(DW, DH * 0.5, 0.11), 0.0));
}
float arch(vec3 p) {
  float d = box(p, vec3(0.0, (SILL + DH + AW) * 0.5, 0.104), vec3(DW + AW, (SILL + DH + AW) * 0.5, 0.018), 0.008);
  return max(d, -box(p, vec3(0.0, SILL + DH * 0.5 - 0.06, 0.1), vec3(DW, DH * 0.5 + 0.06, 0.1), 0.0));
}
float sill(vec3 p) { return box(p, vec3(0.0, SILL - 0.006, 0.04), vec3(DW, 0.009, 0.06), 0.003); }
float doors(vec3 p) {

  float d = box(q, vec3(a + w, SILL + 0.003 + (DH - 0.003) * 0.5, 0.012), vec3(w, (DH - 0.003) * 0.5, 0.012), 0.003);

}
float dial(vec3 p) {

}

// Brass trim: a stepped crown on top, and a plinth the whole lift stands on

  return min(d, box(p, vec3(0.0, HT + 0.08, 0.0), vec3(HW - 0.19, 0.02, HD - 0.035), 0.003));
}
// What came out of the doors: a falling sheet of water, a thread of sand and the little heap it makes
float water(vec3 p) { return uWet < 0.01 ? 1e3 : box(p, vec3(0.0, SILL * 0.5, 0.116), vec3(0.11 * uWet, SILL * 0.5, 0.004), 0.003); }

  d = sill(p); if (d < best) { best = d; id = 2; }
  d = doors(p); if (d < best) { best = d; id = 3; }
  d = dial(p); if (d < best) { best = d; id = 4; }
  d = plate(p); if (d < best) { best = d; id = 5; }
  d = button(p); if (d < best) { best = d; id = 6; }
  d = sand(p); if (d < best) { best = d; id = 7; }
  d = water(p); if (d < best) { best = d; id = 8; }

}
vec3 normalAt(vec3 p) {

}
// How much of the light reaches a point, soft at the edges
float lightAt(vec3 ro) {
  float res = 1.0, t = 0.01;
  for (int i = 0; i < 40; i++) {
    float d = map(ro + uLight * t);
    res = min(res, 8.0 * d / t);
    t += clamp(d, 0.008, 0.15);

vec2 boxHit(vec3 ro, vec3 rd, vec3 lo, vec3 hi) {

float walk(vec3 ro, vec3 rd, float tEnd) {
  vec2 span = boxHit(ro, rd, vec3(-HW - 0.03, -0.01, -HD - 0.03), vec3(HW + 0.03, HT + 0.13, 0.42));

    if (d < 0.0008) return t;
    t += d * 0.9;

}

vec3 shadeLift(vec3 p, vec3 rd) {

  }

    float b = dot(n, normalize(vec3(-0.5, 0.6, 0.6)));

    float fall = fract(p.y * 18.0 + uRound * 200.0 + sin(p.x * 70.0) * 0.6);
    return WATER[ramp(0.2 + 0.5 * lamp + (fall > 0.7 ? 0.4 : 0.0) - 0.15 * step(0.85, fract(p.x * 23.0)), 2.0)];
  }

  int k = id == 1 ? 3 : 2;
  if (n.y > 0.6) k += 2; else if (n.x < -0.6) k += p.x < 0.0 ? 1 : 0; else if (n.x > 0.6 || (n.y < -0.6 && p.y > SILL)) k -= 2;

    vec2 q = p.xy - DIAL; float r = length(q), a = atan(q.y, q.x);

}

// The land: what the thing stands on and its shadow falls on. Here a flat white page, with nothing beyond it.
vec3 landAt(vec3 g, vec2 s, float shade) { return vec3(1.0 - 0.24 * shade); }

void main() {
  vec2 s = (gl_FragCoord.xy / uRes) * 2.0 - 1.0, at = vec2(s.x * uSpan * uRes.x / uRes.y, s.y * uSpan);

    float dim = 0.0, touch = 1.0;
    if (length(g.xz - vec2(0.4, -0.5)) < 1.8) touch = map(g);
    col = landAt(g, s, touch < 0.05 ? 1.0 : 0.0);   // no cast shadow: only a clean line where it meets the page
    // The water that came out, lying on the page and holding a reflection of the lift

      if (dim > 0.4 && k > 0) k -= 1;

    }

}`;

// ================= The floors. Each is its own scene, drawn only while it is behind the doors, into a small picture the size of the opening.
// In each, the opening is x -1 to 1 and y 0 to 3, and uRes is that picture's size in pixels.

// ---- 1. The sea: the drowned city, and a humpback that surfaces, blows, looks at you and dives ----
const SEA_FRAG = /* glsl */`

uniform vec4 uSpout;
uniform float uSpoutZ, uSlick, uDripT;
uniform vec2 uWave;
uniform vec4 uDive;

const vec3 CLOUD[2] = vec3[2](vec3(1.0, 0.995, 0.98), vec3(0.87, 0.89, 0.91));
const vec3 FARC = vec3(0.84, 0.87, 0.88);
const vec3 SEA[6] = vec3[6](vec3(0.11, 0.22, 0.30), vec3(0.19, 0.35, 0.43), vec3(0.31, 0.50, 0.57), vec3(0.48, 0.66, 0.71), vec3(0.70, 0.83, 0.85), vec3(0.95, 0.98, 0.97));
const vec3 STONE[5] = vec3[5](vec3(0.20, 0.20, 0.22), vec3(0.34, 0.33, 0.33), vec3(0.49, 0.47, 0.44), vec3(0.64, 0.61, 0.56), vec3(0.79, 0.76, 0.70));
const vec3 WIN = vec3(0.13, 0.15, 0.17);
const vec3 GUANO = vec3(0.93, 0.92, 0.87);
const vec3 ALGAE[2] = vec3[2](vec3(0.20, 0.27, 0.23), vec3(0.36, 0.42, 0.33));

const vec3 MIST[2] = vec3[2](vec3(1.0), vec3(0.80, 0.84, 0.88));

function seaFloor() {

  const WAVE_AT = [[0, 0], [DIVE, 0], [7.7, 17.5, 'lin'], [8.05, 22, 'lin'], [8.75, 27, 'lin']];
  const WAVE_UP = [[0, 0], [DIVE, 0], [7.2, 0.07, 'out'], [7.7, 0.12, 'lin'], [8.05, 0.34, 'in'], [8.75, 0.3], [8.95, 0]];

function desertFloor() {

    uPeer: { value: new THREE.Vector2() },
    uRes: { value: new THREE.Vector2(1, 1) }, uPx: { value: 0.05 }, uSun: { value: new THREE.Vector3(-0.32, 0.35, 0.85).normalize() },
    uU: { value: 0 }, uBlow: { value: 0 }, uStorm: { value: 1 }, uSwing: { value: 0 },

    len, uniforms: U, scene: quad(new THREE.ShaderMaterial({ uniforms: U, fragmentShader: DESERT_FRAG, vertexShader: VERT, depthTest: false })),

function forestFloor() {
  const U = {
    uRes: { value: new THREE.Vector2(1, 1) }, uPx: { value: 0.05 }, uPhase: { value: 0 },
    uShafts: { value: 1 }, uMist: { value: 1 }, uWind: { value: 1 }, uDrift: { value: new THREE.Vector2() }, uBird: { value: new THREE.Vector4() },
  };

    len, uniforms: U, scene: quad(new THREE.ShaderMaterial({ uniforms: U, fragmentShader: FOREST_FRAG, vertexShader: VERT, depthTest: false })),

function nightFloor() {
  const U = {

    [-1.0, 0.02, 0, 0.6], [-0.6, 0.15, 0, 0.45], [-0.08, 0.21, 0, 0.78], [0.38, 0.15, 0, 0.55], [0.8, 0.03, 0, 0.5],

const FLOORS = [seaFloor(), forestFloor(), desertFloor(), nightFloor()];

let cols = 1, rows = 1, sizedW = -1, sizedH = -1;
function resize() {

  const scale = Math.max(3, Math.round(Math.min(w * 1.3, h) / 104));

// Dragging only shifts where you watch from; the loop itself answers to nothing
const view = { yaw: 0, pitch: 0.25 };
const drag = { down: false, x: 0, y: 0 };
stage.addEventListener('pointerdown', e => { stage.setPointerCapture(e.pointerId); Object.assign(drag, { down: true, x: e.clientX, y: e.clientY }); stage.classList.add('turning'); });
addEventListener('pointermove', e => {
  if (!drag.down) return;
  view.yaw -= (e.clientX - drag.x) * 0.008; view.pitch = clamp(view.pitch + (e.clientY - drag.y) * 0.004, 0.1, 0.9);
  drag.x = e.clientX; drag.y = e.clientY;

const release = () => { drag.down = false; stage.classList.remove('turning'); };
addEventListener('pointerup', release);
addEventListener('pointercancel', release);

// Each visit: the needle snaps round, ding, the doors open fast, the floor plays, the doors slam shut, and the button lights again
const PRE = 0.55, OPEN = 0.45, SHUT = 0.45, POST = 0.15;
const SHOW = [3.05, 2.15, 2.15, 2.9];  // how long each floor is seen before the doors close: the sea from its tail lifting to the swell coming over, the night lingered on, the rest a glimpse
const FROM = [5.2, 2.8, 2.6, 2.6];      // where in its own loop each floor is when the doors open: the whale rolling to dive, the macaw, the gust, the star whale's eye
const S = sections({ sea: 4.35, rainforest: 3.3, desert: 3.3, night: 4.05 });   // PRE + SHOW + SHUT + POST, the sea with a breath after
const STARTS = [0, 4.35, 7.65, 10.95];
const dialAt = n => Math.PI * (0.8 - 0.2 * n);
const P = params({

let warmed = 0;
function frame(now) {
