<meta charset="utf-8">
<title>Don't</title>
<style>
  /* Layout: the whole frame is a dark floor of dominoes, drawn in chunky pixels */
  :root { --bg: #15151b; color-scheme: dark; }
  html, body { height: 100%; }
  body { background: var(--bg); overflow: hidden; }
  #stage {
    position: fixed; left: 0; top: 0; display: block;
    image-rendering: pixelated;
    touch-action: none; cursor: grab;
  }
  #stage.turning { cursor: grabbing; }
</style>

<canvas id="stage" aria-label="An eleven second loop. Seen from above, a floor of standing dominoes fills the frame. A finger tips the first one in the corner, the fall spreads across the floor, and the coloured backs of the fallen dominoes paint a huge eye staring up at you. Then they stand back up in a ripple from the pupil outward."></canvas>

<script type="module">
import * as THREE from 'three';
import { params, loop, sections } from 'scene';

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const f = v => v.toFixed(4);

// When each domino goes: the fall spreads from the first one, the rise from the middle of the eye
const T = { fall0: 0.72, fallPer: 0.085, fallLen: 0.34, rise0: 7.8, risePer: 0.07, riseLen: 0.45, lean: 1.36 };

// Nothing here is a mesh: every pixel finds the few dominoes its ray could touch and meets them exactly
const frag = /* glsl */`
precision highp float;
uniform vec2 uRes;
uniform vec3 uRight, uUp, uFwd, uTarget, uLight;
uniform float uSpan, uT;
uniform vec2 uStart;                    // the cell of the first domino
uniform vec3 uTip, uKnuckle, uWrist, uNail;
uniform vec3 uBack, uIris, uFloor;
const float BAYER[16] = float[16](0.0, 8.0, 2.0, 10.0, 12.0, 4.0, 14.0, 6.0, 3.0, 11.0, 1.0, 9.0, 15.0, 7.0, 13.0, 5.0);

// The face and edges of a domino, and the finger
const vec3 IVORY[4] = vec3[4](vec3(0.36, 0.33, 0.33), vec3(0.6, 0.56, 0.52), vec3(0.82, 0.78, 0.7), vec3(0.97, 0.94, 0.86));
const vec3 SKIN[4] = vec3[4](vec3(0.42, 0.22, 0.2), vec3(0.68, 0.4, 0.34), vec3(0.87, 0.6, 0.5), vec3(0.98, 0.8, 0.68));

const float W = 0.78, TH = 0.22, H = 0.95;    // a domino's width, thickness and height; cells are 1 apart
const float LEAN = ${f(T.lean)};               // how far over a fallen one lies
const float FALL0 = ${f(T.fall0)}, FALL_PER = ${f(T.fallPer)}, FALL_LEN = ${f(T.fallLen)};
const float RISE0 = ${f(T.rise0)}, RISE_PER = ${f(T.risePer)}, RISE_LEN = ${f(T.riseLen)};

float smin(float a, float b, float k) { float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }
float rod(vec3 p, vec3 a, vec3 b, float ra, float rb) {
  vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h) - mix(ra, rb, h);
}
float dots() { ivec2 c = ivec2(gl_FragCoord.xy) & 3; return (BAYER[c.y * 4 + c.x] + 0.5) / 16.0; }
float stepped(float t, float steps) { float x = clamp(t, 0.0, 1.0) * steps; return min(floor(x) + (fract(x) > dots() ? 1.0 : 0.0), steps) / steps; }

// The thing: a field of dominoes, each tipped over toward you by as much as the time says
float tilt(vec2 c) {
  float tf = FALL0 + min(length(c - uStart), 48.0) * FALL_PER;
  float p = clamp((uT - tf) / FALL_LEN, 0.0, 1.0), q = clamp((uT - tf - FALL_LEN) / 0.22, 0.0, 1.0);
  float a = LEAN * p * p - 0.09 * sin(q * 3.14159) * (1.0 - q);   // falls faster and faster, then a little bounce
  float tr = RISE0 + min(length(c + 0.5), 25.0) * RISE_PER;
  float r = clamp((uT - tr) / RISE_LEN, 0.0, 1.0);
  return a * (1.0 - (1.0 - pow(1.0 - r, 3.0)));
}
// A ray against the domino in cell c: how far, which way the face looks, and which face (0 edge, 1 back, 2 front)
float domino(vec3 ro, vec3 rd, vec2 c, out vec3 n, out float face) {
  float a = tilt(c), ca = cos(a), sa = sin(a);
  vec3 o = ro - vec3(c.x + 0.5, 0.0, c.y + 0.5 + TH * 0.5);       // it turns on its bottom front edge
  vec3 lo = vec3(o.x, o.y * ca + o.z * sa, -o.y * sa + o.z * ca);
  vec3 ld = vec3(rd.x, rd.y * ca + rd.z * sa, -rd.y * sa + rd.z * ca);
  ld += step(abs(ld), vec3(1e-6)) * 1e-6;
  vec3 t0 = (vec3(-W * 0.5, 0.0, -TH) - lo) / ld, t1 = (vec3(W * 0.5, H, 0.0) - lo) / ld;
  vec3 tn = min(t0, t1), tx = max(t0, t1);
  float tN = max(max(tn.x, tn.y), tn.z), tX = min(min(tx.x, tx.y), tx.z);
  if (tN > tX || tN < 0.0) return 1e9;
  vec3 ln = tN == tn.x ? vec3(-sign(ld.x), 0.0, 0.0) : tN == tn.y ? vec3(0.0, -sign(ld.y), 0.0) : vec3(0.0, 0.0, -sign(ld.z));
  face = ln.z < -0.5 ? 1.0 : ln.z > 0.5 ? 2.0 : 0.0;
  n = vec3(ln.x, ln.y * ca - ln.z * sa, ln.y * sa + ln.z * ca);
  return tN;
}
// Only the few cells under the stretch of ray between the tops and the floor need trying
float field(vec3 ro, vec3 rd, out vec3 n, out float face, out vec2 cell) {
  vec3 a = ro + rd * ((H + 0.05 - ro.y) / rd.y), b = ro + rd * (-ro.y / rd.y);
  vec2 lo = floor(min(a.xz, b.xz)) - 1.0;
  float best = 1e9;
  for (int k = 0; k < 15; k++) {
    vec2 c = lo + vec2(float(k / 5), float(k - (k / 5) * 5));
    vec3 nn; float ff;
    float t = domino(ro, rd, c, nn, ff);
    if (t < best) { best = t; n = nn; face = ff; cell = c; }
  }
  return best;
}
float finger(vec3 p) { return smin(rod(p, uTip, uKnuckle, 0.4, 0.44), rod(p, uKnuckle, uWrist, 0.44, 0.52), 0.15); }
// How much of the light reaches a point: blocked hard by dominoes, softly by the finger
float lightAt(vec3 p) {
  vec2 c0 = floor(p.xz);
  vec3 n; float ff, hit = 1e9;
  for (int k = 0; k < 12; k++) hit = min(hit, domino(p, uLight, c0 + vec2(float(k / 4 - 1), float(k - (k / 4) * 4 - 2)), n, ff));
  if (hit < 1e8) return 0.0;
  float res = 1.0, t = 0.05;
  if (finger(p) > 4.0) return 1.0;
  for (int i = 0; i < 20; i++) {
    float d = finger(p + uLight * t);
    res = min(res, 6.0 * d / t);
    t += clamp(d, 0.05, 0.4);
    if (res < 0.01 || t > 6.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

// What the backs paint: one domino is one pixel of a big eye, centred on the middle of the floor
vec3 picture(vec2 c) {
  vec2 e = (c + 0.5) * 1.4;
  float ax = 17.0, ay = 8.5, sx = e.x / ax;
  float lid = abs(e.y) - ay * (1.0 - sx * sx);
  float qx = e.x / (ax + 1.5), fold = -e.y - (ay + 3.4) * (1.0 - qx * qx), crease = abs(fold);
  vec3 ink = vec3(0.07, 0.05, 0.06);
  if (lid > 0.0) {
    if (lid < (e.y < 0.0 ? 1.9 : 1.0) && abs(e.x) < ax + 1.0) return ink;                       // the lids' dark line
    // Lashes: short strokes off the upper lid, raked outward, longer toward the outer corner
    float h = lid - 1.9, sx2 = e.x - sign(e.x) * h * 0.7;
    if (e.y < 0.0 && h < 3.5 + 2.0 * smoothstep(0.0, ax, -e.x) && abs(sx2) < ax - 1.0 && fract(sx2 / 4.6) < 0.3) return ink;
    // A short lower lash or two
    if (e.y > 0.0 && lid < 2.6 && abs(e.x) < ax - 4.0 && fract((e.x - sign(e.x) * lid) / 4.6) < 0.3) return ink;
    // The brow: a thick arch, heavier toward the inside
    float bx = (e.x + 2.0) / (ax + 4.0), brow = -e.y - (ay + 8.0) * (1.0 - 0.55 * bx * bx);
    if (abs(bx) < 1.0 && brow > 0.0 && brow < 3.4 - 1.6 * smoothstep(-0.2, 1.0, -bx)) return ink;
    if (e.y < 0.0 && crease < 0.55 && abs(e.x) < ax - 3.0) return uBack * 0.55;              // the fold above
    if (e.y < 0.0 && fold < 0.0 && abs(e.x) < ax - 1.0) return mix(uBack, vec3(1.0, 0.85, 0.75), 0.3);  // the lid, catching the light
    if (e.y > 0.0 && abs(lid - 4.0) < 0.6 && abs(e.x) < ax - 6.0) return uBack * 0.72;        // a line under the eye
    return length(e * vec2(0.8, 1.0)) > 26.0 ? uBack * 0.8 : uBack;                              // darker toward the edges
  }
  float r = length(e), a = atan(e.y, e.x);
  if (length(e - vec2(-2.3, -2.3)) < 1.5) return vec3(1.0);                                     // the glint
  if (length(e - vec2(2.6, 2.1)) < 0.9) return vec3(0.85, 0.9, 0.95);                           // and a small one
  if (r < 3.4) return vec3(0.04, 0.035, 0.05);                                                  // pupil
  if (r < 4.6) return mix(uIris, vec3(0.85, 0.6, 0.2), 0.65);                                   // a warm ring round it
  if (r < 6.6) return fract(a * 2.2 + r * 0.15) < 0.45 ? uIris * 0.72 : uIris;                  // streaks in the iris
  if (r < 7.8) return uIris * 0.45;
  if (e.y < 0.0 && lid > -2.0) return vec3(0.74, 0.7, 0.68);                                    // white, shaded under the lid
  if (abs(e.x) > ax - 5.0 && e.x > 0.0 && abs(e.y) < 2.2) return vec3(0.9, 0.55, 0.55);          // pink at the inner corner
  if (e.y > 0.0 && lid > -1.2) return vec3(0.88, 0.7, 0.66);                                    // the wet lower rim
  return vec3(0.95, 0.92, 0.86);
}

// The land: a dark floor, with no edge in sight
vec3 landAt(vec3 g, vec2 s, float shade) { return uFloor * (1.0 - 0.5 * shade); }

void main() {
  vec2 s = (gl_FragCoord.xy / uRes) * 2.0 - 1.0, at = vec2(s.x * uSpan * uRes.x / uRes.y, s.y * uSpan);
  vec3 ro = uTarget + uRight * at.x + uUp * at.y - uFwd * 30.0, rd = uFwd;
  vec3 n; float face; vec2 cell;
  float tHit = field(ro, rd, n, face, cell), tFloor = -ro.y / rd.y;

  // The finger, if it is near
  float tFin = -1.0;
  if (uTip.y < 12.0) {
    float t = (6.0 - ro.y) / rd.y, tEnd = min(tHit, tFloor);
    for (int i = 0; i < 40 && t < tEnd; i++) {
      float d = finger(ro + rd * t);
      if (d < 0.003) { tFin = t; break; }
      t += d;
    }
  }

  vec3 col;
  if (tFin > 0.0) {
    vec3 p = ro + rd * tFin;
    vec2 e = vec2(0.02, -0.02);
    vec3 fn = normalize(e.xyy * finger(p + e.xyy) + e.yyx * finger(p + e.yyx) + e.yxy * finger(p + e.yxy) + e.xxx * finger(p + e.xxx));
    float lit = max(dot(fn, uLight), 0.0) * lightAt(p + fn * 0.05);
    float x = clamp(0.15 + lit * 0.85, 0.0, 1.0) * 3.0;
    col = SKIN[min(int(x) + (fract(x) > dots() ? 1 : 0), 3)];
    if (length(p - uNail) < 0.28) col = mix(col, vec3(1.0, 0.86, 0.82), 0.6);
  } else if (tHit < 1e8) {
    vec3 p = ro + rd * tHit;
    float lit = max(dot(n, uLight), 0.0) * lightAt(p + n * 0.01);
    if (face == 1.0) col = picture(cell) * (lit > 0.35 ? 1.0 : 0.62);
    else {
      // Flat tones by face: tops brightest, fronts next, sides and the foot of each front darker, shadow darker still
      int k = n.y > 0.6 ? 3 : face == 2.0 ? 2 : 1;
      if (p.y < 0.3 && n.y < 0.6) k -= 1;
      if (lit < 0.3) k -= 1;
      vec3 col0 = IVORY[max(k, 0)]; col = col0;
      // Once down, its edges sink into the picture's own shadow, so the backs read as one image
      if (face == 0.0) col = mix(col, picture(cell) * 0.45, step(0.9, tilt(cell)));
    }
  } else {
    vec3 g = ro + rd * tFloor;
    col = landAt(g, s, stepped(1.0 - lightAt(g + vec3(0.0, 0.01, 0.0)), 2.0));
  }
  gl_FragColor = vec4(col, 1.0);
}`;

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas: stage, antialias: false });
renderer.setPixelRatio(1);
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const uniforms = {
  uRes: { value: new THREE.Vector2(1, 1) }, uSpan: { value: 14 }, uT: { value: 0 }, uStart: { value: new THREE.Vector2() },
  uTip: { value: V() }, uKnuckle: { value: V() }, uWrist: { value: V() }, uNail: { value: V() },
  uBack: { value: new THREE.Color() }, uIris: { value: new THREE.Color() }, uFloor: { value: new THREE.Color() },
  uRight: { value: V() }, uUp: { value: V() }, uFwd: { value: V() }, uTarget: { value: V(0, 0.4, 0) }, uLight: { value: V() },
};
const scene = new THREE.Scene(), camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const page = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms, fragmentShader: frag, vertexShader: 'void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }', depthTest: false,
}));
page.frustumCulled = false;
scene.add(page);

let cols = 1, rows = 1, sizedW = -1, sizedH = -1;
function resize() {
  // A hidden pane reports no size; draw for a plausible one until it has one
  const w = innerWidth || 1280, h = innerHeight || 800;
  const scale = Math.max(3, Math.round(Math.min(w * 1.3, h) / 120));
  cols = Math.ceil(w / scale); rows = Math.ceil(h / scale);
  renderer.setSize(cols, rows, false);
  stage.style.width = cols * scale + 'px'; stage.style.height = rows * scale + 'px';
  uniforms.uRes.value.set(cols, rows);
  // A whole number of pixels to a domino, and wide enough that the whole eye fits across
  uniforms.uSpan.value = rows / 2 / clamp(Math.floor(cols / 30), 3, 5);
}

// Dragging only shifts where you watch from; the loop itself answers to nothing
const view = { yaw: 0, pitch: 0.9273 };   // steep enough that each row of dominoes is a whole number of pixels deep
const drag = { down: false, x: 0, y: 0 };
stage.addEventListener('pointerdown', e => { stage.setPointerCapture(e.pointerId); Object.assign(drag, { down: true, x: e.clientX, y: e.clientY }); stage.classList.add('turning'); });
addEventListener('pointermove', e => {
  if (!drag.down) return;
  view.yaw -= (e.clientX - drag.x) * 0.004; view.pitch = clamp(view.pitch + (e.clientY - drag.y) * 0.004, 0.6, 1.3);
  drag.x = e.clientX; drag.y = e.clientY;
});
const release = () => { drag.down = false; stage.classList.remove('turning'); };
addEventListener('pointerup', release);
addEventListener('pointercancel', release);

const EASE = {
  lin: x => x, io: x => x < 0.5 ? 4 * x * x * x : 1 - (2 - 2 * x) ** 3 / 2, in: x => x * x * x, out: x => 1 - (1 - x) ** 3,
};
// A track is a list of [when, pose, how to arrive]; between entries it moves, after the last it stays
function key(track, t) {
  if (t <= track[0][0]) return track[0][1];
  for (let i = 1; i < track.length; i++) if (t < track[i][0]) {
    const [t0, a] = track[i - 1], [t1, b, how = 'io'] = track[i], k = EASE[how]((t - t0) / (t1 - t0));
    return a + (b - a) * k;
  }
  return track[track.length - 1][1];
}

// Everything is a function of the time in the loop and nothing else, so the last frame meets the first
const S = sections({ reach: 0.9, topple: 4.6, stare: 2.3, rise: 2.4, rest: 0.8 });
const P = params({
  back: '#c0302a',     // the colour the backs paint around the eye
  iris: '#3d9ac0',     // the colour of the eye
  floor: '#1c1c24',    // the floor under them
});

// The finger comes in, waits a beat, presses the first domino over, and goes
const REACH = [[0, 0], [0.42, 0.9, 'out'], [0.56, 0.88], [0.7, 1, 'in'], [1.0, 1], [1.7, 0, 'io']];
const UP = V(-0.7, 0.6, -0.3).normalize(), HAND = V(-0.8, 0.5, -0.3).normalize();

function frame(now) {
  if (innerWidth !== sizedW || innerHeight !== sizedH) { sizedW = innerWidth; sizedH = innerHeight; resize(); }
  const t = S.written(now), U = uniforms;
  U.uT.value = t;

  // Where you are looking from
  const pitch = view.pitch, aspect = cols / rows, span = U.uSpan.value;
  const look = yaw => {
    const fwd = V(-Math.sin(yaw) * Math.cos(pitch), -Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
    const right = V(Math.cos(yaw), 0, -Math.sin(yaw));
    return { fwd, right, up: V().crossVectors(right, fwd) };
  };
  // The first domino stands just inside the top left corner of the still view
  const still = look(view.yaw), corner = U.uTarget.value.clone().addScaledVector(still.right, -span * aspect).addScaledVector(still.up, span);
  corner.addScaledVector(still.fwd, -corner.y / still.fwd.y);
  U.uStart.value.set(Math.floor(corner.x) + 5, Math.floor(corner.z) + 4);

  // Held still: any sway would make the rows of dominoes shimmer against the pixels
  const yaw = view.yaw, cam = look(yaw);
  U.uFwd.value.copy(cam.fwd); U.uRight.value.copy(cam.right); U.uUp.value.copy(cam.up);
  // The light stays over your left shoulder
  U.uLight.value.set(Math.sin(yaw) * 0.45, 0.8, Math.cos(yaw) * 0.45).addScaledVector(cam.right, -0.5).normalize();

  // The fingertip rides the back of the first domino while it presses, then lets it go
  const p = clamp((t - T.fall0) / T.fallLen, 0, 1), a = Math.min(T.lean * p * p, 0.55);
  const s0 = U.uStart.value, ht = 0.7, r = 0.41;
  const touch = V(s0.x + 0.5, ht * Math.cos(a) + 0.22 * Math.sin(a), s0.y + 0.5 + 0.11 + ht * Math.sin(a) - 0.22 * Math.cos(a));
  touch.add(V(0, Math.sin(a) * r, -Math.cos(a) * r));
  const tip = touch.addScaledVector(UP, 12 * (1 - key(REACH, t)));
  U.uTip.value.copy(tip);
  U.uKnuckle.value.copy(tip).addScaledVector(UP, 2.2);
  U.uWrist.value.copy(U.uKnuckle.value).addScaledVector(HAND, 2.6);
  U.uNail.value.copy(tip).addScaledVector(UP, 0.3).add(V(0, 0.3, 0.05));

  U.uBack.value.set(P.back); U.uIris.value.set(P.iris); U.uFloor.value.set(P.floor);
  renderer.render(scene, camera);
}
loop(S, frame);
</script>
