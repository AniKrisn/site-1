  fruit: '#5c1c47',          // the colour of the fruit
  beads: [1, 0, 1.6],        // how fat the beads of its skin are
  pour: [1, 0.4, 1.5],       // how much goo comes out of it
  impact: [1, 0, 1.5],       // how hard the arrows knock it about
  orbit: [1, 0, 2],          // how far the view turns over the loop
  jolt: [1, 0, 2],           // how far the view jumps when an arrow is shot
  contrast: [0.55, 0, 1],    // how much bite there is between light and dark
});
// The ooze has to end the loop as it began. So it is never quite gone: it wells out slowly from the crack until the shell shuts,
// stays on the outside, and then dries back very slowly, all through the quiet after and before, to what it was when it last cracked.
// None while it is shut and whole. It wells out while it is open and stays on the outside when it shuts; then each gulp of the
// refilling draws in the ooze from the part it fills, and the last of it thins away with the last gulp.
const OOZE = [[0, 0], [2.8, 0], [6.8, 1, 'io'], [9.3, 1], [9.31, 0]];   // (by then the refilling has long since pushed it all off)
const oozed = t => key(OOZE, t);
const THROUGH = 2.55;        // when the second arrow goes through it

function frame(now) {
  if (innerWidth !== sizedW || innerHeight !== sizedH) { sizedW = innerWidth; sizedH = innerHeight; resize(); }
  // The story runs on written time; whatever carries on through a hold goes by the real loop
  const t = S.written(now), lap = S.round(now), round = lap * Math.PI * 2, U = uniforms;
  const wild = key(WILD, t);

  // Where you are looking from: a slow sway, so it stays a solid thing
  // The view turns gently all through the scene, round one way and back, rising and dipping a little as it goes.
  // Each arrow gives it a small jump further round and up, which eases off again.
  const nudge = at => { const since = t - at; return since > 0 && since < 4 ? (1 - Math.exp(-14 * since)) * Math.exp(-1.3 * since) * (1 - since / 4) : 0; };
  const jumps = nudge(SHOT1[0]) + 2.6 * nudge(SHOT2[0]);   // the second, the one that bursts it, throws the view much further
  // While the goo runs down the view tilts to look over and down at it, sinking only a touch; as the fruit refills it eases back
  const follow = key(FOLLOW, t);
  U.uTarget.value.y = 1 - 0.04 * follow;
  const yaw = 0.3 - 0.2 * P.orbit * Math.cos(round) + 0.07 * P.jolt * jumps + view.yaw;
  const pitch = view.pitch + 0.06 * P.orbit * Math.sin(round + 0.8) + 0.055 * P.jolt * jumps + 0.13 * follow;
  const fwd = U.uFwd.value.set(-Math.sin(yaw) * Math.cos(pitch), -Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
  const right = U.uRight.value.set(Math.cos(yaw), 0, -Math.sin(yaw));
  U.uUp.value.crossVectors(right, fwd);
  // The light stays over your left shoulder
  // (but it does not swing with the slow sway of the view, or every colour on the tree would shift as it turned)
  const still = 0.3 + view.yaw;
  U.uLight.value.set(Math.sin(still) * 0.45 - 0.5 * Math.cos(still), 0.8, Math.cos(still) * 0.45 + 0.5 * Math.sin(still)).normalize();

  // It swings twice a loop. Something inside wriggles now and then. The kick that cracks it rattles it and sets it swinging harder for a while.
  // Nothing shakes it but the arrows. Each one knocks it hard the way the arrow was going: it is flung out on its thread, rattles,
  // and swings back and forth, round and round, until that dies away
  const knock = (at, amp, decay, freq) => { const since = t - at; return since > 0 && since < 5 ? amp * P.impact * Math.exp(-decay * since) * Math.sin(freq * since) * (1 - since / 5) : 0; };
  const kt = t - KICK, kicked = kt > 0 && kt < 2.5 ? 1 - kt / 2.5 : 0;
  const shake = knock(GRAZE, 0.07, 7, 48) + knock(THROUGH, 0.09, 7, 48);
  const swing = 0.36 * P.sway * Math.sin(round * 2) + knock(GRAZE, 0.8, 1.4, 7.5) + knock(THROUGH, 1.05, 1.2, 7.5);
  const swingZ = 0.16 * P.sway * Math.cos(round * 2) + knock(GRAZE, 0.22, 1.4, 6.6) + knock(THROUGH, -0.3, 1.2, 6.6);
  U.uSwing.value.set(swing + shake, swingZ);
  U.uCrack.value = key(CRACK, t);
  U.uOpen.value = key(OPEN, t);
  U.uHeat.value = key(HEAT, t);
  // Once open, the gaps breathe a little so it is not frozen through a hold
  U.uGap.value = 0.33 * (1 + 0.06 * Math.sin(round * 6));
  U.uSlack.value = key(GAP, t);
  U.uOrb.value = 0.15 * Math.max(0, wild);
  // The ribbons drop like a slack spring, bounce on the jolt, and bob a little while they hang
  const j = t - POP, k = t - SHUT;
  const jolt = (j > 0 && j < 3.1 ? 0.5 * Math.exp(-2.5 * j) * Math.sin(j * 13) * (1 - j / 3.1) : 0) - (k > 0 && k < 0.8 ? 0.7 * Math.exp(-4 * k) * Math.sin(k * 15) * (1 - k / 0.8) : 0);
  const drop = key(DROP, t);
  U.uStretch.value = Math.max(0, 0.65 * drop * (1 + 0.05 * Math.sin(round * 6) + 0.25 * jolt));

  // The twig carries the weight. It sags under it; it dips twice a swing, because the thread pulls hardest as the chrysalis
  // passes through the bottom; it is drawn towards whichever side the chrysalis is on; it trembles with the shaking; and
  // the jolt of the opening sets it bouncing until that dies away. The kick from inside bounces it too.
  const bend = 0.16 + 0.03 * (2 * P.sway) ** 2 * Math.cos(round * 4) - 0.18 * swing - 0.5 * shake + 0.06 * jolt
    + 0.09 * kicked * Math.exp(-3 * kt) * Math.sin(kt * 16 + 0.6) + knock(GRAZE, 0.07, 3, 16)
    + PUMPS.reduce((sum, at) => sum + knock(at, 0.018, 9, 26) * Math.max(0, 1 - (t - at) / 0.45), 0);   // each gulp tugs the branch, and is still again before the loop ends
  let x = TWIG[0][0], y = TWIG[0][1], z = TWIG[0][2], c = 1, s = 0;
  U.uTwig.value[0].set(x, y, z);
  for (let i = 0; i < 5; i++) {
    const dx = TWIG[i + 1][0] - TWIG[i][0], dy = TWIG[i + 1][1] - TWIG[i][1];
    c = Math.cos(bend * GIVE[i]); s = Math.sin(bend * GIVE[i]);
    x += dx * c + dy * s; y += dy * c - dx * s; z = TWIG[i + 1][2] - 0.3 * swingZ * GIVE[i];
    U.uTwig.value[i + 1].set(x, y, z);
    if (i === 3) U.uHang.value.set(x - 0.05 * c - 0.03 * s, y - 0.03 * c + 0.05 * s, z);   // the thread is tied just under the last joint but one
  }
  U.uLeaf.value.set(x + 0.13 * c - 0.02 * s, y - 0.02 * c - 0.13 * s, z, bend);

  // The magic: it swells and the lines wind down a few times a loop, and all of it is stronger while things are wild
  const tint = P.fruit;
  U.uFruit.value.set(parseInt(tint.slice(1, 3), 16) / 255, parseInt(tint.slice(3, 5), 16) / 255, parseInt(tint.slice(5, 7), 16) / 255);
  U.uBeads.value = P.beads;
  U.uGrade.value = P.contrast;
  U.uPulse.value = 0.5 + 0.5 * Math.sin(round * 4);
  U.uTurn.value = lap * 2;
  const hex = P.colour;
  U.uGlowCol.value.set(parseInt(hex.slice(1, 3), 16) / 255, parseInt(hex.slice(3, 5), 16) / 255, parseInt(hex.slice(5, 7), 16) / 255);


  // Each arrow flies straight to the trunk, where its tail quivers until it is still; both fade away near the end
  const gone = 1 - clamp((t - GONE[0]) / (GONE[1] - GONE[0]), 0, 1);
  [[SHOT1, A1], [SHOT2, A2]].forEach(([shot, [from, to]], i) => {
    const u = clamp((t - shot[0]) / (shot[1] - shot[0]), 0, 1), since = t - shot[1];
    const quiver = since > 0 && since < 1.5 ? 0.15 * Math.exp(-4 * since) * Math.sin(since * 42) * (1 - since / 1.5) : 0;
    const way = to.map((e, n) => e - from[n]), far = Math.hypot(...way);
    U.uArrowTip.value[i].set(...from.map((s0, n) => s0 + way[n] * u));
    U.uArrowDir.value[i].set(way[0] / far, way[1] / far + quiver, way[2] / far).normalize();
    U.uArrowShow.value.setComponent(i, t < shot[0] ? 0 : gone);
    U.uArrowGoo.value.setComponent(i, clamp((t - [GRAZE, THROUGH][i]) / 1.5, 0, 1));
  });

  U.uMark.value = t > GRAZE && t < 2.75 ? Math.min(1, (t - GRAZE) / 0.9) : 0;   // the wound weeps until the second arrow bursts the fruit open

  // The pour: the goo sags out of the bottom behind a fat front, runs in one stream that thins as the fruit empties, and its tail drops away.
  // The stream is where it leaves, where it has got to, how thick it is, and how fat its front is.
  // Each drip is how low its bead is, how low its rope reaches, how big the bead is, and how thick the rope
  // They keep coming, one every half second, each as big as the flow was when it started: through the fruit's first try at
  // closing, through its shutting, and on into its refilling
  // Nothing fades: a drip's rope necks and snaps, the drop falls clean out of the picture, and what is left of the rope springs
  // back up into the belly it came from.
  U.uBelly.value = key(BELLY, t) * P.pour;
  U.uDollop.value.forEach((d, i) => {
    const turn = (t - POUR[i]) / 1.5, a = (turn - Math.floor(turn)) * 1.5, flow = turn < 0 ? 0 : key(FLOW, t - a);
    const size = (0.022 + 0.042 * flow - 0.005 * i) * P.pour, rope = (0.018 + 0.04 * flow) * P.pour, top = -0.4 - 0.5 * (1 + U.uStretch.value);
    if (flow <= 0) d.set(top, top, 0, 0);
    else if (a < 0.95) { const f = a / 0.95, bead = top - 0.12 - 0.6 * f * f; d.set(bead, bead, size * Math.min(1, a / 0.3), rope * (1 - 0.35 * f)); }
    else { const f = (a - 0.95) / 0.55, back = Math.min(1, f * 2.2); d.set(top - 0.72 - 3 * f * f, top - 0.02 - 0.7 * (1 - back) ** 2, size, rope * 0.65 * Math.sqrt(1 - back)); }
  });
  U.uWell.value = key(WELLING, t) * P.pour;
  U.uLevel.value = key(LEVEL, t);
  U.uPlump.value = key(PLUMP, t);
  U.uInflate.value = key(INFLATE, t);
  U.uPuff.value = key(PUFF, t);

  U.uOoze.value = 0.5 * oozed(t);

  renderer.render(scene, camera);
}
loop(S, frame);
</script>
