<meta charset="utf-8">
<title>Low tide</title>
<style>
  /* Layout: the whole frame is the harbour, drawn in chunky pixels */
  :root { --bg: #2a2540; color-scheme: dark; }
  html, body { height: 100%; }
  body { background: var(--bg); overflow: hidden; }

</style>

<canvas id="stage" aria-label="A harbour at dusk. The tide runs out fast, the boats settle on the bottom, and under the water is a drowned town with its street lights still on, a church spire and a bus. Then the sea comes back in and the harbour looks ordinary again."></canvas>

<script type="module">
import * as THREE from 'three';
import { params, loop, sections } from 'scene';

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

// Nothing here is a mesh: every pixel walks a ray to a shape described by distance
const frag = /* glsl */`
precision highp float;
uniform vec2 uRes;
uniform vec3 uRight, uUp, uFwd, uTarget, uLight, uLamp;
uniform float uSpan, uLevel, uPhase, uGlow, uWaves;
uniform vec4 uBoat[3];   // where each boat is, and how far it has keeled over
const float BAYER[16] = float[16](0.0, 8.0, 2.0, 10.0, 12.0, 4.0, 14.0, 6.0, 3.0, 11.0, 1.0, 9.0, 15.0, 7.0, 13.0, 5.0);

const float D = 0.7;           // how deep the harbour is, down to the drowned streets
const float QUAY = -1.0;       // the face of the harbour wall
const float QUAY_TOP = 0.16;
const float BACK = -1.78;      // where the quay ends and the sky begins
const float CELL = 0.5;        // one house plot in the drowned town

const vec3 WATER[4] = vec3[4](vec3(0.11, 0.12, 0.26), vec3(0.19, 0.19, 0.37), vec3(0.33, 0.28, 0.48), vec3(0.56, 0.42, 0.55));
const vec3 GLINT = vec3(0.98, 0.72, 0.52);
const vec3 FOAM = vec3(0.78, 0.74, 0.84);
const vec3 SKY[4] = vec3[4](vec3(0.98, 0.68, 0.46), vec3(0.82, 0.47, 0.52), vec3(0.45, 0.3, 0.5), vec3(0.2, 0.17, 0.36));   // low on the picture to high
const vec3 HULL[3] = vec3[3](vec3(0.86, 0.84, 0.78), vec3(0.78, 0.27, 0.22), vec3(0.26, 0.44, 0.68));
const float BOAT_YAW[3] = float[3](0.35, -0.6, 0.05);

float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float h21(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec3 x) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x), mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x), mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
float box(vec3 p, vec3 b) { vec3 q = abs(p) - b; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0); }
float egg(vec3 p, vec3 c, vec3 r) { vec3 q = (p - c) / r; float k0 = length(q), k1 = length(q / r); return k0 * (k0 - 1.0) / max(k1, 1e-4); }
float rod(vec3 p, vec3 a, vec3 b, float ra, float rb) {
  vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h) - mix(ra, rb, h);
}

// The thing: a drowned town under the harbour, the harbour wall and its houses, and the boats
// A house standing on y = 0: walls, and a pitched roof whose ridge runs along x. y says whether it is roof.
vec2 house(vec3 p, vec2 b, float h, float r) {
  float walls = box(p - vec3(0.0, h * 0.5, 0.0), vec3(b.x, h * 0.5, b.y));
  float bz = b.y + 0.03;
  float slope = (abs(p.z) * r + (p.y - h - r) * bz) / length(vec2(r, bz));
  float roof = max(max(slope, h - 0.01 - p.y), abs(p.x) - b.x - 0.02);
  return vec2(min(walls, roof), roof < walls ? 1.0 : 0.0);
}
// Rows of houses on a grid, with the main street, two cross streets and the quayside left open
bool isStreet(vec2 c) { return c.y == 1.0 || c.x == 1.0 || c.x == -4.0 || c.y < -1.0 || c.y > 3.0 || (c.x == -2.0 && c.y < 1.0); }
vec2 town(vec3 p) {
  vec2 c = floor(p.xz / CELL + 0.5), l = p.xz - c * CELL;
  float d = CELL * 0.5 - max(abs(l.x), abs(l.y)) + 0.02, roof = 0.0;   // never step past the next plot
  if (!isStreet(c)) {
    float a = h21(c), b = h21(c + 7.3);
    vec3 q = vec3(l.x, p.y + D, l.y);
    vec2 hb = vec2(0.16 + 0.04 * a, 0.15 + 0.04 * b);
    float h = 0.14 + 0.13 * fract(a * 7.1), r = 0.07 + 0.04 * b;
    vec2 hs = fract(a * 13.7) > 0.5 ? house(q, hb, h, r) : house(q.zyx, hb.yx, h, r);
    if (hs.x < d) { d = hs.x; roof = hs.y; }
  }
  return vec2(max(d, p.y + D - 0.48), roof);
}
// The church: a nave, and a tower with a spire that nearly reaches the surface
vec3 toTower(vec3 p) { return vec3(p.x + 1.0, p.y + D, p.z - 0.08); }
vec2 church(vec3 p) {
  vec3 q = vec3(p.x + 1.0, p.y + D, p.z + 0.3);
  vec2 nave = house(q.zyx, vec2(0.3, 0.16), 0.2, 0.12);
  vec3 t = toTower(p);
  float tower = box(t - vec3(0.0, 0.2, 0.0), vec3(0.085, 0.2, 0.085));
  float sy = (t.y - 0.4) / 0.32;
  float spire = max(max(max(abs(t.x), abs(t.z)) - 0.095 * (1.0 - sy), 0.4 - t.y), t.y - 0.72) * 0.85;
  float d = min(nave.x, min(tower, spire));
  return vec2(d, spire < min(tower, nave.x) ? 2.0 : (nave.y > 0.5 && nave.x < tower) ? 1.0 : 0.0);
}
// Street lamps along both kerbs of the main street; x is the posts, y the lamps
vec2 lamps(vec3 p) {
  float y = p.y + D;
  vec3 n = vec3(p.x - 0.5 - floor(p.x), y, p.z - 0.29), s = vec3(p.x - floor(p.x + 0.5), y, p.z - 0.71);
  vec3 top = vec3(0.0, 0.185, 0.0);
  float post = min(rod(n, vec3(0.0), top, 0.014, 0.01), rod(s, vec3(0.0), top, 0.014, 0.01));
  return vec2(post, min(length(n - top), length(s - top)) - 0.03);
}
// The bus, parked a little askew on the main street
vec3 toBus(vec3 p) { vec3 q = p - vec3(1.25, -D, 0.55); float c = cos(0.12), s = sin(0.12); return vec3(c * q.x + s * q.z, q.y, -s * q.x + c * q.z); }
float bus(vec3 p) {
  vec3 q = toBus(p);
  float b = box(q - vec3(0.0, 0.085, 0.0), vec3(0.165, 0.048, 0.05)) - 0.016;
  return min(b, length(vec3(abs(q.x) - 0.1, q.y - 0.028, abs(q.z) - 0.055)) - 0.027);
}
// The harbour wall, and a terrace of houses along the quay; y is 0 for the wall, 1 for house walls, 2 for their roofs
vec2 quay(vec3 p) {
  float d = box(p - vec3(0.0, (QUAY_TOP - D - 0.1) * 0.5, (QUAY + BACK) * 0.5), vec3(50.0, (QUAY_TOP + D + 0.1) * 0.5, (QUAY - BACK) * 0.5)), m = 0.0;
  float cx = floor(p.x / 0.42 + 0.5), a = h21(vec2(cx, 3.0));
  vec3 q = vec3(p.x - cx * 0.42, p.y - QUAY_TOP, p.z + 1.52);
  float h = 0.14 + 0.1 * a;
  vec2 hs = fract(a * 5.3) > 0.6 ? house(q.zyx, vec2(0.22, 0.2), h, 0.12) : house(q, vec2(0.21, 0.22), h, 0.09);
  float hd = max(min(hs.x, 0.21 - abs(q.x) + 0.02), q.y - 0.45);
  if (hd < d) { d = hd; m = 1.0 + hs.y; }
  return vec2(d, m);
}
// A boat in its own space: along x, keeled over by w
vec3 toBoat(vec3 p, int i) {
  vec3 q = p - uBoat[i].xyz;
  float c = cos(BOAT_YAW[i]), s = sin(BOAT_YAW[i]);
  q.xz = vec2(c * q.x + s * q.z, -s * q.x + c * q.z);
  float rc = cos(uBoat[i].w), rs = sin(uBoat[i].w);
  return vec3(q.x, rc * q.y + rs * q.z, -rs * q.y + rc * q.z);
}
float boat(vec3 q, int i) {
  float taper = 1.0 - 0.45 * smoothstep(0.0, 0.17, q.x);   // a pointed bow
  float d = max(egg(vec3(q.x, q.y, q.z / taper), vec3(0.0), vec3(0.17, 0.075, 0.062)) * taper, q.y - 0.03) * 0.9;
  if (i == 0) d = min(d, box(q - vec3(-0.03, 0.065, 0.0), vec3(0.05, 0.035, 0.038)) - 0.005);
  if (i == 1) d = min(d, rod(q, vec3(0.02, 0.0, 0.0), vec3(0.02, 0.3, 0.0), 0.012, 0.009));
  if (i == 2) d = min(d, box(q - vec3(0.04, 0.05, 0.0), vec3(0.035, 0.025, 0.035)) - 0.004);
  return d;
}

float MAT;   // what map() last found nearest
float map(vec3 p) {
  float d = max(p.y + D, BACK - p.z); MAT = 0.0;
  vec2 t = town(p); if (t.x < d) { d = t.x; MAT = 1.0 + t.y; }
  vec2 c = church(p); if (c.x < d) { d = c.x; MAT = c.y > 1.5 ? 4.5 : 3.0 + c.y; }
  vec2 l = lamps(p); if (l.x < d) { d = l.x; MAT = 5.0; } if (l.y < d) { d = l.y; MAT = 6.0; }
  float b = bus(p); if (b < d) { d = b; MAT = 7.0; }
  vec2 q = quay(p); if (q.x < d) { d = q.x; MAT = 8.0 + q.y; }
  for (int i = 0; i < 3; i++) { float k = boat(toBoat(p, i), i); if (k < d) { d = k; MAT = 11.0 + float(i); } }
  return d;
}
vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.005, -0.005);
  return normalize(e.xyy * map(p + e.xyy) + e.yyx * map(p + e.yyx) + e.yxy * map(p + e.yxy) + e.xxx * map(p + e.xxx));
}
// How much of the light reaches a point, soft at the edges
float lightAt(vec3 ro) {
  float res = 1.0, t = 0.02;
  for (int i = 0; i < 20; i++) {
    float d = map(ro + uLight * t);
    res = min(res, 7.0 * d / t);
    t += clamp(d, 0.02, 0.12);
    if (res < 0.01 || t > 1.4) break;
  }
  return clamp(res, 0.0, 1.0);
}
// Steps between neighbouring tones in a fixed pattern, so shading is dots, not blends
float dots() { ivec2 c = ivec2(gl_FragCoord.xy) & 3; return (BAYER[c.y * 4 + c.x] + 0.5) / 16.0; }
float stepped(float t, float steps) { float x = clamp(t, 0.0, 1.0) * steps; return min(floor(x) + (fract(x) > dots() ? 1.0 : 0.0), steps) / steps; }
float banded(float t, float steps) { float x = clamp(t, 0.0, 1.0) * steps, f = fract(x); return min(floor(x) + (smoothstep(0.32, 0.68, f) > dots() ? 1.0 : 0.0), steps) / steps; }
// Any colour in four steps, cool in shadow and warm in the light
vec3 ramp(vec3 base, float t) { return base * mix(vec3(0.4, 0.42, 0.62), vec3(1.15, 1.08, 1.0), banded(t, 3.0)); }

vec3 thingAt(vec3 p, vec3 n) {
  map(p); float m = MAT;
  float lit = max(dot(n, uLight), 0.0) * lightAt(p + n * 0.012);
  float nook = clamp(0.5 + 0.5 * map(p + n * 0.05) / 0.05, 0.0, 1.0);
  float tone = (lit * 0.7 + (0.5 + 0.5 * n.y) * 0.4) * (0.7 + 0.3 * nook);
  float bed = p.y + D, side = 1.0 - abs(n.y);
  vec3 base = vec3(0.5);
  if (m < 0.5) {            // the old streets, silted over, with the line still down the middle
    base = mix(vec3(0.34, 0.36, 0.4), vec3(0.3, 0.37, 0.32), step(0.62, noise(p * 6.0)));
    if (abs(p.z - 0.5) < 0.024 && fract(p.x * 2.0) < 0.5) base = vec3(0.74, 0.72, 0.6);
  } else if (m < 1.5) {     // drowned house walls and their windows, a few still lit
    vec2 c = floor(p.xz / CELL + 0.5), l = p.xz - c * CELL; float a = h21(c);
    base = a < 0.33 ? vec3(0.56, 0.6, 0.62) : a < 0.66 ? vec3(0.64, 0.56, 0.5) : vec3(0.5, 0.58, 0.56);
    float along = abs(n.x) > 0.5 ? l.y : l.x;
    if (side > 0.5 && abs(abs(along) - 0.075) < 0.028 && (abs(bed - 0.085) < 0.024 || abs(bed - 0.19) < 0.024)) {
      if (h21(c + vec2(sign(along), floor(bed * 8.0)) + n.xz) > 0.86) return uLamp;
      base = vec3(0.13, 0.15, 0.22);
    }
  } else if (m < 2.5) {     // their roofs, slate or tile
    vec2 c = floor(p.xz / CELL + 0.5);
    base = h21(c + 2.1) > 0.5 ? vec3(0.34, 0.35, 0.45) : vec3(0.56, 0.4, 0.36);
  } else if (m < 3.5) {     // church stone, with the belfry open
    vec3 t = toTower(p);
    base = vec3(0.64, 0.62, 0.58);
    if (side > 0.5 && abs(t.y - 0.33) < 0.035 && min(abs(t.x), abs(t.z)) < 0.03 && max(abs(t.x), abs(t.z)) < 0.1) base = vec3(0.1, 0.1, 0.16);
  } else if (m < 4.25) base = vec3(0.32, 0.34, 0.44);
  else if (m < 4.75) base = vec3(0.46, 0.68, 0.58);   // the copper spire, gone green
  else if (m < 5.5) base = vec3(0.16, 0.16, 0.2);
  else if (m < 6.5) return mix(uLamp, vec3(1.0), 0.35 * step(0.6, n.y));
  else if (m < 7.5) {       // the bus: red, a cream band, dark windows, headlights on
    vec3 q = toBus(p);
    base = q.y > 0.1 ? vec3(0.82, 0.78, 0.66) : vec3(0.7, 0.2, 0.18);
    if (q.y > 0.085 && q.y < 0.125 && side > 0.5 && fract(q.x * 14.0) > 0.25) base = vec3(0.1, 0.12, 0.17);
    if (q.y < 0.04) base = vec3(0.1, 0.1, 0.12);
    if (q.x > 0.17 && abs(q.y - 0.06) < 0.016 && abs(abs(q.z) - 0.038) < 0.016) return uLamp;
  } else if (m < 8.5) {     // the harbour wall: dry stone above the tideline, wet and weedy below
    base = vec3(0.58, 0.5, 0.52);
    if (p.y < 0.0) base = p.y > -0.06 ? vec3(0.32, 0.4, 0.28) : vec3(0.42, 0.46, 0.46);
    float course = fract(p.y / 0.1), joint = fract(p.x / 0.24 + 0.5 * floor(p.y / 0.1));
    if (side > 0.5 && (course < 0.14 || joint < 0.06)) base *= 0.8;
  } else if (m < 9.5) {     // the quay houses: plaster, and windows lit for the evening
    float cx = floor(p.x / 0.42 + 0.5), a = h21(vec2(cx, 3.0)), lx = p.x - cx * 0.42, y = p.y - QUAY_TOP;
    base = a < 0.25 ? vec3(0.88, 0.78, 0.64) : a < 0.5 ? vec3(0.76, 0.54, 0.5) : a < 0.75 ? vec3(0.58, 0.64, 0.74) : vec3(0.86, 0.84, 0.76);
    if (n.z > 0.5 && abs(abs(lx) - 0.09) < 0.028 && (abs(y - 0.07) < 0.026 || (abs(y - 0.15) < 0.024 && a > 0.4))) {
      if (h21(vec2(cx * 2.0 + sign(lx), floor(y / 0.11))) > 0.4) return uLamp * 0.95;
      base = vec3(0.16, 0.17, 0.27);
    }
  } else if (m < 10.5) {
    float cx = floor(p.x / 0.42 + 0.5);
    base = h21(vec2(cx, 9.0)) > 0.5 ? vec3(0.4, 0.32, 0.4) : vec3(0.62, 0.36, 0.3);
  } else {                  // a boat: painted hull, a dark stripe, a wooden deck
    int i = int(m - 10.5);
    vec3 q = toBoat(p, i);
    base = HULL[i];
    if (abs(q.y - 0.008) < 0.009) base = vec3(0.14, 0.14, 0.2);
    if (q.y > 0.026) base = vec3(0.5, 0.38, 0.3);
    if (q.y > 0.04) base = i == 1 ? vec3(0.2, 0.18, 0.2) : vec3(0.88, 0.86, 0.82);
  }
  vec3 col = ramp(base, tone);
  // Light pooled round the drowned lamps
  float g = clamp(1.0 - (lamps(p).y + 0.03) / (0.3 * uGlow + 1e-3), 0.0, 1.0);
  return mix(col, col * 0.4 + uLamp * (0.45 + 0.4 * tone), stepped(g * g, 2.0) * 0.8);
}

// The harbour water: ripples that drift in, and race out while the tide runs; lit windows wobble in it
vec3 waterAt(vec3 g) {
  float ripple = sin(g.z * 16.0 + uPhase + 6.0 * noise(vec3(g.x * 3.0, g.z * 6.0, 1.0)));
  float tone = 0.3 + 0.32 * smoothstep(1.8, -1.0, g.z) + ripple * 0.13 * uWaves;
  vec3 col = WATER[int(banded(tone, 3.0) * 3.0 + 0.5)];

  if (abs(abs(lx) - 0.09) < 0.022 && h21(vec2(cx * 2.0 + sign(lx), 0.0)) > 0.4 && near * (0.6 + 0.4 * ripple) > dots()) col = mix(col, uLamp, 0.8);
  if (ripple * uWaves > 0.97 && noise(vec3(g.x * 9.0, g.z * 20.0, 3.0)) > 0.72) col = GLINT;
  return col;
}

// Beyond: the dusk sky over the rooftops, and a thin moon
vec3 skyAt(vec2 s, vec2 at) {
  vec3 col = SKY[int(banded(clamp((s.y - 0.4) / 0.6, 0.0, 1.0), 3.0) * 3.0 + 0.5)];
  vec2 m = at - vec2(-1.2, uSpan * 0.86);
  if (length(m) < 0.075 && length(m - vec2(0.03, 0.02)) > 0.065) col = vec3(1.0, 0.95, 0.82);
  return col;
}

void main() {
  vec2 s = (gl_FragCoord.xy / uRes) * 2.0 - 1.0, at = vec2(s.x * uSpan * uRes.x / uRes.y, s.y * uSpan);
  vec3 ro = uTarget + uRight * at.x + uUp * at.y - uFwd * 6.0, rd = uFwd;
  float t = max(0.0, (0.95 - ro.y) / rd.y), tEnd = (-D - 0.03 - ro.y) / rd.y, tHit = -1.0;
  for (int i = 0; i < 180 && t < tEnd; i++) {
    float d = map(ro + rd * t);
    if (d < 0.0015) { tHit = t; break; }
    t += d * 0.85;
  }
  float tW = (uLevel - ro.y) / rd.y;
  vec3 g = ro + rd * tW, col;
  if (g.z > QUAY && (tHit < 0.0 || tW < tHit)) {
    col = waterAt(g);
    if (tHit > 0.0) {
      // Just under the surface things show through, and the lamps shine up from deeper
      vec3 p = ro + rd * tHit; float under = uLevel - p.y;
      map(p);
      if (MAT > 5.5 && MAT < 6.5) { if (1.0 - under / 0.45 > dots()) col = mix(col, uLamp, 0.6); }
      else if (1.0 - under / 0.14 > dots()) col = mix(thingAt(p, normalAt(p)), WATER[0], 0.45);
    }

  } else if (tHit > 0.0) {
    vec3 p = ro + rd * tHit;
    col = thingAt(p, normalAt(p));

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas: stage, antialias: false });
renderer.setPixelRatio(1);
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const uniforms = {
  uRes: { value: new THREE.Vector2(1, 1) }, uSpan: { value: 1.5 }, uLamp: { value: new THREE.Color() },
  uLevel: { value: 0 }, uPhase: { value: 0 }, uGlow: { value: 1 }, uWaves: { value: 1 },
  uBoat: { value: [new THREE.Vector4(), new THREE.Vector4(), new THREE.Vector4()] },
  uRight: { value: V() }, uUp: { value: V() }, uFwd: { value: V() }, uTarget: { value: V(0, 0, -0.17) }, uLight: { value: V() },
};
const scene = new THREE.Scene(), camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const page = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms, fragmentShader: frag, vertexShader: 'void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }', depthTest: false,
}));
page.frustumCulled = false;
scene.add(page);

let cols = 1, rows = 1, sizedW = -1, sizedH = -1;
function resize() {
  // A hidden pane reports no size; draw for a plausible one until it has one
  const w = innerWidth || 1280, h = innerHeight || 800;
  const scale = Math.max(3, Math.round(Math.min(w * 1.3, h) / 104));
  cols = Math.ceil(w / scale); rows = Math.ceil(h / scale);
  renderer.setSize(cols, rows, false);
  stage.style.width = cols * scale + 'px'; stage.style.height = rows * scale + 'px';
  uniforms.uRes.value.set(cols, rows);
  uniforms.uSpan.value = Math.max(1.5, 1.5 * rows / cols);
}

// Dragging only shifts where you watch from; the loop itself answers to nothing
const view = { yaw: 0, pitch: 0.65 };
const drag = { down: false, x: 0, y: 0 };
stage.addEventListener('pointerdown', e => { stage.setPointerCapture(e.pointerId); Object.assign(drag, { down: true, x: e.clientX, y: e.clientY }); stage.classList.add('turning'); });
addEventListener('pointermove', e => {
  if (!drag.down) return;
  view.yaw -= (e.clientX - drag.x) * 0.008; view.pitch = clamp(view.pitch + (e.clientY - drag.y) * 0.004, 0.3, 0.95);
  drag.x = e.clientX; drag.y = e.clientY;
});
const release = () => { drag.down = false; stage.classList.remove('turning'); };
addEventListener('pointerup', release);
addEventListener('pointercancel', release);

const EASE = {
  lin: x => x, io: x => x < 0.5 ? 4 * x * x * x : 1 - (2 - 2 * x) ** 3 / 2, in: x => x * x * x, out: x => 1 - (1 - x) ** 3,
};
// A track is a list of [when, value, how to arrive]; between entries it moves, after the last it stays
function key(track, t) {
  if (t <= track[0][0]) return track[0][1];
  for (let i = 1; i < track.length; i++) if (t < track[i][0]) {
    const [t0, a] = track[i - 1], [t1, b, how = 'io'] = track[i];
    return a + (b - a) * EASE[how]((t - t0) / (t1 - t0));
  }
  return track[track.length - 1][1];
}

// Everything is a function of the time in the loop and nothing else, so the last frame meets the first
const D = 0.7;
const S = sections({ calm: 0.7, ebb: 2.3, drowned: 3.5, flood: 2.9, ordinary: 1.1 });
// The water level: a small lift, a fast drain to the bottom, a long hold, then back in and a little overshoot
const LEVEL = [[0.7, 0], [1.0, 0.035], [2.8, -D - 0.04], [6.5, -D - 0.04], [8.7, 0.03], [9.4, 0, 'out']];
// Where each boat floats, and which way it keels when it lands
const BOATS = [[0.5, 1.12, 0.3], [-1.8, 0.5, -0.4], [1.9, -0.88, 0.22]];
const P = params({
  lamps: '#ffc46b',     // colour of the drowned street lights and the windows
  glow: [1, 0, 2],      // how far the lamps' light spills
  waves: [1, 0, 2],     // how choppy the harbour is
});

function frame(now) {
  if (innerWidth !== sizedW || innerHeight !== sizedH) { sizedW = innerWidth; sizedH = innerHeight; resize(); }
  const t = S.written(now), round = S.round(now) * Math.PI * 2, U = uniforms;

  // Where you are looking from: a slow sway, so it stays a solid place
  const yaw = 0.06 * Math.sin(round) + view.yaw, pitch = view.pitch;
  const fwd = U.uFwd.value.set(-Math.sin(yaw) * Math.cos(pitch), -Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
  const right = U.uRight.value.set(Math.cos(yaw), 0, -Math.sin(yaw));
  U.uUp.value.crossVectors(right, fwd);
  // The light stays over your left shoulder
  U.uLight.value.set(Math.sin(yaw) * 0.45, 0.7, Math.cos(yaw) * 0.45).addScaledVector(right, -0.5).normalize();

  const level = key(LEVEL, t) + 0.006 * Math.sin(round * 6);
  U.uLevel.value = level;
  U.uPhase.value = round * 4 + level * 40;
  BOATS.forEach(([x, z, keel], i) => {
    const rest = -D + 0.055, aground = clamp((rest - level) / 0.1, 0, 1), afloat = 1 - aground;
    const bob = afloat * 0.006 * Math.sin(round * 3 + i * 2);
    U.uBoat.value[i].set(x, Math.max(level, rest) + bob, z, keel * EASE.out(aground) + afloat * 0.05 * Math.sin(round * 2 + i));
  });
  U.uLamp.value.set(P.lamps);
  U.uGlow.value = P.glow;
  U.uWaves.value = P.waves;

  renderer.render(scene, camera);
}
loop(S, frame);
</script>
</body></html>
