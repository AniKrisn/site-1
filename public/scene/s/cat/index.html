<meta charset="utf-8">
<title>Black Cat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: a white page with one black cat sitting on it. Nothing else. Deliberately light-only. */
  :root { --bg: #ffffff; color-scheme: light; }
  html, body { height: 100%; }
  body { background: var(--bg); overflow: hidden; }
  #stage {
    position: fixed; left: 0; top: 0; display: block;
    image-rendering: pixelated;
    touch-action: none; cursor: grab;
  }
  #stage.turning { cursor: grabbing; }
</style>

<canvas id="stage" aria-label="A scruffy black cat sitting on a white page, tail laid out to one side. It watches the pointer, blinks, and flicks its tail. Drag to turn it; rest the pointer on its head and it shuts its eyes."></canvas>

<script type="module">
import * as THREE from 'three';
import { params, loop } from 'scene';

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v)), lerp = (a, b, t) => a + (b - a) * t;
const toward = (rate, dt) => 1 - Math.exp(-rate * dt);

// The cat is not a mesh: every pixel walks a ray to a shape made of blended blobs, roughened into fur
const frag = /* glsl */`
precision highp float;
uniform vec2 uRes;
uniform vec3 uRight, uUp, uFwd, uTarget, uLight;
uniform float uSpan, uBlink, uBreath;
uniform mat3 uHead;
uniform vec3 uTail[6];
uniform vec2 uEar;
uniform float uEarSize, uRightEar, uTailSize, uBodySize;
uniform vec3 uEyeColour;

// Black, and the few greys the light is allowed to pull out of it
const vec3 FUR[5] = vec3[5](vec3(0.03, 0.028, 0.04), vec3(0.13, 0.115, 0.15), vec3(0.25, 0.21, 0.24), vec3(0.42, 0.34, 0.32), vec3(0.66, 0.56, 0.48));
const vec3 FLOOR[3] = vec3[3](vec3(1.0), vec3(0.85, 0.86, 0.91), vec3(0.66, 0.67, 0.76));
const float BAYER[16] = float[16](0.0, 8.0, 2.0, 10.0, 12.0, 4.0, 14.0, 6.0, 3.0, 11.0, 1.0, 9.0, 15.0, 7.0, 13.0, 5.0);

const vec3 PIVOT = vec3(0.0, 0.7, 0.06);    // where the head turns on the neck
const vec3 EYE = vec3(0.074, 0.858, 0.234);
const float EYE_R = 0.042;
const float BIG = 1.42;                     // how much larger the head is than it was modelled
const float SQUAT = 0.84;                   // and how much shorter the body
const vec3 NECK = vec3(0.0, 0.59, 0.07);    // where that puts the pivot
const vec3 HEART = vec3(0.1, 0.5, -0.1);    // middle of the whole cat, for the ball that bounds it

float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float noise(vec3 x) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x), mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x), mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
float smin(float a, float b, float k) { float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }
float ball(vec3 p, vec3 c, float r) { return length(p - c) - r; }
float egg(vec3 p, vec3 c, vec3 r) { vec3 q = (p - c) / r; float k0 = length(q), k1 = length(q / r); return k0 * (k0 - 1.0) / max(k1, 1e-4); }
float rod(vec3 p, vec3 a, vec3 b, float ra, float rb) {
  vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h) - mix(ra, rb, h);
}

// Clumps and wisps: what makes the outline ragged
float fur(vec3 p) { return (noise(p * vec3(11.0, 6.0, 11.0)) - 0.5) * 0.06 + (noise(p * vec3(21.0, 10.0, 21.0)) - 0.5) * 0.03; }

vec3 toHead(vec3 p) { return uHead * (p - NECK * uBodySize) / BIG + PIVOT; }   // the head rides on the neck wherever the body puts it

// One ear, in a space squashed front to back; x is the ear itself, y the hollow scooped out of its front
vec2 ear(vec3 q, float side) {
  float e = side < 0.0 ? uEar.x : uEar.y;
  vec3 a = vec3(0.09, 0.95, 0.11), b = vec3(0.15 + 0.05 * e, 1.1 - 0.045 * e, 0.09 - 0.03 * e);
  vec3 s = vec3(q.x, q.y, (q.z - 0.1) * 1.8 + 0.1);
  float k = uEarSize * (side < 0.0 ? 1.0 : uRightEar); b = a + (b - a) * k;    // grown or shrunk about its root on the head
  float d = rod(s, a, b, 0.07 * k, 0.022 * k);
  float scoop = rod(s, a + vec3(0.006, 0.022, 0.075) * k, b + vec3(-0.004, -0.03, 0.06) * k, 0.05 * k, 0.004 * k);
  return vec2(max(d, -scoop), scoop) / 1.8;
}
// q is in the head's own space, folded so one side does for both
float headPart(vec3 hq) {
  vec3 q = vec3(abs(hq.x), hq.yz);
  float d = egg(q, vec3(0.0, 0.86, 0.13), vec3(0.165, 0.14, 0.15));
  d = smin(d, ball(q, vec3(0.095, 0.815, 0.16), 0.082), 0.04);                       // jowls
  d = smin(d, egg(q, vec3(0.0, 0.812, 0.25), vec3(0.07, 0.05, 0.055)), 0.03);        // muzzle
  float tufts = fur(hq);
  d -= tufts * 0.45 * smoothstep(0.042, 0.1, length(q - EYE));                      // otherwise fur grows over the eyes
  return smin(d, ear(q, hq.x).x - tufts * 0.22, 0.025);
}
float bodyPart(vec3 p) {
  vec3 q = vec3(abs(p.x), p.yz);
  float d = egg(q, vec3(0.0, 0.27, -0.2), vec3(0.3, 0.28, 0.34));                                        // rump
  d = smin(d, egg(q, vec3(0.21, 0.2, -0.1), vec3(0.14, 0.21, 0.22)), 0.06);                               // haunches
  d = smin(d, rod(q, vec3(0.0, 0.3, -0.14), vec3(0.0, 0.6, 0.07), 0.21 + uBreath, 0.17 + uBreath), 0.08); // back and belly
  d = smin(d, ball(q, vec3(0.0, 0.6, 0.14), 0.15), 0.06);                                                // ruff
  d = smin(d, rod(q, vec3(0.0, 0.6, 0.06), vec3(0.0, 0.78, 0.11), 0.155, 0.14), 0.06);                   // neck
  d = smin(d, rod(q, vec3(0.085, 0.45, 0.13), vec3(0.09, 0.07, 0.2), 0.058, 0.048), 0.04);                // forelegs
  d = smin(d, egg(q, vec3(0.09, 0.035, 0.235), vec3(0.058, 0.042, 0.078)), 0.03);                         // and their paws
  d = smin(d, egg(q, vec3(0.2, 0.035, 0.1), vec3(0.06, 0.042, 0.11)), 0.04);                              // hind feet
  float tail = 1e3;
  for (int i = 0; i < 5; i++) tail = min(tail, rod(p, uTail[i], uTail[i + 1], (0.058 - 0.003 * float(i)) * uTailSize, (0.055 - 0.003 * float(i)) * uTailSize));
  return smin(d, tail, 0.05) - fur(p);
}
float body(vec3 p) { vec3 b = p / uBodySize; return bodyPart(vec3(b.x, b.y / SQUAT, b.z)) * SQUAT * uBodySize; }   // grown about its feet
float map(vec3 p) {
  vec3 hq = toHead(p), q = vec3(abs(hq.x), hq.yz);
  float d = smin(body(p), headPart(hq) * BIG, 0.05);
  return min(d, ball(q, EYE, EYE_R) * BIG);
}

vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.014, -0.014);
  return normalize(e.xyy * map(p + e.xyy) + e.yyx * map(p + e.yyx) + e.yxy * map(p + e.yxy) + e.xxx * map(p + e.xxx));
}
// How much of the lamp reaches a point, soft at the edges
float lampAt(vec3 ro) {
  float res = 1.0, t = 0.03;
  for (int i = 0; i < 22; i++) {
    float d = map(ro + uLight * t);
    res = min(res, 9.0 * d / t);
    t += clamp(d, 0.02, 0.12);
    if (res < 0.01 || t > 1.7) break;
  }
  return clamp(res, 0.0, 1.0);
}
// Steps between neighbouring tones in a fixed pattern, so shading is dots, not blends
float dots() { ivec2 c = ivec2(gl_FragCoord.xy) & 3; return (BAYER[c.y * 4 + c.x] + 0.5) / 16.0; }
vec3 furTone(float t) { float x = clamp(t, 0.0, 1.0) * 4.0; return FUR[min(int(x) + (fract(x) > dots() ? 1 : 0), 4)]; }
vec3 floorTone(float t) { float x = clamp(t, 0.0, 1.0) * 2.0; return FLOOR[min(int(x) + (fract(x) > dots() ? 1 : 0), 2)]; }

vec3 eyeColour(vec3 hq) {
  float side = sign(hq.x);
  vec2 uv = vec2(hq.x - side * EYE.x, hq.y - EYE.y) / EYE_R;
  // Lids: the eye is an almond, higher at the outer corner, and it shuts from the top
  float v = uv.y - 0.22 * uv.x * side, wide = 1.0 - uBlink;
  if (v > mix(-0.55, 0.85, wide) || v < -0.85 + 0.25 * uBlink) return FUR[0];
  return uEyeColour;
}

void main() {
  vec2 s = (gl_FragCoord.xy / uRes) * 2.0 - 1.0;
  vec3 ro = uTarget + uRight * s.x * uSpan * uRes.x / uRes.y + uUp * s.y * uSpan - uFwd * 4.0, rd = uFwd;
  vec3 col = vec3(1.0);

  // Only rays that pass near the cat need walking
  float reach = (0.95 + 0.55 * max(uTailSize - 1.0, 0.0)) * max(uBodySize, 1.0);   // a longer tail or bigger body needs a bigger ball
  vec3 oc = ro - HEART * uBodySize; float b = dot(oc, rd), c = dot(oc, oc) - reach * reach, disc = b * b - c;
  float tFloor = -ro.y / rd.y, tHit = -1.0;
  if (disc > 0.0) {
    float t = -b - sqrt(disc), tEnd = min(-b + sqrt(disc), tFloor);
    for (int i = 0; i < 96 && t < tEnd; i++) {
      float d = map(ro + rd * t);
      if (d < 0.002) { tHit = t; break; }
      t += d * 0.6;   // fur is too bumpy to trust a full step
    }
  }

  if (tHit > 0.0) {
    vec3 p = ro + rd * tHit, n = normalAt(p), hq = toHead(p), q = vec3(abs(hq.x), hq.yz);
    if (ball(q, EYE, EYE_R) < 0.004) col = eyeColour(hq);
    else {
      float head = smoothstep(0.03, -0.03, headPart(hq) * BIG - body(p));
      vec3 lp = head > 0.5 ? hq : p;
      float lamp = lampAt(p + n * 0.02);
      float lit = max(dot(n, uLight), 0.0) * lamp;
      float sheen = pow(1.0 - max(dot(n, -uFwd), 0.0), 2.5) * clamp(0.5 + dot(n, uLight), 0.0, 1.0);
      float nook = clamp(0.5 + 0.5 * map(p + n * 0.07) / 0.07, 0.0, 1.0);
      float tone = lit * 0.5 + sheen * 0.4 + (noise(lp * 16.0) - 0.5) * 0.1;
      col = furTone(tone * nook);
          }
  } else if (tFloor > 0.0) {
    // The page under it: only a shadow, fading to nothing
    vec3 g = ro + rd * tFloor;
    float near = 1.0 - smoothstep(0.7, 1.45, length(g.xz - HEART.xz * uBodySize) / max(uBodySize, 1.0));
    if (near > 0.0) {
      float under = 1.0 - clamp(map(g) / 0.16, 0.0, 1.0);
      col = floorTone(near * ((1.0 - lampAt(g + vec3(0.0, 0.012, 0.0))) * 0.42 + under * under * 0.5));
    }
  }
  gl_FragColor = vec4(col, 1.0);
}`;

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas: stage, antialias: false });
renderer.setPixelRatio(1);
const uniforms = {
  uRes: { value: new THREE.Vector2(1, 1) }, uSpan: { value: 1.7 },
  uRight: { value: new THREE.Vector3() }, uUp: { value: new THREE.Vector3() }, uFwd: { value: new THREE.Vector3() },
  uTarget: { value: new THREE.Vector3(0.1, 0.42, -0.1) }, uLight: { value: new THREE.Vector3() },
  uHead: { value: new THREE.Matrix3() }, uTail: { value: [] }, uEar: { value: new THREE.Vector2() },
  uBlink: { value: 0 }, uBreath: { value: 0 }, uEarSize: { value: 1 }, uRightEar: { value: 1 }, uTailSize: { value: 1 }, uBodySize: { value: 1 }, uEyeColour: { value: new THREE.Color() },
};
// The tail at rest: out behind, then round to one side along the floor
const TAIL = [[0, 0.1, -0.42], [0.2, 0.07, -0.56], [0.42, 0.06, -0.47], [0.56, 0.06, -0.27], [0.62, 0.06, -0.04], [0.6, 0.07, 0.18]];
uniforms.uTail.value = TAIL.map(p => new THREE.Vector3(...p));
const scene = new THREE.Scene(), camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const page = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms, fragmentShader: frag, vertexShader: 'void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }', depthTest: false,
}));
page.frustumCulled = false;
scene.add(page);

let cols = 1, rows = 1, sizedW = -1, sizedH = -1;
function resize() {
  // A hidden pane reports no size; draw for a plausible one until it has one
  const w = innerWidth || 1280, h = innerHeight || 800;
  const scale = Math.max(3, Math.round(Math.min(w * 1.3, h) / 104));
  cols = Math.ceil(w / scale); rows = Math.ceil(h / scale);
  renderer.setSize(cols, rows, false);
  stage.style.width = cols * scale + 'px'; stage.style.height = rows * scale + 'px';
  uniforms.uRes.value.set(cols, rows);
  // Tall windows are fitted by width, so the tail stays in
  uniforms.uSpan.value = Math.max(1.7, 1.45 * rows / cols);
}

const view = { yaw: 0.5, pitch: 0.22, spin: 0 };
const pointer = { x: 0, y: 0, cx: 0, cy: 0, active: false, down: false, stir: 0 };
const cat = { yaw: 0, pitch: 0, roll: 0, purr: 0, excite: 0, blinkAt: 2.5, blinkFor: 0.16, flickAt: 3, earAt: 4, earSide: 0 };
const PIVOT = new THREE.Vector3(0, 0.59, 0.07), crown = new THREE.Vector3(), turn = new THREE.Matrix4();
const bump = (now, at, len) => now > at && now < at + len ? Math.sin((now - at) / len * Math.PI) : 0;

function track(e) {
  const dx = e.clientX - pointer.cx, dy = e.clientY - pointer.cy;
  if (pointer.active) pointer.stir += Math.hypot(dx, dy) / Math.min(innerWidth, innerHeight);
  if (pointer.down) {
    view.yaw -= dx * 0.008; view.spin = -dx * 0.4;
    view.pitch = clamp(view.pitch + dy * 0.004, 0.08, 0.75);
  }
  Object.assign(pointer, { cx: e.clientX, cy: e.clientY, x: e.clientX / innerWidth * 2 - 1, y: 1 - e.clientY / innerHeight * 2, active: true });
}
stage.addEventListener('pointerdown', e => { stage.setPointerCapture(e.pointerId); pointer.active = false; track(e); pointer.down = true; view.spin = 0; stage.classList.add('turning'); });
addEventListener('pointermove', track);
const release = e => { pointer.down = false; stage.classList.remove('turning'); if (e.pointerType === 'touch') pointer.active = false; };
addEventListener('pointerup', release);
addEventListener('pointercancel', release);
document.documentElement.addEventListener('pointerleave', () => { pointer.active = false; });

// Knobs the host can turn while it plays
const P = params({ turn: [0.3, 0, 1.5], earSize: [1, 0.5, 1.6], eyeColour: '#d1d64d', rightEar: [1, 0.5, 1.6], tailSize: [1, 0.5, 1.6], bodySize: [1, 0.6, 1.4] });   // how fast the turntable goes round; how big the ears are; what colour the eyes are; the ear on the right as you face it, against the other; how long and thick the tail is; how big the body is under the same head

function frame(now, dt) {
  if (innerWidth !== sizedW || innerHeight !== sizedH) { sizedW = innerWidth; sizedH = innerHeight; resize(); }

  // Where you are looking from
  if (!pointer.down) { view.yaw += (view.spin + (reduceMotion ? 0 : P.turn)) * dt; view.spin *= Math.exp(-4 * dt); }
  const { yaw, pitch } = view, U = uniforms;
  const fwd = U.uFwd.value.set(-Math.sin(yaw) * Math.cos(pitch), -Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
  const right = U.uRight.value.set(Math.cos(yaw), 0, -Math.sin(yaw));
  const up = U.uUp.value.crossVectors(right, fwd);
  // The lamp stays over your left shoulder however the cat is turned
  U.uLight.value.set(Math.sin(yaw) * 0.5, 0.8, Math.cos(yaw) * 0.5).addScaledVector(right, -0.55).normalize();

  // Is the pointer resting on its head?
  const span = U.uSpan.value, aspect = cols / rows;
  U.uBodySize.value = P.bodySize;
  crown.set(0, 0.24, 0.11).applyMatrix4(turn).addScaledVector(PIVOT, P.bodySize).sub(U.uTarget.value);
  const onHead = pointer.active && Math.hypot(pointer.x * span * aspect - crown.dot(right), pointer.y * span - crown.dot(up)) < 0.2;
  cat.purr += ((onHead ? 1 : 0) - cat.purr) * toward(onHead ? 4 : 1.6, dt);
  cat.excite = clamp(cat.excite + pointer.stir * 1.6 - dt * 0.9, 0, 1);
  pointer.stir = 0;

  // It faces you while you are in front of it, and lets you go when you are not
  let round = Math.atan2(Math.sin(yaw), Math.cos(yaw));
  if (Math.abs(round) > 1.5) round = 0;
  const px = pointer.active ? pointer.x : 0, py = pointer.active ? pointer.y : 0;
  const wantYaw = clamp(round + px * 0.45, -1.2, 1.2), wantPitch = clamp(pitch * 0.7 + py * 0.3 + cat.purr * 0.18, -0.35, 0.55);
  cat.yaw += (wantYaw - cat.yaw) * toward(3, dt);
  cat.pitch += (wantPitch - cat.pitch) * toward(6, dt);
  cat.roll += ((onHead ? -pointer.x * 0.25 : cat.yaw * 0.12) - cat.roll) * toward(4, dt);
  turn.makeRotationFromEuler(new THREE.Euler(-cat.pitch, cat.yaw, cat.roll, 'YXZ'));
  U.uHead.value.setFromMatrix4(turn).transpose();

  // Blinks, mostly quick, now and then slow; shut tight while it is being stroked
  if (now > cat.blinkAt + cat.blinkFor) { cat.blinkAt = now + 2.5 + Math.random() * 4; cat.blinkFor = Math.random() < 0.3 ? 1.3 : 0.16; }
  U.uBlink.value = Math.max(Math.min(1, bump(now, cat.blinkAt, cat.blinkFor) * 1.6), cat.purr * 0.8);
  U.uBreath.value = Math.sin(now * 1.8) * 0.006;

  // One ear flicks now and then; both go sideways under a hand
  if (now > cat.earAt + 0.22) { cat.earAt = now + 3 + Math.random() * 6; cat.earSide = Math.random() < 0.5 ? 0 : 1; }
  const flick = bump(now, cat.earAt, 0.22) * 0.8;
  U.uEarSize.value = P.earSize; U.uRightEar.value = P.rightEar;
  U.uEyeColour.value.setStyle(P.eyeColour, THREE.LinearSRGBColorSpace);
  U.uEar.value.set(cat.purr * 0.7 + (cat.earSide ? 0 : flick), cat.purr * 0.7 + (cat.earSide ? flick : 0));

  // Tail: the end of it sways, and thumps, sooner when there is something to watch
  if (now > cat.flickAt + 0.5) cat.flickAt = now + (cat.excite > 0.5 ? 0.3 : 2) + Math.random() * (cat.excite > 0.5 ? 0.6 : 4);
  const lift = bump(now, cat.flickAt, 0.5);
  // Grown about its root, and thicker as it grows, so it still lies on the floor
  const k = P.tailSize, [rx, ry, rz] = TAIL[0];
  U.uTailSize.value = k;
  TAIL.forEach(([x, y, z], i) => {
    const w = (i / 5) ** 2, sway = Math.sin(now * 1.3 + i * 0.5) * 0.05 * w * k;
    U.uTail.value[i].set(rx + (x - rx) * k + sway * 0.6 - lift * 0.05 * w * k, (i ? y * k : ry) + lift * 0.2 * w * k, rz + (z - rz) * k + sway);
  });

  renderer.render(scene, camera);
}
loop(null, frame);
</script>
