<meta charset="utf-8">
<title>Wrong floor</title>
<style>
  /* Layout: the whole window is the inside of a lift, drawn in chunky pixels */
  :root { --bg: #1a1714; color-scheme: light; }
  html, body { height: 100%; }
  body { background: var(--bg); overflow: hidden; }
  #stage { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; }
</style>

<canvas id="stage" aria-label="Inside a lift, facing the doors. Each ding they open on somewhere else: a sea with a whale going past, a desert at noon, a planet in deep space, a forest in snow, and at last a plain office corridor, where it starts again."></canvas>

<script type="module">
import * as THREE from 'three';
import { params, loop, sections } from 'scene';

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

// Nothing here is a mesh: every pixel walks a ray, through the lift and, if the doors are open, out into whatever floor this is
const frag = /* glsl */`
precision highp float;
uniform vec2 uRes;
uniform vec3 uEye, uLift;
uniform float uSpan, uOpen, uWorld, uNum, uArrow, uDing, uT, uSpill;
const float BAYER[16] = float[16](0.0, 8.0, 2.0, 10.0, 12.0, 4.0, 14.0, 6.0, 3.0, 11.0, 1.0, 9.0, 15.0, 7.0, 13.0, 5.0);
const int DIGITS[6] = int[6](31599, 11415, 29671, 29647, 23497, 31183);   // 3 by 5 pixel numbers, top row first

// The lift: a box, its doors in the far wall
const float W = 0.8, H = 1.34, D = 1.4, DW = 0.42, DH = 0.98;

float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float noise(vec3 x) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x), mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x), mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
float smin(float a, float b, float k) { float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }
float ball(vec3 p, vec3 c, float r) { return length(p - c) - r; }
float egg(vec3 p, vec3 c, vec3 r) { vec3 q = (p - c) / r; float k0 = length(q), k1 = length(q / r); return k0 * (k0 - 1.0) / max(k1, 1e-4); }
float rod(vec3 p, vec3 a, vec3 b, float ra, float rb) {
  vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h) - mix(ra, rb, h);
}

// Steps between neighbouring tones in a fixed pattern, so shading is dots, not blends
float dots() { ivec2 c = ivec2(gl_FragCoord.xy) & 3; return (BAYER[c.y * 4 + c.x] + 0.5) / 16.0; }
// Tones in clean bands: flat colour, with dots only in a narrow seam where one band meets the next
float banded(float t, float steps) { float x = clamp(t, 0.0, 1.0) * steps, f = fract(x); return min(floor(x) + (smoothstep(0.32, 0.68, f) > dots() ? 1.0 : 0.0), steps) / steps; }
vec3 ramp3(vec3 a, vec3 b, vec3 c, float t) { float k = banded(t, 2.0) * 2.0; return k < 0.5 ? a : (k < 1.5 ? b : c); }
vec3 ramp4(vec3 a, vec3 b, vec3 c, vec3 d, float t) { float k = banded(t, 3.0) * 3.0; return k < 0.5 ? a : (k < 1.5 ? b : (k < 2.5 ? c : d)); }

// ---------- Beyond: one world per floor, met by the rays that pass the open doors ----------

// The sea: water right up to the sill, and a whale going by
const vec3 SEA_SKY0 = vec3(0.97, 0.95, 0.86), SEA_SKY1 = vec3(0.80, 0.91, 0.94), SEA_SKY2 = vec3(0.60, 0.80, 0.91);
const vec3 SEA0 = vec3(0.05, 0.22, 0.36), SEA1 = vec3(0.10, 0.38, 0.50), SEA2 = vec3(0.24, 0.58, 0.64), SEA3 = vec3(0.60, 0.83, 0.84);
const vec3 WHALE0 = vec3(0.06, 0.08, 0.15), WHALE1 = vec3(0.17, 0.21, 0.33), WHALE2 = vec3(0.35, 0.41, 0.55), WHALE3 = vec3(0.70, 0.78, 0.86);
const float WL = -0.04;    // the water line, just under the lift floor
vec3 whaleAt() { return vec3(-3.0 + 1.2 * (uT - 0.8), WL + 0.05 + 0.03 * sin(uT * 2.0), D + 3.3); }
float whale(vec3 p, vec3 c) {
  vec3 q = p - c;
  float stroke = sin(uT * 2.6);
  float d = egg(q, vec3(0.0, 0.0, 0.0), vec3(0.8, 0.3, 0.3));
  d = smin(d, egg(q, vec3(0.5, 0.06, 0.0), vec3(0.4, 0.27, 0.27)), 0.15);                     // big blunt head
  vec3 tip = vec3(-1.4, 0.3 + 0.18 * stroke, 0.0);
  d = smin(d, rod(q, vec3(-0.5, 0.02, 0.0), tip, 0.2, 0.05), 0.12);                             // tail
  d = smin(d, egg(q, tip + vec3(-0.06, 0.02, 0.0), vec3(0.1, 0.13, 0.36)), 0.05);               // flukes, raised out of the water
  d = smin(d, rod(q, vec3(-0.22, 0.22, 0.0), vec3(-0.38, 0.35, 0.0), 0.06, 0.015), 0.06);      // fin on the back
  return d;
}
vec3 seaWorld(vec3 ro, vec3 rd) {
  vec3 col;
  float tw = rd.y < 0.0 ? (WL - ro.y) / rd.y : 1e9;
  if (tw > 1e8) {
    col = ramp3(SEA_SKY0, SEA_SKY1, SEA_SKY2, rd.y / 0.28);
    float cloud = noise(vec3(rd.x / rd.z * 5.0, rd.y * 40.0, 2.0));
    if (cloud > 0.6 && rd.y > 0.05 && rd.y < 0.17) col = vec3(1.0);
  } else {
    vec3 g = ro + rd * tw;
    float far = clamp((g.z - D) / 14.0, 0.0, 1.0);
    float wave = sin(g.z * 7.0 - uT * 2.5 + 1.5 * sin(g.x * 1.7 + uT * 0.7));
    col = ramp4(SEA0, SEA1, SEA2, SEA3, 0.18 + 0.8 * pow(far, 0.6) + 0.13 * wave * (1.0 - far));
    if (g.z < D + 0.05 + 0.03 * sin(uT * 3.0 + g.x * 4.0)) col = vec3(0.93, 0.97, 0.96);   // lapping at the sill
  }
  // The whale, walked only by rays that pass near it
  vec3 c = whaleAt(), oc = ro - c;
  float b = dot(oc, rd), disc = b * b - dot(oc, oc) + 1.9 * 1.9;
  if (disc > 0.0) {
    float t = max(0.0, -b - sqrt(disc)), tEnd = -b + sqrt(disc);
    for (int i = 0; i < 64 && t < tEnd; i++) {
      vec3 p = ro + rd * t;
      float d = whale(p, c);
      if (d < 0.003) {
        if (p.y > WL + 0.02) {
          vec2 e = vec2(0.01, -0.01);
          vec3 n = normalize(e.xyy * whale(p + e.xyy, c) + e.yyx * whale(p + e.yyx, c) + e.yxy * whale(p + e.yxy, c) + e.xxx * whale(p + e.xxx, c));
          float lit = dot(n, normalize(vec3(-0.4, 0.85, -0.45)));
          col = ramp4(WHALE0, WHALE1, WHALE2, WHALE3, 0.15 + 0.6 * max(lit, 0.0) + 0.25 * pow(max(lit, 0.0), 8.0));
        } else if (p.y > WL - 0.01) col = vec3(0.93, 0.97, 0.96);   // foam where it breaks the surface
        else if (p.y > WL - 0.3) col = SEA0;                         // the rest of it, dark under the water
        break;
      }
      t += d * 0.8;
    }
  }
  // A spout, once
  if (uT > 1.9 && uT < 2.9) {
    vec3 q = ro + rd * ((c.z - ro.z) / rd.z);
    float k = (uT - 1.9) / 1.0, tall = 0.75 * (1.0 - (1.0 - k) * (1.0 - k));
    vec2 rel = q.xy - (c.xy + vec2(0.45, 0.24));
    float wide = 0.03 + rel.y * 0.35;
    if (rel.y > 0.0 && rel.y < tall && abs(rel.x) < wide && dots() < (1.0 - k) * (1.0 - 0.6 * rel.y / tall) * 1.3) col = vec3(1.0);
  }
  return col;
}

// The desert at noon: sand dunes under a white-hot sky
const vec3 DS0 = vec3(0.99, 0.97, 0.90), DS1 = vec3(0.93, 0.95, 0.95), DS2 = vec3(0.78, 0.88, 0.97);
const vec3 SAND0 = vec3(0.64, 0.38, 0.22), SAND1 = vec3(0.84, 0.57, 0.32), SAND2 = vec3(0.94, 0.75, 0.47), SAND3 = vec3(0.99, 0.91, 0.68);
float dune(vec2 q) {
  float back = smoothstep(D + 0.4, D + 1.8, q.y);
  float r = 0.5 + 0.5 * sin(q.x * 0.7 + q.y * 1.5 + 1.6 * sin(q.y * 0.35 + q.x * 0.6));
  return back * (0.45 * r * r * r + 0.1 * sin(q.x * 0.31 - q.y * 0.17 + 1.0) + 0.1);
}
vec3 desertWorld(vec3 ro, vec3 rd) {
  vec3 col = ramp3(DS0, DS1, DS2, rd.y / 0.3);
  float u = rd.x / rd.z;
  if (rd.y < 0.035 * smoothstep(0.08, 0.12, u) * smoothstep(0.42, 0.38, u) + 0.004) col = vec3(0.90, 0.78, 0.74);   // a far mesa
  if (rd.y > 0.0 && ro.y > 0.7) return col;
  float t = 0.0;
  for (int i = 0; i < 96; i++) {
    vec3 g = ro + rd * t;
    float d = g.y - dune(g.xz);
    if (d < 0.004) {
      vec2 e = vec2(0.03, 0.0);
      vec3 n = normalize(vec3(dune(g.xz - e.xy) - dune(g.xz + e.xy), 2.0 * e.x, dune(g.xz - e.yx) - dune(g.xz + e.yx)));
      float lit = dot(n, normalize(vec3(-0.5, 1.0, 0.6)));
      vec3 sand = ramp4(SAND0, SAND1, SAND2, SAND3, (lit - 0.55) / 0.35 + 0.15 * smoothstep(0.1, 0.5, g.y));
      float far = banded(smoothstep(D + 4.0, D + 30.0, g.z), 3.0);
      return mix(sand, DS0, far * 0.8);
    }
    t += max(d * 0.6, 0.015);
    if (t > 40.0) break;
  }
  return col;
}

// Deep space: no floor past the sill, stars, and a ringed planet framed by the doors
const vec3 SP0 = vec3(0.02, 0.015, 0.05), SP1 = vec3(0.06, 0.04, 0.12), SP2 = vec3(0.13, 0.08, 0.22);
const vec3 PL0 = vec3(0.16, 0.06, 0.15), PL1 = vec3(0.50, 0.19, 0.26), PL2 = vec3(0.86, 0.46, 0.32), PL3 = vec3(0.99, 0.82, 0.56);
const vec3 PLANET = vec3(0.5, 0.4, 13.0);
const float PLANET_R = 2.5;
vec3 spaceWorld(vec3 ro, vec3 rd) {
  vec2 u = rd.xy / rd.z;
  float neb = noise(vec3(u * 3.0, 0.5)) * 0.6 + noise(vec3(u * 7.0, 1.5)) * 0.4;
  vec3 col = ramp3(SP0, SP1, SP2, (neb - 0.35) * 1.2);
  float h = hash(vec3(floor(u * 55.0), 3.0));
  if (h > 0.965) col = (h > 0.99 || sin(uT * 4.0 + h * 80.0) > 0.0) ? vec3(1.0, 0.97, 0.9) : vec3(0.55, 0.55, 0.75);

  vec3 L = normalize(vec3(-0.9, 0.35, -0.3)), RN = normalize(vec3(0.25, 1.0, -0.35));
  vec3 oc = ro - PLANET;
  float b = dot(oc, rd), disc = b * b - dot(oc, oc) + PLANET_R * PLANET_R;
  float tp = disc > 0.0 ? -b - sqrt(disc) : 1e9;
  float tr = dot(PLANET - ro, RN) / dot(rd, RN);
  vec3 pr = ro + rd * tr;
  float r = length(pr - PLANET);
  bool ring = tr > 0.0 && r > 3.2 && r < 4.6 && sin(r * 9.0) > -0.6;
  if (ring && tr < tp) {
    vec3 o2 = pr - PLANET; float b2 = dot(o2, L);
    bool shadowed = b2 < 0.0 && b2 * b2 - dot(o2, o2) + PLANET_R * PLANET_R > 0.0;
    col = shadowed ? SP2 : (sin(r * 4.0) > 0.0 ? vec3(0.84, 0.78, 0.80) : vec3(0.58, 0.50, 0.62));
  } else if (tp < 1e8) {
    vec3 n = normalize(ro + rd * tp - PLANET);
    float lit = dot(n, L), band = 0.5 + 0.5 * sin(dot(n, RN) * 13.0 + noise(n * 4.0) * 2.0);
    col = ramp4(PL0, PL1, PL2, PL3, clamp(lit * 0.9 + 0.1, 0.0, 1.0) * (0.75 + 0.25 * band));
  }
  return col;
}

// A forest in snow: rows of pines going back into a white haze, and snow falling
const vec3 FS0 = vec3(0.88, 0.89, 0.93), FS1 = vec3(0.77, 0.79, 0.87);
const vec3 SNOW0 = vec3(0.74, 0.77, 0.87), SNOW1 = vec3(0.87, 0.89, 0.95), SNOW2 = vec3(0.98, 0.98, 1.0);
const vec3 PINE[4] = vec3[4](vec3(0.05, 0.15, 0.14), vec3(0.15, 0.29, 0.26), vec3(0.36, 0.47, 0.47), vec3(0.58, 0.64, 0.70));
vec3 forestWorld(vec3 ro, vec3 rd) {
  vec3 col = ramp3(FS0, FS0, FS1, rd.y / 0.3);
  if (rd.y < 0.0) {
    vec3 g = ro + rd * (-ro.y / rd.y);
    col = ramp3(SNOW0, SNOW1, SNOW2, 1.0 - smoothstep(D + 1.0, D + 9.0, g.z));
  }
  for (int k = 0; k < 6; k++) {
    float fk = float(k), zk = D + 0.9 + fk * 1.15;
    vec3 q = ro + rd * ((zk - ro.z) / rd.z);
    if (q.y < 0.0) break;    // the snow on the ground came first
    float sp = 0.62 + 0.1 * fk, cx = (q.x + fk * 0.43) / sp, id = floor(cx);
    float h1 = hash(vec3(id, fk, 5.0)), h2 = hash(vec3(id, fk, 9.0));
    float centre = (id + 0.5 + (h2 - 0.5) * 0.4) * sp - fk * 0.43;
    if (h1 < 0.2 || abs(centre) < 0.5 - fk * 0.17) continue;   // a clearing straight ahead
    float x = q.x - centre, tall = 0.9 + 0.9 * h1, y = q.y;
    vec3 pine = PINE[min(k, 3)];
    if (y < 0.12) { if (abs(x) < 0.035) { col = k < 2 ? vec3(0.2, 0.13, 0.1) : pine; break; } continue; }
    if (y > tall) continue;
    float a = tall - y, tier = fract(a / 0.3 + h2 * 0.5);
    if (abs(x) < (0.05 + a * 0.3) * (0.5 + 0.5 * tier)) { col = tier < 0.3 && k < 3 ? mix(SNOW2, pine, 0.25 * fk) : pine; break; }
  }
  // Flakes, on three sheets at different depths
  for (int k = 0; k < 3; k++) {
    float fk = float(k), zf = D + 0.3 + fk * fk * 0.5 + fk * 0.4;
    vec3 q = ro + rd * ((zf - ro.z) / rd.z);
    vec2 g = vec2(q.x + 0.05 * sin(uT * 1.3 + q.y * 3.0 + fk), q.y + uT * (0.3 - fk * 0.05)) / 0.1;
    vec2 id = floor(g), f = fract(g) - 0.5 - (vec2(hash(vec3(id, fk + 1.0)), hash(vec3(id, fk + 7.0))) - 0.5) * 0.6;
    if (hash(vec3(id, fk + 3.0)) < 0.3 && length(f) < 0.2 - fk * 0.03) col = vec3(1.0);
  }
  return col;
}

// A plain office corridor: carpet, beige walls, doors, strip lights, an exit sign at the end
const vec3 WALL0 = vec3(0.52, 0.49, 0.42), WALL1 = vec3(0.70, 0.67, 0.57), WALL2 = vec3(0.85, 0.82, 0.71), WALL3 = vec3(0.94, 0.92, 0.83);
const vec3 CARPET0 = vec3(0.17, 0.2, 0.26), CARPET1 = vec3(0.27, 0.31, 0.37), CARPET2 = vec3(0.39, 0.43, 0.48);
vec3 officeWorld(vec3 ro, vec3 rd) {
  const float CW = 0.55, CH = 1.05, CL = 9.0;
  float tx = ((rd.x >= 0.0 ? CW : -CW) - ro.x) / (abs(rd.x) < 1e-5 ? 1e-5 : rd.x);
  float ty = rd.y >= 0.0 ? (CH - ro.y) / max(rd.y, 1e-5) : -ro.y / rd.y;
  float tz = (D + CL - ro.z) / rd.z;
  float t = min(tx, min(ty, tz));
  vec3 p = ro + rd * t;
  float fade = 1.0 - 0.6 * (p.z - D) / CL, z = p.z - D;
  if (t == tz) {
    if (abs(p.x) < 0.08 && abs(p.y - 0.86) < 0.035) return vec3(0.2, 0.72, 0.42);
    return ramp4(WALL0, WALL1, WALL2, WALL3, 0.62 * fade);
  }
  if (t == ty && rd.y < 0.0) return ramp3(CARPET0, CARPET1, CARPET2, fade * 0.95 - 0.1);
  if (t == ty) {
    float panel = floor(z / 1.5);
    bool lamp = abs(fract(z / 1.5) - 0.42) < 0.13 && abs(p.x) < 0.16;
    bool flicker = panel == 3.0 && uT > 1.7 && uT < 2.2 && sin(uT * 47.0) > 0.2;
    return lamp && !flicker ? vec3(1.0, 1.0, 0.96) : ramp4(WALL0, WALL1, WALL2, WALL3, 0.85 * fade);
  }
  float lit = (0.55 + 0.35 * p.y / CH) * fade - (p.x > 0.0 ? 0.08 : 0.0);
  if (p.y < 0.04) return WALL0;                                                         // skirting
  if (abs(fract(z / 1.8 + (p.x > 0.0 ? 0.3 : 0.0)) - 0.58) < 0.13 && p.y < 0.78)       // doors along both walls
    return ramp3(vec3(0.3, 0.24, 0.2), vec3(0.45, 0.37, 0.3), vec3(0.58, 0.5, 0.4), lit);
  return ramp4(WALL0, WALL1, WALL2, WALL3, lit);
}

vec3 world(vec3 ro, vec3 rd) {
  int w = int(uWorld + 0.5);
  if (w == 0) return seaWorld(ro, rd);
  if (w == 1) return desertWorld(ro, rd);
  if (w == 2) return spaceWorld(ro, rd);
  if (w == 3) return forestWorld(ro, rd);
  return officeWorld(ro, rd);
}
// The colour each floor's daylight throws onto the lift floor
vec3 spillColour() {
  int w = int(uWorld + 0.5);
  if (w == 0) return vec3(0.5, 0.78, 0.82);
  if (w == 1) return vec3(1.0, 0.86, 0.58);
  if (w == 2) return vec3(0.22, 0.16, 0.36);
  if (w == 3) return vec3(0.84, 0.88, 0.98);
  return vec3(0.88, 0.9, 0.82);
}

// ---------- The thing: the lift itself ----------
const vec3 STEEL0 = vec3(0.28, 0.3, 0.34), STEEL1 = vec3(0.46, 0.49, 0.53), STEEL2 = vec3(0.66, 0.69, 0.72), STEEL3 = vec3(0.86, 0.88, 0.9);
vec3 liftTone(float t) { return uLift * mix(0.35, 1.2, banded(t, 3.0)); }

// The panel over the doors: an arrow, the floor number, and the lamp that lights with the ding
vec3 indicator(vec2 p) {
  vec3 col = vec3(0.06, 0.05, 0.05);
  if (abs(p.x) > 0.188 || abs(p.y - 1.17) > 0.118) return STEEL1;
  vec2 cell = vec2(floor((p.x + 0.02) / 0.04), floor((1.27 - p.y) / 0.04));
  if (cell.x >= 0.0 && cell.x < 3.0 && cell.y >= 0.0 && cell.y < 5.0) {
    int bit = (DIGITS[int(uNum)] >> ((4 - int(cell.y)) * 3 + (2 - int(cell.x)))) & 1;
    if (bit == 1) return uDing > 0.55 ? vec3(1.0, 0.93, 0.62) : (uDing > 0.15 ? vec3(1.0, 0.66, 0.2) : vec3(0.86, 0.45, 0.1));
    return vec3(0.13, 0.08, 0.05);
  }
  float ay = (p.y - 1.11) / 0.12, ax = abs(p.x + 0.09);
  if (abs(uArrow) > 0.5 && ay > 0.0 && ay < 1.0 && ax < 0.045 * (uArrow > 0.0 ? 1.0 - ay : ay)) return vec3(0.86, 0.45, 0.1);
  float lamp = length(p - vec2(0.14, 1.17));
  if (lamp < 0.028) return uDing > 0.3 ? vec3(1.0, 0.97, 0.75) : (uDing > 0.05 ? vec3(0.95, 0.75, 0.3) : vec3(0.22, 0.2, 0.17));
  return col;
}

vec3 frontWall(vec3 p, vec3 rd) {
  float ax = abs(p.x), gap = DW * uOpen;
  if (ax < DW && p.y < DH) {
    if (ax < gap) return world(p, rd);
    // The doors: brushed steel, sliding into the wall
    float e = ax - gap;
    if (e < 0.008) return STEEL0;
    float sheen = 0.5 + 0.5 * cos((e - 0.13) * 11.0);
    return ramp4(STEEL0, STEEL1, STEEL2, STEEL3, 0.3 + 0.45 * sheen + 0.12 * p.y - (p.x > 0.0 ? 0.08 : 0.0) - (p.y < 0.12 ? 0.15 : 0.0));
  }
  if (ax < DW + 0.045 && p.y < DH + 0.045) return (ax > DW + 0.035 || p.y > DH + 0.035) ? STEEL3 : STEEL1;   // the frame
  if (abs(p.x) < 0.2 && abs(p.y - 1.17) < 0.13) return indicator(p.xy);
  // The buttons, beside the doors
  if (p.x > 0.53 && p.x < 0.66 && p.y > 0.42 && p.y < 0.86) {
    vec2 g = vec2((p.x - 0.535) / 0.06, (p.y - 0.44) / 0.1), id = floor(g), f = (fract(g) - 0.5) * vec2(0.06, 0.1);
    float r = length(f), n = id.y * 2.0 + id.x + 1.0;
    if (id.x < 2.0 && id.y < 4.0 && r < 0.02) return n == uNum ? vec3(1.0, 0.7, 0.25) : (r > 0.013 ? STEEL1 : STEEL3);
    return STEEL2;
  }
  float ao = smoothstep(0.0, 0.2, W - ax) * smoothstep(0.0, 0.2, H - p.y);
  return liftTone(0.45 + 0.3 * ao);
}

void main() {
  vec2 s = (gl_FragCoord.xy / uRes) * 2.0 - 1.0;
  vec3 ro = uEye, rd = normalize(vec3(s.x * uSpan * uRes.x / uRes.y, s.y * uSpan, 1.0));
  float tx = ((rd.x >= 0.0 ? W : -W) - ro.x) / (abs(rd.x) < 1e-5 ? 1e-5 : rd.x);
  float ty = rd.y > 0.0 ? (H - ro.y) / rd.y : -ro.y / min(rd.y, -1e-5);
  float tz = (D - ro.z) / rd.z;
  float t = min(tx, min(ty, tz));
  vec3 p = ro + rd * t, col;

  if (t == tz) col = frontWall(p, rd);
  else if (t == tx) {
    // The side walls: panelled, with a handrail
    float ao = smoothstep(0.0, 0.25, D - p.z) * smoothstep(0.0, 0.15, p.y) * smoothstep(0.0, 0.15, H - p.y);
    col = liftTone(0.2 + 0.25 * ao - 0.08 * step(0.0, p.x));
    if (fract(p.z / 0.5) < 0.04) col = liftTone(0.05);
    if (abs(p.y - 0.83) < 0.025 && p.z > 0.15 && p.z < D - 0.1) col = p.y > 0.84 ? STEEL3 : STEEL1;
  } else if (rd.y > 0.0) {
    // The ceiling and its light
    col = abs(p.x) < 0.34 && abs(p.z - 0.8) < 0.38 ? vec3(1.0, 0.98, 0.9) : liftTone(0.15);
  } else {
    // The floor: dark, with a steel sill at the doors, and the floor outside lighting it when they open
    col = ramp3(vec3(0.11, 0.1, 0.1), vec3(0.19, 0.17, 0.17), vec3(0.27, 0.25, 0.24), 0.3 + 0.4 * smoothstep(0.0, D, p.z) + 0.15 * step(0.5, fract(p.x / 0.4 + 0.5) + fract(p.z / 0.4)) - 0.15);
    float dz = D - p.z, gap = DW * uOpen;
    if (abs(p.x) < gap * (1.0 + dz * 0.6)) {
      float k = banded(uSpill * (1.0 - dz / 1.3), 2.0);
      col = mix(col, spillColour() * 0.85, k * 0.75);
    }
    if (dz < 0.07 && abs(p.x) < DW + 0.04) col = fract(p.z / 0.025) < 0.5 ? STEEL2 : STEEL1;
  }
  gl_FragColor = vec4(col, 1.0);
}`;

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas: stage, antialias: false });
renderer.setPixelRatio(1);
const uniforms = {
  uRes: { value: new THREE.Vector2(1, 1) }, uSpan: { value: 0.58 }, uEye: { value: new THREE.Vector3(0, 0.62, 0) }, uLift: { value: new THREE.Color() },
  uOpen: { value: 0 }, uWorld: { value: 0 }, uNum: { value: 1 }, uArrow: { value: 0 }, uDing: { value: 0 }, uT: { value: 0 }, uSpill: { value: 0.6 },
};
const scene = new THREE.Scene(), camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const page = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms, fragmentShader: frag, vertexShader: 'void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }', depthTest: false,
}));
page.frustumCulled = false;
scene.add(page);

let cols = 1, rows = 1, sizedW = -1, sizedH = -1;
function resize() {
  // A hidden pane reports no size; draw for a plausible one until it has one
  const w = innerWidth || 1280, h = innerHeight || 800;
  const scale = Math.max(3, Math.round(Math.min(w * 1.3, h) / 104));
  cols = Math.ceil(w / scale); rows = Math.ceil(h / scale);
  renderer.setSize(cols, rows, false);
  stage.style.width = cols * scale + 'px'; stage.style.height = rows * scale + 'px';
  uniforms.uRes.value.set(cols, rows);
  uniforms.uSpan.value = Math.max(0.58, 0.58 * rows / cols);
}

const EASE = { io: x => x < 0.5 ? 4 * x * x * x : 1 - (2 - 2 * x) ** 3 / 2 };

// One section per floor: the ride there with the doors shut, a ding, the doors open, a look, the doors shut
const S = sections({ sea: 4.6, desert: 3.6, space: 4.0, forest: 3.8, office: 3.6 });
const FLOORS = ['sea', 'desert', 'space', 'forest', 'office'];
const NUMBER = [2, 3, 4, 5, 1];   // what the panel says for each
const P = params({
  lift: '#a68a6c',          // the colour of the lift's walls
  spill: [0.6, 0, 1],       // how much each floor's light falls into the lift
  bounce: [1, 0, 3],        // how much the lift settles when it arrives
});

function frame(now) {
  if (innerWidth !== sizedW || innerHeight !== sizedH) { sizedW = innerWidth; sizedH = innerHeight; resize(); }
  const U = uniforms, at = S.at(now), i = FLOORS.indexOf(at.name), t = at.t;
  const len = S.end(at.name) - S.start(at.name);
  // The doors open at a fixed time after the ding and shut at a fixed time before the end, so a longer floor is a longer look
  const openAt = 0.75, closeAt = Math.max(1.5, len - 1.0), shut = closeAt + 0.6;
  U.uOpen.value = t < openAt ? 0 : t < openAt + 0.6 ? EASE.io((t - openAt) / 0.6) : t < closeAt ? 1 : t < shut ? 1 - EASE.io((t - closeAt) / 0.6) : 0;
  U.uWorld.value = i;
  U.uT.value = t;

  // The number turns over on the way; from the top floor back to the corridor it counts down
  const prev = NUMBER[(i + 4) % 5], cur = NUMBER[i], next = NUMBER[(i + 1) % 5];
  U.uNum.value = cur > prev ? (t < 0.3 ? prev : cur) : Math.max(cur, prev - Math.floor(Math.max(0, t - 0.05) / 0.11));
  U.uArrow.value = t < 0.6 ? Math.sign(cur - prev) : t > shut - 0.2 ? Math.sign(next - cur) : 0;
  U.uDing.value = t > 0.6 ? Math.max(0, 1 - (t - 0.6) / 1.4) ** 2 : 0;

  // A little sink and settle on arriving, a lift on leaving, and a slow sway so the floors beyond have depth
  const a = (t - 0.42) / 0.6, l = (t - (len - 0.35)) / 0.35;
  let bob = a > 0 && a < 1 ? -0.018 * Math.sin(a * Math.PI * 2) * (1 - a) : 0;
  if (l > 0 && l < 1) bob += 0.008 * Math.sin(l * Math.PI);
  U.uEye.value.set(0.025 * Math.sin(S.round(now) * Math.PI * 2), 0.62 + bob * P.bounce, 0);

  U.uLift.value.set(P.lift);
  U.uSpill.value = P.spill;
  renderer.render(scene, camera);
}
loop(S, frame);
</script>
