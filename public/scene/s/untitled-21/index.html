// Nothing here is a mesh: every pixel walks a ray to a shape described by distance
const frag = /* glsl */`
precision highp float;
uniform vec2 uRes;
uniform vec3 uRight, uUp, uFwd, uTarget, uLight, uSky;
uniform float uSpan, uMirror, uBlink, uBreath, uEar;
uniform vec3 uCat, uS, uH, uHd;
uniform vec2 uFace;
uniform vec3 uLeg[12];
uniform vec3 uTail[6];

const float EDGE = 1.17;     // where the keys end and the raised ends of the piano begin
const vec3 FUR[5] = vec3[5](vec3(0.012, 0.012, 0.022), vec3(0.05, 0.05, 0.08), vec3(0.11, 0.11, 0.17), vec3(0.22, 0.22, 0.32), vec3(0.40, 0.40, 0.54));
const vec3 IVORY[4] = vec3[4](vec3(0.30, 0.31, 0.42), vec3(0.55, 0.56, 0.66), vec3(0.80, 0.80, 0.84), vec3(0.97, 0.95, 0.88));

const vec3 EYE = vec3(0.042, 0.014, 0.05);
const float BAYER[16] = float[16](0.0, 8.0, 2.0, 10.0, 12.0, 4.0, 14.0, 6.0, 3.0, 11.0, 1.0, 9.0, 15.0, 7.0, 13.0, 5.0);

// Each column of the city has its own colour, round the rainbow from left to right
vec3 hue(float k) { float h = fract((k + 6.0) / 13.0 * 0.85); return mix(vec3(1.0), clamp(abs(mod(h * 6.0 + vec3(0, 4, 2), 6.0) - 3.0) - 1.0, 0.0, 1.0), 0.72); }

// The thing: a black cat, in her own space (x forward, y up); the second pass is the first seen in a mirror
vec3 toCat(vec3 p) { p.x *= uMirror; vec3 d = p - uCat; return vec3(d.x * uFace.x - d.z * uFace.y, d.y, d.x * uFace.y + d.z * uFace.x); }

  d = smin(d, ball(q, uS + vec3(0.025, -0.015, 0.0), 0.064), 0.04);                              // chest
  d = smin(d, egg(q, uH + vec3(-0.015, -0.005, 0.0), vec3(0.085, 0.085, 0.075)), 0.04);          // rump

  hd = smin(hd, rod(hq, vec3(-0.008, 0.04, 0.032), vec3(0.004 - 0.02 * uEar, 0.104 - 0.01 * uEar, 0.042), 0.026, 0.004), 0.012);  // ears

vec2 land(vec3 p) {

float lightAt(vec3 ro) {

    float d = sceneMap(ro + uLight * t);

float dots() { ivec2 c = ivec2(gl_FragCoord.xy) & 3; return (BAYER[c.y * 4 + c.x] + 0.5) / 16.0; }

vec3 beyond(vec3 b, vec2 at) {

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas: stage, antialias: false });
renderer.setPixelRatio(1);
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const uniforms = {
  uRes: { value: new THREE.Vector2(1, 1) }, uSpan: { value: 1.2 }, uSky: { value: new THREE.Color() },
  uRight: { value: V() }, uUp: { value: V() }, uFwd: { value: V() }, uTarget: { value: V(0, 0.62, 0) }, uLight: { value: V() },
  uMirror: { value: 1 }, uBlink: { value: 0 }, uBreath: { value: 0 }, uEar: { value: 0 },
  uCat: { value: V() }, uS: { value: V() }, uH: { value: V() }, uHd: { value: V() }, uFace: { value: new THREE.Vector2(1, 0) },
  uLeg: { value: Array.from({ length: 12 }, () => V()) }, uTail: { value: Array.from({ length: 6 }, () => V()) },
  uPress: { value: new Array(13).fill(0) }, uGlow: { value: new Array(13).fill(0) }, uLevel: { value: new Array(21).fill(0) },

const scene = new THREE.Scene(), camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const page = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms, fragmentShader: frag, vertexShader: 'void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }', depthTest: false,

page.frustumCulled = false;

let cols = 1, rows = 1, sizedW = -1, sizedH = -1;
function resize() {

  const w = innerWidth || 1280, h = innerHeight || 800;
  const scale = Math.max(3, Math.round(Math.min(w * 1.3, h) / 104));
  cols = Math.ceil(w / scale); rows = Math.ceil(h / scale);
  renderer.setSize(cols, rows, false);
  stage.style.width = cols * scale + 'px'; stage.style.height = rows * scale + 'px';
  uniforms.uRes.value.set(cols, rows);
  uniforms.uSpan.value = Math.max(1.15, 1.8 * rows / cols);   // always wide enough for both ends of the piano

// Dragging only shifts where you watch from; the loop itself answers to nothing
const view = { yaw: 0, pitch: 0.24 };
const drag = { down: false, x: 0, y: 0 };

  drag.x = e.clientX; drag.y = e.clientY;
});
const release = () => { drag.down = false; stage.classList.remove('turning'); };
addEventListener('pointerup', release);
addEventListener('pointercancel', release);

// The keyboard and the walk: front paws land on one key after another, so each key is struck in turn
const W = 0.18, NK = 13, HALF = 6, EDGE = 6.5 * W;

const keyX = i => (i - HALF) * W;

// Near front, far front, near hind, far hind: when in the stride each lands, and on which key
const LEGS = [

const A = 0.15, R = 0.5, G0 = -0.25 * T, G1 = 6.25 * T, LIN = G1 - G0 - R;

function gOf(tau) {

  let x = (tau - A) / R;
  if (x < 1) return [G0 + R * x * x / 2, x];

  if (t2 < LIN) return [G0 + R / 2 + t2, 1];

  if (tau < WALK_END) return walkPose(tau);
  const w = walkPose(WALK_END);
  if (tau < CROUCH) {
    const k = EASE.io((tau - WALK_END) / 0.25);
    return { S: [w.S[0] - 0.01 * k, w.S[1] - 0.045 * k], H: [w.H[0] - 0.01 * k, w.H[1] - 0.05 * k], feet: w.feet, look: 0.3 * k };
  }
  const Sc = [w.S[0] - 0.01, w.S[1] - 0.045], Hc = [w.H[0] - 0.01, w.H[1] - 0.05];
  if (tau < LAND) {
    const k = (tau - CROUCH) / 0.37, kx = EASE.io(k), arc = 0.13 * Math.sin(Math.PI * k);
    const S = [lerp(Sc[0], SE[0], kx), lerp(Sc[1], SE[1], kx) + arc + 0.03 * Math.sin(Math.PI * k) * (1 - k)];
    const H = [lerp(Hc[0], HE[0], kx), lerp(Hc[1], HE[1], kx) + arc + 0.03 * Math.sin(Math.PI * k) * k];
    const feet = LEGS.map((L, i) => {
      const B = L.front ? S : H, B0 = L.front ? Sc : Hc, BE = L.front ? SE : HE, f0 = w.feet[i];
      const r0 = [f0.x - B0[0], f0.base + 0.02 - B0[1]], rE = [0, 0.12 - BE[1]], tuck = Math.sin(Math.PI * k);
      return { x: B[0] + lerp(r0[0], rE[0], kx) + (L.front ? 0.05 : -0.05) * tuck, y: B[1] + lerp(r0[1], rE[1], kx) + 0.05 * tuck };
    });
    return { S, H, feet, look: 0.3 * (1 - k) };
  }
  const squash = 0.035 * bump(tau, LAND, 0.3) + 0.012 * bump(tau, PASS - 0.9, 0.35) + 0.012 * bump(tau, PASS - 0.55, 0.35);
  const S = [SE[0], SE[1] - squash], H = [HE[0], HE[1] - squash * 1.2];
  return { S, H, feet: standFeet(SE, HE), look: smooth(ACROSS + 0.1, ACROSS + 0.4, tau) - smooth(PASS - 0.9, PASS - 0.5, tau) };
}

function ik(root, foot, a, b, bend) {
  let dx = foot[0] - root[0], dy = foot[1] - root[1];
  const d = Math.max(Math.hypot(dx, dy), 1e-4), dd = Math.min(d, a + b - 1e-3);
  dx /= d; dy /= d;
  const along = (a * a - b * b + dd * dd) / (2 * dd), h = Math.sqrt(Math.max(0, a * a - along * along));
  return [[root[0] + dx * along - dy * h * bend, root[1] + dy * along + dx * h * bend], [root[0] + dx * dd, root[1] + dy * dd]];
}

// Everything is a function of the time in the loop and nothing else, so the last frame meets the first
const S = sections({ across: ACROSS, dark: 0.8, turn: 1.0, back: ACROSS, darkAgain: 0.8, turnAgain: 1.0 });
const P = params({
  hold: [0.35, 0.1, 1.2],     // how long a struck column stays fully lit
  pulse: [1, 0, 2],           // how hard the lit city throbs
  night: '#1c2048',           // the sky
});

function frame(now) {
  if (innerWidth !== sizedW || innerHeight !== sizedH) { sizedW = innerWidth; sizedH = innerHeight; resize(); }
  const U = uniforms, round = S.round(now), w = S.written(now);
  const pass = w < PASS ? 0 : 1, tau = w - pass * PASS;

  // Where you are looking from: side on, with a slow sway, so it stays a solid thing
  const yaw = 0.03 * Math.sin(round * Math.PI * 2) + view.yaw, pitch = view.pitch;
  const fwd = U.uFwd.value.set(-Math.sin(yaw) * Math.cos(pitch), -Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
  const right = U.uRight.value.set(Math.cos(yaw), 0, -Math.sin(yaw));
  U.uUp.value.crossVectors(right, fwd);
  // The moon stays over your left shoulder
  U.uLight.value.set(Math.sin(yaw) * 0.45, 0.8, Math.cos(yaw) * 0.45).addScaledVector(right, -0.5).normalize();
  U.uSky.value.set(P.night).convertLinearToSRGB();
  U.uMirror.value = pass ? -1 : 1;

  // Her pose, worked out as if on the first pass; the shader mirrors it for the second
  const po = pose(tau), press = new Array(NK).fill(0);
  for (const f of po.feet) if (f.y === undefined && Math.abs(f.x) < EDGE) {
    const k = clamp(Math.round(f.x / W) + HALF, 0, NK - 1);
    press[k] = Math.max(press[k], 0.03 * (1 - smooth(0, 0.02, f.lift)));
  }
  const footY = f => f.y !== undefined ? f.y : f.base + 0.02 + f.lift - (Math.abs(f.x) < EDGE ? press[clamp(Math.round(f.x / W) + HALF, 0, NK - 1)] : 0);
  const turnK = EASE.io(clamp((tau - (PASS - 0.95)) / 0.8, 0, 1)), a = -Math.PI * turnK;
  U.uFace.value.set(Math.cos(a), Math.sin(a));
  const cx = tau >= LAND ? CE : (po.S[0] + po.H[0]) / 2;
  U.uCat.value.set(cx, 0, 0.1);
  U.uS.value.set(po.S[0] - cx, po.S[1], 0);
  U.uH.value.set(po.H[0] - cx, po.H[1], 0);
  U.uHd.value.set(po.S[0] - cx + 0.085 - 0.008 * po.look, po.S[1] + 0.08 + 0.018 * po.look, 0);
  po.feet.forEach((f, i) => {
    const L = LEGS[i], root = L.front ? [po.S[0], po.S[1] - 0.035] : [po.H[0] + 0.01, po.H[1] - 0.03];
    const [knee, foot] = L.front ? ik(root, [f.x, footY(f)], 0.11, 0.1, 1) : ik(root, [f.x, footY(f)], 0.105, 0.1, -1);
    U.uLeg.value[i * 3].set(root[0] - cx, root[1], L.z);
    U.uLeg.value[i * 3 + 1].set(knee[0] - cx, knee[1], L.z);
    U.uLeg.value[i * 3 + 2].set(foot[0] - cx, foot[1], L.z);
  });
  // The tail: up like a question mark, swaying a whole number of times round the loop
  const NT = Math.max(1, Math.round(S.length / 2.6));
  let tx = po.H[0] - cx - 0.08, ty = po.H[1] + 0.03, ang = 2.5;
  for (let j = 0; j < 6; j++) {
    U.uTail.value[j].set(tx, ty, 0);
    ang += -0.2 + 0.12 * Math.sin(2 * Math.PI * round * NT - j * 0.7);
    tx += Math.cos(ang) * 0.06; ty += Math.sin(ang) * 0.06;
  }
  U.uBreath.value = 0.004 * Math.sin(2 * Math.PI * round * Math.max(1, Math.round(S.length / 2.2)));
  U.uBlink.value = bump(tau, 2.2, 0.16) + bump(tau, 6.55, 0.2);
  U.uEar.value = bump(tau, 3.3, 0.22) + bump(tau, 6.2, 0.18);

  // The city: a struck column leaps to the top, settles back, and the more keys are struck the higher it all sits
  const NB = Math.max(1, Math.round(S.length / 0.5)), beat = round * NB, kick = (1 - (beat % 1)) ** 2;
  const struck = STRIKE.filter(s => tau >= s).length / NK, fin = smooth(STRIKE[NK - 1], STRIKE[NK - 1] + 0.6, tau);
  const off = tau < ACROSS ? 1 : tau < ACROSS + 0.08 ? 0.5 : 0;
  const wave = k => 0.6 * kick + 0.4 * (0.5 + 0.5 * Math.sin(2 * Math.PI * beat * 2 + k * 1.1));
  U.uLevel.value.fill(0);
  for (let i = 0; i < NK; i++) {
    const r = pass ? NK - 1 - i : i, k = r - HALF, since = tau - STRIKE[i];
    if (since < 0) { U.uGlow.value[r] = 0; continue; }
    const sustain = 0.15 + 0.4 * struck + 0.2 * P.pulse * wave(k) * struck;
    const level = Math.max(Math.exp(-since / P.hold), lerp(sustain, 0.72 + 0.28 * P.pulse * wave(k) - 0.15 * (1 - P.pulse / 2), fin));
    U.uLevel.value[k + 10] = clamp(level, 0, 1) * off;
    U.uGlow.value[r] = Math.exp(-since / 0.25) * off;
  }
  // and when every key has sounded, the rest of the city joins in, outwards from the ends
  for (let k = -10; k <= 10; k++) if (Math.abs(k) > HALF) {
    const join = smooth(STRIKE[NK - 1] + 0.08 * (Math.abs(k) - HALF), STRIKE[NK - 1] + 0.08 * (Math.abs(k) - HALF) + 0.4, tau);
    U.uLevel.value[k + 10] = join * clamp(0.6 + 0.3 * P.pulse * wave(k), 0, 1) * off;
  }
  for (let i = 0; i < NK; i++) U.uPress.value[pass ? NK - 1 - i : i] = press[i];

  renderer.render(scene, camera);
}
loop(S, frame);
</script>
