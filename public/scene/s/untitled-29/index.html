<meta charset="utf-8">
<title>Wrong floor: rainforest</title>
<style>
  /* Layout: a white page with one doorway on it, drawn in chunky pixels. Deliberately light-only. */
  :root { --bg: #ffffff; color-scheme: light; }
  html, body { height: 100%; }
  body { background: var(--bg); overflow: hidden; }
  #stage { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; }
</style>

<canvas id="stage" aria-label="A seven second loop. A steel doorway on a white page opens onto the old city taken by rainforest: three towers under trees and vines, a waterfall pouring off the stepped one into mist, light coming down through the leaves, and once a red bird crossing. A fern and a vine creep out over the threshold."></canvas>

<script type="module">
import * as THREE from 'three';
import { params, loop } from 'scene';

// Nothing here is a mesh: every pixel works out what it sees through the doorway, layer by layer from far to near
const frag = /* glsl */`
precision highp float;
uniform vec2 uRes;
uniform float uSpan, uPx, uPhase, uShafts, uMist, uWind;
uniform vec2 uDrift;   // how far the eye has drifted, which the far layers follow
uniform vec4 uBird;    // where the bird is, its wingbeat, and whether it is there at all

const float TAU = 6.2831853;
const float BAYER[16] = float[16](0.0, 8.0, 2.0, 10.0, 12.0, 4.0, 14.0, 6.0, 3.0, 11.0, 1.0, 9.0, 15.0, 7.0, 13.0, 5.0);
const vec3 LIGHT = vec3(-0.523, 0.603, 0.603);   // the sun, high and to the left, behind the canopy
const vec3 HAZE = vec3(0.80, 0.90, 0.83);        // what everything pales into with distance
const vec3 SUN = vec3(1.0, 0.98, 0.78);
const vec3 SKY[2] = vec3[2](vec3(0.86, 0.94, 0.86), vec3(0.99, 0.99, 0.90));
const vec3 LEAF[5] = vec3[5](vec3(0.04, 0.13, 0.10), vec3(0.09, 0.25, 0.15), vec3(0.17, 0.40, 0.18), vec3(0.33, 0.57, 0.20), vec3(0.62, 0.78, 0.30));
const vec3 FROND[5] = vec3[5](vec3(0.03, 0.12, 0.12), vec3(0.06, 0.24, 0.20), vec3(0.13, 0.39, 0.28), vec3(0.29, 0.57, 0.36), vec3(0.58, 0.80, 0.50));
const vec3 STONE[4] = vec3[4](vec3(0.20, 0.24, 0.23), vec3(0.34, 0.39, 0.36), vec3(0.50, 0.55, 0.49), vec3(0.68, 0.71, 0.63));
const vec3 BARK[4] = vec3[4](vec3(0.12, 0.09, 0.08), vec3(0.24, 0.18, 0.13), vec3(0.38, 0.30, 0.21), vec3(0.56, 0.47, 0.33));
const vec3 WATER[3] = vec3[3](vec3(0.58, 0.76, 0.78), vec3(0.82, 0.93, 0.93), vec3(0.98, 1.0, 0.98));
const vec3 STEEL[4] = vec3[4](vec3(0.30, 0.32, 0.36), vec3(0.50, 0.53, 0.58), vec3(0.68, 0.71, 0.76), vec3(0.87, 0.89, 0.92));
const vec3 PINK = vec3(0.96, 0.42, 0.58), FLAME = vec3(0.95, 0.36, 0.16), GOLD = vec3(1.0, 0.82, 0.28);

float h1(float n) { return fract(sin(n * 91.3458) * 47453.5453); }
float h2(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
vec2 h22(vec2 p) { return fract(sin(vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)))) * 43758.5453); }
float noise(vec2 x) {
  vec2 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h2(i), h2(i + vec2(1, 0)), f.x), mix(h2(i + vec2(0, 1)), h2(i + vec2(1, 1)), f.x), f.y);
}
float fbm(vec2 p) { return 0.55 * noise(p) + 0.3 * noise(p * 2.03 + 5.1) + 0.15 * noise(p * 4.1 + 9.7); }
float seg(vec2 p, vec2 a, vec2 b, float ra, float rb) {
  vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h) - mix(ra, rb, h);
}

// Steps between neighbouring tones in a fixed pattern; flat colour, with dots only in the seam where one tone meets the next
float dots() { ivec2 c = ivec2(gl_FragCoord.xy) & 3; return (BAYER[c.y * 4 + c.x] + 0.5) / 16.0; }
int rung(float t, int n) { float x = clamp(t, 0.0, 1.0) * float(n - 1); return min(int(x) + (smoothstep(0.25, 0.75, fract(x)) > dots() ? 1 : 0), n - 1); }
vec3 far(vec3 c, float f) { return mix(c, HAZE, f); }

// The thing: the city, ages on. Three towers in the same places as on every floor.
float top2(float x) { return (x < 0.14 || x > 0.5) ? 1.55 : (x < 0.24 || x > 0.4) ? 1.68 : 1.8; }   // the stepped roof
bool inT1(vec2 p) { return p.x > -0.58 && p.x < -0.33 && p.y < 2.0; }
bool inT2(vec2 p) { return p.x > 0.0 && p.x < 0.58 && p.y < top2(p.x); }
vec2 leanT3(vec2 p) { return vec2(p.x + (p.y - 0.4) * 0.2, p.y); }   // the far one, straightened up
bool inT3(vec2 p) { vec2 q = leanT3(p); return q.x > 0.66 && q.x < 1.04 && q.y < 1.3 + (q.x - 0.66) * 0.16; }

// Where tufts of leaves may grow, by the spot each one sprouts from
bool grows(int region, vec2 o) {
  if (region == 0) return o.y < 1.6 + 0.34 * noise(vec2(o.x * 2.2, 1.0));            // the farthest canopy
  if (region == 1) return o.y < 1.18 + 0.3 * noise(vec2(o.x * 3.0, 4.0));            // the next row in
  if (region == 2) return o.y < 0.56 + 0.34 * noise(vec2(o.x * 2.6, 7.0));           // the canopy round the towers' feet
  if (region == 3) {                                                                 // the canopy overhead, with gaps the light comes through
    float edge = 2.8 - 0.32 * smoothstep(0.25, 0.9, o.x) - 0.14 * noise(vec2(o.x * 4.0, 2.0));
    return o.y > edge && length((o - vec2(-0.39, 2.92)) / vec2(1.0, 1.4)) > 0.14 && length(o - vec2(0.07, 2.96)) > 0.09;
  }
  if (region == 4) return o.y < 0.07 + 0.12 * noise(vec2(o.x * 3.4, 11.0));          // undergrowth at the threshold
  if (region == 5) {                                                                 // green over the two near towers, thickest on the roofs
    bool a = inT1(o), b = inT2(o);
    if (!a && !b) return false;
    float below = a ? 2.0 - o.y : top2(o.x) - o.y;
    return fbm(o * 4.5 + 3.0) + 0.4 * smoothstep(0.14, 0.0, below) + 0.3 * smoothstep(1.3, 0.6, o.y) > 0.78;
  }
  if (region == 6) return length((o - vec2(0.45, 1.98)) / vec2(0.11, 0.09)) < 1.0;   // the flowering tree on the stepped roof
  if (region == 7) {                                                                 // green over the leaning tower
    if (!inT3(o)) return false;
    vec2 q = leanT3(o);
    return fbm(o * 4.0 + 8.0) + 0.45 * smoothstep(0.14, 0.0, 1.3 + (q.x - 0.66) * 0.16 - q.y) > 0.75;
  }
  return false;
}
// Leaf clumps: round tufts overlapping like scales, the lower in front. Gives the tuft's roundness as a normal, z < 0 for none, and w to tell tufts apart.
vec4 clumps(vec2 p, float cell, float seed, int region) {
  vec2 c = floor(p / cell);
  float front = 1e3; vec4 hit = vec4(0.0, 0.0, -1.0, 0.0);
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 k = c + vec2(i, j), h = h22(k + seed * 17.0);
    vec2 o = (k + 0.15 + 0.7 * h) * cell;
    float r = cell * (0.62 + 0.3 * h2(k.yx + seed * 7.0));
    vec2 d = (p - o) / r;
    float q = dot(d, d);
    if (q < 1.0 && o.y < front && grows(region, o)) { front = o.y; hit = vec4(d, sqrt(1.0 - q), h.x); }
  }
  return hit;
}
float lit(vec4 c) { return max(dot(c.xyz, LIGHT), 0.0); }

// Light coming down through the gaps in the canopy, slanting to the right; the widest falls across the waterfall
float shaft(vec2 w) {
  float q = w.x + 0.38 * (w.y - 1.3);
  float b = smoothstep(0.11, 0.04, abs(q - 0.2)) + 0.7 * smoothstep(0.06, 0.02, abs(q + 0.32)) + 0.6 * smoothstep(0.045, 0.012, abs(q - 0.66));
  return b * smoothstep(0.1, 1.0, w.y) * (0.85 + 0.15 * sin(TAU * uPhase + q * 9.0)) * uShafts;
}

// Old stone under the green, streaked with stains
vec3 stone(vec2 p, float face, float sh) { return STONE[rung(face - 0.28 * fbm(p * vec2(7.0, 1.6)) + sh * 0.3, 4)]; }
// One pixel wide, two tall: the windows, in columns from x0, every dx, n of them
bool window(float x, float y, float x0, float dx, float n, float top) {
  float c = floor((x - x0) / dx + 0.5);
  return c >= 0.0 && c < n && abs(x - x0 - c * dx) < uPx * 0.5 && fract(y / 0.14) < 0.45 && y < top - 0.07;
}
// Strangler roots poured down the thin tower's face from the tree on its roof: how far across the nearest one, or 2 for none
float roots(vec2 p) {
  float best = 2.0;
  for (int i = 0; i < 4; i++) {
    float fi = float(i);
    float x = -0.55 + fi * 0.068 + 0.022 * sin(p.y * 5.0 + fi * 2.3) + 0.012 * sin(p.y * 11.0 + fi);
    if (p.y < 0.75 + 0.55 * h1(fi + 3.0) || p.y > 2.04) continue;
    float u = (p.x - x) / (0.022 + 0.02 * smoothstep(1.7, 2.02, p.y));
    if (abs(u) < abs(best)) best = u;
  }
  return best;
}
// The tree that grew out of the thin tower's roof, gripping it as it goes up into the canopy
float emergent(vec2 p) {
  if (p.y < 1.9) return 2.0;
  return (p.x - (-0.46 + 0.035 * sin(p.y * 2.2 - 1.0))) / (0.05 + 0.09 * smoothstep(2.25, 1.95, p.y));
}
// The waterfall off the stepped tower's second tier: streaks running down a ribbon that widens as it falls
vec3 waterfall(vec2 p, float sh, out bool hit) {
  hit = false;
  if (p.y > 1.7 || p.y < 0.55) return vec3(0.0);
  float k = 1.7 - p.y;
  float u = (p.x - (0.196 + 0.01 * k + 0.004 * sin(p.y * 9.0))) / (0.042 + 0.03 * k);
  if (abs(u) > 1.0) return vec3(0.0);
  hit = true;
  float run = fract((p.y + uPhase * 7.0) / 0.35 + h1(floor(p.x / uPx)));   // twenty streak lengths a loop
  return WATER[rung(0.5 - 0.3 * u + (run < 0.22 ? 0.4 : 0.0) + sh * 0.3 + (p.y > 1.65 ? 0.5 : 0.0), 3)];
}
// Spray where the falls land, churning on a slow round so it closes
float spray(vec2 p) {
  vec2 d = (p - vec2(0.22, 0.66)) / vec2(0.26, 0.2), turn = vec2(cos(TAU * uPhase), sin(TAU * uPhase)) * 0.7;
  return (1.0 - smoothstep(0.25, 1.0, length(d))) * (0.45 + fbm(p * vec2(7.0, 9.0) + turn)) * uMist;
}
// Mist lying between the far canopy and the towers
float drifting(vec2 p) {
  vec2 turn = vec2(cos(TAU * uPhase), sin(TAU * uPhase)) * 0.25;
  return smoothstep(0.75, 1.0, p.y) * smoothstep(1.45, 1.1, p.y) * fbm(p * vec2(2.5, 9.0) + turn) * uMist;
}
vec3 misted(vec3 col, float m, vec3 tint) {
  int l = rung(m, 3);
  return l == 2 ? tint : l == 1 ? mix(col, tint, 0.55) : col;
}

// The bird crossing: a macaw, red, with a yellow and blue wing beating
vec3 bird(vec2 w, out bool hit) {
  hit = false;
  vec2 q = (w - uBird.xy) / 1.5;
  if (uBird.w < 0.5 || dot(q, q) > 0.06) return vec3(0.0);
  vec2 tip = vec2(-0.03, 0.09 * uBird.z);
  float wing = seg(q, vec2(0.0, 0.008), tip, 0.022, 0.01);
  float body = min(min((length(q / vec2(0.055, 0.026)) - 1.0) * 0.026, length(q - vec2(0.052, 0.014)) - 0.024),
                   seg(q, vec2(-0.03, -0.004), vec2(-0.15, -0.026), 0.016, 0.011));
  if (wing < 0.0) {
    hit = true;
    float along = dot(q - vec2(0.0, 0.008), tip - vec2(0.0, 0.008)) / dot(tip - vec2(0.0, 0.008), tip - vec2(0.0, 0.008));
    return along > 0.6 ? vec3(0.22, 0.42, 0.86) : along > 0.3 ? GOLD : vec3(0.92, 0.2, 0.14);
  }
  if (body < 0.0) {
    hit = true;
    if (q.x > 0.072) return vec3(0.95, 0.9, 0.8);
    if (q.x < -0.13) return vec3(0.22, 0.42, 0.86);
    return q.y > 0.006 ? vec3(1.0, 0.34, 0.24) : vec3(0.76, 0.1, 0.1);
  }

}
// Motes drifting in the light, each wandering a small loop of its own
float motes(vec2 w) {
  for (int i = 0; i < 22; i++) {
    float fi = float(i), lane = (i & 3) < 2 ? 0.2 : (i & 3) == 2 ? -0.32 : 0.66;
    float y = 0.7 + 1.9 * h1(fi * 4.7) + 0.08 * sin(TAU * uPhase + fi * 1.9);
    float x = lane - 0.38 * (y - 1.3) + (h1(fi * 9.1) - 0.5) * 0.1 + 0.035 * sin(TAU * 2.0 * uPhase + fi * 2.6);
    if (all(lessThan(abs(w - vec2(x, y)), vec2(uPx * 0.5)))) return 0.5 + 0.5 * sin(TAU * 3.0 * uPhase + fi * 2.0);
  }
  return 0.0;
}

// The near giant at the left: a trunk going up out of sight, flaring into buttress roots at the floor
vec3 giant(vec2 w, float sh, out bool hit) {
  float flare = exp(-w.y * 4.5);
  float hw = 0.115 + 0.015 * sin(w.y * 3.1 + 1.0) + 0.3 * flare;
  float u = (w.x - (-0.86 + 0.025 * sin(w.y * 1.4 + 0.5) + 0.12 * flare)) / hw;
  hit = abs(u) < 1.0;
  if (!hit) return vec3(0.0);
  float t = 0.42 - 0.3 * u + (noise(vec2(u * 7.0, w.y * 2.2)) - 0.5) * 0.35 + sh * 0.4;
  if (flare > 0.12 && min(abs(u - 0.42), abs(u + 0.25)) < 0.1 * flare) t = 0.0;   // the clefts between the buttress fins
  if (fbm(w * vec2(9.0, 4.0)) > 0.66) return FROND[rung(t * 0.8 + 0.1, 5)];        // moss in patches
  return BARK[rung(t, 4)];
}
// A broad wet leaf from stalk a to tip b, bowed sideways: veined, darker at the rim, with a wet shine on the side that faces up
vec3 broad(vec2 p, vec2 a, vec2 b, float wide, float bow, float sh, out bool hit) {
  hit = false;
  vec2 ab = b - a; float len = length(ab); vec2 t = ab / len, n = vec2(-t.y, t.x);
  float u = dot(p - a, t) / len;
  if (u < 0.0 || u > 1.0) return vec3(0.0);
  float v = dot(p - a, n) - bow * len * u * u;
  float x = v / max(wide * pow(sin(3.14159 * pow(u, 0.7)), 0.7), 1e-4);
  if (abs(x) > 1.0) return vec3(0.0);
  hit = true;
  float up = sign(x * n.y);
  float tone = 0.42 + 0.14 * up - 0.22 * smoothstep(0.7, 1.0, abs(x)) + 0.12 * u + sh * 0.3;
  if (fract(u * 8.0 + abs(x) * 1.3) < 0.16) tone -= 0.14;
  if (up > 0.0 && abs(abs(x) - 0.4) < 0.13 && u > 0.2 && u < 0.6) tone += 0.35;
  if (abs(v) < uPx * 0.5) tone = 0.62;
  return LEAF[rung(tone, 5)];
}
// Heliconia: a stalk of flame-red bracts tipped with gold, among the near leaves
vec3 heliconia(vec2 p, float sw, out bool hit) {
  hit = false;
  vec2 a = vec2(0.77, 0.08), b = vec2(0.69 + sw, 0.6);
  for (int i = 0; i < 6; i++) {
    vec2 s = mix(a, b, 0.35 + 0.12 * float(i)), c = s + vec2(((i & 1) == 0 ? 1.0 : -1.0) * 0.035, -0.012);
    if (seg(p, s, c, 0.017, 0.01) < 0.0) { hit = true; return length(p - c) < 0.014 ? GOLD : p.y > c.y ? FLAME : FLAME * 0.75; }
  }
  if (seg(p, a, b, 0.012, 0.009) < 0.0) { hit = true; return LEAF[2]; }
  return vec3(0.0);
}
// A small leaf hanging from a vine, pointing along dir
bool leaflet(vec2 p, vec2 c, vec2 dir, float len, float wid, out float side) {
  vec2 d = p - c; float a = dot(d, dir) / len, b = dot(d, vec2(-dir.y, dir.x));
  side = sign(b * dir.x - dir.y);
  return a * a + b * b / (wid * wid * (1.0 - 0.4 * a) * (1.0 - 0.4 * a)) < 1.0;
}
// A vine hanging from the canopy down to yb, swinging from the top, with leaves alternating down it
float vineX(float y, float x0, float yb, float ph) {

  return x0 + 0.035 * uWind * sin(TAU * uPhase + ph) * k * k + 0.012 * sin(y * 6.0 + ph);
}
vec3 vine(vec2 w, float x0, float yb, float ph, float sh, out bool hit) {

  if (w.y > yb && abs(w.x - vineX(w.y, x0, yb, ph)) < uPx * 0.6) { hit = true; return LEAF[1 + rung(sh, 2)]; }
  float i0 = floor((3.0 - w.y) / 0.12);
  for (int j = -1; j <= 1; j++) {
    float i = i0 + float(j), yi = 3.0 - (i + 0.5) * 0.12, side;
    if (yi < yb || i < 1.0) continue;
    float out_ = mod(i, 2.0) * 2.0 - 1.0;
    if (leaflet(w, vec2(vineX(yi, x0, yb, ph) + out_ * 0.03, yi - 0.012), normalize(vec2(out_ * 0.7, -1.0)), 0.04, 0.022, side)) {
      hit = true;
      if (mod(i, 5.0) == 2.0 && length(w - vec2(vineX(yi, x0, yb, ph) + out_ * 0.03, yi - 0.012)) < 0.018) return PINK;
      return LEAF[rung(0.35 + 0.15 * side + sh * 0.4, 5)];

}
// The vine that comes down the right of the doorway and creeps out over the threshold onto the page
float creeperX(float y) { return 0.86 - 0.06 * (1.0 - y / 3.0) + 0.03 * uWind * sin(TAU * uPhase + 2.0) * sin(3.14159 * clamp(y / 3.0, 0.0, 1.0)); }
vec3 creeper(vec2 w, out bool hit) {

  float d = w.y > 0.06 ? abs(w.x - creeperX(w.y)) : 1e3;
  vec2 c0 = vec2(creeperX(0.06), 0.06);
  d = min(d, seg(w, c0, vec2(0.8, -0.025), 0.0, 0.0));
  d = min(d, seg(w, vec2(0.8, -0.025), vec2(0.72, -0.08), 0.0, 0.0));
  d = min(d, seg(w, vec2(0.72, -0.08), vec2(0.62, -0.1), 0.0, 0.0));
  if (d < uPx * 0.6) { hit = true; return LEAF[1]; }

  for (int i = 0; i < 22; i++) {

    if (leaflet(w, vec2(creeperX(yi) + out_ * 0.03, yi - 0.012), normalize(vec2(out_ * 0.7, -1.0)), 0.042, 0.024, side)) {

      leaflet(w, vec2(0.66, -0.125), normalize(vec2(-0.6, -1.0)), 0.04, 0.024, side) ||
      leaflet(w, vec2(0.6, -0.07), normalize(vec2(-1.0, 0.5)), 0.036, 0.022, side)) { hit = true; return LEAF[rung(0.45 + 0.15 * side, 5)]; }
  if (length(w - vec2(0.62, -0.1)) < 0.022) { hit = true; return PINK; }

// One frond of the fern: a curve from a to c pulled towards b, with leaflets down both sides that shorten towards the tip

  if (any(lessThan(p, lo)) || any(greaterThan(p, hi))) return vec3(0.0);
  float best = 1e3, s = 0.0, side = 0.0; vec2 prev = a;
  for (int i = 1; i <= 10; i++) {
    float t = float(i) / 10.0;
    vec2 q = mix(mix(a, b, t), mix(b, c, t), t), pa = p - prev, ba = q - prev;
    float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0), dd = length(pa - ba * h);
    if (dd < best) { best = dd; s = (float(i - 1) + h) / 10.0; side = sign(ba.x * pa.y - ba.y * pa.x); }
    prev = q;
  }
  float hw = wide * smoothstep(0.0, 0.15, s) * (1.0 - 0.6 * s);
  float tooth = fract(s * 7.0 - best / wide * 0.9);
  if (best > hw * (tooth < 0.55 ? 1.0 : 0.25)) return vec3(0.0);
  hit = true;
  if (best < uPx * 0.45) return FROND[2];
  return side * sign(c.x - a.x) > 0.0 || tooth < 0.2 ? LEAF[4] : LEAF[3];
}
vec3 fern(vec2 w, out bool hit) {
  vec2 a = vec2(-0.6, 0.02), sw = vec2(0.012, 0.016) * uWind * sin(TAU * 2.0 * uPhase);
  vec3 c = frond(w, a, vec2(-0.58, 0.5), vec2(-0.63, 0.62) + sw, 0.08, hit);          if (hit) return c;
  c = frond(w, a, vec2(-0.72, 0.46), vec2(-0.95, 0.48) + sw * 1.4, 0.09, hit);        if (hit) return c;
  c = frond(w, a, vec2(-0.46, 0.44), vec2(-0.26, 0.32) - sw.yx, 0.09, hit);           if (hit) return c;
  c = frond(w, a, vec2(-0.8, 0.24), vec2(-0.88, -0.17) + sw * 0.3, 0.085, hit);       if (hit) return c;
  return frond(w, a, vec2(-0.4, 0.22), vec2(-0.28, -0.2) + sw.yx * 0.3, 0.09, hit);
}
// Whatever is over the threshold and out on the page
vec3 spill(vec2 w, out bool hit) {
  vec3 c = creeper(w, hit); if (hit) return c;
  return fern(w, hit);
}

// Everything seen through the doorway, from the far canopy in to the leaves at the threshold
vec3 world(vec2 w) {
  float sh = shaft(w);
  bool hit;
  vec3 c;

  // Beyond: the sky in the gaps, and canopy going back for miles
  vec2 p = w - uDrift;
  vec3 col = SKY[1];
  vec4 k = clumps(p, 0.17, 1.0, 0);
  if (k.z >= 0.0) col = far(LEAF[2 + rung(lit(k) * 1.4 - 0.2 + sh * 0.4, 2)], 0.74);
  k = clumps(p, 0.13, 5.0, 1);
  if (k.z >= 0.0) col = far(LEAF[1 + rung(0.15 + 0.7 * lit(k) + sh * 0.4, 3)], 0.52);

  // The leaning tower, further back than the others
  p = w - uDrift * 0.8;
  if (inT3(p)) {
    vec2 q = leanT3(p);
    col = far(q.x < 0.7 ? stone(p, 0.95, sh) : window(q.x, q.y, 0.76, 0.09, 3.0, 1.3) ? STONE[0] : stone(p, 0.7, sh), 0.32);
  }
  k = clumps(p, 0.07, 9.0, 7);
  if (k.z >= 0.0) col = far(LEAF[rung(0.2 + 0.6 * lit(k) + sh * 0.3, 5)], 0.32);
  col = misted(col, drifting(p) * 1.3 - 0.2, vec3(0.9, 0.95, 0.91));

  c = bird(w, hit);
  if (hit) col = c;

  // The two near towers, with what grows on them
  p = w - uDrift * 0.6;
  if (inT1(p)) col = p.x > -0.38 ? stone(p, 0.3, sh) : window(p.x, p.y, -0.535, 0.09, 2.0, 2.0) ? STONE[0] : stone(p, 0.8, sh);
  if (inT2(p)) col = p.y > top2(p.x) - uPx ? STONE[3] : p.x < 0.05 ? stone(p, 0.95, sh) : window(p.x, p.y, 0.1, 0.09, 6.0, top2(p.x)) ? STONE[0] : stone(p, 0.8, sh);
  float r = emergent(p);
  if (abs(r) < 1.0) col = far(BARK[rung(0.5 - 0.35 * r + sh * 0.4 + (noise(vec2(r * 5.0, p.y * 3.0)) - 0.5) * 0.3, 4)], 0.14);
  r = roots(p);
  if (abs(r) < 1.0) col = far(BARK[rung(0.55 - 0.4 * r + sh * 0.3, 4)], 0.14);
  k = clumps(p, 0.065, 3.0, 5);
  if (k.z >= 0.0) col = far(k.w > 0.93 && k.z > 0.9 ? PINK : LEAF[rung(0.2 + 0.6 * lit(k) + (k.w - 0.5) * 0.2 + sh * 0.35, 5)], 0.14);
  if (abs(p.x - 0.43 - 0.01 * sin(p.y * 20.0)) < uPx * 0.6 && p.y > 1.78 && p.y < 1.98) col = far(BARK[1], 0.14);
  k = clumps(p, 0.075, 6.0, 6);
  if (k.z >= 0.0) col = far(k.w > 0.7 && k.z > 0.88 ? PINK : LEAF[rung(0.25 + 0.6 * lit(k) + sh * 0.35, 5)], 0.14);
  // Vines hanging off the roofs: where each hangs from, and how far down it reaches
  for (int i = 0; i < 7; i++) {
    vec3 v = i == 0 ? vec3(-0.565, 2.0, 0.5) : i == 1 ? vec3(-0.5, 2.0, 0.25) : i == 2 ? vec3(-0.405, 2.0, 0.7) : i == 3 ? vec3(0.03, 1.55, 0.45)
           : i == 4 ? vec3(0.11, 1.55, 0.3) : i == 5 ? vec3(0.47, 1.68, 0.55) : vec3(0.55, 1.55, 0.35);
    if (p.y < v.y && p.y > v.y - v.z && abs(p.x - v.x - 0.008 * sin(p.y * 7.0 + float(i)) - 0.01 * uWind * sin(TAU * uPhase + float(i)) * (v.y - p.y)) < uPx * 0.5)
      col = far(LEAF[1 + int(p.y < v.y - v.z + 0.04)], 0.14);
  }
  c = waterfall(p, sh, hit);
  if (hit) col = c;

  // The canopy round the towers' feet, and the spray rising out of it
  p = w - uDrift * 0.45;
  k = clumps(p, 0.11, 2.0, 2);
  if (k.z >= 0.0) col = far(k.w > 0.95 && k.z > 0.92 ? GOLD : LEAF[rung(0.15 + 0.6 * lit(k) + (k.w - 0.5) * 0.2 + sh * 0.35, 5)], 0.1);
  col = misted(col, spray(p) - 0.35, WATER[2]);

  // The air in the light, and what drifts in it
  col = mix(col, SUN, 0.6 * float(rung(sh, 3)) / 2.0);
  float m = motes(w);
  if (m > 0.2 && sh > 0.2) col = mix(col, vec3(1.0, 1.0, 0.86), 0.5 + 0.5 * m);

  // The land: the near giant, the canopy overhead and what hangs from it, and the undergrowth at the threshold
  c = giant(w, sh, hit);
  if (hit) col = c;
  float sag = 0.01 * uWind * sin(TAU * uPhase + 0.7), ls = (w.x + 0.76) / 0.9;
  if (ls > 0.0 && ls < 1.0) {
    float y = mix(2.55, 2.74, ls) - (1.36 + sag * 40.0) * ls * (1.0 - ls) * 0.25, slope = 0.21 - (1.36 + sag * 40.0) * (1.0 - 2.0 * ls) * 0.278;
    float d = (w.y - y) / sqrt(1.0 + slope * slope);
    if (abs(d) < uPx * 0.75) col = BARK[d > 0.0 ? 1 + rung(sh * 1.5, 3) : 0];
  }
  k = clumps(w, 0.13, 4.0, 3);
  if (k.z >= 0.0) {
    float gap = min(length(w - vec2(-0.39, 2.92)), length(w - vec2(0.07, 2.96)) + 0.05);
    col = LEAF[rung(0.05 + 0.4 * lit(k) + (k.w - 0.5) * 0.15 + 0.55 * smoothstep(0.3, 0.14, gap), 5)];
  }
  c = vine(w, -0.64, 1.55, 0.0, sh, hit);  if (hit) col = c;
  c = vine(w, 0.4, 2.12, 2.1, sh, hit);    if (hit) col = c;
  k = clumps(w, 0.1, 8.0, 4);
  if (k.z >= 0.0) col = k.w > 0.9 && k.z > 0.92 ? vec3(1.0, 0.97, 0.85) : FROND[rung(0.05 + 0.45 * lit(k) + (k.w - 0.5) * 0.2, 5)];
  float sw = 0.012 * uWind * sin(TAU * uPhase + 1.2);
  c = broad(w, vec2(0.98, 0.2), vec2(0.66, 0.7 + sw), 0.1, 0.05, sh, hit);     if (hit) col = c;
  c = heliconia(w, sw, hit);                                                    if (hit) col = c;
  c = broad(w, vec2(1.02, 0.12), vec2(0.42, 0.36 + sw), 0.12, -0.08, sh, hit);  if (hit) col = c;
  c = broad(w, vec2(1.02, 0.05), vec2(0.6, 0.03), 0.08, -0.04, sh, hit);       if (hit) col = c;
  c = broad(w, vec2(-1.02, 1.25), vec2(-0.62, 1.02 - sw), 0.09, -0.05, sh, hit); if (hit) col = c;
  c = spill(w, hit);
  if (hit) col = c;
  return col;
}

void main() {
  vec2 s = (gl_FragCoord.xy / uRes) * 2.0 - 1.0;
  vec2 w = vec2(s.x * uRes.x / uRes.y, s.y) * uSpan + vec2(0.0, 1.5);   // across the doorway, and up from its threshold
  vec3 col = vec3(1.0);
  const float FR = 0.07;   // how thick the steel is
  bool frame = false;
  if (abs(w.x) < 1.0 && w.y > 0.0 && w.y < 3.0) col = world(w);
  else if (abs(w.x) < 1.0 + FR && w.y > -FR && w.y < 3.0 + FR) {
    // The steel frame: lit on its left and top, a dark reveal on the right where it meets the opening
    frame = true;
    if (w.y < 0.0) col = STEEL[w.y > -uPx ? 3 : w.y < -FR + uPx ? 1 : 2];
    else if (w.y > 3.0) col = STEEL[w.y > 3.0 + FR - uPx ? 3 : 2];
    else if (w.x < 0.0) col = STEEL[w.x < -1.0 - FR + uPx ? 3 : 2];
    else col = STEEL[w.x < 1.0 + uPx ? 0 : 1];
  }
  // What spills over the threshold, and its soft shadow on the page
  if (w.y < 0.0 && w.y > -0.3 && abs(w.x) < 1.05) {
    bool hit;
    vec3 c = spill(w, hit);
    if (hit) col = c;
    else if (!frame) { spill(w + vec2(-0.03, 0.03), hit); if (hit) col = vec3(0.85, 0.86, 0.91); }
  }
  gl_FragColor = vec4(col, 1.0);
}`;

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas: stage, antialias: false });
renderer.setPixelRatio(1);
const uniforms = {
  uRes: { value: new THREE.Vector2(1, 1) }, uSpan: { value: 1.8 }, uPx: { value: 0.035 }, uPhase: { value: 0 },
  uShafts: { value: 1 }, uMist: { value: 1 }, uWind: { value: 1 }, uDrift: { value: new THREE.Vector2() }, uBird: { value: new THREE.Vector4() },
};
const scene = new THREE.Scene(), camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const page = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms, fragmentShader: frag, vertexShader: 'void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }', depthTest: false,
}));
page.frustumCulled = false;
scene.add(page);

let cols = 1, rows = 1, sizedW = -1, sizedH = -1;
function resize() {
  // A hidden pane reports no size; draw for a plausible one until it has one
  const w = innerWidth || 1280, h = innerHeight || 800;
  const scale = Math.max(3, Math.round(Math.min(w * 1.3, h) / 104));
  cols = Math.ceil(w / scale); rows = Math.ceil(h / scale);
  renderer.setSize(cols, rows, false);
  stage.style.width = cols * scale + 'px'; stage.style.height = rows * scale + 'px';
  uniforms.uRes.value.set(cols, rows);
  // The doorway is 2 wide and 3 tall, always whole, with a little page round it
  uniforms.uSpan.value = Math.max(1.8, 1.25 * rows / cols);
  uniforms.uPx.value = 2 * uniforms.uSpan.value / rows;
}

// Everything is a function of the time in the loop and nothing else, so the last frame meets the first
const LOOP = 7, TAU = Math.PI * 2;
const P = params({
  shafts: [1, 0, 2],   // how strong the light coming down through the leaves is
  mist: [1, 0, 2],     // how much mist hangs in the air and rises off the falls
  wind: [1, 0, 2],     // how much the vines, leaves and fern sway
});

function frame(now) {
  if (innerWidth !== sizedW || innerHeight !== sizedH) { sizedW = innerWidth; sizedH = innerHeight; resize(); }
  const t = now % LOOP, u = t / LOOP, U = uniforms;
  U.uPhase.value = u;
  U.uShafts.value = P.shafts; U.uMist.value = P.mist; U.uWind.value = P.wind;
  // The eye drifts a little, so the far layers slide behind the near
  U.uDrift.value.set(0.03 * Math.sin(u * TAU), 0);

  // The bird crosses in the middle of the loop, so it begins and ends calm: flapping, a glide, flapping again
  const k = (t - 2.6) / 2.2;
  if (k > 0 && k < 1) {
    const wing = k > 0.42 && k < 0.66 ? 0.25 : Math.sin(t * TAU * 5);
    U.uBird.value.set(-1.2 + 2.4 * k, 2.12 + 0.3 * k - 0.08 * Math.sin(Math.PI * k), wing, 1);
  } else U.uBird.value.set(0, 0, 0, 0);

  renderer.render(scene, camera);
}
loop(LOOP, frame);
</script>
