<meta charset="utf-8">
<title>Wrong floor: desert</title>
<style>
  /* Layout: a white page with one doorway on it, drawn in chunky pixels. Deliberately light-only. */
  :root { --bg: #ffffff; color-scheme: light; }
  html, body { height: 100%; }
  body { background: var(--bg); overflow: hidden; }
  #stage {
    position: fixed; left: 0; top: 0; display: block;
    image-rendering: pixelated;
  }
</style>

<canvas id="stage" aria-label="A seven second loop. A thin steel doorway stands on a white page. Through it, the same three towers stand broken open in a dead desert: floors bare to the sky, slabs hanging, sand piled against them and pouring from their windows, a bus roof, a bent sign and a lamp post half buried in front, and a wall of sandstorm on the horizon. The wind lifts sand off every edge and a little trickles over the threshold."></canvas>

<script type="module">
import * as THREE from 'three';
import { params, loop } from 'scene';

// Nothing here is a mesh: every pixel inside the doorway walks a ray from the eye out into the world
const frag = /* glsl */`
precision highp float;
uniform vec2 uRes;
uniform vec3 uSun;
uniform float uSpan, uU, uBlow, uStorm, uSwing;

const vec3 EYE = vec3(0.0, 1.6, 2.5);   // where you stand in the lift; the doorway is x -1 to 1, y 0 to 3, at z = 0
const float S = 3.5;                    // one storey
const float STORM = 700.0;              // how far off the wall of the storm stands
const vec3 T1 = vec3(-9.0, -40.0, -55.0);    // the tall thin tower, left of centre
const vec3 T2 = vec3(12.0, -40.0, -72.0);    // the broad one with the stepped top
const vec3 T3 = vec3(19.5, -40.0, -48.0);    // the short one at the far right
const float LEAN = 0.18;                   // and how far it leans to the left

// Five tones each: sand, concrete, rust, the bus's faded paint, the sign's green, the storm, the sky (low to high), steel
const vec3 PAL[40] = vec3[40](
  vec3(0.42, 0.23, 0.14), vec3(0.60, 0.37, 0.21), vec3(0.78, 0.55, 0.33), vec3(0.91, 0.73, 0.48), vec3(0.99, 0.89, 0.66),
  vec3(0.17, 0.13, 0.13), vec3(0.34, 0.27, 0.25), vec3(0.53, 0.45, 0.40), vec3(0.72, 0.65, 0.56), vec3(0.90, 0.85, 0.75),
  vec3(0.22, 0.10, 0.07), vec3(0.40, 0.19, 0.10), vec3(0.60, 0.31, 0.15), vec3(0.77, 0.48, 0.25), vec3(0.90, 0.66, 0.40),
  vec3(0.16, 0.21, 0.22), vec3(0.28, 0.38, 0.37), vec3(0.45, 0.58, 0.54), vec3(0.65, 0.76, 0.68), vec3(0.86, 0.90, 0.80),
  vec3(0.09, 0.17, 0.13), vec3(0.15, 0.31, 0.23), vec3(0.26, 0.47, 0.34), vec3(0.45, 0.65, 0.49), vec3(0.94, 0.93, 0.86),
  vec3(0.34, 0.20, 0.14), vec3(0.46, 0.29, 0.19), vec3(0.58, 0.40, 0.27), vec3(0.71, 0.53, 0.37), vec3(0.84, 0.69, 0.51),
  vec3(0.96, 0.83, 0.62), vec3(0.98, 0.89, 0.71), vec3(0.99, 0.93, 0.79), vec3(0.98, 0.95, 0.85), vec3(0.95, 0.94, 0.89),
  vec3(0.20, 0.21, 0.24), vec3(0.36, 0.38, 0.42), vec3(0.54, 0.56, 0.60), vec3(0.72, 0.74, 0.78), vec3(0.89, 0.90, 0.93)
);
const float BAYER[16] = float[16](0.0, 8.0, 2.0, 10.0, 12.0, 4.0, 14.0, 6.0, 3.0, 11.0, 1.0, 9.0, 15.0, 7.0, 13.0, 5.0);

// Steps between neighbouring tones in a fixed pattern; flat bands with dots only at the seams
float dots() { ivec2 c = ivec2(gl_FragCoord.xy) & 3; return (BAYER[c.y * 4 + c.x] + 0.5) / 16.0; }
float banded(float t, float steps) { float x = clamp(t, 0.0, 1.0) * steps, f = fract(x); return min(floor(x) + (smoothstep(0.25, 0.75, f) > dots() ? 1.0 : 0.0), steps) / steps; }
vec3 tone(int m, float t) { return PAL[m * 5 + int(banded(t, 4.0) * 4.0 + 0.5)]; }
vec3 plain(int m, float t) { return PAL[m * 5 + int(clamp(t, 0.0, 1.0) * 4.0 + 0.5)]; }   // for flat faces: one tone, no dots

float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float hash2(vec2 p) { vec3 q = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
float noise(vec3 x) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x), mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x), mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
float fbm(vec2 p) { return 0.5 * noise(vec3(p, 0.0)) + 0.25 * noise(vec3(p * 2.03, 1.7)) + 0.125 * noise(vec3(p * 4.1, 3.1)); }

float box(vec3 p, vec3 b) { vec3 d = abs(p) - b; return length(max(d, 0.0)) + min(max(d.x, max(d.y, d.z)), 0.0); }
float box2(vec2 p, vec2 b) { vec2 d = abs(p) - b; return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0); }
float ball(vec3 p, vec3 c, float r) { return length(p - c) - r; }
float rod(vec3 p, vec3 a, vec3 b, float r) { vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h) - r; }
vec2 turn(vec2 v, float a) { float c = cos(a), s = sin(a); return vec2(c * v.x - s * v.y, s * v.x + c * v.y); }

// Where a point out in the world shows in the doorway
vec2 toDoor(vec3 w) { float k = EYE.z / (EYE.z - w.z); return vec2(w.x * k, EYE.y + (w.y - EYE.y) * k); }

// The land: a drift at the threshold, a long slope of sand down into the dry bed of the sea, dunes, and sand piled against the towers
float dunePhase(vec2 q) { return fract((q.x * 0.85 + q.y * 0.5) / 40.0 + 0.15 * sin(q.y * 0.023 + q.x * 0.011)); }
float duneShape(float f) { float k = f < 0.74 ? f / 0.74 : (1.0 - f) / 0.26; return 1.0 - (1.0 - k) * (1.0 - k); }   // long back, steep lee to the right
float pile(vec2 q, vec3 c, vec2 hb, float top) { vec2 d = abs(q - c.xz) - hb; return top - 0.62 * length(max(d, 0.0)) - 0.06 * (q.x - c.x); }
float land(vec2 q) {
  float d = -q.y, x = d - 1.0, s = 0.5 * (x + sqrt(x * x + 1.0));
  float h = -45.0 * (1.0 - exp(-s / 90.0));
  float far = smoothstep(15.0, 160.0, d);
  h += (0.5 + 6.5 * far) * duneShape(dunePhase(q));
  h = max(h, pile(q, T1, vec2(5.0), -17.0));
  h = max(h, pile(q, T2, vec2(9.0, 7.5), -22.0));
  h = max(h, pile(q, T3, vec2(4.5), -15.0));
  h += 0.16 * exp(-(q.x - 0.15) * (q.x - 0.15) * 1.2) * smoothstep(-3.0, 0.0, q.y);   // the drift that reaches the threshold
  return h;
}

// The towers: walls up to where they give out, then only bare floors and columns, broken off unevenly
float bones(vec3 q, float env, vec2 hb, vec2 n) {
  float slab = abs(mod(q.y, S) - 0.4) - 0.4;
  vec2 c = (hb - 0.5) / n;
  vec2 r = q.xz - c * clamp(floor(q.xz / c + 0.5), -n, n);
  return max(min(slab, box2(r, vec2(0.45))), env);
}
// A slab torn off a floor, hanging from its rebar; x of h points out from the face
float hanging(vec3 h, float ang, vec3 size, out float bar) {
  h.xy = vec2(dot(h.xy, vec2(cos(ang), sin(ang))), dot(h.xy, vec2(-sin(ang), cos(ang))));
  bar = max(box2(vec2(h.y, mod(h.z + 0.6, 1.2) - 0.6), vec2(0.16)), max(abs(h.x - 0.45) - 0.55, abs(h.z) - size.z));
  return box(h - vec3(0.8 + size.x, 0.0, 0.0), size);
}
float tower1(vec3 p, out float m) {
  vec3 q = p - T1;
  float b = box(q - vec3(1.0, 37.0, 0.0), vec3(10.5, 16.0, 6.5));
  m = 1.0; if (b > 1.5) return b;
  float fall = floor(clamp(1.0 + 3.2 * q.x / 5.0 - 0.6 * q.z / 5.0 + 0.7 * sin(q.x * 1.5), 0.0, 5.0));   // storeys lost, more to the right
  float env = max(box(q - vec3(0.0, 28.0, 0.0), vec3(5.0, 28.0, 5.0)), q.y - (14.0 - fall) * S - 2.0);
  float wall = 8.4 * S + 3.5 * noise(vec3(q.xz * 0.45, 1.0)) - 0.8 * q.x / 5.0 * S;
  float shell = max(max(env, q.y - wall), q.y - (14.0 - fall) * S - 0.8);
  shell = max(shell, -ball(q, vec3(1.2, 25.5, 5.0), 2.2));     // blown open at the front
  shell = max(shell, -ball(q, vec3(-2.2, 28.8, 5.0), 1.3));    // a window burst, sand still running out of it
  shell = max(shell, -ball(q, vec3(-5.0, 26.0, -1.0), 2.4));   // and a hole in the sunny side
  float bone = bones(q, env, vec2(5.0), vec2(1.0)), bar;
  float hang = hanging(vec3(-5.0 - q.x, q.y - 13.0 * S - 0.4, q.z - 0.5), -0.85 + uSwing, vec3(2.2, 0.4, 2.0), bar);   // off the sunny side, from the top floor
  float d = min(shell, bone);
  m = shell < bone ? 1.0 : 2.0;
  if (hang < d) { d = hang; m = 2.0; }
  if (bar < d) { d = bar; m = 3.0; }
  return d;
}
float tier(vec3 q, float hx, float hz, float top) { return box(q - vec3(0.0, top * 0.5, 0.0), vec3(hx, top * 0.5, hz)); }
float tower2(vec3 p, out float m) {
  vec3 q = p - T2;
  float b = box(q - vec3(0.0, 38.0, 3.0), vec3(10.0, 16.0, 10.5));
  m = 1.0; if (b > 1.5) return b;
  float env = min(min(tier(q, 9.0, 7.5, 11.0 * S + 0.8), tier(q, 6.75, 5.5, 12.0 * S + 0.8)), tier(q, 4.5, 3.5, 13.0 * S + 0.8));
  env = max(env, -box(q - vec3(9.5, 40.0, 8.0), vec3(4.0, 7.5, 4.0)));              // a corner fallen away
  float wall = (11.6 - 1.2 * q.x / 9.0) * S + 3.0 * noise(vec3(q.xz * 0.4, 5.0));
  float shell = max(env, q.y - wall);
  shell = max(shell, -ball(q, vec3(-5.0, 34.0, 7.5), 2.4));
  shell = max(shell, -ball(q, vec3(9.0, 30.0, 1.0), 2.6));
  float crown = box(q - vec3(0.0, 47.7, 0.0), vec3(2.2, 1.4, 2.2));                // the plant room on top, still whole
  float bone = bones(q, env, vec2(9.0, 7.5), vec2(2.0)), bar;
  float hang = hanging(vec3(q.z - 7.5, q.y - 11.0 * S - 0.4, q.x - 3.0), -1.4 + uSwing * 0.8, vec3(2.0, 0.4, 1.9), bar);
  float mast = rod(q, vec3(1.2, 49.0, 0.5), vec3(1.9, 53.5, 0.8), 0.35);
  float d = min(shell, crown);
  m = 1.0;
  if (bone < d) { d = bone; m = 2.0; }
  if (hang < d) { d = hang; m = 2.0; }
  if (min(bar, mast) < d) { d = min(bar, mast); m = 3.0; }
  return d;
}
vec3 local3(vec3 p) { vec3 q = p - T3; q.y -= 20.0; q.xy = turn(q.xy, -LEAN); q.y += 20.0; return q; }
float tower3(vec3 p, out float m) {
  vec3 q = local3(p);
  float b = box(q - vec3(0.0, 33.0, 0.0), vec3(6.0, 12.0, 6.0));
  m = 1.5; if (b > 1.5) return b;
  float fall = floor(clamp(1.2 - 1.6 * q.x / 4.5 + 0.5 * sin(q.z * 0.9 + 2.0), 0.0, 3.0));   // crumbled on the side it leans to
  float env = max(box(q - vec3(0.0, 24.0, 0.0), vec3(4.5, 24.0, 4.5)), q.y - (12.0 - fall) * S - 2.0);
  float wall = (9.6 + 1.2 * q.x / 4.5) * S + 3.0 * noise(vec3(q.xz * 0.5, 9.0));
  float shell = max(max(env, q.y - wall), q.y - (12.0 - fall) * S - 0.8);
  shell = max(shell, -ball(q, vec3(-1.3, 31.5, 4.5), 2.1));
  float bone = bones(q, env, vec2(4.5), vec2(1.0));
  m = shell < bone ? 1.5 : 2.0;
  return min(shell, bone);
}
// Further off, the stumps of the rest of the city
float stump(vec3 p, vec3 c, vec3 hb) {
  vec3 q = p - c;
  float top = hb.y * 2.0 - S * floor(2.6 * noise(vec3(q.x * 0.3, q.z * 0.3, c.x)));
  return max(box(q - vec3(0.0, hb.y, 0.0), hb), q.y - top);
}
float ruinsFar(vec3 p) {
  if (p.z > -220.0) return p.z + 220.0 + 2.0;
  float d = stump(p, vec3(-75.0, -45.0, -290.0), vec3(7.0, 22.0, 6.0));
  d = min(d, stump(p, vec3(-28.0, -45.0, -390.0), vec3(5.0, 19.0, 5.0)));
  d = min(d, stump(p, vec3(52.0, -45.0, -330.0), vec3(10.0, 15.0, 7.0)));
  d = min(d, stump(p, vec3(96.0, -45.0, -250.0), vec3(6.0, 20.0, 6.0)));
  d = min(d, stump(p, vec3(-135.0, -45.0, -430.0), vec3(8.0, 17.0, 6.0)));
  return d;
}

// Half buried in front: the roof of a bus, a bent road sign, a lamp post, lumps of concrete
const vec3 BUS = vec3(-2.3, -5.5, -12.5);
const vec3 SIGNP = vec3(1.85, -0.95, -5.5);
vec3 busLocal(vec3 p) { vec3 q = p - BUS; q.xz = turn(q.xz, 0.5); q.yz = turn(q.yz, 0.36); q.xy = turn(q.xy, 0.12); return q; }
vec3 signLocal(vec3 p) { vec3 q = p - SIGNP; q.xz = turn(q.xz, -0.35); q.xy = turn(q.xy, 0.5); return q; }
float near(vec3 p, out float m) {
  m = 4.0;
  if (p.z < -24.0) return -24.0 - p.z + 1.0;
  vec3 q = busLocal(p);
  float d = box(q, vec3(1.0, 1.1, 5.25)) - 0.25;
  d = min(d, box(q - vec3(0.0, 1.38, 1.4), vec3(0.42, 0.07, 0.48)));         // the roof hatch
  float k = rod(p, vec3(1.0, -3.0, -5.2), vec3(1.05, -1.3, -5.2), 0.05);       // sign post, bent over
  k = min(k, rod(p, vec3(1.05, -1.3, -5.2), vec3(1.6, -0.72, -5.4), 0.05));
  float lamp = rod(p, vec3(-7.3, -9.0, -18.0), vec3(-7.7, 1.0, -18.0), 0.13);
  lamp = min(lamp, rod(p, vec3(-7.7, 1.0, -18.0), vec3(-7.45, 1.9, -18.0), 0.11));
  lamp = min(lamp, rod(p, vec3(-7.45, 1.9, -18.0), vec3(-6.55, 2.25, -18.05), 0.1));
  lamp = min(lamp, box(p - vec3(-6.05, 2.15, -18.08), vec3(0.5, 0.11, 0.2)));
  k = min(k, lamp);
  if (k < d) { d = k; m = 3.0; }
  float plate = box(signLocal(p), vec3(0.46, 0.3, 0.035));
  if (plate < d) { d = plate; m = 5.0; }
  vec3 c2 = p - vec3(2.6, -3.2, -8.2); c2.xz = turn(c2.xz, -0.4); c2.yz = turn(c2.yz, 0.5);
  float lumps = box(c2, vec3(0.6, 0.35, 0.45));
  if (lumps < d) { d = lumps; m = 2.0; }
  float bar = min(rod(p, vec3(2.3, -2.7, -8.0), vec3(2.0, -1.8, -7.6), 0.05), rod(p, vec3(2.9, -2.6, -8.3), vec3(3.5, -1.9, -8.6), 0.05));
  if (bar < d) { d = bar; m = 3.0; }
  return d;
}

float scene(vec3 p, out float m) {
  float d = (p.y - land(p.xz)) * 0.5, k, e;
  m = 0.0;
  e = tower1(p, k); if (e < d) { d = e; m = k; }
  e = tower2(p, k); if (e < d) { d = e; m = k; }
  e = tower3(p, k); if (e < d) { d = e; m = k; }
  e = ruinsFar(p); if (e < d) { d = e; m = 1.0; }
  e = near(p, k); if (e < d) { d = e; m = k; }
  return d;
}
float map(vec3 p) { float m; return scene(p, m); }
vec3 normalAt(vec3 p, float e) {
  vec2 k = vec2(e, -e);
  return normalize(k.xyy * map(p + k.xyy) + k.yyx * map(p + k.yyx) + k.yxy * map(p + k.yxy) + k.xxx * map(p + k.xxx));
}
// How much of the sun reaches a point; hard, because the light is
float sunAt(vec3 p) {
  float res = 1.0, t = 0.08;
  for (int i = 0; i < 56; i++) {
    vec3 q = p + uSun * t;
    float d = map(q);
    res = min(res, 18.0 * d / t);
    if (res < 0.01 || q.y > 20.0 || t > 170.0) break;
    t += clamp(d, 0.03 + t * 0.015, 9.0);
  }
  return clamp(res, 0.0, 1.0);
}

vec3 surface(vec3 p, vec3 n, float m, float t) {
  float facing = dot(n, uSun), lit = facing > 0.0 ? sunAt(p + n * max(0.04, t * 0.003)) : 0.0;
  float v = 0.06 + 0.1 * (0.5 + 0.5 * n.y) + lit * (0.3 + 0.7 * smoothstep(0.0, 0.8, facing));   // hard: in the sun or not
  if (m < 0.5) {
    float d = -p.z;
    float rip = fract(dot(p.xz, vec2(0.9, 2.2)) * 0.9 + 1.5 * noise(vec3(p.xz * 0.5, 2.0)));
    v += (rip < 0.28 ? -0.2 : 0.04) * (1.0 - smoothstep(3.0, 12.0, d));   // wind ripples close by: a shaded lee to each
    // Sand smoking off the dune crests while the wind is up
    float f = dunePhase(p.xz), crest = smoothstep(0.73, 0.745, f) * (1.0 - smoothstep(0.76, 0.84, f)) * smoothstep(30.0, 90.0, d);
    float g = hash2(floor(vec2(p.x * 0.7 - uU * 35.0, p.z * 0.45)));
    if (g > 1.0 - crest * 0.7 * uBlow) return PAL[4];
    return tone(0, v);
  }
  if (m < 1.9) {
    vec3 q = p - vec3(0.0, -40.0, 0.0), nn = n;
    if (m > 1.2) { q = local3(p); nn.xy = turn(n.xy, -LEAN); v *= 0.68; }   // the leaning one is stained darker, so it stands off the one behind
    if (nn.y > 0.6) return tone(0, v * 0.95);                     // sand drifted on every ledge
    float u = abs(nn.x) > abs(nn.z) ? q.z : q.x;
    float f = fract(q.y / S), w = fract(u / 4.0 + 0.5);
    vec2 cell = floor(vec2(u / 4.0 + 0.5, q.y / S));
    if (f > 0.36 && f < 0.8 && w < 0.58) {
      float h = hash2(cell + floor(p.xz * 0.01) * 13.0);
      return h < 0.07 ? plain(0, v * 0.85) : plain(1, v * 0.22);  // empty windows, a few filled with sand
    }
    return plain(1, v);
  }
  if (m < 2.5) return n.y > 0.6 ? plain(0, v * 0.95) : plain(1, v * 0.92);
  if (m < 3.5) return plain(2, v);
  if (m < 4.5) {
    vec3 q = busLocal(p), nl = n;
    nl.xz = turn(nl.xz, 0.5); nl.yz = turn(nl.yz, 0.36); nl.xy = turn(nl.xy, 0.12);
    if (nl.y > 0.55) {
      if (noise(vec3(q.xz * 0.9, 4.0)) > 0.64) return tone(0, v);          // sand blown up on the roof
      if (box2(q.xz - vec2(0.0, 1.4), vec2(0.42, 0.48)) > -0.06 && box2(q.xz - vec2(0.0, 1.4), vec2(0.42, 0.48)) < 0.06) return tone(3, v * 0.6);
      if (noise(vec3(q.xz * 1.3, 8.0)) > 0.66) return tone(2, v);          // rust
      return tone(3, v);
    }
    if (q.y > 0.15 && q.y < 0.95 && fract(q.z / 1.4) > 0.2) return tone(1, v * 0.2);    // the windows, glass long gone
    if (q.y > -0.3 && q.y < -0.05) return tone(2, v);                                  // its stripe
    return tone(3, v * 0.95);
  }
  vec3 q = signLocal(p);
  if (q.z < 0.0) return tone(1, v);
  float edge = max(abs(q.x) - 0.46, abs(q.y) - 0.3);
  bool arrow = (q.x > -0.16 && q.x < 0.28 && abs(q.y) < 0.06) || (q.x > -0.34 && q.x < -0.14 && abs(q.y) < (q.x + 0.34) * 0.85);
  return edge > -0.07 || arrow ? (v > 0.5 ? PAL[24] : PAL[8]) : tone(4, v * 0.75);
}

// Beyond: the wall of the storm along the horizon, rows of billows each swelling and settling, and the bleached sky over it.
// A row is rounded lobes side by side; under a lobe it is lit like a ball, below the lobes it is the dull body of the wall.
// x says whether the point is inside the row; yz is the tone it takes there.
vec2 billows(vec2 c, float base, float size, float seed, float row) {
  float cell = floor(c.x / size), best = -1e3, v = 0.0;
  for (int i = -1; i <= 1; i++) {
    float k = cell + float(i), h1 = hash2(vec2(k, seed)), h2 = hash2(vec2(seed, k + 7.0));
    float r = size * (0.62 + 0.45 * h2) * (1.0 + 0.07 * sin(6.2832 * (uU + h1)));   // each lobe breathes once a loop, out of step
    vec2 o = vec2((k + 0.2 + 0.6 * h1) * size, base + size * 0.6 * (h2 - 0.5) + 0.04 * size * sin(6.2832 * (uU + h2)));
    vec2 d = (c - o) / vec2(r, r * 0.55);                         // lobes far wider than tall: a wall, not a row of clouds
    if (abs(d.x) >= 1.0) continue;
    float top = o.y + r * 0.55 * sqrt(1.0 - d.x * d.x);
    if (top > best) {
      best = top;
      vec3 n = vec3(d, sqrt(max(1.0 - dot(d, d), 0.0)));
      v = dot(d, d) < 1.0 ? dot(n, vec3(-0.55, 0.55, 0.62)) : -0.25 + 0.15 * d.x;
    }
  }
  float edge = best - c.y;
  return vec2(edge, row + 0.4 * v + 0.12 * (noise(vec3(c * 0.05, seed)) - 0.5));
}
vec3 beyond(vec3 rd) {
  vec3 sky = PAL[30 + int(banded((rd.y - 0.12) * 2.6, 4.0) * 4.0 + 0.5)];
  float tc = (EYE.z + STORM) / -rd.z; vec2 c = (EYE + rd * tc).xy;
  // Rows stacked one behind and above another: the low front darkest, the high back palest and thinning at its crown
  for (int i = 0; i < 5; i++) {
    float k = float(i);
    vec2 b = billows(c, uStorm * (35.0 + 52.0 * k), 48.0 + 9.0 * k, 3.0 + 8.0 * k, 0.08 + 0.13 * k);
    if (b.x > 0.0 && (i < 4 || smoothstep(0.0, 22.0, b.x) > dots())) return tone(5, b.y);
  }
  return sky;
}

// Sand torn off an edge by the wind: grains streaming away to the right, rising a little, thinning out
vec2 spray(vec2 at, vec4 e, float seed) {
  vec2 d = at - toDoor(e.xyz);
  float a = d.x, len = e.w;
  if (a < 0.0 || a > len) return vec2(0.0);
  float b = d.y - (0.22 * a - 0.45 * a * a);
  float w = 0.004 + 0.12 * a;
  float dens = exp(-b * b / (w * w)) * (1.0 - a / len) * uBlow;
  float g = hash2(floor(vec2(a * 36.0 - uU * 196.0, b * 36.0)) + seed * 17.0);
  return vec2(g > 1.0 - dens * 0.55 ? 1.0 : 0.0, dens * 0.35);
}
// Sand pouring from a blown-out window: a thin fall, bent a little by the wind
float pour(vec2 at, vec4 s, float seed) {
  float k = EYE.z / (EYE.z - s.z), px = 0.028 / k;
  vec2 o = toDoor(s.xyz);
  float v = (o.y - at.y) / k;
  if (v < 0.0 || v > s.w) return 0.0;
  float x = (at.x - o.x) / k - 0.01 * v * v * (0.4 + uBlow);
  float g = hash2(floor(vec2(x / px, v / px - uU * 35.0)) + seed * 31.0);
  if (abs(x) < max(0.3 + 0.03 * v, px * 0.55)) return g > 0.45 ? 2.0 : 1.0;
  return abs(x) < 0.5 + 0.08 * v + px && g > 0.9 ? 2.0 : 0.0;
}
const vec4 POURS[3] = vec4[3](vec4(T2 + vec3(-5.0, 31.7, 7.6), 13.0), vec4(T1 + vec3(-2.2, 27.6, 5.1), 4.6), vec4(T3 + vec3(-2.6, 29.1, 4.6), 4.0));
const vec4 GUSTS[8] = vec4[8](
  vec4(T1 + vec3(0.5, 49.8, 5.0), 0.3), vec4(T2 + vec3(2.2, 49.1, 2.2), 0.28), vec4(T2 + vec3(6.75, 42.8, 5.5), 0.22), vec4(T3 + vec3(1.3, 43.2, 4.5), 0.25),
  vec4(-1.2, -4.2, -10.5, 0.45), vec4(2.2, -0.6, -5.4, 0.5), vec4(-0.5, 0.05, -0.6, 0.75), vec4(T1 + vec3(6.0, 23.0, 3.0), 0.3)
);

vec3 world(vec2 at) {
  vec3 rd = normalize(vec3(at, 0.0) - EYE);
  float t = length(vec3(at, 0.0) - EYE), tEnd = (EYE.z + STORM) / -rd.z, tHit = -1.0;
  for (int i = 0; i < 260; i++) {
    vec3 p = EYE + rd * t;
    float d = map(p);
    if (d < t * 0.0032) { tHit = t; break; }
    t += max(d * 0.8, t * 0.0015);
    if (t > tEnd || (rd.y > 0.0 && p.y > 20.0)) break;
  }
  vec3 col;
  if (tHit > 0.0) {
    vec3 p = EYE + rd * tHit; float m; scene(p, m);
    col = surface(p, normalAt(p, max(0.015, tHit * 0.002)), m, tHit);
    col = mix(col, PAL[27], floor((1.0 - exp(-tHit / 380.0)) * 4.0 + 0.1) * 0.19);   // by clean steps into the dust with distance
  } else col = beyond(rd);
  float far = tHit < 0.0 ? 1e5 : tHit;
  for (int i = 0; i < 3; i++) {
    if (far < length(POURS[i].xyz - EYE) - 2.0) continue;
    float g = pour(at, POURS[i], float(i));
    if (g > 1.5) col = PAL[4]; else if (g > 0.5) col = PAL[3];
  }
  for (int i = 0; i < 8; i++) {
    if (far < length(GUSTS[i].xyz - EYE) - 1.5) continue;
    vec2 g = spray(at, GUSTS[i], float(i));
    if (g.x > 0.5) col = PAL[4]; else if (g.y > dots() + 0.2) col = PAL[3];
  }
  return col;
}

// The page outside: the thin steel frame, and the sand that has run over the threshold onto it
vec3 page(vec2 at) {
  vec3 col = vec3(1.0);
  float fw = 0.06, rim = max(abs(at.x) - 1.0, max(at.y - 3.0, -at.y));
  if (rim < fw && at.y > -fw) {
    float v = at.x < -1.0 ? 0.8 : at.x > 1.0 ? 0.35 : at.y > 3.0 ? 0.62 : 0.52;
    col = tone(7, rim < fw * 0.5 ? v - 0.22 : v);
  }
  // The spill: a tongue of sand run over the sill, leaning off to the right with the wind
  float px = 2.0 * uSpan / uRes.y, y = -at.y, L = 0.27;
  vec2 cell = floor(at / px);
  float row = floor(y / px);
  float k = clamp(y / L, 0.0, 1.0), c = 0.1 + 0.25 * y;
  // A rounded lobe, spreading a little as it leaves the sill, with a ragged rim that thins to single grains
  float hw = 0.42 * (1.0 + 0.25 * k) * sqrt(max(1.0 - k * k, 0.0)) + px * 1.2 * (hash2(vec2(row, 3.0)) - 0.5);
  float x = (at.x - c) / max(hw, 1e-3);
  float rimOut = max(abs(x) - 1.0 + 2.0 * px / max(hw, 1e-3), (y - L + 2.0 * px) / px);
  bool thin = rimOut > 0.0 && hash2(cell + 2.0) > 0.45;
  if (y > -0.005 && y < L && abs(x) < 1.0 && !thin) {
    // Lit on the left, in shade on the right, a bright crest where it rolls over the sill, darker toward the toe
    float v = 0.74 - 0.42 * smoothstep(-0.2, 0.9, x) - 0.3 * k * k + 0.14 * (1.0 - smoothstep(0.0, 0.07, y));
    if (x > 1.0 - 1.1 * px / hw || y > L - 1.1 * px * (1.0 + 2.0 * k)) v -= 0.22;   // a dark lip on its shaded edge
    col = tone(0, v);
    // Grains sliding down it in three thin runs
    for (int i = 0; i < 3; i++) {
      float f = float(i), lane = c + hw * (-0.45 + 0.4 * f);
      if (abs(at.x - lane) < px * 0.5 && fract(y / 0.11 - uU * 3.0 - f * 0.37) < 0.14 && y < L * 0.8) col = PAL[4];
    }
    return col;
  }
  // Its shadow on the page, thrown down and to the right
  float xs = (at.x - px * 2.0 - c) / max(hw, 1e-3);
  if (y > 0.0 && y < L + px * 1.5 && abs(xs) < 1.0 && x > 0.0 && dots() < 0.5) col = vec3(0.86, 0.85, 0.84);
  // A few grains strewn about it
  if (y > 0.0 && length(vec2((at.x - 0.2) / 0.75, y / 0.48)) < 1.0 && hash2(cell + 5.0) > 0.975) col = PAL[2 + int(hash2(cell) * 2.0)];
  // In the gust, grains lifted off the crest skate away to the right
  if (y > -0.02 && y < 0.14 && at.x > 0.35) {
    float g = hash2(vec2(row, 9.0)), run = fract(uU * 2.0 + g), gx = 0.4 + run * 1.1;
    if (g > 0.55 && abs(at.x - gx) < px * 0.5 && (1.0 - run) * uBlow > 0.35 + 0.4 * hash2(vec2(row, floor(uU * 2.0 + g)))) col = PAL[3];
  }
  return col;
}

void main() {
  vec2 s = (gl_FragCoord.xy / uRes) * 2.0 - 1.0;
  vec2 at = vec2(s.x * uSpan * uRes.x / uRes.y, 1.5 + s.y * uSpan);   // a place on the page, in the doorway's own units
  vec3 col = abs(at.x) < 1.0 && at.y > 0.0 && at.y < 3.0 ? world(at) : page(at);
  gl_FragColor = vec4(col, 1.0);
}`;

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas: stage, antialias: false });
renderer.setPixelRatio(1);
const uniforms = {
  uRes: { value: new THREE.Vector2(1, 1) }, uSpan: { value: 1.85 }, uSun: { value: new THREE.Vector3() },
  uU: { value: 0 }, uBlow: { value: 0 }, uStorm: { value: 1 }, uSwing: { value: 0 },
};
const scene = new THREE.Scene(), camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms, fragmentShader: frag, vertexShader: 'void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }', depthTest: false,
}));
quad.frustumCulled = false;
scene.add(quad);

let sizedW = -1, sizedH = -1;
function resize() {
  // A hidden pane reports no size; draw for a plausible one until it has one
  const w = innerWidth || 1280, h = innerHeight || 800;
  const scale = Math.max(2, Math.round(Math.min(w * 1.3, h) / 130));
  const cols = Math.ceil(w / scale), rows = Math.ceil(h / scale);
  renderer.setSize(cols, rows, false);
  stage.style.width = cols * scale + 'px'; stage.style.height = rows * scale + 'px';
  uniforms.uRes.value.set(cols, rows);
  uniforms.uSpan.value = Math.max(1.85, 1.25 * rows / cols);
}

// Everything is a function of the time in the loop and nothing else, so the last frame meets the first
const LOOP = 7;
const P = params({
  wind: [1, 0, 2],          // how much sand the wind tears off every edge
  storm: [1, 0.5, 1.3],     // how high the wall of the sandstorm stands
  sun: [0.35, 0.12, 0.9],   // how high the sun is; lower makes longer shadows
});

function frame(now) {
  if (innerWidth !== sizedW || innerHeight !== sizedH) { sizedW = innerWidth; sizedH = innerHeight; resize(); }
  const u = (now % LOOP) / LOOP, U = uniforms;
  // One gust a loop, calm at either end so the doors can close on it
  const gust = (1 - Math.cos(u * Math.PI * 2)) / 2;
  U.uU.value = u;
  U.uBlow.value = P.wind * (0.15 + 0.85 * gust);
  U.uStorm.value = P.storm;
  U.uSwing.value = 0.05 * Math.sin(u * Math.PI * 4) * gust;
  // Hard low sun from the left, a little behind you
  U.uSun.value.set(-0.32, P.sun, 0.85).normalize();
  renderer.render(scene, camera);
}
loop(LOOP, frame);
</script>
