<meta charset="utf-8">
<title>Bigger fish</title>
<style>
  /* Layout: a white page with one thing on it, drawn in chunky pixels. Deliberately light-only. */

  #stage {

<canvas id="stage" aria-label="A loop of about fifteen seconds. A black cat sits watching a round glass fishbowl. Inside it is deep ocean, and a whale's eye drifts past the glass, looking at her. Her pupils go wide and her tail stops. It passes, and she turns to look at us."></canvas>

<script type="module">
import * as THREE from 'three';
import { params, loop, sections } from 'scene';

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

// The cat is not a mesh: every pixel walks a ray to a shape made of blended blobs, roughened into fur. The bowl is a sphere met exactly.
const frag = /* glsl */`
precision highp float;
uniform vec2 uRes;
uniform vec3 uRight, uUp, uFwd, uTarget, uLight;
uniform float uSpan, uBlink, uBreath, uPupil, uRound, uWater, uWhaleSize, uFar;
uniform mat3 uHead;
uniform vec3 uTail[6];
uniform vec2 uEar, uWhale, uLook;
uniform vec3 uWhisk[18];

// Black, and the few greys the light is allowed to pull out of it
const vec3 FUR[5] = vec3[5](vec3(0.03, 0.028, 0.04), vec3(0.13, 0.115, 0.15), vec3(0.25, 0.21, 0.24), vec3(0.42, 0.34, 0.32), vec3(0.66, 0.56, 0.48));
const vec3 IRIS[3] = vec3[3](vec3(0.34, 0.36, 0.08), vec3(0.64, 0.68, 0.2), vec3(0.86, 0.87, 0.42));
const vec3 FLOOR[3] = vec3[3](vec3(1.0), vec3(0.85, 0.86, 0.91), vec3(0.66, 0.67, 0.76));
// The deep, and the whale in it
const vec3 OCEAN[5] = vec3[5](vec3(0.015, 0.03, 0.06), vec3(0.03, 0.07, 0.12), vec3(0.06, 0.13, 0.2), vec3(0.11, 0.22, 0.3), vec3(0.22, 0.38, 0.45));
const vec3 SKIN[5] = vec3[5](vec3(0.02, 0.025, 0.04), vec3(0.07, 0.085, 0.11), vec3(0.14, 0.16, 0.2), vec3(0.25, 0.28, 0.32), vec3(0.46, 0.49, 0.5));
// Glass: its edge seen side-on, its tint, its reflections, its shine
const vec3 GLASS[4] = vec3[4](vec3(0.34, 0.45, 0.5), vec3(0.6, 0.71, 0.75), vec3(0.82, 0.9, 0.92), vec3(1.0));
const float BAYER[16] = float[16](0.0, 8.0, 2.0, 10.0, 12.0, 4.0, 14.0, 6.0, 3.0, 11.0, 1.0, 9.0, 15.0, 7.0, 13.0, 5.0);

const vec3 PIVOT = vec3(0.0, 0.7, 0.06);    // where the head turns on the neck
const vec3 EYE = vec3(0.074, 0.858, 0.234);
const float EYE_R = 0.042;
const float BIG = 1.42;                     // how much larger the head is than it was modelled
const float SQUAT = 0.84;                   // and how much shorter the body
const vec3 NECK = vec3(0.0, 0.59, 0.07);    // where that puts the pivot
const vec3 HEART = vec3(0.0, 0.5, -0.12);   // middle of the whole cat, for the ball that bounds it
const vec3 CAT = vec3(-0.42, 0.0, 0.06);    // where she sits
const float CAT_YAW = 1.08;                 // turned side-on to the bowl

const vec3 BC = vec3(0.42, 0.32, -0.02);    // the bowl: a sphere, cut flat at the floor and open at the top
const float BR = 0.34, TOP = 0.585, RR = 0.213, FOOT = 0.115;

float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float noise(vec3 x) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x), mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x), mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
float smin(float a, float b, float k) { float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }
float ball(vec3 p, vec3 c, float r) { return length(p - c) - r; }
float egg(vec3 p, vec3 c, vec3 r) { vec3 q = (p - c) / r; float k0 = length(q), k1 = length(q / r); return k0 * (k0 - 1.0) / max(k1, 1e-4); }
float rod(vec3 p, vec3 a, vec3 b, float ra, float rb) {
  vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h) - mix(ra, rb, h);
}

// Clumps and wisps: what makes the outline ragged
float fur(vec3 p) { return (noise(p * vec3(11.0, 6.0, 11.0)) - 0.5) * 0.06 + (noise(p * vec3(21.0, 10.0, 21.0)) - 0.5) * 0.03; }

// The cat's own space: she sits at CAT, turned towards the bowl
vec3 toCat(vec3 p) { vec3 q = p - CAT; float c = cos(CAT_YAW), s = sin(CAT_YAW); return vec3(c * q.x - s * q.z, q.y, s * q.x + c * q.z); }
vec3 catToWorld(vec3 q) { float c = cos(CAT_YAW), s = sin(CAT_YAW); return vec3(c * q.x + s * q.z, q.y, -s * q.x + c * q.z) + CAT; }
vec3 toHead(vec3 p) { return uHead * (p - NECK) / BIG + PIVOT; }

// One ear, in a space squashed front to back; x is the ear itself, y the hollow scooped out of its front
vec2 ear(vec3 q, float side) {
  float e = side < 0.0 ? uEar.x : uEar.y;
  vec3 a = vec3(0.09, 0.95, 0.11), b = vec3(0.15 + 0.05 * e, 1.1 - 0.045 * e, 0.09 - 0.03 * e);
  vec3 s = vec3(q.x, q.y, (q.z - 0.1) * 1.8 + 0.1);
  float d = rod(s, a, b, 0.07, 0.022);
  float scoop = rod(s, a + vec3(0.006, 0.022, 0.075), b + vec3(-0.004, -0.03, 0.06), 0.05, 0.004);
  return vec2(max(d, -scoop), scoop) / 1.8;
}
// q is in the head's own space, folded so one side does for both
float headPart(vec3 hq) {
  vec3 q = vec3(abs(hq.x), hq.yz);
  float d = egg(q, vec3(0.0, 0.86, 0.13), vec3(0.165, 0.14, 0.15));
  d = smin(d, ball(q, vec3(0.095, 0.815, 0.16), 0.082), 0.04);                       // jowls
  d = smin(d, egg(q, vec3(0.0, 0.812, 0.25), vec3(0.07, 0.05, 0.055)), 0.03);        // muzzle
  float tufts = fur(hq);
  d -= tufts * 0.45 * smoothstep(0.042, 0.1, length(q - EYE));                      // otherwise fur grows over the eyes
  return smin(d, ear(q, hq.x).x - tufts * 0.22, 0.025);
}
float bodyPart(vec3 p) {
  vec3 q = vec3(abs(p.x), p.yz);
  float d = egg(q, vec3(0.0, 0.27, -0.2), vec3(0.3, 0.28, 0.34));                                        // rump
  d = smin(d, egg(q, vec3(0.21, 0.2, -0.1), vec3(0.14, 0.21, 0.22)), 0.06);                               // haunches
  d = smin(d, rod(q, vec3(0.0, 0.3, -0.14), vec3(0.0, 0.6, 0.07), 0.21 + uBreath, 0.17 + uBreath), 0.08); // back and belly
  d = smin(d, ball(q, vec3(0.0, 0.6, 0.14), 0.15), 0.06);                                                // ruff
  d = smin(d, rod(q, vec3(0.0, 0.6, 0.06), vec3(0.0, 0.78, 0.11), 0.155, 0.14), 0.06);                   // neck
  d = smin(d, rod(q, vec3(0.085, 0.45, 0.13), vec3(0.09, 0.07, 0.2), 0.058, 0.048), 0.04);                // forelegs
  d = smin(d, egg(q, vec3(0.09, 0.035, 0.235), vec3(0.058, 0.042, 0.078)), 0.03);                         // and their paws
  d = smin(d, egg(q, vec3(0.2, 0.035, 0.1), vec3(0.06, 0.042, 0.11)), 0.04);                              // hind feet
  float tail = 1e3;
  for (int i = 0; i < 5; i++) tail = min(tail, rod(p, uTail[i], uTail[i + 1], 0.058 - 0.003 * float(i), 0.055 - 0.004 * float(i)));
  return smin(d, tail, 0.05) - fur(p);
}
float body(vec3 p) { return bodyPart(vec3(p.x, p.y / SQUAT, p.z)) * SQUAT; }
float catMap(vec3 p) {
  vec3 hq = toHead(p), q = vec3(abs(hq.x), hq.yz);
  float d = smin(body(p), headPart(hq) * BIG, 0.05);
  return min(d, ball(q, EYE, EYE_R) * BIG);
}
float map(vec3 p) { return catMap(toCat(p)); }

vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.014, -0.014);
  return normalize(e.xyy * map(p + e.xyy) + e.yyx * map(p + e.yyx) + e.yxy * map(p + e.yxy) + e.xxx * map(p + e.xxx));
}
// How much of the lamp reaches a point, soft at the edges
float lampAt(vec3 ro) {
  float res = 1.0, t = 0.03;
  for (int i = 0; i < 22; i++) {
    float d = map(ro + uLight * t);
    res = min(res, 9.0 * d / t);
    t += clamp(d, 0.02, 0.12);
    if (res < 0.01 || t > 1.7) break;
  }
  return clamp(res, 0.0, 1.0);
}
// Whether a ray from the glass meets the cat: she shows, dark, in the curve of the bowl
bool meets(vec3 ro, vec3 rd, vec3 c, float r) { vec3 oc = ro - c; float b = dot(oc, rd); return b < 0.0 && b * b - dot(oc, oc) + r * r > 0.0; }
bool seesCat(vec3 ro, vec3 rd) {
  return meets(ro, rd, catToWorld(vec3(0.0, 0.3, -0.12)), 0.3) || meets(ro, rd, catToWorld(vec3(0.0, 0.85, 0.15)), 0.2);
}
// Steps between neighbouring tones in a fixed pattern, so shading is dots, not blends
float dots() { ivec2 c = ivec2(gl_FragCoord.xy) & 3; return (BAYER[c.y * 4 + c.x] + 0.5) / 16.0; }
int rung(float t, float steps) { float x = clamp(t, 0.0, 1.0) * steps; return int(min(floor(x) + (fract(x) > dots() ? 1.0 : 0.0), steps)); }
// Tones in clean bands, with dots only in a narrow seam where one meets the next
int band(float t, float steps) { float x = clamp(t, 0.0, 1.0) * steps, f = fract(x); return int(min(floor(x) + (smoothstep(0.32, 0.68, f) > dots() ? 1.0 : 0.0), steps)); }

vec3 eyeColour(vec3 hq) {
  float side = sign(hq.x);
  vec2 uv = vec2(hq.x - side * EYE.x, hq.y - EYE.y) / EYE_R;
  // Lids: the eye is an almond, higher at the outer corner, and it shuts from the top
  float v = uv.y - 0.22 * uv.x * side, wide = 1.0 - uBlink, lid = mix(-0.55, 0.85, wide);
  if (v > lid || v < -0.85 + 0.25 * uBlink) return FUR[0];
  if (length(uv - vec2(-0.3, 0.3)) < 0.26 && uBlink < 0.3) return vec3(0.96);           // the glint of the lamp
  if (length(vec2(uv.x / uPupil, (uv.y + 0.03) / 0.86)) < 1.0) return vec3(0.01);        // the pupil: a slit, or wide and black
  // The iris glows from below, and the lid shades its top
  int i = length(uv) > 0.82 || v > lid - 0.32 ? 0 : (uv.y < -0.2 ? 2 : 1);
  return IRIS[i];
}

vec3 catColour(vec3 p, vec3 n) {
  vec3 cp = toCat(p), hq = toHead(cp), q = vec3(abs(hq.x), hq.yz);
  if (ball(q, EYE, EYE_R) < 0.004) return eyeColour(hq);
  float head = smoothstep(0.03, -0.03, headPart(hq) * BIG - body(cp));
  vec3 lp = head > 0.5 ? hq : cp;
  float lamp = lampAt(p + n * 0.02);
  float lit = max(dot(n, uLight), 0.0) * lamp;
  float sheen = pow(1.0 - max(dot(n, -uFwd), 0.0), 2.5) * clamp(0.5 + dot(n, uLight), 0.0, 1.0);
  float nook = clamp(0.5 + 0.5 * map(p + n * 0.07) / 0.07, 0.0, 1.0);
  float tone = lit * 0.5 + sheen * 0.4 + (noise(lp * 16.0) - 0.5) * 0.1;
  return FUR[rung(tone * nook, 4.0)];
}

// The land: a flat white page, with her shadow and the bowl's on it. The bowl's is a ring, since the glass gathers light into its middle.
vec3 landAt(vec3 g) {
  float shade = 0.0;
  vec3 hc = catToWorld(HEART);
  float near = 1.0 - smoothstep(0.7, 1.45, length(g.xz - hc.xz));
  if (near > 0.0) {
    float under = 1.0 - clamp(map(g) / 0.16, 0.0, 1.0);
    shade = near * ((1.0 - lampAt(g + vec3(0.0, 0.012, 0.0))) * 0.42 + under * under * 0.5);
  }
  vec3 v = BC - g; float along = dot(v, uLight);
  if (along > 0.0) {
    float x = length(v - uLight * along) / BR;
    shade = max(shade, mix(0.08, 0.44, smoothstep(0.3, 0.92, x)) * (1.0 - smoothstep(0.92, 1.12, x)));
  }
  shade = max(shade, 0.6 * (1.0 - smoothstep(FOOT * 0.95, FOOT * 1.45, length(g.xz - BC.xz))));
  return FLOOR[rung(shade, 2.0)];
}

// The whale's eye, e in eye radii; a is how open the almond is across
vec3 whaleEye(vec2 e, float a) {
  vec2 ic = e - uLook;
  if (length(ic - vec2(-0.1, 0.2)) < 0.16) return vec3(0.9, 0.92, 0.9);                   // a glint
  float ir = length(ic), shut = 0.6 * a - 0.2;
  if (ir < 0.3) return vec3(0.01, 0.01, 0.02);
  if (ir < 0.6) return e.y > shut ? vec3(0.09, 0.055, 0.04) : vec3(0.22, 0.13, 0.07);     // iris, in the shadow of the lid
  return e.y > shut ? vec3(0.42, 0.4, 0.35) : vec3(0.7, 0.67, 0.57);                       // the white, seen as it looks aside
}
// Beyond the glass: deep water, lit from far above, and something in it far too big for the bowl. o is where you are looking, in the ocean.
vec3 ocean(vec2 o, float glow) {
  float shafts = 0.5 + 0.5 * sin((o.x + 0.55 * o.y) * 2.6 + 0.8 * sin(o.x * 1.1 + uRound * 6.2832) + uRound * 6.2832);
  float lt = 0.3 + 0.17 * o.y + 0.12 * shafts * smoothstep(-1.2, 1.6, o.y) + glow * 0.25;
  vec3 col = OCEAN[band(lt, 4.0)];

  // The whale: its head, the eye near the corner of its mouth, a pleated throat, then a flank that goes on and on
  vec2 w = (o - uWhale) / uWhaleSize;
  float x = w.x, y = w.y, fx = max(x, 0.0), k = max(-x - 1.5, 0.0);
  float top = 1.6 - 0.35 * fx * fx - 0.25 * k, belly = -0.85 + 0.12 * fx * fx + 0.25 * k;
  float snout = 1.6 - 0.45 * (y - 0.1) * (y - 0.1);
  if (y < top && y > belly && x < snout) {
    float f = (y - belly) / (top - belly), mouth = -0.36 + 0.06 * x;
    float s = 0.2 + 0.3 * smoothstep(0.1, 0.9, f) - 0.14 * (1.0 - smoothstep(0.0, 0.14, f)) - 0.14 * smoothstep(-0.35, 0.0, x - snout);
    s += (noise(vec3(w * 3.2, 1.0)) - 0.5) * 0.16 + glow * 0.15;
    if (y < mouth && x > -0.9) s += 0.08 + (fract((y - belly) * 7.0) < 0.32 ? 0.16 : 0.0);           // the throat, pleated
    vec2 cell = floor(w * 2.6), fr = fract(w * 2.6) - 0.5;
    float hh = hash(vec3(cell, 3.0));
    if (hh > 0.84 && y > mouth && length(fr - (hash(vec3(cell, 7.0)) - 0.5) * 0.5) < 0.12 + (hh - 0.84) * 0.6) s = 0.78;   // barnacles
    vec2 e = w / 0.26;
    float r = length(e * vec2(0.72, 1.0));
    if (r > 1.0 && r < 1.4) s += 0.12;                                   // the swell of the lids
    else if (r < 2.8 && fract(r * 1.5) < 0.2) s -= 0.1;                  // and the wrinkles round them
    if (abs(y - mouth) < 0.04 && x > -0.9) s = 0.0;                      // the line of the mouth
    vec3 wc = SKIN[band(s * (1.0 - 0.5 * uFar), 4.0)];
    float a = 1.0 - e.x * e.x;
    if (a > 0.0 && e.y < 0.6 * a && e.y > -0.45 * a) wc = whaleEye(e, a);
    else if (a > -0.3 && e.y < 0.6 * a + 0.17 && e.y > -0.45 * a - 0.14) wc = SKIN[0];
    if (dots() >= uFar) col = wc;                                         // and as it goes, it goes into the dark
  }
  // Drifting specks, between us and it
  vec2 m = o * 3.0 + vec2(0.0, uRound * 6.0), id = floor(m), fm = fract(m) - 0.5;
  if (hash(vec3(id, 11.0)) > 0.72 && length(fm - (vec2(hash(vec3(id, 5.0)), hash(vec3(id, 9.0))) - 0.5) * 0.6) < 0.1) col = OCEAN[4];
  return col;
}

// How many picture pixels a point on a level plane is from a circle round the bowl's axis
float ringPx(vec3 g, float R, vec3 rd) {
  float px = 2.0 * uSpan / uRes.y;
  vec2 dir = normalize(g.xz - BC.xz);
  vec3 du = uUp * px - rd * (uUp.y * px / rd.y), dr = uRight * px - rd * (uRight.y * px / rd.y);
  return (length(g.xz - BC.xz) - R) / max(length(vec2(dot(dir, dr.xz), dot(dir, du.xz))), 1e-5);
}

// The front of the glass: its edge, the room and the cat reflected in its curve, and the window shining in it
vec3 shine(vec3 col, vec3 p0, vec3 n0, vec3 rd, bool wet, float ds) {
  vec3 r = reflect(rd, n0);
  vec2 rs = vec2(dot(r, uRight), dot(r, uUp)), sn = vec2(dot(n0, uRight), dot(n0, uUp));
  vec2 dir = sn / max(length(sn), 1e-4);
  bool cat = ds < 7.0 && seesCat(p0 + n0 * 0.01, r);
  if (ds < 1.0) return GLASS[0];
  float facing = clamp(dot(dir, vec2(-0.6, 0.8)), 0.0, 1.0), rim = 1.0 + 2.6 * facing * facing;
  if (ds < 1.0 + rim) return cat ? (wet ? FUR[0] : GLASS[1]) : (wet ? GLASS[ds < 1.0 + rim * 0.5 ? 2 : 1] : GLASS[2]);
  vec2 wv = (rs - vec2(dot(uLight, uRight), dot(uLight, uUp))) / vec2(0.2, 0.24);
  float box = max(abs(wv.x), abs(wv.y));
  if (!cat && box < 1.0 && abs(wv.x) > 0.17 && abs(wv.y) > 0.17) return vec3(1.0);   // the window, four panes
  if (wet && !cat && box < 1.7 && dots() > 0.5) col = max(col, GLASS[0]);
  if (wet && dot(dir, vec2(0.6, -0.8)) > 0.975 && ds < 3.4) col = GLASS[2];          // and its glint on the far side, low
  return col;
}

vec3 bowl(vec3 ro, vec3 rd, vec3 base, float tBase, inout float tNear) {
  vec3 oc = ro - BC; float b = dot(oc, rd), c = dot(oc, oc) - BR * BR, h = b * b - c;
  if (h <= 0.0) return base;
  h = sqrt(h);
  float t0 = -b - h, t1 = -b + h;
  vec3 p0 = ro + rd * t0;
  float tTop = (TOP - ro.y) / rd.y; vec3 gT = ro + rd * tTop;
  float lip = ringPx(gT, RR, rd);
  // The lip round the opening: rolled glass, catching the lamp at the front
  if (abs(lip) < 0.95 && tTop < tBase) {
    tNear = tTop;
    float lit = dot(normalize(gT.xz - BC.xz), normalize(uLight.xz));
    return lit > 0.6 ? GLASS[3] : (lip > 0.0 ? GLASS[0] : GLASS[1]);
  }
  bool front = p0.y > 0.0 && p0.y < TOP, mouth = !front && p0.y >= TOP && lip < 0.0;
  if (!front && !mouth) return base;
  float tIn = front ? t0 : tTop;
  if (tIn > tBase) return base;
  tNear = tIn;
  vec3 n0 = (p0 - BC) / BR;
  float ds = (BR - length(oc - rd * b)) / (2.0 * uSpan / uRes.y);   // pixels in from the bowl's outline
  float tW = (uWater - ro.y) / rd.y, rw = sqrt(max(BR * BR - (uWater - BC.y) * (uWater - BC.y), 0.0));
  bool wet = front && p0.y < uWater;
  vec3 col;
  if (wet) {
    // Straight into the water: bent by the glass, which is what makes the ocean in it so wide
    vec3 d = refract(rd, n0, 0.75);
    vec2 sn = vec2(dot(n0, uRight), dot(n0, uUp));
    float glow = smoothstep(0.72, 0.97, length(sn)) * smoothstep(0.3, 0.9, dot(normalize(sn), vec2(0.71, -0.71)));
    col = ocean(-vec2(dot(d, uRight), dot(d, uUp)) * 4.0, glow);
    if (p0.y < 0.04) col = p0.y > 0.03 ? GLASS[2] : GLASS[1];        // the thick glass of the base
  } else if (tW > tIn && tW < t1) {
    // Down onto the water's surface: dark, paler where it reflects the far side, with the meniscus bright round it
    vec3 g = ro + rd * tW;
    float m = ringPx(g, rw, rd);
    if (m > -1.2) col = GLASS[2];
    else {
      float back = dot((g.xz - BC.xz) / rw, normalize(uFwd.xz));
      float near = smoothstep(1.8, 0.4, abs(uWhale.x)) * (1.0 - uFar);
      col = OCEAN[band(0.22 + 0.3 * smoothstep(-0.3, 1.0, back) - 0.15 * near, 4.0)];
    }
  } else col = base * vec3(0.93, 0.97, 0.98);
  if (front) col = shine(col, p0, n0, rd, wet, ds);
  return col;
}

// Whiskers: fine curves, drawn a pixel wide where they lie on the picture, hidden where the head is in front of them
vec2 onPicture(vec3 w) { return vec2(dot(w - uTarget, uRight), dot(w - uTarget, uUp)); }
vec3 whiskers(vec3 ro, vec3 rd, vec3 col, float tDepth, bool overCat) {
  float px = 2.0 * uSpan / uRes.y;
  vec2 me = onPicture(ro);
  for (int i = 0; i < 6; i++) {
    vec3 a = uWhisk[i * 3], c = uWhisk[i * 3 + 1], b = uWhisk[i * 3 + 2], prev = a;
    for (int k = 1; k <= 6; k++) {
      float u = float(k) / 6.0;
      vec3 cur = mix(mix(a, c, u), mix(c, b, u), u);
      vec2 s0 = onPicture(prev), ba = onPicture(cur) - s0, pa = me - s0;
      float hh = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-8), 0.0, 1.0);
      if (length(pa - ba * hh) < 0.55 * px) {
        float along = (float(k - 1) + hh) / 6.0, depth = dot(mix(prev, cur, hh) - ro, rd);
        if (depth < tDepth + 0.015 && (along < 0.6 || dots() > (along - 0.6) / 0.4)) col = overCat ? vec3(0.74, 0.72, 0.68) : vec3(0.5, 0.5, 0.55);
      }
      prev = cur;
    }
  }
  return col;
}

void main() {
  vec2 s = (gl_FragCoord.xy / uRes) * 2.0 - 1.0, at = vec2(s.x * uSpan * uRes.x / uRes.y, s.y * uSpan);
  vec3 ro = uTarget + uRight * at.x + uUp * at.y - uFwd * 5.0, rd = uFwd;
  float tFloor = -ro.y / rd.y, tCat = -1.0;
  // Only rays that pass near the cat need walking
  vec3 oc = ro - catToWorld(HEART); float b = dot(oc, rd), c = dot(oc, oc) - 0.85 * 0.85, disc = b * b - c;
  if (disc > 0.0) {
    float t = -b - sqrt(disc), tEnd = min(-b + sqrt(disc), tFloor);
    for (int i = 0; i < 110 && t < tEnd; i++) {
      float d = map(ro + rd * t);
      if (d < 0.002) { tCat = t; break; }
      t += d * 0.6;   // fur is too bumpy to trust a full step
    }
  }
  vec3 col; float tBase;
  if (tCat > 0.0) { vec3 p = ro + rd * tCat; col = catColour(p, normalAt(p)); tBase = tCat; }
  else { col = landAt(ro + rd * tFloor); tBase = tFloor; }
  float tNear = tBase;
  col = bowl(ro, rd, col, tBase, tNear);
  col = whiskers(ro, rd, col, tNear, tCat > 0.0 && tNear >= tCat - 0.001);
  gl_FragColor = vec4(col, 1.0);
}`;

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas: stage, antialias: false });
renderer.setPixelRatio(1);
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const uniforms = {
  uRes: { value: new THREE.Vector2(1, 1) }, uSpan: { value: 0.72 },
  uRight: { value: V() }, uUp: { value: V() }, uFwd: { value: V() }, uTarget: { value: V(-0.05, 0.48, 0) }, uLight: { value: V() },
  uBlink: { value: 0 }, uBreath: { value: 0 }, uPupil: { value: 0.2 }, uRound: { value: 0 }, uWater: { value: 0.46 },
  uWhaleSize: { value: 1 }, uFar: { value: 0 }, uHead: { value: new THREE.Matrix3() },
  uTail: { value: Array.from({ length: 6 }, () => V()) }, uEar: { value: new THREE.Vector2() },
  uWhale: { value: new THREE.Vector2() }, uLook: { value: new THREE.Vector2() },
  uWhisk: { value: Array.from({ length: 18 }, () => V()) },
};
const scene = new THREE.Scene(), camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const page = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms, fragmentShader: frag, vertexShader: 'void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }', depthTest: false,
}));
page.frustumCulled = false;
scene.add(page);

let cols = 1, rows = 1, sizedW = -1, sizedH = -1;
function resize() {
  // A hidden pane reports no size; draw for a plausible one until it has one
  const w = innerWidth || 1280, h = innerHeight || 800;
  const scale = Math.max(3, Math.round(Math.min(w * 1.3, h) / 104));
  cols = Math.ceil(w / scale); rows = Math.ceil(h / scale);
  renderer.setSize(cols, rows, false);
  stage.style.width = cols * scale + 'px'; stage.style.height = rows * scale + 'px';
  uniforms.uRes.value.set(cols, rows);
  uniforms.uSpan.value = Math.max(0.72, 1.05 * rows / cols);
}

// Dragging only shifts where you watch from; the loop itself answers to nothing
const view = { yaw: 0, pitch: 0.3 };
const drag = { down: false, x: 0, y: 0 };
stage.addEventListener('pointerdown', e => { stage.setPointerCapture(e.pointerId); Object.assign(drag, { down: true, x: e.clientX, y: e.clientY }); stage.classList.add('turning'); });
addEventListener('pointermove', e => {
  if (!drag.down) return;
  view.yaw -= (e.clientX - drag.x) * 0.008; view.pitch = clamp(view.pitch + (e.clientY - drag.y) * 0.004, 0.1, 0.9);
  drag.x = e.clientX; drag.y = e.clientY;
});
const release = () => { drag.down = false; stage.classList.remove('turning'); };
addEventListener('pointerup', release);
addEventListener('pointercancel', release);

const EASE = {
  lin: x => x, io: x => x < 0.5 ? 4 * x * x * x : 1 - (2 - 2 * x) ** 3 / 2, in: x => x * x * x, out: x => 1 - (1 - x) ** 3,
  snap: x => 1 - (1 - x) ** 5, fall: x => x ** 4, back: x => 1 + 2.70158 * (x - 1) ** 3 + 1.70158 * (x - 1) ** 2,
};
// A track is a list of [when, pose, how to arrive]; between entries it moves, after the last it stays
function key(track, t) {
  if (t <= track[0][0]) return track[0][1];
  for (let i = 1; i < track.length; i++) if (t < track[i][0]) {
    const [t0, a] = track[i - 1], [t1, b, how = 'io'] = track[i], k = EASE[how]((t - t0) / (t1 - t0));
    return typeof a === 'number' ? a + (b - a) * k : a.map((v, j) => v + (b[j] - v) * k);
  }
  return track[track.length - 1][1];
}
const bump = (t, at, len) => t > at && t < at + len ? Math.sin((t - at) / len * Math.PI) : 0;

// The story: she watches, the eye comes past, it is gone, she looks at us
const S = sections({ watching: 3.5, eye: 6, passes: 1.5, looksAtUs: 3.5 });
const END = 14.5;
const P = params({
  water: [0.76, 0.1, 1],      // how full the bowl is
  whale: [1, 0.6, 1.6],       // how big the whale looks through the glass
  sway: [0.1, 0, 0.3],        // how far the view sways
});

// Her head: turned to the bowl, following the eye, then round to us and back
const HEAD = [   // [yaw, pitch, roll]
  [0, [0.52, 0.36, 0.12]], [4.6, [0.52, 0.36, 0.12]], [5.6, [0.56, 0.34, 0.12]], [6.4, [0.6, 0.32, 0], 'io'], [9.6, [0.68, 0.35, 0]],
  [11.0, [0.68, 0.35, 0]], [11.15, [0.72, 0.38, 0], 'io'], [11.5, [-0.7, -0.08, 0], 'back'], [12.4, [-0.7, -0.08, 0]],
  [12.9, [-0.7, -0.08, -0.1]], [13.4, [-0.7, -0.08, -0.1]], [14.2, [0.52, 0.36, 0.12]],
];
const PUPIL = [[0, 0.2], [4.7, 0.2], [5.0, 0.6, 'snap'], [6.6, 0.74], [11.5, 0.74], [14.0, 0.2]];
const EARS = [[0, 0], [5.8, 0], [6.4, 0.45], [10.5, 0.45], [12.0, 0]];
const ALERT = [[0, 0], [4.6, 0], [5.0, 1, 'snap'], [11.5, 1], [13.0, 0]];
const SLOW_BLINK = [[12.1, 0], [12.35, 1], [12.55, 1], [12.95, 0]];
// The whale: its eye drifts across at a whale's pace, sinks a little, and is lost in the dark
const WHALE_X = [[0, -3.9], [10, 2.6, 'lin']], WHALE_Y = [[0, -0.05], [7, -0.12], [11, -0.6, 'in']], FAR = [[8.5, 0], [11, 1]];
const LOOK = [[0, [-0.2, 0.05]], [6, [-0.3, 0.05]], [9.5, [-0.5, 0.1]]];

// How far the tail has swished by time t: it slows to a stop as the eye appears, and starts again at the end
const STOP = [4.55, 4.95], GO = [13.5, 14.2];
function swished(t) {
  const u1 = clamp((t - STOP[0]) / (STOP[1] - STOP[0]), 0, 1), u2 = clamp((t - GO[0]) / (GO[1] - GO[0]), 0, 1);
  return Math.min(t, STOP[0]) + (STOP[1] - STOP[0]) * (u1 - u1 ** 3 + u1 ** 4 / 2) + (GO[1] - GO[0]) * (u2 ** 3 - u2 ** 4 / 2) + Math.max(0, t - GO[1]);
}
const SWISHES = 2, ALL = swished(END);
// The tail lies round her on the floor; only its end moves
const TAIL = [[-0.06, 0.13, -0.46], [-0.22, 0.06, -0.47], [-0.34, 0.06, -0.31], [-0.37, 0.06, -0.11], [-0.31, 0.065, 0.07], [-0.2, 0.08, 0.2]];

const PIVOT = [0, 0.7, 0.06], NECK = [0, 0.59, 0.07], BIG = 1.42, CAT = [-0.42, 0, 0.06], CAT_YAW = 1.08;
const catToWorld = (x, y, z) => { const c = Math.cos(CAT_YAW), s = Math.sin(CAT_YAW); return V(c * x + s * z + CAT[0], y + CAT[1], -s * x + c * z + CAT[2]); };
const euler = new THREE.Euler(), m4 = new THREE.Matrix4(), headToCat = new THREE.Matrix3(), tmp = V();
const headToWorld = (h) => { tmp.set(h[0] - PIVOT[0], h[1] - PIVOT[1], h[2] - PIVOT[2]).multiplyScalar(BIG).applyMatrix3(headToCat); return catToWorld(tmp.x + NECK[0], tmp.y + NECK[1], tmp.z + NECK[2]); };
// Three whiskers a side, from the muzzle: where each ends, in the head's own space
const ROOT = [0.05, 0.802, 0.29], WHISK = [[0.3, 0.86, 0.27], [0.315, 0.805, 0.29], [0.29, 0.75, 0.28]];

function frame(now) {
  if (innerWidth !== sizedW || innerHeight !== sizedH) { sizedW = innerWidth; sizedH = innerHeight; resize(); }
  const t = S.written(now), round = S.round(now), U = uniforms;

  // Where you are looking from: a slow sway, so it stays a solid thing
  const yaw = 0.3 + P.sway * Math.sin(round * Math.PI * 2) + view.yaw, pitch = view.pitch;
  const fwd = U.uFwd.value.set(-Math.sin(yaw) * Math.cos(pitch), -Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
  const right = U.uRight.value.set(Math.cos(yaw), 0, -Math.sin(yaw));
  U.uUp.value.crossVectors(right, fwd);
  // The light stays over your left shoulder
  U.uLight.value.set(Math.sin(yaw) * 0.45, 0.8, Math.cos(yaw) * 0.45).addScaledVector(right, -0.5).normalize();
  U.uRound.value = round;

  // Her: breathing all the while, a blink, an ear flick, the eyes and the tail answering to what comes past
  U.uBreath.value = 0.006 * Math.sin(round * Math.PI * 2 * 5);
  U.uBlink.value = Math.max(bump(t, 1.6, 0.22), key(SLOW_BLINK, t));
  U.uPupil.value = key(PUPIL, t);
  const back = key(EARS, t);
  U.uEar.value.set(back, back + 0.8 * bump(t, 2.4, 0.25));
  const [hy, hp, hr] = key(HEAD, t);
  euler.set(hp, hy, hr, 'YXZ'); m4.makeRotationFromEuler(euler); headToCat.setFromMatrix4(m4);
  U.uHead.value.copy(headToCat).transpose();
  const sw = Math.sin(swished(t) / ALL * SWISHES * Math.PI * 2), up = 0.5 + 0.5 * sw;
  TAIL.forEach((p, i) => U.uTail.value[i].set(p[0], p[1], p[2]));
  U.uTail.value[4].y += 0.025 * up;
  U.uTail.value[5].set(TAIL[5][0] - 0.03 * sw, TAIL[5][1] + 0.08 * up, TAIL[5][2]);
  const alert = key(ALERT, t);
  for (let side = 0; side < 2; side++) for (let i = 0; i < 3; i++) {
    const m = side ? -1 : 1, e = WHISK[i];
    const end = [e[0] * m, e[1] + 0.012 * alert * (1 - i), e[2] + 0.08 * alert];
    const root = [ROOT[0] * m, ROOT[1], ROOT[2]];
    const mid = root.map((v, j) => v + (end[j] - v) * 0.45 + [0, 0.025, 0.02][j]);
    const k = (side * 3 + i) * 3;
    U.uWhisk.value[k].copy(headToWorld(root)); U.uWhisk.value[k + 1].copy(headToWorld(mid)); U.uWhisk.value[k + 2].copy(headToWorld(end));
  }

  // The bowl and what is in it
  U.uWater.value = 0.12 + 0.45 * P.water;
  U.uWhaleSize.value = P.whale;
  U.uWhale.value.set(key(WHALE_X, t), key(WHALE_Y, t));
  U.uLook.value.fromArray(key(LOOK, t));
  U.uFar.value = key(FAR, t);

  renderer.render(scene, camera);
}
loop(S, frame);
</script>
