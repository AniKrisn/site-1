  <body>
    <div id="err"></div>
    <script>
      // the viewer has no console for a visitor: anything thrown lands here
      const errBox = document.getElementById("err");
      errBox.style.cssText =
        "position:fixed;left:8px;bottom:8px;max-width:90vw;z-index:50;" +
        "font:12px monospace;color:#fff;background:#a00;padding:4px 8px;" +
        "white-space:pre-wrap;display:none";
      function showErr(msg) {
        errBox.style.display = "block";
        errBox.textContent += msg + "\n";
      }
      window.onerror = (m, s, l) => showErr(`${m} (${s}:${l})`);
      window.onunhandledrejection = (e) => showErr(String(e.reason));
      const origErr = console.error.bind(console);
      console.error = (...a) => {
        showErr(a.map(String).join(" ").slice(0, 2000));
        origErr(...a);
      };
    </script>
  </body>
